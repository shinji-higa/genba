<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>給与管理</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --ink: #14202e; --sub: #47566a; --line: #c5ced9; --bg: #f1f4f8; --card: #fff; --accent: #0b4f8a; --accent2: #e8f1fa; --warn: #b3261e; --ok: #1a7f4e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; font-size: 15px; line-height: 1.55; }
  header { background: var(--ink); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; position: sticky; top: 0; z-index: 20; }
  header b { font-size: 1.1rem; letter-spacing: .08em; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  nav button { background: transparent; color: #cfdbe8; border: 0; padding: 7px 12px; border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
  nav button.on { background: #fff; color: var(--ink); }
  .who { font-size: .82rem; color: #cfdbe8; }
  .who a { color: #fff; }
  main { max-width: 1120px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 1rem; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sp { flex: 1; }
  button.b, a.b { font: inherit; font-weight: 700; padding: 9px 14px; border-radius: 6px; border: 1.5px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
  button.b.dark { background: var(--ink); color: #fff; }
  button.b.danger { border-color: var(--warn); color: var(--warn); }
  button.b:disabled { opacity: .5; cursor: default; }
  input, select { font: inherit; padding: 7px 9px; border: 1.5px solid #7d8a99; border-radius: 5px; background: #fff; color: var(--ink); min-width: 0; }
  label.f { display: block; font-size: .84rem; font-weight: 700; color: var(--sub); }
  table.t { border-collapse: collapse; width: 100%; font-size: .9rem; }
  table.t th { background: var(--accent2); text-align: left; padding: 7px 8px; border-bottom: 2px solid var(--accent); white-space: nowrap; }
  table.t td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.t tr.link { cursor: pointer; }
  table.t tr.link:hover { background: #f6f9fc; }
  .wrapx { overflow-x: auto; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: .78rem; font-weight: 800; background: #e4e9ef; color: var(--sub); }
  .tag.ok { background: #dff3e8; color: var(--ok); }
  .tag.ng { background: #fdeaea; color: var(--warn); }
  .msg { font-weight: 700; color: var(--warn); margin: 6px 0; }
  .note { font-size: .84rem; color: var(--sub); }
  /* 設定：項目の横に説明（ユーザー指示 2026-11-02） */
  .set { display: grid; grid-template-columns: minmax(170px, 230px) 130px 1fr; gap: 6px 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid #e3e8ee; }
  .set .k { font-weight: 700; }
  .set input { width: 100%; text-align: right; }
  .set .d { font-size: .84rem; color: var(--sub); }
  @media (max-width: 640px) { .set { grid-template-columns: 1fr 120px; } .set .d { grid-column: 1 / -1; } }
  /* 明細 */
  .slip { background: #fff; width: 100%; max-width: 760px; margin: 0 auto; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; color: var(--ink); }
  .slip .top { background: linear-gradient(120deg, #14202e, #0b4f8a); color: #fff; padding: 18px 22px; display: flex; justify-content: space-between; gap: 10px; align-items: flex-end; }
  .slip .top h3 { margin: 0; font-size: 1.25rem; letter-spacing: .12em; }
  .slip .net { padding: 16px 22px; display: flex; justify-content: space-between; align-items: baseline; background: var(--accent2); }
  .slip .net b { font-size: 1.7rem; font-variant-numeric: tabular-nums; }
  .slip .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; padding: 14px 22px 8px; }
  .slip h4 { margin: 0 0 6px; font-size: .86rem; color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 3px; }
  .slip .l { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #e8edf2; font-size: .9rem; }
  .slip .l span:last-child { font-variant-numeric: tabular-nums; }
  .slip .l.sum { font-weight: 800; border-bottom: 0; padding-top: 7px; }
  .slip .att { padding: 6px 22px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .84rem; color: var(--sub); }
  .slip .ft { padding: 8px 22px 14px; font-size: .78rem; color: var(--sub); }
  @media (max-width: 640px) { .slip .cols { grid-template-columns: 1fr; } }
  #login { max-width: 360px; margin: 60px auto; }
  #login input { width: 100%; margin: 4px 0 10px; }
  #upd { position: fixed; left: 50%; transform: translateX(-50%); top: 8px; z-index: 60; border: 0; border-radius: 18px; padding: 9px 16px; background: var(--accent); color: #fff; font: 700 13px inherit; box-shadow: 0 2px 8px rgba(0,0,0,.3); white-space: nowrap; cursor: pointer; }
</style>
</head>
<body>
<header id="hd" style="display:none;">
  <b>給与管理</b>
  <nav id="nav"></nav>
  <span class="who"><span id="who"></span>　<a href="#" id="out">ログアウト</a></span>
</header>
<main id="m"></main>

<script src="tax.js"></script>
<script src="calc.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const APP_VER = 'Ver.20261102-02';
const API = 'https://script.google.com/macros/s/AKfycbyW2hFHqIQuu-TsflPk_0zv7gquhoepspuvRG9-bMStPDSWSc2blcDFBtWs7MisP3f_/exec';
const app = initializeApp({ apiKey: 'AIzaSyDVR4p4DO4s9h70uPlXUVlhNcMP9-YkQ5Q', authDomain: 'genba-portal-9077b.firebaseapp.com', projectId: 'genba-portal-9077b' });
const auth = getAuth(app);
const $ = id => document.getElementById(id), M = $('m'), KY = window.KY, TAX = window.KY_TAX;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = n => (Number(n) || 0).toLocaleString('ja-JP');
const pad = n => ('0' + n).slice(-2);

/* 新しい版の知らせ：ポータルと同じ。表に出たときと10分ごとに確かめる。設定の中からも入れ替えられる */
async function refreshApp() {
  try { const r = await fetch('./?check=' + Date.now(), { cache: 'no-store' }); if (r.ok && window.caches) await (await caches.open('kyuyo-shell-v1')).put('./', r); } catch (e) {}
  location.reload();
}
function showUpdate() {
  if ($('upd')) return;
  const b = document.createElement('button'); b.id = 'upd'; b.textContent = '新しいVerがあります（押すと入れ替え）';
  b.onclick = () => { b.textContent = '入れ替えています…'; refreshApp(); };
  document.body.appendChild(b);
}
async function checkVer() {
  if (navigator.onLine === false || document.hidden) return;
  try { const t = await fetch('./?check=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : ''); const m = t.match(/APP_VER = '([^']+)'/); if (m && m[1] !== APP_VER) showUpdate(); } catch (e) {}
}
document.addEventListener('visibilitychange', checkVer); setInterval(checkVer, 600000); setTimeout(checkVer, 3000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

async function pay(action, data) {
  const idToken = await auth.currentUser.getIdToken();
  const d = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'pay', idToken, action, data: data || {} }) }).then(r => r.json());
  if (!d || !d.ok) throw new Error((d && d.m) || 'サーバーでエラーが発生しました。');
  return d.v;
}

/* ---------- 初期値。設定画面で変えられる（説明は CFG_DEF の横の文）---------- */
const DEF = {
  workDays: 245, stdH: 8, close: 20, step: 30, ot: 1.25, hol: 1.6, holOt: 2, night: 1.6, tripNight: 3500,
  rates: [
    { from: '2026-03', health: 10.12, care: 1.62, child: 0, pension: 18.3, emp: 0.65 },
    { from: '2026-04', health: 10.12, care: 1.62, child: 0.23, pension: 18.3, emp: 0.6 }
  ], offDays: []
};
const CFG_DEF = [
  ['基本の時間', [
    ['workDays', '年間の所定労働日数', '日', '1年で出勤する決まりの日数です。平日から祝日と会社休日を除いた日数を入れます。毎年1月に見直します。'],
    ['stdH', '1日の所定労働時間', '時間', '8:00〜17:00（休憩1時間）の8時間です。時間単価と日額の元になります。'],
    ['close', '締め日', '日', '20なら「前月21日〜当月20日」を今月の給与として計算します。'],
    ['step', '時間外の刻み', '分', '時間外を何分単位で数えるかです。端数は切り捨てます。30なら45分は30分になります。']
  ]],
  ['掛率', [
    ['ot', '時間外（平日）', '倍', '平日に8時間を超えた1時間の割増です。時間単価に掛けます。法律の下限は1.25です。'],
    ['hol', '休日出勤（所定・法定）', '倍', '土曜・日曜・祝日に出勤した日の掛率です。日額に掛けます。法定休日の法律の下限は1.35です。'],
    ['holOt', '休日の時間外', '倍', '休日に8時間を超えた1時間の掛率です。時間単価に掛けます。'],
    ['night', '夜間作業', '倍', '日報で「夜間作業」にチェックした日の掛率です。昼の1日分に掛けます。平日は基本給に入っている1倍を除いた分を足します。休日は休日の掛率にこの上乗せ分を足します。']
  ]],
  ['手当', [
    ['tripNight', '出張手当（1泊）', '円', '泊数に掛けます。明細に載せて振込に足します。税金と社会保険の計算には入れません。']
  ]]
];
const EMP_KIND = ['社員', '役員', 'その他'];
let ST = { me: null, cfg: null, emps: [], tab: 'month', ym: '' };
const cfgOf = () => { const c = ST.cfg; return { ...c, monthHours: c.workDays * c.stdH / 12 }; };
const taxFor = ym => TAX[ym.slice(0, 4)] || TAX[Object.keys(TAX).sort().pop()];
function defaultYm() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
const ymLabel = ym => Number(ym.slice(0, 4)) + '年' + Number(ym.slice(5)) + '月';
const dLabel = d => d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();

/* 祝日：日報と同じ計算を持たず、支給日の表示は会社休日と土日で出す。祝日はサーバーの日報の「日の種類」に入っている */
const payDayOf = ym => KY.payDay(ym, d => d.getDay() === 0 || d.getDay() === 6 || (ST.cfg.offDays || []).includes(d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())));

/* ---------- 画面 ---------- */
const TABS = [['month', '今月の給与'], ['bonus', '賞与'], ['year', '提出データ'], ['emp', '従業員'], ['set', '設定']];
function nav() {
  $('nav').innerHTML = TABS.map(t => '<button class="' + (ST.tab === t[0] ? 'on' : '') + '" data-t="' + t[0] + '">' + t[1] + '</button>').join('');
  $('nav').querySelectorAll('button').forEach(b => { b.onclick = () => { ST.tab = b.dataset.t; draw(); }; });
}
function draw() { nav(); ({ month: drawMonth, bonus: drawBonus, year: drawYear, emp: drawEmp, set: drawSet })[ST.tab](); }
const busy = t => { M.innerHTML = '<div class="card">' + esc(t || '読み込んでいます…') + '</div>'; };
const fail = e => { M.innerHTML = '<div class="card msg">' + esc((e && e.message) || e) + '</div>'; };

/* 今月の給与 */
let MON = null;
async function drawMonth() {
  ST.ym = ST.ym || defaultYm(); const ym = ST.ym, c = cfgOf();
  busy('日報を集計しています…');
  try {
    const r = await pay('month', { ym, close: c.close, step: c.step, emps: ST.emps.map(e => ({ id: e.id, uid: e.uid, name: e.name })) });
    if (ST.tab !== 'month' || ST.ym !== ym) return;
    MON = { ym, saved: r.saved, att: r.att, res: {} };
    ST.emps.filter(e => !e.left).forEach(e => { calcOne(e); });
    renderMonth();
  } catch (e) { fail(e); }
}
function calcOne(e) {
  const s = MON.saved[e.id] || {}, adj = s.adj || {};
  if (s.status === '確定' && s.result && s.result.payTotal != null) { MON.res[e.id] = s.result; return; }
  MON.res[e.id] = KY.calcMonth({ emp: e, att: { ...(MON.att[e.id] || {}), tripNights: adj.tripNights }, adj, cfg: cfgOf(), ym: MON.ym, taxTable: taxFor(MON.ym) });
}
function renderMonth() {
  const ym = MON.ym, c = cfgOf(), p = KY.period(ym, c.close), pd = payDayOf(ym), list = ST.emps.filter(e => !e.left);
  const done = list.length && list.every(e => (MON.saved[e.id] || {}).status === '確定');
  const warn = list.reduce((n, e) => n + ((MON.res[e.id] || {}).warns || []).length, 0);
  const sum = k => list.reduce((n, e) => n + (Number((MON.res[e.id] || {})[k]) || 0), 0);
  M.innerHTML = '<div class="card"><div class="row"><label class="f">給与の月<br><input type="month" id="ym" value="' + ym + '"></label>' +
    '<div class="note">対象 ' + dLabel(p.from) + '〜' + dLabel(p.to) + '<br>支給日 ' + dLabel(pd) + '</div><span class="sp"></span>' +
    (done ? '<span class="tag ok">確定済み</span><button class="b danger" id="un">確定を解除</button>' : '<button class="b dark" id="ok"' + (warn ? ' disabled' : '') + '>この月を確定</button>') + '</div>' +
    (warn ? '<div class="msg">確認が必要な所が ' + warn + ' 件あります。直すと確定できます。</div>' : '') + '</div>' +
    '<div class="card wrapx"><table class="t"><tr><th>氏名</th><th>状態</th><th class="n">出勤</th><th class="n">時間外</th><th class="n">支給合計</th><th class="n">控除合計</th><th class="n">差引支給額</th></tr>' +
    list.map(e => { const r = MON.res[e.id] || {}, a = MON.att[e.id] || {}, st = (MON.saved[e.id] || {}).status, w = (r.warns || []).length;
      return '<tr class="link" data-id="' + esc(e.id) + '"><td><b>' + esc(e.name) + '</b></td><td>' + (st === '確定' ? '<span class="tag ok">確定</span>' : w ? '<span class="tag ng">要確認 ' + w + '</span>' : '<span class="tag">確認待ち</span>') + '</td><td class="n">' + (a.workDays || 0) + '日</td><td class="n">' + ((a.otH || 0) + (a.shoOtH || 0) + (a.houOtH || 0)) + 'h</td><td class="n">' + yen(r.payTotal) + '</td><td class="n">' + yen(r.dedTotal) + '</td><td class="n"><b>' + yen(r.net) + '</b></td></tr>'; }).join('') +
    '<tr><td colspan="4"><b>合計</b></td><td class="n"><b>' + yen(sum('payTotal')) + '</b></td><td class="n"><b>' + yen(sum('dedTotal')) + '</b></td><td class="n"><b>' + yen(sum('net')) + '</b></td></tr></table>' +
    (list.length ? '' : '<div class="note" style="margin-top:8px;">従業員のタブから人を追加してください。</div>') + '</div>';
  $('ym').onchange = e => { ST.ym = e.target.value; drawMonth(); };
  M.querySelectorAll('tr.link').forEach(t => { t.onclick = () => drawPerson(t.dataset.id); });
  if ($('ok')) $('ok').onclick = async () => {
    if (!confirm(ymLabel(ym) + 'の給与を確定しますか？\n確定すると金額が固定されます。')) return;
    $('ok').disabled = true;
    try { await pay('confirm', { ym, list: list.map(e => { const r = MON.res[e.id]; return { id: e.id, name: e.name, payTotal: r.payTotal, dedTotal: r.dedTotal, net: r.net, adj: (MON.saved[e.id] || {}).adj || {}, result: { ...r, att: MON.att[e.id] || {} } }; }) }); drawMonth(); } catch (x) { alert(x.message); $('ok').disabled = false; }
  };
  if ($('un')) $('un').onclick = async () => { const why = prompt('確定を解除する理由を書いてください（記録に残ります）'); if (!why) return; try { await pay('unconfirm', { ym, why }); drawMonth(); } catch (x) { alert(x.message); } };
}
const ADJ = [['tripNights', '出張（泊）', '泊数を入れると手当になります'], ['retro', '遡及分', '過去の差額を足す額'], ['leave', '休業手当・自宅待機', '金額で入れます'], ['other', 'その他の支給', '金額で入れます'], ['yearEnd', '年末調整', '還付はマイナスで入れます'], ['otherDed', 'その他の控除', '金額で入れます']];
function slipHtml(e, r, ym, att) {
  const c = cfgOf(), P = r.pay || {}, D = r.ded || {}, l = (k, v, sum) => (v || sum) ? '<div class="l' + (sum ? ' sum' : '') + '"><span>' + k + '</span><span>' + yen(v) + '</span></div>' : '';
  const a = att || {};
  return '<div class="slip"><div class="top"><div><div style="font-size:.8rem;opacity:.8;">エクスケアダクト株式会社</div><h3>給与明細</h3></div><div style="text-align:right;">' + ymLabel(ym) + '分<br><b>' + esc(e.name) + '</b> 様</div></div>' +
    '<div class="net"><span>差引支給額</span><b>¥' + yen(r.net) + '</b></div><div class="cols"><div><h4>支給</h4>' +
    l('基本給', P.base) + l('時間外手当', P.ot) + l('所定休日出勤手当', P.shoDay) + l('所定休日時間外手当', P.shoOt) + l('法定休日出勤手当', P.houDay) + l('法定休日時間外手当', P.houOt) + l('夜間作業手当', P.night) + l('家族手当', P.family) + l('交通費', P.commute) + l('出張手当', P.trip) + l('欠勤の減額', P.absent) + l('遅刻・早退の減額', P.early) + l('遡及分', P.retro) + l('休業手当・自宅待機', P.leave) + l('その他の支給', P.other) + l('支給合計', r.payTotal, 1) +
    '</div><div><h4>控除</h4>' + l('健康保険料', D.health) + l('厚生年金', D.pension) + l('雇用保険', D.emp) + l('所得税', D.tax) + l('住民税', D.resident) + l('年末調整', D.yearEnd) + l('その他の控除', D.otherDed) + l('控除合計', r.dedTotal, 1) + '</div></div>' +
    '<div class="att"><span>出勤 ' + (a.workDays || 0) + '日</span><span>有給 ' + (a.paidDays || 0) + '日</span><span>欠勤 ' + (a.absentDays || 0) + '日</span><span>時間外 ' + (a.otH || 0) + 'h</span><span>所定休日 ' + (a.shoDays || 0) + '日</span><span>法定休日 ' + (a.houDays || 0) + '日</span><span>夜間作業 ' + ((a.nightDays || 0) + (a.nightShoDays || 0) + (a.nightHouDays || 0)) + '日</span><span>早退 ' + (a.earlyH || 0) + 'h</span></div>' +
    '<div class="ft">時間単価 ' + yen(Math.round(r.hourly || 0)) + '円（基本給 ÷ 月平均 ' + (Math.round(c.monthHours * 10) / 10) + '時間）</div></div>';
}
function drawPerson(id) {
  const e = ST.emps.find(x => x.id === id), s = MON.saved[id] || {}, adj = { ...(s.adj || {}) }, lock = s.status === '確定', ym = MON.ym;
  M.innerHTML = '<div class="row" style="margin-bottom:10px;"><button class="b" id="bk">← 一覧へ</button><b>' + esc(e.name) + '　' + ymLabel(ym) + '</b></div>' +
    '<div class="card"><h2>この月だけの入力</h2>' + (lock ? '<div class="note">確定済みなので直せません。</div>' : '') +
    '<div class="row" style="align-items:flex-end;">' + ADJ.map(a => '<label class="f">' + a[1] + '<br><input type="number" data-a="' + a[0] + '" value="' + esc(adj[a[0]] == null ? '' : adj[a[0]]) + '" style="width:120px;"' + (lock ? ' disabled' : '') + ' title="' + esc(a[2]) + '"></label>').join('') +
    (lock ? '' : '<button class="b dark" id="sv">保存</button>') + '</div><div class="msg" id="pm"></div>' + ((MON.res[id].warns || []).map(w => '<div class="msg">' + esc(w) + '</div>').join('')) + '</div><div id="pv"></div>';
  const paint = () => { $('pv').innerHTML = slipHtml(e, MON.res[id], ym, MON.att[id]); };
  paint();

    const calc = e => { const p = prev[e.id] || {}, pn = p.taxable || 0; return KY.calcBonus({ emp: e, amount: Number(amt[e.id]) || 0, prevNet: pn, cfg: c, ym, taxTable: taxFor(ym) }); };

/* 提出データ：個人別の月ごとの総額一覧と、月ごとの明細 */
async function loadLib() {
  for (const s of ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js']) {
    if (document.querySelector('script[src="' + s + '"]')) continue;
    await new Promise((ok, ng) => { const x = document.createElement('script'); x.src = s; x.onload = ok; x.onerror = () => ng(new Error('PDFを作る部品を読み込めませんでした')); document.head.appendChild(x); });
  }
}
async function pdfOf(htmls, name, wide) {
  await loadLib();
  const box = document.createElement('div'); box.style.cssText = 'position:fixed;left:-6000px;top:0;width:' + (wide ? 1120 : 780) + 'px;background:#fff;padding:12px;'; document.body.appendChild(box);
  const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: wide ? 'landscape' : 'portrait', compress: true }), W = wide ? 297 : 210;
  for (let i = 0; i < htmls.length; i++) {
    box.innerHTML = htmls[i];
    const cv = await window.html2canvas(box, { scale: 2, backgroundColor: '#fff', logging: false });
    if (i) pdf.addPage();
    pdf.addImage(cv.toDataURL('image/jpeg', 0.8), 'JPEG', 6, 6, W - 12, (W - 12) * cv.height / cv.width);
  }
  box.remove(); pdf.save(name);
}
