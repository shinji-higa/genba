async function gas(action, data) {

  const d = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'pay', idToken, action, data: data || {} }) }).then(r => r.json());

/* 画面はポータルと同じ Firestore で動かして速くする（ユーザー指示 2026-11-02）。読めるのはマスターと給与管理の権限がある人だけ。
   金額を端末に控えないよう、ポータルと違って端末の保存はしない。日報は今月と前月がポータルにある。
   金額の置き場（ユーザー決定 2026-11-03 案A）：入力中は Firestore、確定したら一人ずつの「年氏名給与DB」の給与・賞与シート。
   確定はサーバーが 書く→読み戻す→Firestore から消す を一人ずつ行う。給与管理DB へは設定・従業員の写しと記録だけ書く */
const db = getFirestore(app);
const col = n => collection(db, n), mid = (ym, id) => ym + '_' + id, plain = o => JSON.parse(JSON.stringify(o));
const empRef = e => ({ id: e.id, uid: e.uid || '', name: e.name });
let mirrorQ = Promise.resolve();   // 控えは押した順に1つずつ書く（続けて押しても順番が入れ替わらないように）
const mirror = (action, data) => { mirrorQ = mirrorQ.then(() => gas(action, data)).catch(e => alert('ドライブの給与管理DBへ書けませんでした：' + e.message + '\n画面の保存はできています。')); return mirrorQ; };
function attend(days, ym, close) {   // 時間外は1日ごとには丸めず、月の合計を KY.roundAtt で丸める
  const p = KY.period(ym, close), s = d => d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()), from = s(p.from), to = s(p.to);
  const a = { totalH: 0, workDays: 0, absentDays: 0, paidDays: 0, otH: 0, earlyH: 0, shoDays: 0, shoOtH: 0, shoH: 0, houDays: 0, houOtH: 0, houH: 0, nightDays: 0, nightShoDays: 0, nightHouDays: 0, lateH: 0, rows: 0 };   // shoH・houH は休日に働いた時間、lateH は夜間作業の日の22時〜5時の時間（賃金台帳用）
  days.forEach(d => {
    if (d.deleted || String(d.date) < from || String(d.date) > to) return;
    a.rows++;
    if (d.kubun === '欠勤') { a.absentDays++; return; }
    if (d.kubun === '有給') { a.paidDays++; return; }
    if (d.kubun !== '出勤') return;
    const ot = Number(d.ot) || 0, night = !!d.night;
    const h = Number(d.hours) || 0; a.totalH += h; if (night) a.lateH += KY.lateH(d.start, d.end);
    if (d.type === '所定休日') { a.shoDays++; a.shoOtH += ot; a.shoH += h; if (night) a.nightShoDays++; }
    else if (d.type === '法定休日') { a.houDays++; a.houOtH += ot; a.houH += h; if (night) a.nightHouDays++; }
    else { a.workDays++; a.otH += ot; a.earlyH += Number(d.early) || 0; if (night) a.nightDays++; }
  });
  return KY.roundAtt(a);
}
/* 速くする（ユーザー決定 2026-11-04）：確定した金額と勤怠の集計は、Firestore の写し（payrollMonths / payrollBonus）から読む。
   写しは「確定した年の翌年3月末」に消える（expireAt）。正しい記録は一人ずつの給与DB（スプレッドシート）で、写しはサーバーが同じ処理で両方に書く。
   写しが消えた古い月だけ、スプレッドシートを読む。日報シートは「更新」を押したときに読む（開いたときは写しで表示し、更新日時と警告を出す） */
const expireOf = ym => new Date((Number(String(ym).slice(0, 4)) + 1) + '-03-31T23:59:59+09:00').getTime();
const live = ym => Date.now() <= expireOf(ym);
const fmtAt = t => t ? new Date(t).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const FAST_ACT = {
  async boot() {

    if (!u.isMaster && !u.canPayroll) throw new Error('給与管理の権限がありません。');
    const [c, e] = await Promise.all([getDoc(doc(db, 'payrollCfg', 'main')), getDocs(col('payrollEmps'))]);

    return { me: { name: u.name || auth.currentUser.uid, uid: auth.currentUser.uid }, cfg: cfg || {}, emps };
  },
  async saveCfg(d) { await setDoc(doc(db, 'payrollCfg', 'main'), plain(d), { merge: true }); mirror('saveCfg', d); return {}; },
  async saveEmp(d) { const id = d.id || doc(col('payrollEmps')).id, x = { ...d, id }; await setDoc(doc(db, 'payrollEmps', id), plain(x)); mirror('saveEmp', x); return { id }; },
  async month(d) {
    const saved = {}, att = {}, info = {};
    (await getDocs(query(col('payrollMonths'), where('ym', '==', d.ym)))).docs.forEach(x => { const v = x.data(); saved[v.id] = v; });
    await Promise.all((d.emps || []).map(async e => {
      const s = saved[e.id];
      if (s && s.status === '確定' && s.result && s.result.att) { att[e.id] = s.result.att; return; }
      const days = e.uid ? (await getDocs(collection(db, 'daily', e.uid, 'days'))).docs.map(x => x.data()) : [];
      const cp = s && s.attCopy && s.attCopy.att ? s.attCopy : null, p = KY.period(d.ym, d.close), from = dKey(p.from), to = dKey(p.to);
      const last = Math.max(0, ...days.filter(x => String(x.date) >= from && String(x.date) <= to).map(x => Number(x.at) || 0));   // ポータルで日報を最後に保存した日時
      att[e.id] = cp ? KY.roundAtt(cp.att) : attend(days, d.ym, d.close);

    }));
    return { saved, att, info };
  },
  async saveAdj(d) {
    const r = doc(db, 'payrollMonths', mid(d.ym, d.id)), c = await getDoc(r);
    if (c.exists() && c.data().status === '確定') throw new Error('確定した月は直せません。先に確定を解除してください。');
    await setDoc(r, plain({ ym: d.ym, year: d.ym.slice(0, 4), id: d.id, name: d.name, status: '入力中', adj: d.adj || {}, expireAt: expireOf(d.ym) }), { mergeFields: ['ym', 'year', 'id', 'name', 'status', 'adj', 'expireAt'] });   // 勤怠の写し（attCopy）や送信日時は残す
    mirror('logAdj', { ym: d.ym, name: d.name, keys: Object.keys(d.adj || {}).map(k => (ADJ.find(a => a[0] === k) || [k, k])[1]) }); return {};
  },
  // 確定・確定解除はサーバーが一人ずつの給与DBと Firestore の写しの両方に書く
  async confirm(d) { await mirrorQ; return gas('confirm', d); },
  async unconfirm(d) { await mirrorQ; return gas('unconfirm', d); },
  async unconfirmBonus(d) { await mirrorQ; return gas('unconfirmBonus', d); },
  async year(d) {
    if (!live(d.year + '-12')) return gas('year', d);   // 写しが消えた年はスプレッドシートから
    const ids = new Set((d.emps || []).map(e => e.id)), pick = s => s.docs.map(x => x.data()).filter(x => x.status === '確定' && x.result && ids.has(x.id)).map(x => ({ ym: x.ym, id: x.id, name: x.name, status: x.status, result: x.result }));
    const [m, b] = await Promise.all([getDocs(query(col('payrollMonths'), where('year', '==', String(d.year)))), getDocs(query(col('payrollBonus'), where('year', '==', String(d.year))))]);
    return { months: pick(m), bonus: pick(b) };
  },
  async saveBonus(d) {
    if (d.done) { await mirrorQ; return gas('confirmBonus', d); }
    const b = writeBatch(db);
    d.list.forEach(x => b.set(doc(db, 'payrollBonus', mid(d.ym, x.id)), plain({ ym: d.ym, year: d.ym.slice(0, 4), id: x.id, name: x.name, status: '入力中', amount: x.amount, result: x.result, expireAt: expireOf(d.ym) }), { mergeFields: ['ym', 'year', 'id', 'name', 'status', 'amount', 'result', 'expireAt'] }));

      const [l, s] = await Promise.all([getDocs(query(col('payrollBonus'), where('ym', '==', d.ym))), gas('bonusRead', d)]);
      const list = l.docs.map(x => x.data()).filter(x => !s.list.some(y => y.id === x.id)).concat(s.list);

    const [l, p] = await Promise.all([getDocs(query(col('payrollBonus'), where('ym', '==', d.ym))), getDocs(query(col('payrollMonths'), where('ym', '==', d.prev)))]);
    const list = l.docs.map(x => x.data()), sent = {};
    list.forEach(x => { if (x.sentAt) sent[x.id] = { at: x.sentAt, n: x.sentN || 1 }; });

const dKey = d => d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate());
/** 期限（確定した年の翌年3月末）が過ぎた写しを消す。正しい記録は一人ずつの給与DBに残る */
async function expireCopies() {
  for (const c of ['payrollMonths', 'payrollBonus']) {
    const s = await getDocs(query(col(c), where('expireAt', '<', Date.now())));
    for (const x of s.docs) await deleteDoc(x.ref);

}
/* ポータルで「日報」にチェックがある人を従業員として自動で足す（テスト用の @example.com は除く）。ユーザー指示 2026-11-02 */
const sortEmps = l => l.sort((a, b) => String(a.code || '').localeCompare(String(b.code || ''), 'ja', { numeric: true }));
async function portalEmps(emps) {
  const us = (await getDocs(col('users'))).docs.map(d => ({ ...d.data(), uid: d.id }));
  const add = us.filter(u => u.canDaily && !/@example\.com$/.test(u.uid) && !emps.some(e => e.uid === u.uid));
  for (const u of add) {
    const x = { id: doc(col('payrollEmps')).id, uid: u.uid, name: u.name || u.uid, kind: '社員', insure: true, empIns: true, deps: 0, resident: {} };
    await setDoc(doc(db, 'payrollEmps', x.id), plain(x)); mirror('saveEmp', x); emps.push(x);
  }
  if (add.length) sortEmps(emps);

}
async function pay(action, data) { return FAST_ACT[action] ? FAST_ACT[action](data || {}) : gas(action, data); }

    const cv = await window.html2canvas(box, { scale: 2, backgroundColor: '#fff', logging: false });
    if (i) pdf.addPage('a4', wd ? 'landscape' : 'portrait');
    const H = (wd ? 210 : 297) - 12; let w = W - 12, h = w * cv.height / cv.width; if (h > H) { h = H; w = h * cv.width / cv.height; }   // 用紙から切れないように縮める

}

  const histHtml = '<div class="card"><h2>昇給・変更の履歴</h2><div class="note">基本給・交通費・扶養・16歳未満の家族は「適用する給与の月」、標準報酬月額は「保険の月」（翌月の給与から引きます）で入れます。確定済みの月にかかったときは差額を出して、次の未確定の月に入れます（基本給は遡及分、標準報酬はその他の控除）。交通費・扶養を遡ったときの差額は、その月の手入力で入れてください。</div>' +
    (rows.length ? '<div class="wrapx"><table class="t" style="margin-top:8px;"><tr><th>項目</th><th>適用月</th><th class="n">値</th><th>理由</th><th>入れた人</th><th>入れた日時</th><th>確定済みの月の差額</th><th></th></tr>' + rows.map(r => '<tr><td>' + esc(KY.HIST[r.k][0]) + '</td><td>' + esc(r.x.from) + '</td><td class="n">' + esc(Number(r.x.v).toLocaleString('ja-JP')) + '</td><td>' + esc(r.x.why || '') + '</td><td>' + esc(r.x.by || '') + '</td><td>' + esc(r.x.at || '') + '</td><td>' + (r.x.retro && r.x.retro.amount ? Number(r.x.retro.amount).toLocaleString('ja-JP') + '円 → ' + esc(ymLabel(r.x.retro.ym)) + 'の' + (r.x.retro.kind === 'pay' ? '遡及分' : 'その他の控除') : '') + '</td><td><button class="b" data-hd="' + r.k + ':' + r.i + '">取り消す</button></td></tr>').join('') + '</table></div>' : '<div class="note" style="margin-top:6px;">まだありません。</div>') +
    '<div class="row" style="margin-top:10px;align-items:flex-end;"><label class="f">項目<br><select id="hk">' + Object.keys(KY.HIST).map(k => '<option value="' + k + '">' + KY.HIST[k][0] + '</option>').join('') + '</select></label><label class="f"><span id="hfl">適用する給与の月</span><br><input type="month" id="hf" value="' + cur + '"></label><label class="f">新しい値<br><input type="number" id="hv" style="width:130px;"></label><label class="f">理由<br><input type="text" id="hw" style="width:220px;text-align:left;" placeholder="例：定期昇給"></label><button class="b dark" id="ha">履歴に足す</button></div><div class="msg" id="hm"></div></div>';
  M.innerHTML = '<div class="row" style="margin-bottom:10px;"><button class="b" id="bk">← 一覧へ</button><b>' + esc(e.name || '新しい人') + '</b><span class="sp"></span><button class="b dark" id="sv">保存</button></div><div class="card">' + EMP_F.map(inp).join('') + '</div>' + (e.id ? histHtml : '') + '<div class="card"><h2>住民税（月ごと）</h2><div class="note">市区町村の通知書の額を入れます。その月の給与から引きます。6月から翌年5月までの額を入れ替えます。</div><div class="row" style="margin-top:8px;">' + ['06', '07', '08', '09', '10', '11', '12', '01', '02', '03', '04', '05'].map(m => '<label class="f">' + Number(m) + '月<br><input type="number" data-r="' + m + '" value="' + esc(e.resident[m] == null ? '' : e.resident[m]) + '" style="width:92px;"></label>').join('') + '</div></div><div class="msg" id="em"></div>';
  const collect = () => {
    M.querySelectorAll('[data-e]').forEach(i => { if (i.disabled) return; const k = i.dataset.e; if (i.type === 'checkbox') e[k] = i.checked; else if (i.type === 'number') e[k] = i.value === '' ? '' : Number(i.value); else e[k] = i.value.trim(); });
    M.querySelectorAll('[data-r]').forEach(i => { e.resident[i.dataset.r] = i.value === '' ? '' : Number(i.value); });
  };
  const save = async () => { const r = await pay('saveEmp', e); e.id = r.id; const n = ST.emps.findIndex(x => x.id === e.id); if (n >= 0) ST.emps[n] = e; else ST.emps.push(e); };
  $('bk').onclick = drawEmp;
  $('sv').onclick = async () => {
    collect();
    if (!e.name) { $('em').textContent = '氏名を入れてください'; return; }
    // 形のおかしいメールは保存させない（保存できてしまい、送るときに初めて失敗していた。2026-11-04）
    e.email = String(e.email || '').trim();
    if (e.email && !/^[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(\.[A-Za-z0-9\-]+)+$/.test(e.email)) { $('em').textContent = '明細を送るメールの形が正しくありません（' + e.email + '）。全角の文字・空白・記号が入っていないか確かめてください。'; $('em').scrollIntoView({ block: 'center' }); return; }
    try { await save(); drawEmp(); } catch (x) { $('em').textContent = x.message; }
  };
  if (!e.id) return;
  $('hk').onchange = () => { $('hfl').textContent = KY.HIST[$('hk').value][1] === 'ins' ? '保険の月' : '適用する給与の月'; };
  $('ha').onclick = async () => {
    const k = $('hk').value, from = $('hf').value, v = $('hv').value, why = $('hw').value.trim();
    if (!from || v === '' || !why) { $('hm').textContent = '月・新しい値・理由を入れてください'; return; }
    $('ha').disabled = true; $('hm').style.color = 'var(--ink)'; $('hm').textContent = '確定済みの月を一人ずつの給与DBから読んでいます…';
    try {
      collect();
      const old = JSON.parse(JSON.stringify(e)), x = { from, v: Number(v), why, by: (ST.me && ST.me.name) || '', at: jpNow() };
      e.hist[k] = (e.hist[k] || []).concat([x]);
      const conf = await confirmedMonths(e, from), last = conf.length ? conf[conf.length - 1].ym : '';
      const hit = conf.filter(m => (KY.HIST[k][1] === 'ins' ? KY.ymAdd(m.ym, -1) : m.ym) >= from);   // この変更がかかる確定済みの月
      let msg = KY.HIST[k][0] + 'を ' + from + ' から ' + Number(v).toLocaleString('ja-JP') + ' にします。';
      if (hit.length && (k === 'base' || k === 'std' || k === 'stdPen')) {
        const r = KY.retroCalc({ oldEmp: old, newEmp: e, key: k, months: hit, cfgOf, taxFor }), to = KY.ymAdd(last, 1), kind = k === 'base' ? 'pay' : 'ded';
        if (r.amount) { x.retro = { ym: to, amount: r.amount, kind, months: r.months }; msg += '\n\n確定済みの月（' + r.months.join('・') + '）の差額 ' + r.amount.toLocaleString('ja-JP') + '円を、' + ymLabel(to) + 'の「' + (kind === 'pay' ? '遡及分' : 'その他の控除') + '」に入れます。'; }
      } else if (hit.length) msg += '\n\n確定済みの月（' + hit.map(m => m.ym).join('・') + '）にかかっています。差額は、次の月の手入力で入れてください。';
      if (!confirm(msg + '\n\nよろしいですか？')) { e.hist[k].pop(); $('hm').textContent = ''; $('ha').disabled = false; return; }
      await save();
      mirror('logHist', { name: e.name, text: KY.HIST[k][0] + ' を ' + from + ' から変更（' + why + '）' + (x.retro ? '　確定済みの月の差額を ' + x.retro.ym + ' に入れる' : '') });   // 給与管理DB には金額を書かない
      editEmp(e);
    } catch (err) { $('hm').style.color = ''; $('hm').textContent = err.message; $('ha').disabled = false; }
  };
  M.querySelectorAll('[data-hd]').forEach(b => { b.onclick = async () => {
    const [k, i] = b.dataset.hd.split(':'), x = e.hist[k][Number(i)];
    try {
      if (x.retro && x.retro.amount) {   // 差額を入れる月がもう確定していたら取り消せない（払った差額と合わなくなる）
        const done = (await pay('year', { year: x.retro.ym.slice(0, 4), emps: [empRef(e)] })).months.some(m => m.ym === x.retro.ym);
        if (done) { alert(ymLabel(x.retro.ym) + 'は確定済みで、差額をもう払っているので取り消せません。逆の変更を新しく足してください。'); return; }
      }
      if (!confirm(KY.HIST[k][0] + ' ' + x.from + ' の履歴を取り消しますか？' + (x.retro && x.retro.amount ? '\n差額 ' + x.retro.amount.toLocaleString('ja-JP') + '円も入れなくなります。' : ''))) return;
      collect(); e.hist[k].splice(Number(i), 1); await save();
      mirror('logHist', { name: e.name, text: '取り消し：' + KY.HIST[k][0] + ' ' + x.from + ' からの変更（' + (x.why || '') + '）' });
      editEmp(e);
    } catch (err) { alert(err.message); }
  }; });
}

/* 設定 */
function drawSet() {
  const c = ST.cfg, y0 = yearOf(), w = { ...KY.workYear(y0, 0), year: y0 }, mh = Math.round(cfgOf().monthHours * 10) / 10;
  M.innerHTML = '<div class="card"><h2>アプリの版</h2><div>今の版：<b>' + APP_VER + '</b></div><div style="margin-top:8px;"><button class="b dark" id="ver">最新の版にする</button></div><div class="note">新しい版が出ているときは、押すと入れ替わります。</div></div>' +
    CFG_DEF.map(([h, fs]) => '<div class="card"><h2>' + h + '</h2>' + fs.map(f => f[2] === 'memo' ? '<div class="set"><div class="k">' + f[1] + '</div><div><textarea data-c="' + f[0] + '" rows="5" style="width:100%;min-width:260px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;">' + esc(c[f[0]] || '') + '</textarea></div><div class="d">' + f[3] + '</div></div>' : f[2] === 'check' ? '<div class="set"><div class="k">' + f[1] + '</div><div><input type="checkbox" data-c="' + f[0] + '"' + (c[f[0]] ? ' checked' : '') + ' style="width:22px;height:22px;"></div><div class="d">' + f[3] + '</div></div>' : '<div class="set"><div class="k">' + f[1] + '</div><div class="row" style="flex-wrap:nowrap;gap:6px;"><input type="number" min="0" step="' + (f[2] === '倍' ? '0.01' : 'any') + '" data-c="' + f[0] + '"' + (f[2] === '倍' ? ' data-rate="1"' : '') + ' value="' + esc(f[2] === '倍' ? Number(c[f[0]]).toFixed(2) : c[f[0]]) + '"><span>' + f[2] + '</span></div><div class="d">' + f[3] + '</div></div>').join('') + (h === '基本の時間' ? '<div class="note" style="margin-top:8px;">' + w.year + '年の所定労働日数：平日 ' + w.weekdays + '日 − 祝日 ' + w.holidays + '日 ＝ <b>' + w.days + '日</b><br>月平均所定時間：<b>' + mh + '時間</b>（' + w.days + '日 × ' + c.stdH + '時間 ÷ 12）。時間単価＝基本給 ÷ この時間です。<br>時間外は1か月の合計で丸めます（平日・所定休日・法定休日ごと）。30分未満は切り捨て、30分以上は1時間に切り上げます。</div>' : '') + '</div>').join('') +
    '<div class="card"><h2>保険料率（適用月ごと）</h2><div class="note">変わるときは行を足します。健康保険・介護保険・支援金・厚生年金は「保険の月」、雇用保険は「給与の月」で使います。社会保険は前月分を今月の給与から引くので、3月分の率は4月の給与から効きます。</div><div class="wrapx"><table class="t" id="rt"></table></div><button class="b" id="ra" style="margin-top:8px;">＋ 行を足す</button>' +
    '<div class="set" style="border:0;"><div class="k">健康保険</div><div></div><div class="d">協会けんぽ兵庫の率（全体）です。本人はこの半分です。毎年3月分から変わります。</div><div class="k">介護保険</div><div></div><div class="d">40〜64歳の人だけにかかります（全体の率）。全国共通です。</div><div class="k">支援金</div><div></div><div class="d">子ども・子育て支援金です（全体の率）。明細では健康保険料に含めます。</div><div class="k">厚生年金</div><div></div><div class="d">全体の率です。本人はこの半分です。</div><div class="k">雇用保険</div><div></div><div class="d">本人負担の率です（建設の事業）。毎年4月に変わります。</div></div></div>' +
    '<div class="card"><div class="row"><button class="b dark" id="sv">設定を保存</button><span id="sm" class="note"></span></div></div>';
  const rates = JSON.parse(JSON.stringify(c.rates || []));
  const drawR = () => {
    $('rt').innerHTML = '<tr><th>適用月</th><th>健康保険%</th><th>介護保険%</th><th>支援金%</th><th>厚生年金%</th><th>雇用保険%</th></tr>' + rates.map((r, i) => '<tr><td><input type="month" data-i="' + i + '" data-k="from" value="' + esc(r.from) + '"></td>' + ['health', 'care', 'child', 'pension', 'emp'].map(k => '<td><input type="number" step="any" data-i="' + i + '" data-k="' + k + '" value="' + esc(r[k]) + '" style="width:88px;"></td>').join('') + '</tr>').join('');
    $('rt').querySelectorAll('input').forEach(x => { x.onchange = () => { rates[x.dataset.i][x.dataset.k] = x.type === 'month' ? x.value : Number(x.value); }; });
  };
  drawR();
  $('ver').onclick = () => { $('ver').textContent = '入れ替えています…'; refreshApp(); };
  $('ra').onclick = () => { rates.push({ ...(rates[rates.length - 1] || {}), from: '' }); drawR(); };
  $('sv').onclick = async () => {
    const d = { rates }; M.querySelectorAll('[data-c]').forEach(i => { d[i.dataset.c] = i.tagName === 'TEXTAREA' ? i.value : i.type === 'checkbox' ? i.checked : i.dataset.rate ? Math.round(Number(i.value) * 100) / 100 : Number(i.value); });   // 掛率は小数点第2位まで
    try { await pay('saveCfg', d); Object.assign(ST.cfg, d); drawSet(); $('sm').textContent = '保存しました'; } catch (x) { $('sm').textContent = x.message; }
  };
}

/* ---------- ログイン ---------- */
function login(msg) {
  $('hd').style.display = 'none';
  M.innerHTML = '<div class="card" id="login"><h2>給与管理</h2><label class="f">メールアドレス</label><input type="email" id="em" autocomplete="username"><label class="f">パスワード</label><input type="password" id="pw" autocomplete="current-password"><button class="b dark" id="go" style="width:100%;">ログイン</button><div class="msg" id="lm">' + esc(msg || '') + '</div><div class="note">現場管理ポータルと同じアカウントです。権限のある人だけ入れます。</div></div>';
  $('go').onclick = async () => { try { await signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value); } catch (e) { $('lm').textContent = 'ログインできませんでした。'; } };
}
$('out').onclick = e => { e.preventDefault(); signOut(auth); };
onAuthStateChanged(auth, async u => {
  if (!u) { ST = { me: null, cfg: null, emps: [], tab: 'month', ym: '' }; login(); return; }
  busy();
  try {
    const r = await pay('boot');
    ST.me = r.me; ST.cfg = { ...DEF, ...r.cfg }; ST.emps = sortEmps(r.emps);
    $('who').textContent = r.me.name; $('hd').style.display = ''; draw();
  } catch (e) { await signOut(auth).catch(() => {}); login(e.message); }
});
</script>
</body>
</html>
