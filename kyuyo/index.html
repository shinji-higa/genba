async function gas(action, data) {
  const idToken = await auth.currentUser.getIdToken();
  const d = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'pay', idToken, action, data: data || {} }) }).then(r => r.json());
  if (!d || !d.ok) throw new Error((d && d.m) || 'サーバーでエラーが発生しました。');
  return d.v;
}

/* 画面はポータルと同じ Firestore で動かして速くする（ユーザー指示 2026-11-02）。読めるのはマスターと給与管理の権限がある人だけ。
   金額を端末に控えないよう、ポータルと違って端末の保存はしない。日報は今月と前月がポータルにある。
   金額の置き場（ユーザー決定 2026-11-03 案A）：入力中は Firestore、確定したら一人ずつの「年氏名給与DB」の給与・賞与シート。
   確定はサーバーが 書く→読み戻す→Firestore から消す を一人ずつ行う。給与管理DB へは設定・従業員の写しと記録だけ書く */
const db = getFirestore(app);
const col = n => collection(db, n), mid = (ym, id) => ym + '_' + id, plain = o => JSON.parse(JSON.stringify(o));
const empRef = e => ({ id: e.id, uid: e.uid || '', name: e.name });
let mirrorQ = Promise.resolve();   // 控えは押した順に1つずつ書く（続けて押しても順番が入れ替わらないように）
const mirror = (action, data) => { mirrorQ = mirrorQ.then(() => gas(action, data)).catch(e => alert('ドライブの給与管理DBへ書けませんでした：' + e.message + '\n画面の保存はできています。')); return mirrorQ; };
function attend(days, ym, close) {   // 時間外は1日ごとには丸めず、月の合計を KY.roundAtt で丸める
  const p = KY.period(ym, close), s = d => d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()), from = s(p.from), to = s(p.to);
  const a = { totalH: 0, workDays: 0, absentDays: 0, paidDays: 0, otH: 0, inH: 0, earlyH: 0, shoDays: 0, shoOtH: 0, shoH: 0, houDays: 0, houOtH: 0, houH: 0, nightDays: 0, nightShoDays: 0, nightHouDays: 0, lateH: 0, rows: 0 };   // inH は半日有給の日の法定内の時間外。shoH・houH は休日に働いた時間、lateH は夜間作業の日の22時〜5時の時間（賃金台帳用）
  days.forEach(d => {
    if (d.deleted || String(d.date) < from || String(d.date) > to) return;
    a.rows++;
    if (d.kubun === '欠勤') { a.absentDays++; return; }
    if (d.kubun === '有給') { if (d.leave && d.leave !== '承認') return; a.paidDays++; return; }   // 申請中・却下の有給は数えない（日報シートにも入らない。2026-11-05 画面だけ有給に数えていた）
    // 半日有給（午前有給・午後有給）は0.5日。残りの半日は出勤として数える（2026-11-05 ユーザー決定）。日報シートに入るのは承認された日だけ
    if (d.kubun === '午前有給' || d.kubun === '午後有給') { if (d.leave && d.leave !== '承認') return; a.paidDays += 0.5; }
    else if (d.kubun !== '出勤') return;
    // 半日有給の日（案C 2026-11-05）：実際に働いた時間が8時間を超えた分が時間外（1.25倍）、4〜8時間の分は法定内の時間外（1倍）
    const half = d.kubun !== '出勤', h = Number(d.hours) || 0, ot = half ? Math.max(0, h - 8) : Number(d.ot) || 0, night = !!d.night;
    if (half) a.inH += Math.max(0, Math.min(h, 8) - 4);
    a.totalH += h; if (night) a.lateH += KY.lateH(d.start, d.end);

/* 速くする（ユーザー決定 2026-11-04）：確定した金額と勤怠の集計は、Firestore の写し（payrollMonths / payrollBonus）から読む。
   写しは「確定した年の翌年3月末」に消える（expireAt）。正しい記録は一人ずつの給与DB（スプレッドシート）で、写しはサーバーが同じ処理で両方に書く。

const expireOf = ym => new Date((Number(String(ym).slice(0, 4)) + 1) + '-03-31T23:59:59+09:00').getTime();

const FAST_ACT = {
  async boot() {
    const u = (await getDoc(doc(db, 'users', auth.currentUser.uid))).data() || {};
    if (!u.isMaster && !u.canPayroll) throw new Error('給与管理の権限がありません。');
    const [c, e] = await Promise.all([getDoc(doc(db, 'payrollCfg', 'main')), getDocs(col('payrollEmps'))]);
    let cfg = c.exists() ? c.data() : null, emps = e.docs.map(d => ({ ...d.data(), id: d.id }));

      const r = await gas('boot'); cfg = r.cfg || {}; emps = r.emps || [];
      const b = writeBatch(db); b.set(doc(db, 'payrollCfg', 'main'), plain(cfg)); emps.forEach(x => b.set(doc(db, 'payrollEmps', x.id), plain(x))); await b.commit();
    }

    return { me: { name: u.name || auth.currentUser.uid, uid: auth.currentUser.uid }, cfg: cfg || {}, emps };
  },
  async saveCfg(d) { await setDoc(doc(db, 'payrollCfg', 'main'), plain(d), { merge: true }); mirror('saveCfg', d); return {}; },
  async saveEmp(d) { const id = d.id || doc(col('payrollEmps')).id, x = { ...d, id }; await setDoc(doc(db, 'payrollEmps', id), plain(x)); mirror('saveEmp', x); return { id }; },
  async month(d) {
    const saved = {}, att = {}, info = {};
    (await getDocs(query(col('payrollMonths'), where('ym', '==', d.ym)))).docs.forEach(x => { const v = x.data(); saved[v.id] = v; });
    await Promise.all((d.emps || []).map(async e => {
      const s = saved[e.id];
      if (s && s.status === '確定' && s.result && s.result.att) { att[e.id] = s.result.att; return; }
      const days = e.uid ? (await getDocs(collection(db, 'daily', e.uid, 'days'))).docs.map(x => x.data()) : [];
      const cp = s && s.attCopy && s.attCopy.att ? s.attCopy : null, p = KY.period(d.ym, d.close), from = dKey(p.from), to = dKey(p.to);
      const last = Math.max(0, ...days.filter(x => String(x.date) >= from && String(x.date) <= to).map(x => Number(x.at) || 0));   // ポータルで日報を最後に保存した日時
      att[e.id] = cp ? KY.roundAtt(cp.att) : attend(days, d.ym, d.close);

  },
  async saveAdj(d) {
    const r = doc(db, 'payrollMonths', mid(d.ym, d.id)), c = await getDoc(r);

    await setDoc(r, plain({ ym: d.ym, year: d.ym.slice(0, 4), id: d.id, name: d.name, status: '入力中', adj: d.adj || {}, expireAt: expireOf(d.ym) }), { mergeFields: ['ym', 'year', 'id', 'name', 'status', 'adj', 'expireAt'] });   // 勤怠の写し（attCopy）や送信日時は残す
    mirror('logAdj', { ym: d.ym, name: d.name, keys: Object.keys(d.adj || {}).map(k => (ADJ.find(a => a[0] === k) || [k, k])[1]) }); return {};
  },
  // 確定・確定解除はサーバーが一人ずつの給与DBと Firestore の写しの両方に書く
  async confirm(d) { await mirrorQ; return gas('confirm', d); },
  async unconfirm(d) { await mirrorQ; return gas('unconfirm', d); },
  async unconfirmBonus(d) { await mirrorQ; return gas('unconfirmBonus', d); },
  async year(d) {
    if (!live(d.year + '-12')) return gas('year', d);   // 写しが消えた年はスプレッドシートから
    const ids = new Set((d.emps || []).map(e => e.id)), pick = s => s.docs.map(x => x.data()).filter(x => x.status === '確定' && x.result && ids.has(x.id)).map(x => ({ ym: x.ym, id: x.id, name: x.name, status: x.status, result: x.result }));

  async saveBonus(d) {

  },
  // 同じ年度（4月〜翌3月）に、この賞与の月より前に確定した賞与の標準賞与額の合計（健康保険の年度の上限 573万円のため。2026-11-05）
  async bonusFy(d) {

  const list = ST.emps.filter(x => !x.left), tdy = new Date(), T = tdy.getFullYear() + '-' + pad(tdy.getMonth() + 1) + '-' + pad(tdy.getDate()), fd = d => d ? d.replace(/-/g, '/') : '', dd = n => (Math.round(n * 10) / 10) + '日';
  const fromOf = e => { const x = leaveEmp(e); return (x.leaveBaseDate || x.joined || '').replace(/-/g, '/'); };
  const r = await pay('leaveTakenAll', { emps: list.map(e => ({ ...empRef(e), from: fromOf(e) })) });
  const out = list.map(e => {
    const x = leaveEmp(e), L = (x.joined || x.leaveBaseDate) ? KY.leaveCalc(x, r[e.id] || [], T) : null;
    const rows = [['氏名', e.name], ['入社日', fd(e.joined) || '（空欄）'], ['作った日', fd(T)], ['今の残り', L ? dd(L.remain) : '入社日が空欄なので計算できません'], ['基準日（付いた日）', '付いた日数', '期間', '取った日（時季）', '取った日数', '年5日']];
    if (L && x.leaveBaseDate) rows.push(['切り替えの日 ' + fd(x.leaveBaseDate), '残り ' + dd(Number(x.leaveBase) || 0) + (Number(x.leaveCarry) ? '（うち繰り越し ' + dd(Number(x.leaveCarry)) + '）' : ''), '', '切り替え前に取った日は、前の帳簿にあります', '', '']);
    (L ? L.grants.filter(g => g.date <= T) : []).forEach(g => {
      const end = (() => { const [a, b, c] = g.date.split('-').map(Number), z = new Date(a + 1, b - 1, c); z.setDate(z.getDate() - 1); return z.getFullYear() + '-' + pad(z.getMonth() + 1) + '-' + pad(z.getDate()); })();
      const u = L.used.filter(v => v.date >= g.date && v.date <= end), n = u.reduce((a, v) => a + v.n, 0), f = (L.five || []).find(v => v.from === g.date);
      rows.push([fd(g.date), dd(g.days) + (g.fixed ? '（手直し）' : ''), fd(g.date) + '〜' + fd(end), u.map(v => fd(v.date) + (v.n < 1 ? '（' + v.kubun + '）' : '')).join('、') || 'なし', dd(n), g.days >= 10 ? (n >= 5 ? '5日取れた' : end < T ? '届かずに終わった' : 'あと ' + dd(5 - n)) + (x.leaveBaseDate && g.date <= x.leaveBaseDate ? '（切り替え前の分は入っていません）' : '') : '']);
    });
    const th = rows[4], body = rows.slice(5);
    const h = '<div style="font-family:inherit;color:#14202e;"><div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0b4f8a;padding-bottom:6px;margin-bottom:8px;"><b style="font-size:18px;letter-spacing:.1em;">年次有給休暇管理簿</b><span>エクスケアダクト株式会社</span></div>' +
      '<div style="margin-bottom:8px;">氏名：<b>' + esc(e.name) + '</b>　入社日：' + esc(fd(e.joined) || '（空欄）') + '　作った日：' + esc(fd(T)) + '　今の残り：<b>' + esc(L ? dd(L.remain) : '計算できません（入社日が空欄）') + '</b></div>' +
      '<table class="t" style="width:100%;"><tr>' + th.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>' + (body.map(rw => '<tr>' + rw.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') || '<tr><td colspan="6">まだ有給が付いていません</td></tr>') + '</table></div>';
    return { e, rows, h };
  });
  out.T = T; return out;
}

  const fromOf = e => { const x = leaveEmp(e); return (x.leaveBaseDate || x.joined || '').replace(/-/g, '/'); };

  const cur = defaultYm(), openYms = [cur, KY.ymAdd(cur, -1)];
  const dailyP = Promise.all(list.filter(e => e.uid).map(async e => { const days = (await getDocs(collection(db, 'daily', e.uid, 'days'))).docs.map(x => x.data()); return [e.id, days]; })).catch(() => []);
  let r, daily = []; try { r = await pay('leaveTakenAll', { emps: list.map(e => ({ ...empRef(e), from: fromOf(e) })) }); await yearsP; daily = await dailyP; } catch (x) { list.forEach(e => { const c = M.querySelector('[data-lr="' + e.id + '"]'); if (c) c.textContent = '読めません'; }); return; }
  list.forEach(e => {
    const c = M.querySelector('[data-lr="' + e.id + '"]'), f = M.querySelector('[data-lf="' + e.id + '"]'); if (!c || !f) return;
    const x = leaveEmp(e); if (!x.joined && !x.leaveBaseDate) { c.textContent = '—'; f.innerHTML = '<span class="note">入社日が空欄</span>'; return; }
    const L = KY.leaveCalc(x, r[e.id] || [], T), cur = (L.five || []).filter(v => !v.done).pop(), cur2 = cur, past = (L.five || []).filter(v => v.done && !v.ok).pop();
    c.textContent = dd(L.remain) + (L.warns.length ? ' ！' : '');
    const abE = { ...(ab[e.id] || {}) }, dd3 = (daily.find(z => z[0] === e.id) || [])[1] || [];
    openYms.forEach(ym => { if (!(ym in abE) && dd3.length) abE[ym] = attend(dd3, ym, cfgOf(ym).close).absentDays || 0; });
    const ar = KY.attendRate(x, L.next, T, abE, cfgOf(T.slice(0, 7))), low = ar && ar.rate < 0.8;
    if (cur2 && !cur2.ok && (new Date(cur2.until + 'T00:00:00') - tdy) / 864e5 < 92) risk.push({ e, until: cur2.until, n: 5 - cur2.n });

    const from = e.leaveBaseDate ? e.leaveBaseDate.replace(/-/g, '/') : e.joined ? e.joined.replace(/-/g, '/') : '';

/* 賞与 */
async function drawBonus() {

    if (ST.tab !== 'bonus' || ST.bym !== ym) return;
    // 賞与の月に在籍している人だけ（入社が月末より後・退職が月初より前の人は出さない。2026-11-05）
    const mEnd = ym + '-' + ('0' + new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)), 0).getDate()).slice(-2), inB = e => !(e.joined && e.joined > mEnd) && !(e.leftDate && e.leftDate < ym + '-01');

    const done = r.list.length && r.list.every(x => x.status === '確定');
    let payDay = ((r.list.find(x => x.result && x.result.payDay) || {}).result || {}).payDay || '';   // 賞与の支給日はその回ごとに入れる（2026-11-05 案A）。入れるまで確定できない

    const calc = e => { if (conf[e.id]) return conf[e.id]; const pn = prev[e.id] ? prev[e.id].taxable || 0 : hand(e) ? Number(e.prevNet) || 0 : 0; return KY.calcBonus({ emp: e, amount: Number(amt[e.id]) || 0, prevNet: pn, cfg: c, ym, taxTable: taxFor(ym), taxManual: taxM[e.id], payDay, priorStd: prior[e.id] || 0 }); };   // 確定した人は給与DBの金額
    const paint = () => {

      // 料率の表に行がないなどの知らせ（赤）は確定を止める。黄色は知らせるだけ
      const ws = list.filter(e => Number(amt[e.id]) || conf[e.id]).map(e => [e, calc(e)]);

  const c = ST.cfg, y0 = yearOf(), w = { ...KY.workYear(y0, KY.offCount(y0, c.offDays)), year: y0 }, mh = Math.round(cfgOf().monthHours * 10) / 10;
  M.innerHTML = '<div class="card"><h2>アプリの版</h2><div>今の版：<b>' + APP_VER + '</b></div><div style="margin-top:8px;"><button class="b dark" id="ver">最新の版にする</button></div><div class="note">新しい版が出ているときは、押すと入れ替わります。</div></div>' +
    CFG_DEF.map(([h, fs]) => '<div class="card"><h2>' + h + '</h2>' + fs.map(f => f[2] === 'memo' ? '<div style="padding:10px 0;border-bottom:1px solid #e3e8ee;"><div style="font-weight:700;">' + f[1] + '</div><div style="font-size:.84rem;color:var(--sub);margin:2px 0 6px;">' + f[3] + '</div><textarea data-c="' + f[0] + '" data-grow="1" style="display:block;width:100%;box-sizing:border-box;min-height:84px;overflow:hidden;resize:none;font:inherit;line-height:1.6;padding:8px 10px;border:1px solid var(--line);border-radius:6px;">' + esc(c[f[0]] || '') + '</textarea></div>' : f[2] === 'check' ? '<div class="set"><div class="k">' + f[1] + '</div><div><input type="checkbox" data-c="' + f[0] + '"' + (c[f[0]] ? ' checked' : '') + ' style="width:22px;height:22px;"></div><div class="d">' + f[3] + '</div></div>' : '<div class="set"><div class="k">' + f[1] + '</div><div class="row" style="flex-wrap:nowrap;gap:6px;"><input type="number" min="0" step="' + (f[2] === '倍' ? '0.01' : 'any') + '" data-c="' + f[0] + '"' + (f[2] === '倍' ? ' data-rate="1"' : '') + ' value="' + esc(f[2] === '倍' ? Number(c[f[0]]).toFixed(2) : c[f[0]]) + '"><span>' + f[2] + '</span></div><div class="d">' + f[3] + '</div></div>').join('') + (h === '基本の時間' ? '<div class="note" style="margin-top:8px;">' + w.year + '年の所定労働日数：平日 ' + w.weekdays + '日 − 祝日 ' + w.holidays + '日' + (w.companyOff ? ' − 会社休日 ' + w.companyOff + '日' : '') + ' ＝ <b>' + w.days + '日</b><br>月平均所定時間：<b>' + mh + '時間</b>（' + w.days + '日 × ' + c.stdH + '時間 ÷ 12）。時間単価＝基本給 ÷ この時間です。<br>時間外は1か月の合計で丸めます（平日・所定休日・法定休日ごと）。30分未満は切り捨て、30分以上は1時間に切り上げます。</div>' : '') + '</div>').join('') +
    '<div class="card"><h2>保険料率（適用月ごと）</h2><div class="note">変わるときは行を足します。健康保険・介護保険・支援金・厚生年金は「保険の月」、雇用保険は「給与の月」で使います。社会保険は前月分を今月の給与から引くので、3月分の率は4月の給与から効きます。</div><div class="wrapx"><table class="t" id="rt"></table></div><button class="b" id="ra" style="margin-top:8px;">＋ 行を足す</button>' +
    '<div class="set" style="border:0;"><div class="k">健康保険</div><div></div><div class="d">協会けんぽ兵庫の率（全体）です。本人はこの半分です。毎年3月分から変わります。</div><div class="k">介護保険</div><div></div><div class="d">40〜64歳の人だけにかかります（全体の率）。全国共通です。</div><div class="k">支援金</div><div></div><div class="d">子ども・子育て支援金です（全体の率）。明細では健康保険料に含めます。</div><div class="k">厚生年金</div><div></div><div class="d">全体の率です。本人はこの半分です。</div><div class="k">雇用保険</div><div></div><div class="d">本人負担の率です（建設の事業）。毎年4月に変わります。</div></div></div>' +
    '<div class="card"><div class="row"><button class="b dark" id="sv">設定を保存</button><span id="sm" class="note"></span></div></div>' +
    offDaysHtml() + leaveSwitchHtml();
  // メモの欄は中の文の長さに合わせて高くする（スクロールさせず全文を見せる。ユーザー指示 2026-11-04）
  M.querySelectorAll('textarea[data-grow]').forEach(t => { const g = () => { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }; t.oninput = g; g(); });
  const rates = JSON.parse(JSON.stringify(c.rates || []));
  const drawR = () => {
    $('rt').innerHTML = '<tr><th>適用月</th><th>健康保険%</th><th>介護保険%</th><th>支援金%</th><th>厚生年金%</th><th>雇用保険%</th></tr>' + rates.map((r, i) => '<tr><td><input type="month" data-i="' + i + '" data-k="from" value="' + esc(r.from) + '"></td>' + ['health', 'care', 'child', 'pension', 'emp'].map(k => '<td><input type="number" step="any" data-i="' + i + '" data-k="' + k + '" value="' + esc(r[k]) + '" style="width:88px;"></td>').join('') + '</tr>').join('');
    $('rt').querySelectorAll('input').forEach(x => { x.onchange = () => { rates[x.dataset.i][x.dataset.k] = x.type === 'month' ? x.value : Number(x.value); }; });
  };
  drawR();
  $('ver').onclick = () => { $('ver').textContent = '入れ替えています…'; refreshApp(); };
  $('ra').onclick = () => { rates.push({ ...(rates[rates.length - 1] || {}), from: '' }); drawR(); };
  offDaysWire();
  leaveSwitchWire();
  $('sv').onclick = async () => {
    const d = { rates }; M.querySelectorAll('[data-c]').forEach(i => { d[i.dataset.c] = i.tagName === 'TEXTAREA' ? i.value : i.type === 'checkbox' ? i.checked : i.dataset.rate ? Math.round(Number(i.value) * 100) / 100 : Number(i.value); });   // 掛率は小数点第2位まで
    try { await pay('saveCfg', d); Object.assign(ST.cfg, d); drawSet(); $('sm').textContent = '保存しました'; } catch (x) { $('sm').textContent = x.message; }
  };
}

/* 会社休日（2026-11-05 ユーザー指示）：1日ずつ「日付」「名前（年末年始など）」で入れる。ふだんは閉じておく。同じ日付が2つあれば知らせて保存しない。
   使う所：時給の月平均所定時間（平日で祝日でない日を、その年の所定労働日から引く）、入社・退職の月の日割り、出勤率の目安、支給日（休みなら前の平日） */
function offDaysHtml() {
  const c = ST.cfg, names = c.offNames || {}, rows = (c.offDays || []).slice().sort().map(d => ({ d, n: names[d] || '' }));
  const years = [...new Set(rows.map(r => r.d.slice(0, 4)))].sort();
  return '<div class="card"><details id="offd"><summary style="cursor:pointer;font-weight:800;font-size:1.05rem;">会社休日（' + (rows.length ? years.map(y => y + '年 ' + KY.offCount(Number(y), c.offDays) + '日').join('、') : 'まだ入れていません') + '）　押すと開きます</summary>' +
    '<div class="note" style="margin-top:8px;">土日・祝日のほかに会社が休みにする日（年末年始・お盆など）を、1日ずつ入れます。平日で祝日でない日だけが、時給の計算の所定労働日から引かれます（土日・祝日に重ねても数えません）。入社・退職の月の日割り、出勤率の目安、支給日（休みなら前の平日）にも使います。</div>' +
    '<div class="wrapx"><table class="t" id="oft" style="margin-top:8px;"></table></div><div class="msg" id="ofw" style="display:none;"></div>' +
    '<div class="row" style="margin-top:8px;"><button class="b" id="ofa">＋ 行を足す</button><span class="sp"></span><button class="b dark" id="ofs">会社休日を保存</button><span id="ofm" class="note"></span></div></details></div>';
}
function offDaysWire() {
  const c = ST.cfg, names = c.offNames || {};
  let rows = (c.offDays || []).slice().sort().map(d => ({ d, n: names[d] || '' }));
  const wd = ['日', '月', '火', '水', '木', '金', '土'], dup = () => { const m = {}; rows.forEach(r => { if (r.d) m[r.d] = (m[r.d] || 0) + 1; }); return Object.keys(m).filter(k => m[k] > 1); };
  const draw = () => {
    const dd = dup(), h = {};
    $('oft').innerHTML = '<tr><th>日付</th><th>曜日など</th><th>名前</th><th></th></tr>' + rows.map((r, i) => {
      let info = ''; if (r.d) { const x = new Date(r.d + 'T00:00:00'), y = x.getFullYear(); h[y] = h[y] || KY.jpHolidays(y); info = wd[x.getDay()] + (h[y][r.d] ? '・祝日（' + h[y][r.d] + '）' : '') + ((x.getDay() === 0 || x.getDay() === 6 || h[y][r.d]) ? '　<span class="note">もともと休みなので数えません</span>' : ''); }
      return '<tr' + (dd.includes(r.d) ? ' style="background:#fdecea;"' : '') + '><td><input type="date" data-od="' + i + '" value="' + esc(r.d) + '"></td><td>' + info + '</td><td><input type="text" data-on="' + i + '" value="' + esc(r.n) + '" placeholder="年末年始" style="width:180px;"></td><td><button class="b" data-ox="' + i + '">この行を消す</button></td></tr>';
    }).join('');
    $('ofw').style.display = dd.length ? '' : 'none';
    $('ofw').textContent = dd.length ? '同じ日付が2つあります（' + dd.map(d => d.replace(/-/g, '/')).join('、') + '）。1つにしてから保存してください。' : '';
    $('oft').querySelectorAll('[data-od]').forEach(x => { x.onchange = () => { rows[Number(x.dataset.od)].d = x.value; draw(); }; });
    $('oft').querySelectorAll('[data-on]').forEach(x => { x.oninput = () => { rows[Number(x.dataset.on)].n = x.value; }; });
    $('oft').querySelectorAll('[data-ox]').forEach(x => { x.onclick = () => { rows.splice(Number(x.dataset.ox), 1); draw(); }; });
  };
  draw();
  $('ofa').onclick = () => { const last = rows.length ? rows[rows.length - 1] : null; let d = ''; if (last && last.d) { const x = new Date(last.d + 'T00:00:00'); x.setDate(x.getDate() + 1); d = x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()); } rows.push({ d, n: last ? last.n : '' }); draw(); };   // 続けて入れやすいように、前の行の次の日と同じ名前を入れておく
  $('ofs').onclick = async () => {
    if (dup().length) { $('ofm').textContent = '同じ日付があるので保存していません。'; return; }
    const ok = rows.filter(r => r.d), offDays = ok.map(r => r.d).sort(), offNames = {}; ok.forEach(r => { offNames[r.d] = r.n.trim(); });
    try { $('ofs').disabled = true; await pay('saveCfg', { offDays, offNames }); ST.cfg.offDays = offDays; ST.cfg.offNames = offNames; drawSet(); $('offd').open = true; $('ofm').textContent = '保存しました'; } catch (x) { $('ofm').textContent = x.message; } finally { if ($('ofs')) $('ofs').disabled = false; }
  };
}

/* 有給の切り替え（2026-11-05 ユーザー指示）：好きな日を「切り替えの日」にして、その日の時点の残日数を全員分入れる。
   その日より後に取った有給をアプリが引いていく。切り替えの日より後に入社した人は、入社した日から数える */
function leaveSwitchHtml() {
  const sw = ST.cfg.leaveSwitch || '', list = ST.emps.filter(x => !x.left);   // 有給の切り替えは在籍している全員（月で絞らない）
  return '<div class="card"><h2>有給の切り替え</h2><div class="note">アプリで有給を数え始める日と、その日の時点で一人ずつ残っている日数を入れます（その日に取った分は引いた後の日数）。「うち繰り越し」は、前の年から繰り越した分です。次に有給が付く日に消えます。分からなければ空欄にします。0.5日も入れられます。切り替えの日より後に入社した人は入れません（入社した日から数えます）。</div>' +
    '<div class="row" style="margin-top:8px;"><label class="f">切り替えの日<br><input type="date" id="lsw" value="' + esc(sw) + '"></label></div>' +
    '<div class="wrapx"><table class="t" id="lst" style="margin-top:8px;"><tr><th>氏名</th><th>入社日</th><th class="n">残日数</th><th class="n">うち繰り越し</th></tr>' + list.map(e => '<tr><td>' + esc(e.name) + '</td><td>' + esc(e.joined || '（空欄）') + '</td><td class="n"><input type="number" step="0.5" min="0" data-lb="' + esc(e.id) + '" value="' + esc(e.leaveBase == null ? '' : e.leaveBase) + '" style="width:90px;text-align:right;"></td><td class="n"><input type="number" step="0.5" min="0" data-lc="' + esc(e.id) + '" value="' + esc(e.leaveCarry == null ? '' : e.leaveCarry) + '" style="width:90px;text-align:right;"></td></tr>').join('') + '</table></div>' +
    '<div class="row" style="margin-top:8px;"><button class="b dark" id="lsv">有給の切り替えを保存</button><span id="lsm" class="note"></span></div></div>';
}
function leaveSwitchWire() {
  const paint = () => { const sw = $('lsw').value; $('lst').querySelectorAll('[data-lb],[data-lc]').forEach(i => { const e = ST.emps.find(x => x.id === (i.dataset.lb || i.dataset.lc)), off = !sw || (e.joined && e.joined > sw); i.disabled = off; i.title = !sw ? '先に切り替えの日を入れます' : off ? '切り替えの日より後に入社した人です' : ''; }); };
  $('lsw').onchange = paint; paint();
  $('lsv').onclick = async () => {
    const sw = $('lsw').value, num = v => v === '' ? '' : Number(v);
    try {
      $('lsv').disabled = true; $('lsm').textContent = '保存しています…';
      for (const e of ST.emps.filter(x => !x.left)) {
        const b = $('lst').querySelector('[data-lb="' + e.id + '"]'), c = $('lst').querySelector('[data-lc="' + e.id + '"]'), nb = num(b.value), nc = num(c.value);
        if (nc !== '' && nb !== '' && nc > nb) throw new Error(e.name + '：うち繰り越しが残日数より多くなっています。');
        if ((e.leaveBase == null ? '' : e.leaveBase) === nb && (e.leaveCarry == null ? '' : e.leaveCarry) === nc) continue;
        const x = { ...e, leaveBase: nb, leaveCarry: nc }; await pay('saveEmp', x); Object.assign(e, x);
      }
      if ((ST.cfg.leaveSwitch || '') !== sw) { await pay('saveCfg', { leaveSwitch: sw }); ST.cfg.leaveSwitch = sw; }
      $('lsm').textContent = '保存しました';
    } catch (x) { $('lsm').textContent = x.message; } finally { $('lsv').disabled = false; }
  };
}

/* ---------- ログイン ---------- */
function login(msg) {
  $('hd').style.display = 'none';
  M.innerHTML = '<div class="card" id="login"><h2>給与管理</h2><label class="f">メールアドレス</label><input type="email" id="em" autocomplete="username"><label class="f">パスワード</label><input type="password" id="pw" autocomplete="current-password"><button class="b dark" id="go" style="width:100%;">ログイン</button><div class="msg" id="lm">' + esc(msg || '') + '</div><div class="note">現場管理ポータルと同じアカウントです。権限のある人だけ入れます。</div></div>';
  $('go').onclick = async () => { try { await signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value); } catch (e) { $('lm').textContent = 'ログインできませんでした。'; } };
}
$('out').onclick = e => { e.preventDefault(); signOut(auth); };
onAuthStateChanged(auth, async u => {
  if (!u) { ST = { me: null, cfg: null, emps: [], tab: 'month', ym: '' }; login(); return; }
  busy();
  try {
    const r = await pay('boot');
    ST.me = r.me; ST.cfg = { ...DEF, ...r.cfg }; ST.emps = sortEmps(r.emps);
    $('who').textContent = r.me.name; $('hd').style.display = ''; showReadAt(); draw();
  } catch (e) { await signOut(auth).catch(() => {}); login(e.message); }
});
</script>
</body>
</html>
