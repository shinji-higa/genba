<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>現場管理</title>
<!-- ホーム画面アイコン（iPhone / Android） -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="現場管理">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111111">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; overflow: hidden; }
  /* アプリをこのページの中に全画面で表示（Googleの注意書きの帯が出ない） */
  #app { position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top, 0px); width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; display: block; background: #ffffff; }
  #splash { position: fixed; inset: 0; background: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 2; transition: opacity .3s; }
  #splash img { width: 120px; height: 120px; border-radius: 24px; }
  #splash p { color: #bbbbbb; font: 600 14px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; margin: 0; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #help { position: fixed; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 3; display: none; background: rgba(17,17,17,.85); color: #fff; font: 600 12px -apple-system, BlinkMacSystemFont, "Hiragino Sans", Meiryo, sans-serif; padding: 8px 12px; border-radius: 18px; text-decoration: none; }
</style>
</head>
<body>
  <div id="splash"><img src="apple-touch-icon.png" alt=""><p>読み込んでいます…</p></div>
  <iframe id="app" title="現場管理システム" allow="camera; microphone; geolocation; clipboard-write; fullscreen"></iframe>
  <a id="help" href="guide.html">ホーム画面に追加する方法</a>
<script>
  // ▼ 現場管理システム（Apps Script Webアプリ）のURL
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzVlXtdeBEba1Z1qhxOvSi9AOXs0LPfdSK_sXwBDf2eIhJKR6z7CdZ6yGIDiK9IIw7tAw/exec';

  var frame = document.getElementById('app');
  var splash = document.getElementById('splash');
  frame.addEventListener('load', function () { splash.classList.add('hide'); });
  setTimeout(function () { splash.classList.add('hide'); }, 15000);
  frame.src = APP_URL;

  // ホーム画面から開いていないときだけ、追加方法の案内ボタンを数秒表示
  var fromHome = (window.navigator.standalone === true) ||
                 (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (!fromHome && /iPhone|iPad|iPod|Android/.test(navigator.userAgent)) {
    var help = document.getElementById('help');
    help.style.display = 'block';
    setTimeout(function () { help.style.display = 'none'; }, 12000);
  }
</script>
</body>
</html>
