<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>消耗品注文</title>
  <!-- Ver.20261103-04 -->
  <style>
    /* 消耗品注文（フカガワの総合カタログの消耗品）。丸ダクト注文の注文書の仕組みを使う。2026-11-01 作成
       見た目は角ダクトの製作伝票にそろえる（白黒を基調に、薄い灰色は使わない） */
    :root { --bg: #e8eaed; --text: #111; --muted: #3d3d3d; --border: #9e9e9e; --primary: #111; --err: #b3261e; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif; }
    html, body { height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--text); }
    #app { height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    button { font: inherit; color: inherit; }
    input, select, textarea { min-width: 0; max-width: 100%; }
    .top { position: sticky; top: 0; z-index: 30; background: #fff; border-bottom: 2px solid #111; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
    .top-title { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; border-radius: 4px; border: 1.5px solid var(--primary); cursor: pointer; padding: 9px 14px; background: #fff; white-space: nowrap; }
    .btn-dark { background: var(--primary); color: #fff; }
    .btn-sub { border-color: #6e6e6e; color: #222; font-size: 0.82rem; padding: 7px 10px; }
    .btn-danger { color: var(--err); border-color: #d9a29d; }
    .btn:disabled { background: #8a8a8a; border-color: #8a8a8a; color: #f2f2f2; }
    .layout { display: flex; gap: 16px; padding: 12px; max-width: 1600px; margin: 0 auto; }
    .col-left { width: 100%; max-width: 640px; margin: 0 auto; }
    .col-right { display: none; }
    @media (min-width: 1100px) {
      .col-left { width: 460px; flex-shrink: 0; margin: 0; }
      .col-right { display: block; flex: 1; min-width: 0; position: sticky; top: 58px; align-self: flex-start; max-height: calc(100vh - 72px); overflow: auto; }
      .only-mobile { display: none !important; }
    }
    @media (max-width: 1099px) { .only-desk { display: none !important; } }
    .card { border: 1.5px solid #a3a7ad; border-radius: 8px; background: #eceef1; padding: 12px; margin-bottom: 12px; }
    .card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1.5px solid #a3a7ad; font-weight: 700; font-size: 0.95rem; }
    .fg { margin-bottom: 10px; }
    label, .lbl { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; color: #222; }
    input[type="text"], input[type="date"], input[type="number"], select, textarea { width: 100%; padding: 9px 10px; border: 1.5px solid #8d9298; border-radius: 4px; font-size: 1rem; background: #fff; color: #111; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #111; }
    input::placeholder, textarea::placeholder { color: #6b6b6b; }
    textarea { resize: vertical; min-height: 56px; }
    .g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    /* iPhone の日付欄は幅の指定を受け付けず枠からはみ出す（2026-11-02 比嘉さんの報告）。iPhone だけに効かせる */
    @supports (-webkit-touch-callout: none) {
      input[type="date"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; max-width: 100%; min-height: 44px; text-align: left; }
      input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
    }
    .g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 7px 12px; border-radius: 16px; border: 1.5px solid #6e6e6e; background: #fff; font-size: 0.85rem; font-weight: 700; color: #222; cursor: pointer; user-select: none; }
    .chip.on { background: #111; border-color: #111; color: #fff; }
    .chip.dis { background: #e3e3e3; border-color: #b5b5b5; color: #8a8a8a; cursor: default; }   /* 選べない（ダンパーの SPサイズなど） */
    .note { font-size: 0.8rem; color: var(--muted); line-height: 1.6; }
    .warnbox { background: #fff4d6; color: #6b4a00; border: 1.5px solid #e0b64a; border-radius: 4px; padding: 8px 10px; font-size: 0.85rem; font-weight: 700; margin-top: 8px; }
    .errbox { background: #fceded; color: var(--err); border-radius: 4px; padding: 8px 10px; font-size: 0.85rem; font-weight: 700; margin-top: 8px; }
    /* 部材の一覧 */
    .items { display: flex; flex-direction: column; gap: 8px; }
    .item { display: flex; gap: 10px; align-items: center; border: 1.5px solid #9e9e9e; border-radius: 6px; padding: 8px; background: #fff; cursor: pointer; content-visibility: auto; contain-intrinsic-size: auto 70px; }   /* 画面の外の部材は描かない（製作伝票と同じ） */
    .item-ic { width: 64px; height: 45px; flex-shrink: 0; }
    .item-b { flex: 1; min-width: 0; }
    .item-t { font-weight: 700; font-size: 0.95rem; }
    .item-s { font-size: 0.82rem; color: #333; }
    .item-q { font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
    .empty { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 16px 0; }
    .bottom-bar { position: sticky; bottom: 0; z-index: 25; background: #fff; border-top: 1.5px solid #9e9e9e; padding: 10px 12px; display: flex; gap: 8px; }
    .bottom-bar .btn { flex: 1; min-width: 0; padding: 12px 6px; }
    /* 全画面のシート */
    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 50; display: none; }
    .sheet-bg.open { display: block; }
    .sheet { position: absolute; inset: 0; background: #fff; display: flex; flex-direction: column; }
    @media (min-width: 900px) { .sheet { inset: 4vh auto auto 50%; transform: translateX(-50%); width: min(760px, 94vw); max-height: 92vh; border-radius: 8px; } }
    .sheet-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1.5px solid #9e9e9e; font-weight: 700; }
    .sheet-h .ttl { flex: 1; min-width: 0; }
    .sheet-b { flex: 1; overflow: auto; padding: 12px; background: #eceef1; }
    .sheet-f { display: flex; gap: 8px; padding: 10px 12px; border-top: 1.5px solid #9e9e9e; }
    .sheet-f .btn { flex: 1; padding: 12px; }
    .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    @media (max-width: 520px) { .pick-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; } .pick { padding: 5px; } .pick svg { height: 60px; } .pick-n { font-size: 0.8rem; } }   /* スマホは3列（スクロールを短く） */
    .pick { border: 1.5px solid #8d9298; border-radius: 6px; padding: 8px; cursor: pointer; text-align: center; background: #fff; }
    .pick:hover { border-color: #111; }
    .pick svg { width: 100%; height: 84px; }
    .pick-n { font-weight: 700; font-size: 0.9rem; margin-top: 4px; }
    .edfig { background: #fff; border: 1.5px solid #9e9e9e; border-radius: 6px; padding: 6px; margin-bottom: 10px; }
    .edfig svg { width: 100%; height: auto; max-height: 230px; display: block; }
    .edbox { border: 1.5px solid #a3a7ad; border-radius: 8px; background: #eceef1; padding: 10px 12px; margin-bottom: 10px; }
    .qty { display: flex; align-items: center; gap: 8px; }
    .qty button { width: 46px; height: 42px; border: 1.5px solid #6e6e6e; border-radius: 6px; background: #fff; font-size: 1.3rem; font-weight: 700; cursor: pointer; }
    .qty input { text-align: center; font-size: 1.15rem; font-weight: 700; }
    .slip-row { display: flex; gap: 10px; align-items: center; border: 1.5px solid #9e9e9e; border-radius: 6px; padding: 10px; margin-bottom: 8px; background: #fff; }
    .slip-row .b { flex: 1; min-width: 0; cursor: pointer; }
    .slip-row .t { font-weight: 700; }
    .slip-row .m { font-size: 0.8rem; color: var(--muted); }
    /* 消耗品を選ぶ画面 */
    /* 現場管理の中だけで出す物（工場へ提出・閉じる・保存の状態。製作伝票と同じ） */
    body:not(.hosted) .host-only { display: none !important; }
    .save-st { font-size: 0.75rem; color: #444; align-self: center; white-space: nowrap; }
    .save-st.err { color: #c62828; font-weight: 700; }
    .btn-block { width: 100%; }
    .pdf-f { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1.5px solid #9e9e9e; border-radius: 6px; margin-bottom: 6px; font-size: 0.9rem; cursor: pointer; background: #fff; }
    .pdf-f input[type="radio"] { width: 18px; height: 18px; flex: none; }
    .pdf-f input[type="text"] { flex: 1; min-width: 0; }
    .pdf-msg { margin-top: 10px; font-size: 0.88rem; font-weight: 700; }
    .pdf-msg.err { color: #c62828; }
    .rev-bar { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; line-height: 1.5; }
    .rev-bar.done { background: #eef4ff; border: 1.5px solid #1a5fd0; }
    .rev-bar.edit { background: #fff1f0; border: 1.5px solid #d40000; color: #8a0000; }
    .rev-bar .btn { flex: none; }
    .locked .col-left .card { opacity: 0.55; pointer-events: none; }
    .locked .bottom-bar .btn-dark { opacity: 0.4; }
    .slip-row .del { color: #c62828; border-color: #e8b4b0; }
    .slip-row.cur { border-color: #111; }
    /* 一覧の数の ＋－ */
    .item-q { display: flex; align-items: center; gap: 6px; }
    .item-q .qb { width: 34px; height: 34px; border: 1.5px solid #6e6e6e; border-radius: 6px; background: #fff; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
    .item-q span { min-width: 22px; text-align: center; }
    /* 版の印・修正の赤 */
    .dp-title { position: relative; }
    .dp-rev { position: absolute; left: 0; bottom: 1.5mm; font-size: 10pt; font-weight: 700; border: 0.5mm solid #000; padding: 0.4mm 2mm; font-family: "Yu Gothic", Meiryo, sans-serif; }
    .dp-rev.red { color: #d40000; border-color: #d40000; }
    .dp-cont-head .dp-rev { position: static; font-size: 8.5pt; white-space: nowrap; }
    .dp-red { color: #d40000 !important; font-weight: 700; }
    .dp tr.red td, .dp td.q.red { color: #d40000; font-weight: 700; }
    .dp .dp-chgt td { color: #d40000; text-align: left !important; font-family: "Yu Gothic", Meiryo, sans-serif; font-size: 9pt; padding-left: 2mm; }
    .toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 0.9rem; z-index: 99; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }

    /* ===== 注文書（A4）===== 製作伝票と同じ書式 */
    .pv-wrap { background: #e9e9ec; padding: 12px; border-radius: 6px; }
    .pv-page { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.2); margin: 0 auto 12px; overflow: hidden; }
    .pv-page > .dp { transform-origin: 0 0; }
    .dp { width: 210mm; height: 297mm; padding: 8mm 9mm 7mm; color: #000; font-family: "MS Mincho", "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 9pt; display: flex; flex-direction: column; background: #fff; }
    .dp .gt { font-family: "Yu Gothic", "Hiragino Sans", Meiryo, sans-serif; }
    .dp-title { display: flex; align-items: flex-end; justify-content: center; position: relative; height: 13mm; }
    .dp-title h1 { font-size: 22pt; font-weight: 400; letter-spacing: 0.3em; }
    .dp-no { position: absolute; right: 0; bottom: 0; font-size: 9pt; text-align: right; line-height: 1.4; }
    .dp-no b { font-size: 12pt; font-weight: 400; }
    .dp-head { display: flex; justify-content: space-between; gap: 6mm; margin-top: 2mm; }
    .dp-lines { width: 50%; }
    .dp-line { display: flex; border-bottom: 1px solid #000; height: 6.4mm; align-items: flex-end; padding-bottom: 0.6mm; gap: 3mm; white-space: nowrap; overflow: hidden; }
    .dp-line .k { width: 15mm; text-decoration: underline; flex-shrink: 0; }
    .dp-line .v { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .dp-co { width: 50%; text-align: right; padding-top: 0; font-size: 7.2pt; line-height: 1.32; }
    .dp-co .co-who { font-weight: 700; }
    .dp-co img { height: 6mm; vertical-align: middle; }
    .dp-co .nm { font-size: 9.5pt; font-weight: 700; vertical-align: middle; margin-left: 2mm; }
    .dp-co .nm { display: block; margin: 0.5mm 0 0; }
    @media screen { .co-link { color: #1a56c4; text-decoration: underline; cursor: pointer; } }
    .dp table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .dp td, .dp th { border: 1px solid #000; text-align: center; font-weight: 400; height: 6.6mm; padding: 0 1mm; white-space: nowrap; overflow: hidden; }
    /* 接合（差込・FG）はとても大事なので、閉の印のように角の丸い四角（グレー地・太字）で囲む（ユーザー指示 2026-10-30。文字の大きさはほかと同じ） */
    .dp td.join .jt { display: inline-block; background: #bdbdbd; color: #000; font-weight: 700; border-radius: 1.2mm; padding: 0 2.5mm; line-height: 1.5; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* 表の見出しに色（前は 200φ の行に付けていた色） */
    .dp th, .dp td.k { background: #e6f0f5; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* 長い文字（その他のメモなど）は文字を小さくせずに折り返す */
    .dp td.wrap { white-space: normal; height: auto; min-height: 6.4mm; line-height: 1.3; padding: 0.8mm 1mm; word-break: break-all; }
    .dp-spec { margin-top: 2.5mm; font-size: 8.5pt; }
    .dp-spec td.k { width: 14mm; }
    .dp-spec td.memo { text-align: left; white-space: pre-line; line-height: 1.25; }
    .dp-sec { margin-top: 3mm; margin-bottom: 1mm; font-size: 9pt; font-weight: 700; }
    .dp-mx th { font-size: 9.5pt; line-height: 1.05; }
    .dp-mx th small { display: block; font-size: 7.5pt; }
    .dp-mx th.sub { font-size: 7pt; height: 5mm; padding: 0; }
    /* 仕様の板厚と違う部材・閉止板の印（黒地に白の太字。見落とさないように） */
    .dp .pt { display: inline-block; background: #000; color: #fff; font-weight: 700; font-size: 7pt; line-height: 1.25; padding: 0 0.6mm; border-radius: 0.6mm; margin: 0 0.4mm 0 1.2mm; vertical-align: 0.3mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .dp .pt:first-child { margin-left: 0; }
    .dp .vt { display: inline-block; border: 1px solid #000; font-size: 7pt; font-weight: 700; line-height: 1.2; padding: 0 0.6mm; margin-right: 0.8mm; vertical-align: 0.3mm; }   /* SP・防虫の印 */
    .dp-mx td.sz { font-weight: 700; }
    .dp-mx td.q, .dp-br td.q, .dp-fx td.q { font-size: 10.5pt; }
    .dp-br td, .dp-fx td { height: 6.4mm; }
    .dp-cs td { height: 6.4mm; }
    .dp-cs td.l { text-align: left; }
    .dp-foot { font-size: 7.5pt; margin-top: 1.5mm; }
    .dp-cont-head { display: flex; align-items: flex-end; gap: 4mm; border-bottom: 1.5px solid #000; padding-bottom: 1.5mm; }
    .dp-cont-head h1 { font-size: 15pt; font-weight: 400; letter-spacing: 0.15em; white-space: nowrap; }
    .dp-cont-head .site { flex: 1; min-width: 0; font-size: 9pt; white-space: nowrap; overflow: hidden; }
    .dp-cont-head .no { font-size: 9pt; text-align: right; white-space: nowrap; }
    #print-root { display: none; }
    @media print {
      @page { size: A4 portrait; margin: 0; }
      html, body { height: auto; overflow: visible; }
      body { background: #fff; }
      body > *:not(#print-root) { display: none !important; }
      #print-root { display: block; }
      #print-root .dp { page-break-after: always; break-after: page; }
      #print-root .dp:last-child { page-break-after: auto; break-after: auto; }
    }
    /* 消耗品を選ぶ画面 */
    .cons-g { margin-bottom: 14px; }
    .cons-gh { font-weight: 700; font-size: 0.92rem; margin-bottom: 6px; }
    .cons-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
    .cons-p { text-align: left; padding: 10px; border: 1.5px solid #8d9298; border-radius: 6px; background: #fff; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
    .cons-p small { display: block; font-weight: 400; font-size: 0.78rem; color: #333; margin-top: 2px; }
    .cons-tabs { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; flex-basis: 100%; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    .cons-tabs .chip { flex: none; }
    .rec-row { display: flex; align-items: center; gap: 10px; background: #fff; border: 1.5px solid #9e9e9e; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
    .rec-row input[type="checkbox"] { width: 22px; height: 22px; flex: none; }
    .rec-row .b { flex: 1; min-width: 0; }
    .rec-row .q { width: 72px; flex: none; text-align: center; font-weight: 700; }
    .rec-row .u { flex: none; font-size: 0.85rem; }
    .dp-cs col.n { width: 56mm; }
    .dp-cs td.q { font-size: 10.5pt; }
  </style>
</head>
<body>
  <div id="app">
    <div class="top">
      <div class="top-title" id="topTitle">消耗品注文</div>
      <div class="top-btns">
        <span class="save-st host-only" id="saveState"></span>
        <button type="button" class="btn btn-sub" onclick="openSlips()">注文書一覧</button>
        <button type="button" class="btn btn-sub" onclick="saveSlip(true)">保存</button>
        <button type="button" class="btn btn-sub only-desk" onclick="printSlip()">印刷</button>
        <button type="button" class="btn btn-dark only-desk host-only" onclick="openSubmit()">工場へ提出</button>
        <button type="button" class="btn btn-sub host-only" onclick="closeApp()">閉じる</button>
      </div>
    </div>

    <div class="layout">
      <section class="col-left">
        <div class="rev-bar" id="revBar" style="display:none;"></div>
        <div class="card">
          <div class="card-h">注文書の情報</div>
          <div class="g2">
            <div class="fg"><label for="fNo">注文書NO</label><input type="text" id="fNo" data-k="no" readonly placeholder="提出時に自動" style="background:#ececec;"></div>
            <div class="fg"><label for="fOrderer">注文者</label><input type="text" id="fOrderer" data-k="orderer"></div>
          </div>
          <div class="fg"><label for="fSite">現場名</label><input type="text" id="fSite" data-k="site"></div>
          <div class="fg"><label for="fRoom">室名</label><input type="text" id="fRoom" data-k="room"></div>
          <div class="g2">
            <div class="fg"><label for="fOrderDate">発注日</label><input type="date" id="fOrderDate" data-k="orderDate"></div>
            <div class="fg"><label for="fDelivDate">搬入日</label><input type="date" id="fDelivDate" data-k="delivDate"></div>
          </div>
          <div class="fg"><span class="lbl">搬入先</span><div class="chips" id="cDest"></div></div>
          <div class="fg" id="coAddrRow" style="display:none;"><span class="lbl">会社の住所</span><div class="chips" id="cCoAddr"></div></div>
          <div class="fg"><label for="fMemo">Memo（注文書に出ます）</label><textarea id="fMemo" data-k="memo"></textarea></div>
        </div>

        <div class="card">
          <div class="card-h"><span>消耗品（<span id="itemCount">0</span>件）</span>
            <span style="display:flex; gap:6px;"><button type="button" class="btn btn-sub host-only" onclick="openRecent()">前回の注文</button><button type="button" class="btn btn-dark" onclick="openPicker()">＋ 追加</button></span></div>
          <div class="items" id="items"></div>
        </div>
      </section>
      <section class="col-right"><div class="pv-wrap" id="pvDesk"></div></section>
    </div>

    <div class="bottom-bar only-mobile">
      <button type="button" class="btn" onclick="openPreview()">注文書を見る</button>
      <button type="button" class="btn btn-dark" onclick="openPicker()">＋ 消耗品を追加</button>
      <button type="button" class="btn btn-dark host-only" onclick="openSubmit()">工場へ提出</button>
    </div>
  </div>

  <!-- 消耗品を選ぶ -->
  <div class="sheet-bg" id="pickerBg" onclick="if(event.target===this)closeSheet('pickerBg')">
    <div class="sheet">
      <div class="sheet-h"><span class="ttl">消耗品を選ぶ</span><button type="button" class="btn btn-sub" onclick="closeSheet('pickerBg')">閉じる</button>

    function jpDate(s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? (+m[1]) + '年' + (+m[2]) + '月' + (+m[3]) + '日' : ''; }
    var STORE = 'consOrders.v1';
    var S = null;
    function blank() { return { id: uid(), no: '', orderer: '', site: '', room: '', orderDate: today(), delivDate: '', dest: '現場', memo: '', items: [], updated: 0 }; }
    function normSlip(s) { s.items = s.items || []; s.items.forEach(function (it) { if (!it.id) it.id = uid(); }); return s; }
    function loadStore() { try { return JSON.parse(localStorage.getItem(STORE) || '[]'); } catch (e) { return []; } }

    function saveSlip(show) {
      if (HOST) { hostSave(show); return; }   // 現場管理の中ではサーバーに保存
      S.updated = Date.now();
      var a = loadStore().filter(function (x) { return x.id !== S.id; });
      a.unshift(JSON.parse(JSON.stringify(S)));
      writeStore(a.slice(0, 200));
      if (show) toast('保存しました');
    }
    var saveTimer = null;
    function changed() {
      renderAll();
      if (HOST) { SRV.dirty = true; setSaveState('未保存'); hostSchedule(3000); return; }   // 現場管理の中：入力が止まって3秒で保存（製作伝票と同じ）
      clearTimeout(saveTimer); saveTimer = setTimeout(function () { saveSlip(false); }, 1500);
    }

    /* 消耗品1件の文字 */
    function consName(c) { return c.free ? [c.maker, c.name].filter(Boolean).join('　') : c.n; }
    function sizeText(it) { return it.spec || ''; }
    function itemSub(it) { return [it.mat, it.spec, it.memo].filter(Boolean).join('　'); }
    function itemErrors(c) {
      var e = [];
      if (c.free && !String(c.name || '').trim()) e.push('品名を入れてください。');
      if (!(num(c.qty) > 0)) e.push('数を入れてください。');
      return e;
    }
    function matOf(p, mat) { return (p.mats || []).filter(function (x) { return x.m === mat; })[0] || null; }
    function specsOf(p, mat) { var m = matOf(p, mat); return m ? m.s : (p.s || []); }
    function pkOf(n, mat, spec) {
      var r = PK[n]; if (!r) return null;
      var e = r.by ? (r.by[mat + '|' + spec] || r.by[spec]) : r.p;
      if (!e) return null;
      return e.b ? e : { b: r.b, p: e };
    }
    function pkText(k) { return k.p.map(function (x) { return x[0] + x[1].toLocaleString() + k.b; }).join('・'); }
    function fitUnit() {
      var c = ED.it, k = pkOf(c.n, c.mat, c.spec); if (!k) return;
      if (c.unit !== k.b && !k.p.some(function (x) { return x[0] === c.unit; })) c.unit = k.p[0][0];
    }
    function edTotal() {
      var c = ED.it, k = pkOf(c.n, c.mat, c.spec), el = document.getElementById('edTotal'); if (!el) return;
      var x = k ? k.p.filter(function (a) { return a[0] === c.unit; })[0] : null;
      el.textContent = x ? '合計 ' + (num(c.qty) * x[1]).toLocaleString() + k.b : '';
    }
    function consProd(g, n) {
      for (var i = 0; i < CONS.length; i++) if (CONS[i].g === g) for (var j = 0; j < CONS[i].list.length; j++) if (CONS[i].list[j].n === n) return CONS[i].list[j];
      return null;
    }

    /* ===== 画面の表示 ===== */
    function renderAll() {
      document.querySelectorAll('[data-k]').forEach(function (el) { if (document.activeElement !== el) el.value = S[el.getAttribute('data-k')] || ''; });
      renderChips('cDest', OPT.dest, 'dest');
      var ads = coAddrs(S).map(function (a) { return a.label; });
      document.getElementById('coAddrRow').style.display = ads.length > 1 ? '' : 'none';
      if (ads.length > 1) { if (ads.indexOf(S.coAddr) < 0) S.coAddr = ads[0]; renderChips('cCoAddr', ads, 'coAddr'); }
      document.getElementById('topTitle').textContent = '消耗品注文' + (S.site ? '　' + S.site : '');
      renderItems();
      renderRev();
      schedulePreview();
    }
    var pvTimer = null;
    function schedulePreview() { clearTimeout(pvTimer); pvTimer = setTimeout(renderPreview, 250); }
    function renderChips(id, list, key) {
      document.getElementById(id).innerHTML = list.map(function (v) {
        return '<span class="chip' + (S[key] === v ? ' on' : '') + '" onclick="setOpt(\'' + key + '\',\'' + v + '\')">' + esc(v) + '</span>';
      }).join('');
    }
    function setOpt(k, v) { S[k] = v; changed(); }
    function renderItems() {
      var el = document.getElementById('items');
      document.getElementById('itemCount').textContent = S.items.length;
      if (!S.items.length) { el.innerHTML = '<div class="empty">「＋ 追加」から入力してください。</div>'; return; }
      el.innerHTML = S.items.map(function (it, i) {
        var er = itemErrors(it);
        return '<div class="item" onclick="editItem(' + i + ')"><div class="item-b"><div class="item-t">' + esc(consName(it)) + '</div><div class="item-s">' + esc(itemSub(it)) + '</div>' +
          (er.length ? '<div class="item-s" style="color:var(--err);font-weight:700;">' + esc(er[0]) + '</div>' : '') + '</div>' +
          '<div class="item-q"><button type="button" class="qb" onclick="event.stopPropagation(); qtyStep(' + i + ', -1)">－</button><span>' + esc(it.qty || 0) + '</span><button type="button" class="qb" onclick="event.stopPropagation(); qtyStep(' + i + ', 1)">＋</button></div>' +
          '<div class="item-s" style="white-space:nowrap;">' + esc(it.unit || '') + '</div></div>';
      }).join('');
    }
    function qtyStep(i, d) {
      if (revLocked()) { lockedToast(); return; }
      var it = S.items[i]; if (!it) return;
      it.qty = Math.max(1, (parseInt(it.qty, 10) || 0) + d); changed();
    }
    document.addEventListener('input', function (e) {
      var k = e.target.getAttribute && e.target.getAttribute('data-k');
      if (k) {
        S[k] = e.target.value;
        if (HOST) { SRV.dirty = true; setSaveState('未保存'); hostSchedule(3000); schedulePreview(); return; }
        if (k === 'site') document.getElementById('topTitle').textContent = '消耗品注文' + (S.site ? '　' + S.site : '');
        schedulePreview(); clearTimeout(saveTimer); saveTimer = setTimeout(function () { saveSlip(false); }, 1500);
      }
    });

    /* ===== 消耗品を選ぶ・入れる ===== */
    var PICK_G = '', PICK_S = '';   // 分類の絞り込み・「その他」の中の分類（チェックのない品。ユーザー指示 2026-11-02）
    function hiddenGroups() { return CONS.filter(function (g) { return g.list.some(function (p) { return HIDE.indexOf(p.n) >= 0; }); }).map(function (g) { return g.g; }); }
    function openPicker() {
      if (revLocked()) { lockedToast(); return; }
      document.getElementById('consFind').value = '';
      document.getElementById('consTabs').innerHTML = [''].concat(CONS.filter(function (g) { return g.g !== 'フリー入力' && g.list.some(function (p) { return HIDE.indexOf(p.n) < 0; }); }).map(function (g) { return g.g; }), ['フリー入力', 'その他']).map(function (g) {
        return '<span class="chip' + (g === PICK_G ? ' on' : '') + '" onclick="pickG(this,\'' + g + '\')">' + esc(g || 'すべて') + '</span>';
      }).join('');
      renderSub(); renderPick();
      openSheet('pickerBg');
    }
    function pickG(el, g) {
      if (g === 'フリー入力') { var gi = CONS.findIndex(function (x) { return x.g === g; }); pickCons(gi, 0); return; }   // 押したらすぐ入力欄へ
      PICK_G = g; PICK_S = ''; [].forEach.call(document.querySelectorAll('#consTabs .chip'), function (c) { c.classList.toggle('on', c === el); }); renderSub(); renderPick();
    }
    function renderSub() {
      var el = document.getElementById('consSub'), on = PICK_G === 'その他';
      el.style.display = on ? '' : 'none';
      if (on) el.innerHTML = [''].concat(hiddenGroups()).map(function (g) { return '<span class="chip' + (g === PICK_S ? ' on' : '') + '" onclick="pickS(this,\'' + g + '\')">' + esc(g || 'ぜんぶ') + '</span>'; }).join('');
    }
    function pickS(el, g) { PICK_S = g; [].forEach.call(document.querySelectorAll('#consSub .chip'), function (c) { c.classList.toggle('on', c === el); }); renderPick(); }
    function renderPick() {
      var q = document.getElementById('consFind').value.trim();
      var h = CONS.map(function (g, gi) {
        var other = PICK_G === 'その他';
        if (other ? (PICK_S && g.g !== PICK_S) : (PICK_G && g.g !== PICK_G)) return '';
        var list = g.list.map(function (p, pi) { return { p: p, pi: pi }; }).filter(function (x) {
          return (HIDE.indexOf(x.p.n) >= 0) === other && (!q || (g.g + x.p.n + (x.p.d || '') + (x.p.s || []).join(' ') + (x.p.mats || []).map(function (m) { return m.m + ' ' + m.s.join(' '); }).join(' ')).indexOf(q) !== -1);
        });
        if (!list.length) return '';
        return '<div class="cons-g"><div class="cons-gh">' + esc(g.g) + (g.p ? '　<span class="note">カタログ p.' + g.p + '〜</span>' : '') + '</div><div class="cons-list">' +
          list.map(function (x) { var sub = x.p.nosub ? '' : x.p.mats ? x.p.mats.map(function (m) { return m.m; }).join('・') : (x.p.d || ''); return '<button type="button" class="cons-p" onclick="pickCons(' + gi + ',' + x.pi + ')">' + esc(x.p.n) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</button>'; }).join('') + '</div></div>';
      }).join('');
      document.getElementById('consPick').innerHTML = h || '<div class="empty">見つかりません。「その他」から品名を入れてください。</div>';
    }
    var ED = null;   // { it, index }
    function pickCons(gi, pi) {
      var g = CONS[gi], p = g.list[pi];
      closeSheet('pickerBg');
      var df = DEF[p.n] || [], mat = p.mats ? (matOf(p, df[0]) ? df[0] : p.mats[0].m) : '', sp = specsOf(p, mat);
      ED = { it: { id: uid(), g: g.g, n: p.n, free: !!p.free, maker: '', name: '', mat: mat, spec: sp.indexOf(df[1]) >= 0 ? df[1] : (sp.length ? sp[0] : ''), qty: 1, unit: p.u, memo: '' }, index: -1 };
      fitUnit(); openEditor();
    }
    function backToPicker() { closeSheet('editorBg'); openPicker(); }
    function editItem(i) { if (revLocked()) { lockedToast(); return; } ED = { it: JSON.parse(JSON.stringify(S.items[i])), index: i }; openEditor(); }
    function openEditor() {
      var c = ED.it, p = consProd(c.g, c.n) || { s: [], u: c.unit }, specs = specsOf(p, c.mat), m0 = matOf(p, c.mat);
      document.getElementById('edTitle').textContent = (c.free ? 'フリー入力' : c.n) + (ED.index >= 0 ? '（編集）' : '');
      document.getElementById('edDel').style.display = ED.index >= 0 ? '' : 'none';
      document.getElementById('edBack').style.display = ED.index >= 0 ? 'none' : '';
      var h = '<div class="edbox">';
      if (c.free) h += '<div class="fg"><label>メーカー名</label><input type="text" value="' + esc(c.maker) + '" oninput="ED.it.maker=this.value"></div>' +
        '<div class="fg"><label>品名</label><input type="text" value="' + esc(c.name) + '" oninput="ED.it.name=this.value; refreshEd()"></div>' +
        '<div class="fg"><label>サイズ・材質など</label><input type="text" value="' + esc(c.spec) + '" oninput="ED.it.spec=this.value"></div>';
      else if (p.mats) h += '<div class="fg"><span class="lbl">' + esc(p.ml || '材質') + '</span><div class="chips">' + p.mats.map(function (x, i) { return '<span class="chip' + (x.m === c.mat ? ' on' : '') + '" onclick="edMat(' + i + ')">' + esc(x.m) + '</span>'; }).join('') + '</div></div>';
      else h += '<div class="fg"><label>材質（あれば）</label><input type="text" value="' + esc(c.mat) + '" placeholder="例：ステンレス" oninput="ED.it.mat=this.value"></div>';
      var inList = specs.indexOf(c.spec) !== -1;
      if (specs.length && p.split && inList) {
        var sp2 = c.spec.split('×'), ds = specs.map(function (v) { return v.split('×')[0]; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
        var ls = specs.filter(function (v) { return v.split('×')[0] === sp2[0]; }).map(function (v) { return v.split('×')[1]; });
        h += '<div class="fg"><label>' + esc(p.split[0]) + '</label><select onchange="edSplit(0,this.value)">' + ds.map(function (v) { return '<option' + (v === sp2[0] ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') + '</select></div>';
        h += '<div class="fg"><label>' + esc(p.split[1]) + '</label><select onchange="edSplit(1,this.value)">' + ls.map(function (v) { return '<option value="' + esc(v) + '"' + (v === sp2[1] ? ' selected' : '') + '>' + esc(v + p.split[2]) + '</option>'; }).join('') + '<option value="__other">ほかの仕様（文字で入れる）</option></select></div>';
      } else if (specs.length) h += '<div class="fg"><label>仕様・サイズ</label><select onchange="edSpec(this.value)">' + specs.map(function (v) { return '<option' + (c.spec === v ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') + '<option value="__other"' + (!inList ? ' selected' : '') + '>ほかの仕様（文字で入れる）</option></select></div>';
      if (!c.free && (!specs.length || !inList)) h += '<div class="fg"><label>' + (specs.length ? 'ほかの仕様' : '仕様・サイズ・型番') + '</label><input type="text" id="edSpecTx" value="' + esc(c.spec) + '" placeholder="例：W3/8×20、φ150 など" oninput="ED.it.spec=this.value"></div>';
      h += '<div class="fg"><label>数</label><div class="qty"><button type="button" onclick="edQty(-1)">－</button><input type="number" inputmode="numeric" id="edQty" value="' + esc(c.qty) + '" oninput="ED.it.qty=this.value; refreshEd()"><button type="button" onclick="edQty(1)">＋</button></div></div>';
      var k = pkOf(c.n, c.mat, c.spec);
      var uo = k ? [[k.b, k.b + '（バラ）']].concat(k.p.map(function (x) { return [x[0], x[0] + '（' + x[1].toLocaleString() + k.b + '）']; })) : UNITS.map(function (u) { return [u, u]; });
      if (!uo.some(function (x) { return x[0] === c.unit; })) uo.push([c.unit, c.unit]);
      h += '<div class="fg"><label>単位</label><select onchange="ED.it.unit=this.value; edTotal()">' + uo.map(function (u) { return '<option value="' + esc(u[0]) + '"' + (c.unit === u[0] ? ' selected' : '') + '>' + esc(u[1]) + '</option>'; }).join('') + '</select><div class="note" id="edTotal"></div></div>';
      h += '<div class="fg"><label>メモ（注文書に出ます）</label><textarea rows="3" oninput="ED.it.memo=this.value">' + esc(c.memo) + '</textarea></div>';   // 長いメモも折り返して全部見える（丸ダクトと同じ）
      if (k) h += '<div class="note">入数：' + esc(pkText(k)) + '</div>';
      var note = (m0 && m0.d) || p.d; if (note) h += '<div class="note">' + esc(note) + '</div>';
      h += '</div><div id="edErr"></div>';
      document.getElementById('edForm').innerHTML = h;
      refreshEd();
      openSheet('editorBg');
    }
    function edMat(i) {
      var p = consProd(ED.it.g, ED.it.n), m = p.mats[i], keep = m.s.indexOf(ED.it.spec) >= 0;
      ED.it.mat = m.m; if (!keep) ED.it.spec = m.s.length ? m.s[0] : '';
      fitUnit(); openEditor();
    }
    function edSpec(v) { ED.it.spec = v === '__other' ? '' : v; fitUnit(); openEditor(); if (v === '__other') document.getElementById('edSpecTx').focus(); }
    function edSplit(i, v) {
      if (v === '__other') { edSpec(v); return; }
      var p = consProd(ED.it.g, ED.it.n), a = ED.it.spec.split('×'), specs = specsOf(p, ED.it.mat);
      a[i] = v;
      if (specs.indexOf(a.join('×')) < 0) a[1] = specs.filter(function (x) { return x.split('×')[0] === a[0]; })[0].split('×')[1];
      ED.it.spec = a.join('×'); fitUnit(); openEditor();
    }
    function edQty(d) { ED.it.qty = Math.max(0, num(ED.it.qty) + d); document.getElementById('edQty').value = ED.it.qty; refreshEd(); }
    function refreshEd() {
      edTotal();
      var er = itemErrors(ED.it);
      document.getElementById('edErr').innerHTML = er.length ? '<div class="errbox">' + er.map(esc).join('<br>') + '</div>' : '';
      document.getElementById('edOk').disabled = er.length > 0;
    }
    function commitItem() {
      if (itemErrors(ED.it).length) return;
      if (ED.index >= 0) S.items[ED.index] = ED.it; else S.items.push(ED.it);
      closeSheet('editorBg'); changed();
    }
    function deleteItem() {
      if (ED.index < 0) return;
      askYes('この消耗品を消しますか？').then(function (ok) { if (!ok) return; S.items.splice(ED.index, 1); closeSheet('editorBg'); changed(); });
    }

    /* ===== 前回の注文から選ぶ（ユーザー決定 2026-11-01）：この現場の、開いているもの以外で一番新しい注文書の品を、数を直して追加する ===== */
    var REC = [];
    function openRecent() {
      if (revLocked()) { lockedToast(); return; }
      var el = document.getElementById('recentBody');
      el.innerHTML = '<div class="empty">読み込んでいます…</div>';
      document.getElementById('recentGo').style.display = 'none';
      openSheet('recentBg');
      HOST.call('listCons', [HOST.site]).then(function (r) {
        var x = (r.list || []).filter(function (o) { return o.id !== SRV.fileId; }).sort(function (a, b) { return (b.updated || 0) - (a.updated || 0); })[0];
        if (!x) { el.innerHTML = '<div class="empty">この現場の前回の注文はまだありません。</div>'; return null; }
        return HOST.call('getCons', [HOST.site, x.id]).then(function (g) {
          REC = (g.slip.items || []).map(function (it) { var c = JSON.parse(JSON.stringify(it)); c.id = uid(); return c; });
          var d = new Date(x.updated || 0);
          el.innerHTML = '<div class="note" style="margin-bottom:10px;">' + (x.no ? 'NO.' + esc(x.no) + '　' : '') + (d.getMonth() + 1) + '/' + d.getDate() + ' の注文書です。いる物に印を付けて、数を直してください。</div>' +
            REC.map(function (c, i) { return '<label class="rec-row"><input type="checkbox" id="rc' + i + '" checked><span class="b"><b>' + esc(consName(c)) + '</b><br><span class="note">' + esc(itemSub(c)) + '</span></span><input type="number" inputmode="numeric" class="q" id="rq' + i + '" value="' + esc(c.qty) + '"><span class="u">' + esc(c.unit || '') + '</span></label>'; }).join('');
          document.getElementById('recentGo').style.display = '';
        });
      }).catch(function (e) { el.innerHTML = '<div class="empty">読み込めませんでした。<br>' + esc((e && e.message) || '') + '</div>'; });
    }
    function addRecent() {
      var n = 0;
      REC.forEach(function (c, i) {
        var q = num(document.getElementById('rq' + i).value);
        if (!document.getElementById('rc' + i).checked || !(q > 0)) return;
        c.qty = q; S.items.push(c); n++;
      });
      closeSheet('recentBg');
      if (n) { changed(); toast(n + '件追加しました'); }
    }

    /* ===== 注文書（A4）===== */
    function collect() {   // 同じ品・仕様・単位・メモは1行にまとめる。分類ごとに並べる
      var groups = [], byG = {}, seen = {};
      CONS.map(function (g) { return g.g; }).forEach(function (g) { byG[g] = []; });
      S.items.forEach(function (it) {
        if (itemErrors(it).length) return;
        var k = [it.g, consName(it), it.mat, it.spec, it.unit, it.memo].join('|');
        if (seen[k]) { seen[k].qty += num(it.qty); seen[k].red = seen[k].red || itemRed(it); return; }
        var r = { name: consName(it), mat: it.mat, spec: it.spec, qty: num(it.qty), unit: it.unit, memo: it.memo, red: itemRed(it) };
        seen[k] = r; (byG[it.g] = byG[it.g] || []).push(r);
      });
      Object.keys(byG).forEach(function (g) { if (byG[g].length) groups.push({ g: g, rows: byG[g] }); });
      return groups;
    }
    function headHtml(page, pages) {
      return '<div class="dp-title">' + revTag() + '<h1>消耗品 注文書</h1><div class="dp-no">（NO, <b>' + esc(S.no || '') + '</b>）<br>ページNo, ⇒ ' + page + '／' + pages + '</div></div>' +
        '<div class="dp-head"><div class="dp-lines">' +
        '<div class="dp-line"><span class="k">現場名</span><span class="v">' + esc(S.site) + '</span></div>' +
        '<div class="dp-line"><span class="k">室名</span><span class="v">' + redIf(specRed('room'), esc(S.room)) + '</span></div>' +
        '<div class="dp-line"><span class="k">発注日</span><span class="v">' + redIf(specRed('orderDate'), esc(jpDate(S.orderDate))) + '</span></div>' +
        '<div class="dp-line"><span class="k">搬入日</span><span class="v">' + redIf(specRed('delivDate'), esc(jpDate(S.delivDate))) + '　' + redIf(specRed('dest'), esc(S.dest || '')) + '</span></div>' +
        '</div>' + coHtml(S) + '</div>' +
        '<table class="dp-spec"><colgroup><col style="width:22mm"><col></colgroup><tr><td class="k">Memo</td><td class="memo">' + redIf(specRed('memo'), esc(S.memo || '')) + '</td></tr></table>';
    }
    function contHead(page, pages) {
      return '<div class="dp-cont-head"><h1>注文書（続き）</h1>' + revTag() + '<span class="site">' + esc(S.site) + (S.room ? '　' + esc(S.room) : '') + '</span><span class="no">（NO, ' + esc(S.no || '') + '）　ページNo, ' + page + '／' + pages + '</span></div>';
    }
    function consTable(rows) {
      return '<table class="dp-cs"><colgroup><col class="n"><col style="width:22mm"><col><col style="width:12mm"><col style="width:11mm"><col style="width:30mm"></colgroup><tr><th>品名</th><th>材質</th><th>仕様・サイズ</th><th>数</th><th>単位</th><th>メモ</th></tr>' +
        rows.map(function (r) { return '<tr' + (r.red ? ' class="red"' : '') + '><td class="l wrap">' + esc(r.name) + '</td><td class="wrap">' + esc(r.mat || '') + '</td><td class="l wrap">' + esc(r.spec) + '</td><td class="q">' + esc(r.qty) + '</td><td>' + esc(r.unit) + '</td><td class="l wrap">' + esc(r.memo) + '</td></tr>'; }).join('') + '</table>';
    }
    function chgTable(rows) { return '<table class="dp-chgt"><colgroup><col></colgroup>' + rows.map(function (l) { return '<tr><td class="wrap">' + esc(l) + '</td></tr>'; }).join('') + '</table>'; }
    function buildPages() {
      SLIP_DIFF = slipDiff();
      var blocks = collect().map(function (g) { return { kind: 'cs', rows: g.rows, title: '■ ' + g.g }; });
      if (SLIP_DIFF && SLIP_DIFF.lines.length) blocks.push({ kind: 'chg', rows: SLIP_DIFF.lines, title: '■ 修正内容（' + revLabel() + '・前の版から変わった所）' });
      var MM = 96 / 25.4, AVAIL = (297 - 8 - 7 - 2) * MM;
      var tableOf = function (kind, rows) { return kind === 'chg' ? chgTable(rows) : consTable(rows); };
      var box = document.getElementById('dpMeasure');
      if (!box) { box = document.createElement('div'); box.id = 'dpMeasure'; box.style.cssText = 'position:absolute;left:-4000px;top:0;visibility:hidden;'; document.body.appendChild(box); }
      var measureHead = function (html) {
        box.innerHTML = '<div class="dp" style="height:auto">' + html + '<div class="mk"></div></div>';
        var dp = box.firstChild; return dp.querySelector('.mk').getBoundingClientRect().top - dp.getBoundingClientRect().top - 8 * MM;
      };
      var headFirst = measureHead(headHtml(1, 9)), headNext = measureHead(contHead(2, 9));
      blocks.forEach(function (b) {
        box.innerHTML = '<div class="dp" style="height:auto"><div class="dp-sec gt">' + esc(b.title) + '（続き）</div>' + tableOf(b.kind, b.rows) + '</div>';
        var sec = box.querySelector('.dp-sec'), trs = Array.prototype.slice.call(box.querySelectorAll('tr'));
        var top = sec.getBoundingClientRect().top - 3 * MM;
        var data = trs.filter(function (r) { return !r.querySelector('th'); });
        b.headH = (data.length ? data[0].getBoundingClientRect().top : box.firstChild.getBoundingClientRect().bottom) - top;
        b.rowH = data.map(function (r) { return r.getBoundingClientRect().height; });
      });
      var pages = [[]], left = AVAIL - headFirst;
      blocks.forEach(function (b) {
        var i = 0;
        while (i < b.rows.length) {
          if (left < b.headH + b.rowH[i]) { pages.push([]); left = AVAIL - headNext; }
          var n = 0, used = b.headH;
          while (i + n < b.rows.length && (n === 0 || used + b.rowH[i + n] <= left)) { used += b.rowH[i + n]; n++; }
          pages[pages.length - 1].push({ kind: b.kind, rows: b.rows.slice(i, i + n), title: b.title + (i > 0 ? '（続き）' : '') });
          left -= used; i += n;
        }
      });
      box.innerHTML = '';
      var total = pages.length;
      return pages.map(function (blk, pi) {
        var h = pi === 0 ? headHtml(1, total) : contHead(pi + 1, total);
        if (!blk.length && pi === 0) h += '<div class="dp-sec">（消耗品がまだありません）</div>';
        blk.forEach(function (b) { h += '<div class="dp-sec gt">' + esc(b.title) + '</div>' + tableOf(b.kind, b.rows); });
        return '<div class="dp">' + h + '</div>';
      });
    }
    function renderPreview() {

    window.addEventListener('resize', schedulePreview);

    /* ===== 現場管理の中で開いたとき（注文 → 消耗品注文）=====
       角ダクトの製作伝票と同じ仕組み（ユーザー指示 2026-10-30）：
       ・注文書は現場管理に保存。入力が止まって3秒たったら自動で保存
       ・ほかの人が先に同じ注文書を保存していたら、上書きせずに止める
       ・「工場へ提出」でPDFを資料の中のフォルダへ。提出したら見るだけ。「修正する」で第2版… */
    var HOST = null;
    try { HOST = window.parent !== window && window.parent.consHost ? window.parent.consHost : null; } catch (e) { HOST = null; }
    function noop() { }
    function blankForHost() { var b = blank(); if (HOST) { b.site = HOST.site || ''; b.orderer = ME ? ME.name : (HOST.userName || ''); if (ME) b.oi = meSnap(); } return b; }
    var SRV = { fileId: '', updated: 0, dirty: false, saving: null, timer: null, blocked: false };
    function setSaveState(t, err) { var el = document.getElementById('saveState'); if (el) { el.textContent = t; el.classList.toggle('err', !!err); } }
    function hostSchedule(ms) { clearTimeout(SRV.timer); SRV.timer = setTimeout(function () { hostSaveNow().catch(noop); }, ms || 3000); }
    function hostSave(show) {
      if (SRV.blocked) { if (show) HOST.confirm('ほかの人が先にこの注文書を保存したため、保存を止めています。注文書一覧から開き直してください。').catch(noop); return; }
      if (!show) { if (SRV.dirty) { setSaveState('未保存'); hostSchedule(); } return; }
      SRV.dirty = true;
      hostSaveNow().then(function () { toast('保存しました'); }).catch(noop);
    }
    function hostSaveNow() {
      clearTimeout(SRV.timer);
      if (SRV.blocked) return Promise.reject({ message: '保存を止めています' });
      if (SRV.saving) return SRV.saving.then(hostSaveNow, hostSaveNow);
      if (!SRV.dirty) return Promise.resolve();
      SRV.dirty = false; setSaveState('保存中…');
      S.updated = Date.now();
      SRV.saving = HOST.call('saveCons', [HOST.site, SRV.fileId, JSON.stringify(S), SRV.updated]).then(function (r) {
        SRV.fileId = r.fileId; SRV.updated = r.updated; SRV.saving = null;
        if (SRV.dirty) { setSaveState('未保存'); hostSchedule(); } else setSaveState('保存済み');
      }, function (e) {
        SRV.saving = null; SRV.dirty = true;
        if (e && e.conflict) { SRV.blocked = true; setSaveState('保存できません', true); HOST.confirm(e.message).catch(noop); }
        else { setSaveState('保存できませんでした', true); toast('保存できませんでした：' + ((e && e.message) || '')); hostSchedule(15000); }
        throw e;
      });
      return SRV.saving;
    }
    function hostMe() {

        ME = r.orderer || null;
        if (ME && ME.company && ME.company.logo) LOGOS[ME.company.name] = ME.company.logo;
        if (ME && !SRV.fileId && !S.oi && !(S.items || []).length) { S.oi = meSnap(); S.orderer = ME.name; }

    }
    function hostOpen(slip, fileId, updated) {

    function hostSlipList() {

          return '<div class="slip-row' + (cur ? ' cur' : '') + '"><div class="b" onclick="loadSlip(\'' + x.id + '\')"><div class="t">' + (x.no ? 'NO.' + esc(x.no) : '（NOは提出時に付きます）') + st + (cur ? '　<span style="font-size:0.75rem;">（開いている注文書）</span>' : '') + '</div>' +
            '<div class="m">' + esc(x.room || '') + '　消耗品' + (x.n || 0) + '件　更新 ' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2) + (x.byName ? '　' + esc(x.byName) : '') + '</div></div>' +

    /* ===== 版（第1版・第2版…）と修正の印（現場管理の中だけ。角ダクトと同じ）=====
       S.status：''＝入力中・'submitted'＝提出済み（見るだけ）・'editing'＝修正中（次の版を入力中）。
       修正中は S.base（前の版）と比べて、変わった行・数を赤に、「修正内容」の表に何が変わったかを書く */
    var SLIP_DIFF = null, PDF_NOW = false;
    function revLocked() { return !!HOST && S.status === 'submitted'; }
    function lockedToast() { toast('提出済みです。直すときは「修正する」を押してください'); }
    function fmtMD(t) { var d = new Date(t || Date.now()); return (d.getMonth() + 1) + '/' + d.getDate(); }
    function fmtDT(t) { var d = new Date(t || Date.now()); return fmtMD(t) + ' ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2); }
    function revLabel() {
      if (!HOST || (!S.status && !PDF_NOW)) return '';
      var rev = S.status === 'editing' || S.status === 'submitted' ? (S.rev || 1) : 1;
      if (S.status === 'submitted' && !PDF_NOW) return '第' + rev + '版　' + fmtMD(S.subAt) + ' 提出';
      return '第' + rev + '版' + (rev > 1 ? '　修正 ' + (PDF_NOW ? fmtMD() : '入力中') : '');
    }
    function revTag() { var l = revLabel(); return l ? '<span class="dp-rev' + ((S.rev || 1) > 1 ? ' red' : '') + '">' + esc(l) + '</span>' : ''; }
    function stableJ(x) {   // 項目の順番・空の項目によらずに比べる（開いて閉じただけで「修正」にならないように）
      if (Array.isArray(x)) return '[' + x.map(stableJ).join(',') + ']';
      if (x && typeof x === 'object') return '{' + Object.keys(x).sort().filter(function (k) { var v = x[k]; return !(v === '' || v == null || v === false || (Array.isArray(v) && !v.length) || (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length)); }).map(function (k) { return JSON.stringify(k) + ':' + stableJ(x[k]); }).join(',') + '}';
      return JSON.stringify(x);
    }
    var HEAD_LBL = { no: '注文書NO', orderer: '注文者', room: '室名', orderDate: '発注日', delivDate: '搬入日', dest: '搬入先', memo: 'Memo', coAddr: '会社の住所' };
    var SPEC_LBL = {};
    function dShow(v) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v); if (m) return (+m[2]) + '/' + (+m[3]); return (v === '' || v == null) ? '空' : String(v); }
    function itemLabel(it) { return consName(it) + '　' + sizeText(it); }
    function slipDiff() {
      if (!HOST || !S.base || (S.rev || 1) < 2 || !S.status) return null;
      var b = S.base, out = { items: {}, spec: {}, lines: [] };
      Object.keys(HEAD_LBL).forEach(function (k) { if (stableJ(S[k] == null ? '' : S[k]) !== stableJ(b[k] == null ? '' : b[k])) { out.spec[k] = true; out.lines.push(HEAD_LBL[k] + '　' + dShow(b[k]) + '→' + dShow(S[k])); } });
      Object.keys(SPEC_LBL).forEach(function (k) { var a = S.spec[k], c = (b.spec || {})[k]; if (String(a == null ? '' : a) !== String(c == null ? '' : c)) { out.spec[k] = true; out.lines.push(SPEC_LBL[k] + '　' + dShow(c) + '→' + dShow(a)); } });
      var bi = {}; (b.items || []).forEach(function (it) { bi[it.id] = it; });
      var rest = function (x) { var c = JSON.parse(JSON.stringify(x)); delete c.id; delete c.qty; delete c.unit; return stableJ(c); };
      var qu = function (x) { return String(x.qty) + (x.unit || ''); };   // 数は単位も一緒に比べる（3束→150本 のように出す）
      S.items.forEach(function (it) {
        var o = bi[it.id];
        if (!o) { out.items[it.id] = true; out.lines.push('追加　' + itemLabel(it) + '　数 ' + qu(it)); return; }
        delete bi[it.id];
        var ch = [];
        if (rest(it) !== rest(o)) ch.push(itemLabel(o) + ' → ' + sizeText(it) + (itemSub(o) !== itemSub(it) && sizeText(o) === sizeText(it) ? '（' + itemSub(it).replace(sizeText(it), '').replace(/^　+|　+$/g, '') + '）' : ''));
        else if (qu(it) !== qu(o)) ch.push(itemLabel(it));
        if (qu(it) !== qu(o)) ch.push('数 ' + qu(o) + '→' + qu(it));
        if (ch.length) { out.items[it.id] = true; out.lines.push(ch.join('　')); }
      });
      Object.keys(bi).forEach(function (id) { out.lines.push('削除　' + itemLabel(bi[id]) + '　数 ' + qu(bi[id])); });
      return out;
    }
    function redIf(on, html) { return on ? '<span class="dp-red">' + html + '</span>' : html; }
    function specRed() { var a = arguments, df = SLIP_DIFF; if (!df) return false; for (var i = 0; i < a.length; i++) if (df.spec[a[i]]) return true; return false; }
    function itemRed(it) { return !!(SLIP_DIFF && SLIP_DIFF.items[it.id]); }
    function renderRev() {
      var el = document.getElementById('revBar'); if (!el) return;
      var lk = revLocked();
      document.body.classList.toggle('locked', lk);
      document.querySelectorAll('.col-left input, .col-left select, .col-left textarea').forEach(function (x) { x.disabled = lk; });
      if (!HOST || !S.status) { el.style.display = 'none'; el.innerHTML = ''; return; }
      el.style.display = '';
      el.className = 'rev-bar ' + (lk ? 'done' : 'edit');
      el.innerHTML = lk
        ? '<div><b>提出済み　第' + (S.rev || 1) + '版</b>（' + fmtDT(S.subAt) + ' 提出）<br>この注文書は見るだけです。直すときは「修正する」を押してください。' + (S.pdfUrl ? '<br><a href="' + esc(S.pdfUrl) + '" target="_blank" rel="noopener">提出したPDFを開く</a>' : '') + '</div><button type="button" class="btn btn-dark" onclick="startRevision()">修正する</button>'
        : '<div><b>修正中　第' + (S.rev || 1) + '版（まだ提出していません）</b><br>直し終わったら「工場へ提出」を押してください。前の版から変わった所は、注文書で赤くなります。</div>';
    }
    function startRevision() {
      HOST.confirm('この注文書を修正しますか？\n第' + ((S.rev || 1) + 1) + '版として入力し、直し終わったらもう一度「工場へ提出」を押します。').then(function (ok) {
        if (!ok) return;
        S.base = S.subSnap ? JSON.parse(JSON.stringify(S.subSnap)) : null; S.rev = (S.rev || 1) + 1; S.status = 'editing';
        SRV.dirty = true; renderAll(); hostSaveNow().catch(noop);
        HOST.call('logCons', [HOST.site, '修正開始', S.no, S.rev]).catch(noop);
      });
    }
    function slipSnap(s) { var c = JSON.parse(JSON.stringify(s)); delete c.base; delete c.subSnap; return c; }

    /* ===== 工場へ提出（現場管理の中だけ。角ダクトと同じ）=====
       注文書をPDFにして、現場名資料の中の選んだフォルダへ保存する（html2canvas＋jsPDF はこのときだけ読み込む） */
    var PDF_LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
    function loadScriptOnce(src) {
      return new Promise(function (res, rej) {
        if (document.querySelector('script[src="' + src + '"]')) { res(); return; }
        var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function () { rej({ message: 'PDFを作る部品を読み込めませんでした（インターネットにつながっているか確かめてください）' }); };
        document.head.appendChild(s);
      });
    }
    function nextRev() { return S.status === 'editing' ? (S.rev || 2) : 1; }
    function pdfDefaultName() {
      var d = new Date();
      return '消耗品注文書' + (S.no ? '_NO' + S.no : '') + (S.room ? '_' + S.room : '') + '_第' + nextRev() + '版_' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
    }
    function openSubmit() {
      if (revLocked()) { lockedToast(); return; }
      if (!S.items.length) { toast('消耗品がありません'); return; }
      var bad = S.items.filter(function (it) { return itemErrors(it).length; });
      var body = document.getElementById('pdfBody');
      body.innerHTML = '<div class="empty">保存先のフォルダを読み込んでいます…</div>';
      openSheet('pdfBg');
      SRV.dirty = true;
      // 保存とフォルダ一覧は同時に頼む（順番に待つと倍かかる。2026-10-30）
      Promise.all([hostSaveNow().catch(noop), HOST.call('getDenpyoFolders', [HOST.site])]).then(function (a) {
        var r = a[1];
        var fs = r.folders || [], pick = fs.filter(function (f) { return f.id === S.pdfFolderId; })[0] || fs.filter(function (f) { return f.path === '消耗品注文書'; })[0];
        body.innerHTML =
          (bad.length ? '<div class="pdf-msg err" style="margin:0 0 10px;">⚠ 入力が足りない消耗品が ' + bad.length + ' 件あります（一覧の赤い字）。その消耗品は注文書に載りません。</div>' : '') +
          (needNo() ? '<div class="note" style="margin-bottom:8px;">注文書NOは「PDFを作って保存」を押すと自動で付き、ファイル名にも入ります。</div>' : '') +
          '<div class="fg"><label for="pdfName">ファイル名</label><input type="text" id="pdfName" value="' + esc(pdfDefaultName()) + '"></div>' +
          '<div style="font-size:0.85rem;font-weight:700;margin:12px 0 6px;">保存先フォルダ（' + esc(r.rootName || '資料') + ' の中）</div>' +
          fs.map(function (f) { return '<label class="pdf-f"><input type="radio" name="pdfDir" value="' + esc(f.id) + '"' + (pick && pick.id === f.id ? ' checked' : '') + '>' + esc(f.path) + '</label>'; }).join('') +
          '<label class="pdf-f"><input type="radio" name="pdfDir" value=""' + (pick ? '' : ' checked') + '>新しいフォルダを作る：<input type="text" id="pdfNewDir" value="消耗品注文書" onfocus="this.parentNode.querySelector(\'input[type=radio]\').checked=true"></label>' +
          '<button type="button" class="btn btn-dark btn-block" id="pdfGo" style="margin-top:12px;" onclick="submitPdf()">PDFを作って保存</button>' +
          '<div class="pdf-msg" id="pdfMsg"></div>';
      }).catch(function (e) { body.innerHTML = '<div class="pdf-msg err">フォルダを読み込めませんでした：' + esc((e && e.message) || '') + '</div>'; });
    }
    function makePdfBase64() {
      return PDF_LIBS.reduce(function (p, src) { return p.then(function () { return loadScriptOnce(src); }); }, Promise.resolve()).then(function () {
        var tmp = document.createElement('div');
        tmp.style.cssText = 'position:fixed;left:-12000px;top:0;background:#fff;';
        PDF_NOW = true; try { tmp.innerHTML = buildPages().join(''); } finally { PDF_NOW = false; }   // 版の日付は今日（提出する日）
        document.body.appendChild(tmp);
        var pages = [].slice.call(tmp.querySelectorAll('.dp')), pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
        return pages.reduce(function (p, dp, i) {
          return p.then(function () {
            return window.html2canvas(dp, { scale: 2.2, backgroundColor: '#ffffff', logging: false }).then(function (cv) {
              if (i) pdf.addPage();
              // 圧縮60：細かさ（2.2倍）はそのままで軽くする（角ダクトと同じ。ユーザー指示 2026-10-31）
              pdf.addImage(cv.toDataURL('image/jpeg', 0.6), 'JPEG', 0, 0, 210, 297);
            });
          });
        }, Promise.resolve()).then(function () { tmp.remove(); return pdf.output('datauristring').split(',')[1]; }, function (e) { tmp.remove(); throw e; });
      });
    }
    /* 注文書NOは現場ごとに1から（角・丸・消耗品・金物で続き番号）。工場へ提出するときに自動で付く（ユーザー指示 2026-11-02）。修正版は同じNOのまま */
    function needNo() { return !S.noAuto && (S.status !== 'editing' || !S.no); }
    function ensureNo() {
      if (!needNo()) return Promise.resolve();
      return HOST.call('nextOrderNo', []).then(function (r) { S.no = String(r.no); S.noAuto = true; SRV.dirty = true; renderAll(); return hostSaveNow(); });
    }
    function submitPdf() {
      var r = document.querySelector('input[name="pdfDir"]:checked'), dir = r ? r.value : '', nf = dir ? '' : (document.getElementById('pdfNewDir').value || '').trim();
      var typed = (document.getElementById('pdfName').value || '').trim(), sameName = !typed || typed === pdfDefaultName(), name = typed;
      var msg = document.getElementById('pdfMsg'), go = document.getElementById('pdfGo');
      if (!dir && !nf) { msg.className = 'pdf-msg err'; msg.textContent = '保存先のフォルダを選ぶか、新しいフォルダの名前を入れてください'; return; }
      go.disabled = true; msg.className = 'pdf-msg'; msg.textContent = 'PDFを作っています…（件数が多いと少し時間がかかります）';
      var rev = nextRev(), t0 = Date.now(), t1 = 0;
      ensureNo().then(function () { if (sameName) name = pdfDefaultName(); return makePdfBase64(); }).then(function (b64) {
        msg.textContent = '保存しています…'; t1 = Date.now();
        return HOST.call('saveConsPdf', [HOST.site, dir, nf, b64, name, S.pdfId || '', rev, S.no]);   // 前の版のPDFは削除フォルダへ（上書き）
      }).then(function (res) {
        // 保存先フォルダの名前は画面で選んだものを前に付ける（サーバーで調べると時間がかかるため。2026-10-31）
        var dirLabel = dir ? (r.parentNode.textContent || '').trim() : nf;
        if (dirLabel && !/^「[^」]*」に「/.test(res.message)) res.message = '「' + dirLabel + '」に' + res.message;
        // かかった時間を出す（スマホで遅いところを調べるため。2026-10-31）
        res.message +='\n（PDF作成 ' + ((t1 - t0) / 1000).toFixed(1) + '秒・保存 ' + ((Date.now() - t1) / 1000).toFixed(1) + '秒）';
        S.pdfFolderId = res.folderId; S.pdfId = res.pdfId; S.pdfUrl = res.url;
        S.status = 'submitted'; S.rev = rev; S.subAt = Date.now(); S.subSnap = slipSnap(S);
        SRV.dirty = true; renderAll(); hostSaveNow().catch(noop);
        msg.className = 'pdf-msg'; msg.innerHTML = '✓ ' + esc(res.message).replace(/\n/g, '<br>') + '<br>資料タブのそのフォルダから見られます。<br>この注文書は「提出済み（第' + rev + '版）」になり、見るだけになりました。';
        go.style.display = 'none';
      }).catch(function (e) { go.disabled = false; msg.className = 'pdf-msg err'; msg.textContent = '保存できませんでした：' + ((e && e.message) || ''); });
    }

    (function start() {
      if (HOST) {   // 現場管理の中：白紙の注文書で始め、注文書一覧を出す（まだ無ければ白紙のまま。製作伝票と同じ）
        document.body.classList.add('hosted');
        S = blankForHost(); renderAll(); hostMe();
        openSheet('slipsBg');
        hostSlipList().then(function (list) { if (list && !list.length) closeSheet('slipsBg'); });
        return;
      }
      S = normSlip(loadStore()[0] || blank());
      renderAll();
    })();  </script>
<script>
  /* 全角の数字を半角に（数字の欄だけ。ユーザー指示 2026-11-03）。日本語入力の確定のあとにも直す */
  (function () {
    var Z = /[０-９．，－]/;
    function isNum(el) { return el && el.tagName === 'INPUT' && (el.type === 'number' || /^(numeric|decimal)$/.test(el.getAttribute('inputmode') || '')); }
    function fix(el) {
      if (!isNum(el) || !Z.test(el.value)) return false;
      var p = el.selectionStart;
      el.value = el.value.replace(/[０-９．，－]/g, function (c) { return c === '．' ? '.' : c === '，' ? ',' : c === '－' ? '-' : String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
      try { if (p != null) el.setSelectionRange(p, p); } catch (e) {}
      return true;
    }
    document.addEventListener('input', function (e) { if (!e.isComposing) fix(e.target); }, true);
    document.addEventListener('compositionend', function (e) { if (fix(e.target)) e.target.dispatchEvent(new Event('input', { bubbles: true })); }, true);
  })();
</script>
