<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ダクト製作伝票</title>
  <style>
    :root {
      --bg: #f5f5f7; --card-bg: #ffffff; --text: #111111; --muted: #444444;
      --border: #b3b3b3; --primary: #111111; --link-blue: #1a73e8;
      --error-bg: #fceded; --error-text: #b3261e; --success-bg: #e6f4ea; --success-text: #137333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", Meiryo, Roboto, sans-serif; }
    html { overflow-x: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    button { font: inherit; color: inherit; }
    .top { position: sticky; top: 0; z-index: 30; background: #fff; border-bottom: 1px solid var(--border); padding: 8px 14px; display: flex; align-items: center; gap: 10px; }
    .top-logo { height: 22px; }
    .top-title { font-weight: 700; font-size: 0.95rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 0.85rem; font-weight: 600; border-radius: 4px; border: 1px solid var(--primary); cursor: pointer; padding: 9px 14px; background: #fff; white-space: nowrap; }
    .btn-dark { background: var(--primary); color: #fff; }
    .btn-dark:hover { background: #333; }
    .btn:disabled { background: #8a8a8a; border-color: #8a8a8a; color: #f2f2f2; cursor: not-allowed; }
    .btn-sub { color: var(--muted); border-color: var(--border); font-size: 0.8rem; padding: 6px 10px; }
    .btn-danger { color: var(--error-text); border-color: #e8b4b0; }
    .btn-block { width: 100%; }

    .layout { display: flex; gap: 16px; padding: 14px; max-width: 1600px; margin: 0 auto; }
    .col-left { width: 100%; max-width: 640px; margin: 0 auto; }
    .col-right { display: none; }
    @media (min-width: 1100px) {
      .col-left { width: 460px; flex-shrink: 0; margin: 0; }
      .col-right { display: block; flex: 1; min-width: 0; position: sticky; top: 58px; align-self: flex-start; max-height: calc(100vh - 72px); overflow: auto; }
      .only-mobile { display: none !important; }
    }
    @media (max-width: 1099px) { .only-desk { display: none !important; } }
    /* スマホ：横にずらさなくても全部見えるように（ユーザー指示 2026-10-28）。
       iPhone は中の画面がはみ出すと枠ごと広がる（上や横が切れる）ので、ページ全体ではなく #app の中だけで縦に動かす */
    html, body { height: 100%; overflow: hidden; }
    #app { height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    input, select, textarea { min-width: 0; max-width: 100%; }
    @media (max-width: 1099px) {
      .top { padding: 8px 10px; gap: 6px; }
      .top-logo, .top-title { display: none; }
      .top-btns { flex: 1; min-width: 0; justify-content: flex-end; align-items: center; }
      .top-btns .save-st { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .layout { padding: 10px; }
    }

    .card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-bottom: 14px; }
    /* トップ画面の左側の枠も、部材の入力画面（.edbox）と同じ配色に。右の伝票は白のまま（ユーザー指示 2026-10-26） */
    .col-left .card { border: 1.5px solid #a3a7ad; border-radius: 8px; background: #eceef1; }
    .col-left .card-h { border-bottom-color: #a3a7ad; color: #222; }
    .col-left .card input:not([type="checkbox"]):not(:disabled), .col-left .card select, .col-left .card textarea { background: #fff; border-color: #8d9298; }
    .col-left .card .spec-note { background: #fff; }
    .col-left .card .btn-sub { border: 1.5px solid #6e6e6e; color: #222; background: #fff; }
    .col-left .card .tot { background: #fff; border-color: #a3a7ad; }
    .card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 0.92rem; }
    .fg { margin-bottom: 10px; }
    label, .lbl { display: block; font-size: 0.78rem; font-weight: 600; margin-bottom: 4px; color: #333; }
    input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.95rem; background: #fafafa; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); background: #fff; }
    textarea { resize: vertical; min-height: 60px; }
    .g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 6px 11px; border-radius: 16px; border: 1.5px solid #6e6e6e; background: #fff; font-size: 0.8rem; font-weight: 600; color: #222; cursor: pointer; user-select: none; }   /* 枠は現場管理のボタンくらいの太さ、色は少し濃いグレー */
    .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
    .spec-row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
    .spec-row .lbl { margin: 0; }
    .spec-note { font-size: 0.75rem; color: var(--muted); background: #eceef0; border-radius: 4px; padding: 8px 10px; line-height: 1.6; }
    .spec-note b { color: #333; }
    .err { color: var(--error-text); font-weight: 700; }
    .errbox { background: var(--error-bg); color: var(--error-text); border-radius: 4px; padding: 8px 10px; font-size: 0.8rem; font-weight: 600; line-height: 1.5; margin-top: 6px; }
    .badge { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: #eee; color: #333; margin-left: 4px; vertical-align: middle; }
    .badge.red { background: var(--error-bg); color: var(--error-text); }
    .req { color: var(--error-text); margin-left: 2px; }

    .items { display: flex; flex-direction: column; gap: 8px; }
    .item { display: flex; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 6px; padding: 8px; cursor: pointer; background: #fff; content-visibility: auto; contain-intrinsic-size: auto 100px; }   /* 画面の外の部材は描かない（部材が多いときスマホで軽く。2026-10-27） */
    .item:hover { border-color: #555; }
    .item-fig { width: 84px; height: 56px; flex-shrink: 0; border: 1px solid #c4c4c4; border-radius: 4px; background: #fff; }
    .item-fig svg { width: 100%; height: 100%; }
    .item-body { flex: 1; min-width: 0; }
    .item-t { font-weight: 700; font-size: 0.88rem; }
    .item-s { font-size: 0.82rem; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-m { font-size: 0.75rem; color: var(--muted); }
    .item-ops { display: flex; flex-direction: column; gap: 4px; }
    .iconbtn { width: 30px; height: 26px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; font-size: 0.75rem; color: var(--muted); }
    .empty { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 18px 0; }

    .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .tot { border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; font-size: 0.78rem; }
    .tot b { display: block; font-size: 0.95rem; }
    .tot.zero { color: #777; }

    /* 下に固定するボタン（スマホ） */
    .bottom-bar { position: sticky; bottom: 0; z-index: 25; background: #fff; border-top: 1px solid var(--border); padding: 10px 14px; display: flex; gap: 8px; }
    .bottom-bar .btn { flex: 1; min-width: 0; padding: 12px 6px; }

    /* 全画面のシート（部材の入力・部材の種類・伝票一覧・プレビュー） */
    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; display: none; }
    .sheet-bg.open { display: block; }
    .sheet { position: absolute; inset: 0; background: #fff; display: flex; flex-direction: column; }
    @media (min-width: 900px) {
      .sheet { inset: 4vh auto auto 50%; transform: translateX(-50%); width: min(980px, 94vw); max-height: 92vh; border-radius: 8px; }
    }
    .sheet-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 700; }
    .sheet-h .ttl { flex: 1; min-width: 0; }
    .sheet-b { flex: 1; overflow: auto; padding: 14px; }
    .sheet-f { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); }
    .sheet-f .btn { flex: 1; padding: 12px; }

    .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .pick { border: 1px solid var(--border); border-radius: 6px; padding: 8px; cursor: pointer; text-align: center; background: #fff; }
    .pick:hover { border-color: var(--primary); }
    .pick svg { width: 100%; height: 84px; }
    .pick-n { font-weight: 700; font-size: 0.85rem; margin-top: 4px; }
    .pick-d { font-size: 0.7rem; color: var(--muted); }

    .ed { display: flex; flex-direction: column; gap: 14px; }
    .ed-fig { position: sticky; top: -14px; z-index: 2; background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 6px; margin: -2px 0 0; }
    .ed-fig svg { width: 100%; height: auto; max-height: 45vh; display: block; cursor: zoom-in; }   /* 押すと画面いっぱいに拡大（figZoom） */
    #figZoom { position: fixed; inset: 0; z-index: 9999; background: rgba(255,255,255,0.98); display: none; padding: 16px; cursor: zoom-out; }
    #figZoom.open { display: block; }
    #figZoom svg { width: 100%; height: 100%; display: block; }
    #figZoom .zc { position: absolute; top: 10px; right: 14px; font-size: 0.85rem; color: #444; }
    /* 現場管理の中だけで出す物（工場へ提出・閉じる・保存の状態） */
    html:not(.in-host) .host-only { display: none !important; }
    .save-st { font-size: 0.75rem; color: #666; align-self: center; white-space: nowrap; }
    .save-st.err { color: #c62828; font-weight: 700; }
    .pdf-f { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 6px; font-size: 0.9rem; cursor: pointer; background: #fff; }
    .pdf-f input[type="radio"] { width: 18px; height: 18px; flex: none; }
    .pdf-f input[type="text"] { flex: 1; min-width: 0; }
    .pdf-msg { margin-top: 10px; font-size: 0.88rem; font-weight: 600; }
    .pdf-msg.err { color: #c62828; }
    /* 版（提出済み・修正中）と修正の印 */
    .rev-bar { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; line-height: 1.5; }
    .rev-bar.done { background: #eef4ff; border: 1.5px solid #1a5fd0; }
    .rev-bar.edit { background: #fff1f0; border: 1.5px solid #d40000; color: #8a0000; }
    .rev-bar .btn { flex: none; }
    .locked .col-left .card { opacity: 0.55; pointer-events: none; }
    .locked .bottom-bar .btn-dark { opacity: 0.4; }
    .badge.red { background: #d40000; color: #fff; }
    .dp-red { color: #d40000 !important; font-weight: 700; }
    .dp-cell { position: relative; }
    .dp-cell-nm { align-self: stretch; flex: none; font-family: "Yu Gothic", Meiryo, sans-serif; font-size: 8pt; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; }   /* 形状名（図の左上に1行。長いときは字を小さく） */
    .dp-cell.chg::after { content: ''; position: absolute; inset: 0; border: 0.8mm solid #d40000; pointer-events: none; z-index: 2; }
    .dp-tbl tr.chg td { border-top: 0.7mm solid #d40000; border-bottom: 0.7mm solid #d40000; }
    .dp-tbl tr.chg td:first-child { border-left: 0.7mm solid #d40000; }
    .dp-tbl tr.chg td:last-child { border-right: 0.7mm solid #d40000; }
    .dp-rev { position: absolute; left: 0; bottom: 1.5mm; font-size: 10pt; font-weight: 700; border: 0.5mm solid #000; padding: 0.4mm 2mm; font-family: "Yu Gothic", Meiryo, sans-serif; }
    .dp-rev.red { color: #d40000; border-color: #d40000; }
    .dp-cont-head .dp-rev { position: static; font-size: 8.5pt; white-space: nowrap; }
    .dp-chg { border: 0.5mm solid #d40000; margin-top: 1.5mm; padding: 1mm 2mm; color: #d40000; font-family: "Yu Gothic", Meiryo, sans-serif; }
    .dp-chg-h { font-size: 8pt; font-weight: 700; margin-bottom: 0.5mm; }
    .dp-chg-l { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 3mm; font-size: 7.5pt; line-height: 1.35; }
    .dp-chgpage { display: block !important; }
    .dp-chgpage .dp-chg-l { grid-template-columns: repeat(2, minmax(0, 1fr)); font-size: 9pt; }
    .slip-row .del { color: #c62828; border-color: #e8b4b0; }
    .slip-row.cur { border-color: #111; }
    /* 伝票の文字を動かす（工場に渡す前の確認） */
    .slip-mv .dp-cell-b svg { touch-action: none; }
    .slip-mv .dp-cell-b [data-sp="t"], .slip-mv .dp-cell-b [data-sp="j"], .slip-mv .dp-cell-b .sub { cursor: grab; }
    .slip-mv .dp-cell-b [data-sp="t"]:hover text, .slip-mv .dp-cell-b [data-sp="j"]:hover text, .slip-mv .dp-cell-b .sub:hover text { fill: #e07000; }
    .slip-mv .dp-cell { cursor: default; }
    /*EXPLAIN-START*/
    /* 図の説明（文字・記号・寸法を動かして見せる。パソコンの試し画面だけ） */
    #edExplain { display: none; position: absolute; top: 4px; right: 4px; z-index: 3; }
    .xp-ok #edExplain { display: inline-flex; }
    #figExplain { position: fixed; inset: 0; z-index: 10000; background: #fff; display: none; flex-direction: column; }
    #figExplain.open { display: flex; }
    #figExplain .xb { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #ddd; background: #f7f7f7; }
    #figExplain .xh { font-size: 0.8rem; color: #444; padding: 6px 12px 0; }
    #figExplain .xn { margin: 6px 12px 0; height: 2.6em; font: inherit; font-size: 0.85rem; padding: 4px 6px; border: 1px solid #bbb; border-radius: 4px; resize: vertical; }
    #figExplain .xm { font-size: 0.85rem; font-weight: 600; color: #0b5cd5; padding: 0 12px; min-height: 1.2em; }
    #figExplain .xs { flex: 1; min-height: 0; padding: 4px 12px 12px; }
    #figExplain svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
    #figExplain [data-sp] { cursor: grab; }
    #figExplain [data-sp]:hover text { fill: #e07000; }
    #figExplain .hit { stroke: transparent; stroke-width: 10px; stroke-dasharray: none; pointer-events: stroke; }
    /*EXPLAIN-END*/
    .ed-calc { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.8rem; color: #333; padding: 6px 4px 0; border-top: 1px dashed #b3b3b3; margin-top: 4px; }
    .ed-calc b { font-size: 0.92rem; }
    @media (min-width: 900px) {
      .ed { flex-direction: row-reverse; align-items: flex-start; }
      .ed-fig { width: 52%; position: sticky; top: 0; margin: 0; }
      .ed-fig svg { max-height: calc(100vh - 230px); }   /* 入力欄が多い部材でも図を大きく */
      .ed-form { flex: 1; min-width: 0; }
    }
    .dims { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
    .dims input { text-align: right; font-variant-numeric: tabular-nums; }
    /* 使えない項目（押せない）：薄くするだけでは分かりにくいので、濃いグレーの地にする（ユーザー指示 2026-10-26） */
    .chip.dis { background: #9e9e9e; border-color: #8a8a8a; color: #e6e6e6; cursor: not-allowed; pointer-events: none; }
    /* 部材を選ぶ画面も入力画面と同じ配色：背景は薄いグレー、選べる部材は白く浮かせ、選べない部材は濃いグレー（ユーザー指示 2026-10-26） */
    #pickerBg .sheet-b { background: #eceef1; }
    #pickerBg .pick { border: 1.5px solid #8d9298; }
    #pickerBg .pick:hover { border-color: var(--primary); }
    .pick.dis { background: #a8a8a8; border-color: #8f8f8f; cursor: not-allowed; pointer-events: none; }
    .pick.dis svg { opacity: 0.35; }
    .pick.dis .pick-n, .pick.dis .pick-d { color: #ececec; }
    .dims > div { display: flex; flex-direction: column; justify-content: flex-end; }   /* 欄名が2行になっても入力欄の高さをそろえる */
    .sec { font-size: 0.78rem; font-weight: 700; color: var(--muted); margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #c4c4c4; }
    /* 部材の入力画面：見出しごとに枠で囲み、枠の中は白より少し濃いライトグレー（線で区切るより見やすく） */
    .edbox { border: 1.5px solid #a3a7ad; border-radius: 8px; background: #eceef1; padding: 10px 12px; margin-bottom: 10px; }
    .edbox > .sec { margin: 0 0 8px; padding: 0; border-bottom: none; color: #222; font-size: 0.85rem; }
    .edbox .spec-note { background: #fff; }
    .edbox input:not([type="checkbox"]):not(:disabled), .edbox select, .edbox textarea { background: #fff; border-color: #8d9298; }   /* 入力欄はグレーの中で白く浮かせる */
    input::placeholder, textarea::placeholder { color: #6b6b6b; }   /* 例の文字も読める濃さに */
    input:disabled, select:disabled, textarea:disabled { background: #d4d4d4; color: #333; border-color: #9a9a9a; }   /* 入力できない欄（自動の値など） */
    .edbox .btn-sub { border: 1.5px solid #6e6e6e; color: #222; }
    .open-card { border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-bottom: 8px; }
    .open-head { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    .open-head b { font-size: 0.82rem; margin-right: 4px; }
    .open-head select { width: auto; flex: 1; padding: 6px 8px; }
    .open-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; align-items: end; }
    .open-row input { text-align: right; }
    .open-info { font-size: 0.78rem; color: #333; margin-top: 6px; }
    .open-row .lbl { font-size: 0.7rem; }
    .chk { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; padding: 4px 0; cursor: pointer; }
    .chk input { width: 18px; height: 18px; }

    .slip-row { display: flex; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 8px; }
    .slip-row .b { flex: 1; min-width: 0; cursor: pointer; }
    .slip-row .t { font-weight: 700; font-size: 0.9rem; }
    .slip-row .m { font-size: 0.75rem; color: var(--muted); }

    .toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 0.85rem; z-index: 99; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }

    /* ===== 伝票（A4）===== */
    .pv-wrap { background: #e9e9ec; padding: 12px; border-radius: 6px; }
    .pv-page { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.2); margin: 0 auto 12px; overflow: hidden; }
    .pv-page > .dp { transform-origin: 0 0; }
    .pv-page [data-ed] { cursor: pointer; }
    .pv-page [data-ed]:hover { background: #eef4fd; }   /* 伝票の部材を押すと編集 */
    .dp { width: 210mm; height: 297mm; padding: 8mm 9mm 7mm; color: #000; font-family: "MS Mincho", "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 9pt; display: flex; flex-direction: column; background: #fff; }
    .dp .gt { font-family: "Yu Gothic", "Hiragino Sans", Meiryo, sans-serif; }
    .dp-title { display: flex; align-items: flex-end; justify-content: center; position: relative; height: 13mm; }
    .dp-title h1 { font-size: 22pt; font-weight: 400; letter-spacing: 0.2em; }
    .dp-no { position: absolute; right: 0; bottom: 0; font-size: 9pt; text-align: right; line-height: 1.4; }
    .dp-no b { font-size: 12pt; font-weight: 400; }
    .dp-head { display: flex; justify-content: space-between; gap: 6mm; margin-top: 2mm; }
    .dp-lines { width: 50%; }
    .dp-line { display: flex; border-bottom: 1px solid #000; height: 6.4mm; align-items: flex-end; padding-bottom: 0.6mm; gap: 3mm; white-space: nowrap; overflow: hidden; }
    .dp-line .k { width: 15mm; text-decoration: underline; flex-shrink: 0; }
    .dp-line .v { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .dp-co { width: 50%; text-align: right; padding-top: 0; font-size: 7.2pt; line-height: 1.32; }
    .dp-co .co-who { font-weight: 700; }
    .dp-co img { height: 6mm; vertical-align: middle; }
    .dp-co .nm { font-size: 9.5pt; font-weight: 700; vertical-align: middle; margin-left: 2mm; }
    .dp-co .nm { display: block; margin: 0.5mm 0 0; }
    @media screen { .co-link { color: #1a56c4; text-decoration: underline; cursor: pointer; } }
    .dp-dest { font-size: 8.5pt; }
    .circ { display: inline-block; border: 1px solid #000; border-radius: 50%; padding: 0 0.7mm; line-height: 1.15; }
    .dp-spec { width: 100%; border-collapse: collapse; margin-top: 2mm; font-size: 7.6pt; table-layout: fixed; }
    .dp-spec td { border: 1px solid #000; padding: 0.8mm 1.2mm; white-space: nowrap; overflow: hidden; height: 6.2mm; }
    /* 本体：3列のマス目。表は左2列ぶん、図の枠は1列ずつなので、上下の縦線がそろう。
       枠線は外側の上・左を本体に、各マスは右・下だけ引く（二重線にならない） */
    .dp-body { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 3mm; border-top: 1px solid #000; border-left: 1px solid #000; flex: 1; min-height: 0; }
    .dp-body > * { border-right: 1px solid #000; border-bottom: 1px solid #000; min-width: 0; min-height: 0; }
    .dp-tblwrap { grid-column: span 2; display: flex; flex-direction: column; }
    .dp-tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .dp-tbl th, .dp-tbl td { border-right: 1px solid #000; border-bottom: 1px solid #000; height: 7mm; text-align: center; font-weight: 400; overflow: hidden; white-space: nowrap; padding: 0 0.5mm; }
    .dp-tbl th:last-child, .dp-tbl td:last-child { border-right: none; }
    .dp-tbl .nb { border-right: none; }                 /* W × H × L の間は縦線なし */
    .dp-tbl th { font-size: 10pt; }
    .dp-tbl td.memo { text-align: left; font-size: 7pt; padding: 0 1mm; white-space: normal; line-height: 1.15; }
    .dp-tbl td.memo > div { max-height: 6.6mm; overflow: hidden; }
    .dp-tbl td.x { font-size: 9.5pt; }
    .dp-tbl td.by { font-size: 8pt; padding: 0; }
    .dp-thick { display: grid; margin-top: 2mm; border-top: 1px solid #000; border-left: 1px solid #000; flex-shrink: 0; }   /* 板厚別合計：1枚目の見出しの下（直管リストの上）に1回だけ（ユーザー指示 2026-10-27） */
    .dp-thick div { border-right: 1px solid #000; border-bottom: 1px solid #000; text-align: center; height: 6.2mm; line-height: 6.2mm; font-size: 8.5pt; white-space: nowrap; overflow: hidden; }
    .dp-thick .v { text-align: right; padding-right: 1.5mm; }
    .dp-thick .dp-thick-h { grid-row: span 2; height: auto; line-height: 1.35; display: flex; flex-direction: column; justify-content: center; font-size: 8pt; }
    .dp-tblwrap.full .dp-tbl { height: 100%; }   /* 表だけの用紙：行を用紙の下まで均等に広げる */
    .dp-cell { display: flex; flex-direction: column; }
    .dp-cell-h { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); border-bottom: 1px solid #000; font-size: 8.5pt; }   /* 右の印（リブ入り・1.6t・中黒塗り）が3つ並んでも入るよう右を広く */
    .dp-cell-h div { height: 7mm; line-height: 7mm; padding: 0 1.5mm; border-bottom: 1px solid #000; white-space: nowrap; overflow: hidden; }
    .dp-cell-h div:nth-child(odd) { border-right: 1px solid #000; }
    .dp-cell-h div:nth-last-child(-n+2) { border-bottom: none; }
    .dp-cell-h .r { text-align: right; }
    .dp-tag { display: inline-block; border: 1px solid #000; padding: 0 0.35em; line-height: 1.3; margin-left: 0.25em; font-size: 0.95em; }   /* 大きさは枠の文字に合わせる（枠からはみ出すときは枠ごと縮む） */
    .dp-tag.hot { background: #000; color: #fff; font-weight: 700; border-width: 1.5px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }   /* リブ入り・1.6t・中黒塗りは忘れやすいので黒地で強調（印刷でも黒地を残す） */
    .dp-cell-b { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 1.5mm 2mm 1mm; min-height: 0; }
    .dp-cell-b svg { width: 100%; flex: 1; min-height: 0; }
    .dp-cell-memo { align-self: stretch; font-size: 7pt; line-height: 1.25; white-space: pre-wrap; max-height: 10mm; overflow: hidden; flex-shrink: 0; }
    .dp-foot { font-size: 8pt; margin-top: 1.5mm; }
    /* 2ページ目以降（続き用紙）：見出しを小さくして、表と図の枠を多くする */
    .dp-cont-head { display: flex; align-items: flex-end; gap: 4mm; border-bottom: 1.5px solid #000; padding-bottom: 1.5mm; }
    .dp-cont-head h1 { font-size: 15pt; font-weight: 400; letter-spacing: 0.15em; white-space: nowrap; }
    .dp-cont-head .site { flex: 1; min-width: 0; font-size: 9pt; white-space: nowrap; overflow: hidden; }
    .dp-cont-head .no { font-size: 9pt; text-align: right; white-space: nowrap; }
    .dp-cont-head .no b { font-size: 11pt; font-weight: 400; }
    #print-root { display: none; }
    @media print {
      @page { size: A4 portrait; margin: 0; }
      html, body { height: auto; overflow: visible; }
      body { background: #fff; }
      body > *:not(#print-root) { display: none !important; }
      #print-root { display: block; }
      #print-root .dp { page-break-after: always; break-after: page; }
      #print-root .dp:last-child { page-break-after: auto; break-after: auto; }
    }
  </style>
</head>

      }, function (e) {
        SRV.saving = null; SRV.dirty = true;
        if (e && e.conflict) { SRV.blocked = true; setSaveState('保存できません', true); HOST.confirm(e.message).catch(noop); }
        else { setSaveState('保存できませんでした', true); toast('保存できませんでした：' + ((e && e.message) || '')); hostSchedule(15000); }
        throw e;
      });
      return SRV.saving;
    }
    // 写真の番号だけの部材に、写真を読み込む
    function hostPhotos() {
      var need = S.items.filter(function (it) { return it.photoId && !it.photo; });
      need.forEach(function (it) { if (PHOTO_CACHE[it.photoId]) it.photo = PHOTO_CACHE[it.photoId]; });
      var ids = need.filter(function (it) { return !it.photo; }).map(function (it) { return it.photoId; });
      if (!ids.length) return Promise.resolve();
      return HOST.call('getDenpyoPhotos', [HOST.site, ids]).then(function (r) {
        var ph = r.photos || {}; for (var k in ph) PHOTO_CACHE[k] = ph[k];
        S.items.forEach(function (it) { if (it.photoId && !it.photo && PHOTO_CACHE[it.photoId]) it.photo = PHOTO_CACHE[it.photoId]; });
      }).catch(function () { toast('写真を読み込めませんでした'); });
    }
    function hostBlank() { var s = blankSlip(); s.site = HOST.site; if (ME) { s.oi = meSnap(); s.orderer = ME.name; } return s; }
    // ログインしている人（注文者）の情報。白紙の伝票に入れる
    function hostMe() {
      return HOST.call('getOrdererInfo', []).then(function (r) {
        ME = r.orderer || null;
        if (ME && ME.company && ME.company.logo) LOGOS[ME.company.name] = ME.company.logo;
        if (ME && !SRV.fileId && !S.oi && !(S.items || []).length) { S.oi = meSnap(); S.orderer = ME.name; }
        renderAll();
      }).catch(function () { });
    }
    function hostOpen(slip, fileId, updated) {
      S = normSlip(slip); SRV.fileId = fileId || ''; SRV.updated = updated || 0; SRV.dirty = false; SRV.blocked = false;
      setSaveState(fileId ? '保存済み' : '');
      renderAll();
      return hostPhotos().then(function () { renderAll(); });
    }
    function hostClose() {
      hostSaveNow().then(function () { HOST.close(); }, function () {
        HOST.confirm('保存できていない入力があります。このまま閉じますか？').then(function (ok) { if (ok) HOST.close(); });
      });
    }
    function hostSlipList() {
      var el = document.getElementById('slipList');
      el.innerHTML = '<div class="empty">読み込んでいます…</div>';
      return hostSaveNow().catch(noop).then(function () { return HOST.call('listDenpyo', [HOST.site]); }).then(function (r) {
        var list = r.list || [];
        el.innerHTML = list.length ? list.map(function (x) {
          var d = new Date(x.updated || 0), cur = x.id === SRV.fileId;
          return '<div class="slip-row' + (cur ? ' cur' : '') + '"><div class="b" onclick="loadSlip(\'' + x.id + '\')"><div class="t">' + (x.no ? 'NO.' + esc(x.no) : '（伝票NOなし）') + (cur ? '　<span style="font-size:0.75rem;">（開いている伝票）</span>' : '') + '</div>' +
            '<div class="m">' + esc(x.room || '') + '　部材' + (x.n || 0) + '件　更新 ' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2) + (x.byName ? '　' + esc(x.byName) : '') + '</div></div>' +
            '<button type="button" class="btn btn-sub" onclick="copySlip(\'' + x.id + '\')">複製</button>' +
            (x.canDelete ? '<button type="button" class="btn btn-sub del" onclick="deleteSlip(\'' + x.id + '\')">削除</button>' : '') + '</div>';
        }).join('') : '<div class="empty">この現場の伝票はまだありません。</div>';
        return list;
      }).catch(function (e) { el.innerHTML = '<div class="empty">一覧を読み込めませんでした。<br>' + esc((e && e.message) || '') + '</div>'; return null; });
    }
    function deleteSlip(id) {
      HOST.confirm('この伝票を削除しますか？\n（削除フォルダへ移します）').then(function (ok) {
        if (!ok) return;
        HOST.call('deleteDenpyo', [HOST.site, id]).then(function (r) {
          toast(r.message || '削除しました');
          if (id === SRV.fileId) hostOpen(hostBlank(), '', 0);
          hostSlipList();
        }).catch(function (e) { toast('削除できませんでした：' + ((e && e.message) || '')); });
      });
    }
    function openSlips() {
      if (HOST) { openSheet('slipsBg'); hostSlipList(); return; }
      var list = loadStore();
      document.getElementById('slipList').innerHTML = list.length ? list.map(function (x) {
        var d = new Date(x.updated || 0);
        return '<div class="slip-row"><div class="b" onclick="loadSlip(\'' + x.id + '\')"><div class="t">' + esc(x.site || '（現場名なし）') + (x.no ? '　NO.' + esc(x.no) : '') + '</div>' +
          '<div class="m">' + esc(x.room || '') + '　部材' + (x.items || []).length + '件　更新 ' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2) + '</div></div>' +
          '<button type="button" class="btn btn-sub" onclick="copySlip(\'' + x.id + '\')">複製</button></div>';
      }).join('') : '<div class="empty">保存した伝票はまだありません。</div>';
      openSheet('slipsBg');
    }
    function loadSlip(id) {
      if (HOST) {
        if (id === SRV.fileId) { closeSheet('slipsBg'); return; }
        toast('読み込んでいます…');
        hostSaveNow().catch(noop).then(function () { return HOST.call('getDenpyo', [HOST.site, id]); })
          .then(function (r) { closeSheet('slipsBg'); return hostOpen(r.slip, r.fileId, r.updated); })
          .catch(function (e) { toast('開けませんでした：' + ((e && e.message) || '')); });
        return;
      }
      var x = loadStore().filter(function (s) { return s.id === id; })[0]; if (!x) return; S = normSlip(x); closeSheet('slipsBg'); renderAll();
    }
    function copySlip(id) {
      if (HOST) {
        hostSaveNow().catch(noop).then(function () { return HOST.call('getDenpyo', [HOST.site, id]); }).then(function (r) {
          var c = clone(r.slip); c.id = uid(); c.no = ''; c.orderDate = today(); c.delivDate = ''; c.updated = Date.now(); c.site = c.site || HOST.site;
          if (ME) { c.oi = meSnap(); c.orderer = ME.name; }   // 複製した人が注文者
          ['status', 'rev', 'subAt', 'subSnap', 'base', 'pdfId', 'pdfUrl'].forEach(function (k) { delete c[k]; });   // 複製は新しい伝票（未提出）
          closeSheet('slipsBg');
          return hostOpen(c, '', 0).then(function () { SRV.dirty = true; return hostSaveNow(); }).then(function () { toast('伝票を複製しました'); });
        }).catch(function (e) { toast('複製できませんでした：' + ((e && e.message) || '')); });
        return;
      }
      var x = loadStore().filter(function (s) { return s.id === id; })[0]; if (!x) return;
      S = normSlip(clone(x)); S.id = uid(); S.no = ''; S.orderDate = today(); S.delivDate = ''; S.updated = Date.now();
      closeSheet('slipsBg'); renderAll(); saveSlip(false); toast('伝票を複製しました');
    }
    function newSlip() {
      if (HOST) { hostSaveNow().catch(noop).then(function () { closeSheet('slipsBg'); hostOpen(hostBlank(), '', 0); }); return; }
      saveSlip(false); S = blankSlip(); closeSheet('slipsBg'); renderAll();
    }

    /* ===== 起動 ===== */
    document.querySelectorAll('[data-k]').forEach(function (el) {
      el.addEventListener('input', function () { S[el.getAttribute('data-k')] = el.value; document.getElementById('topTitle').textContent = S.site ? S.site + (S.room ? '　' + S.room : '') : 'ダクト製作伝票'; changed(); });
    });
    window.addEventListener('resize', function () { clearTimeout(pvTimer); pvTimer = setTimeout(renderPreview, 150); });
    (function init() {
      if (HOST) {   // 現場管理の中：白紙の伝票で始め、伝票一覧を出す（伝票がまだ無ければ白紙のまま）
        S = hostBlank(); renderAll(); hostMe();
        HOST.call('getDuctSpecs', []).then(function (r) { SPECS_HOST = r.list || []; renderHeader(); }).catch(function () { toast('登録したダクト仕様を読み込めませんでした'); });
        openSheet('slipsBg');
        hostSlipList().then(function (list) { if (list && !list.length) closeSheet('slipsBg'); });
        return;
      }
      var cur = null; try { cur = localStorage.getItem(STORE_KEY + '.cur'); } catch (e) { }
      var x = cur && loadStore().filter(function (s) { return s.id === cur; })[0];
      S = x ? normSlip(x) : blankSlip();
      renderAll();
    })();
  </script>
</body>
</html>
