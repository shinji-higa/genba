<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>現場管理ポータル</title>
<style>
  :root { --ink:#1a1a1a; --sub:#3d3d3d; --line:#8a8a8a; --bg:#f2f2f2; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; background:#1a1a1a; color:#fff; padding:12px 14px; }
  header h1 { flex:1; margin:0; font-size:18px; font-weight:700; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  header button { background:#fff; color:#1a1a1a; border:0; border-radius:6px; padding:6px 10px; font-size:15px; font-weight:700; white-space:nowrap; }
  main { max-width:760px; margin:0 auto; padding:14px; }
  .card { display:block; width:100%; text-align:left; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; font-size:16px; }
  .card b { display:block; font-size:17px; }
  .sub { color:var(--sub); font-size:15px; }
  .row { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid #c4c4c4; }
  .row:last-child { border-bottom:0; }
  .row > span:first-child { flex:0 0 7.5em; color:var(--sub); font-size:15px; }
  .row > span:last-child { flex:1; white-space:pre-wrap; word-break:break-word; }
  a { color:var(--ink); font-weight:700; }
  img.site { width:100%; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; }
  label { display:block; margin-top:10px; font-weight:700; }
  label.check { display:flex; align-items:center; gap:8px; font-weight:400; }
  label.check input { width:22px; height:22px; flex:none; }
  input, select { width:100%; font-size:17px; padding:10px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
  .btn { width:100%; margin-top:14px; padding:12px; font-size:17px; font-weight:700; background:#1a1a1a; color:#fff; border:0; border-radius:8px; }
  .btn.sub2 { background:#fff; color:#1a1a1a; border:1px solid #1a1a1a; }
  .link { background:none; border:0; padding:10px 0; color:var(--ink); font-size:16px; font-weight:700; text-decoration:underline; }
  .msg { padding:12px; background:#fff; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; }
  .siterow { display:grid; grid-template-columns:1fr 9.5em; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid #c4c4c4; }
  .siterow select { padding:6px; font-size:15px; }
  #speed { color:var(--sub); font-size:14px; margin:6px 2px 12px; min-height:1.4em; }
</style>
</head>
<body>
<header>
  <button id="back" hidden>← 戻る</button>
  <h1 id="title">現場管理ポータル</h1>
  <button id="admin" hidden>管理</button>
  <button id="out" hidden>ログアウト</button>
</header>
<main>
  <div id="speed"></div>
  <div id="view"><div class="msg">準備しています…</div></div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, collection, query, where, doc, getDoc, getDocs, setDoc, updateDoc, writeBatch, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* 現場管理ポータル（試作）：ログインと保存はポータルの中。写真・資料のファイルは Google ドライブ */
const T0 = performance.now();
const app = initializeApp({
  apiKey: 'AIzaSyDVR4p4DO4s9h70uPlXUVlhNcMP9-YkQ5Q',
  authDomain: 'genba-portal-9077b.firebaseapp.com',
  projectId: 'genba-portal-9077b',
  appId: '1:1005411376335:web:0129ce73c9988973e56bba'
});
const auth = getAuth(app);
auth.languageCode = 'ja';   // パスワード再設定のメールと画面を日本語にする
const db = initializeFirestore(app, { localCache: persistentLocalCache() });
const PORTAL_API = 'https://script.google.com/macros/s/AKfycbyW2hFHqIQuu-TsflPk_0zv7gquhoepspuvRG9-bMStPDSWSc2blcDFBtWs7MisP3f_/exec';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sec = t => ((performance.now() - t) / 1000).toFixed(2) + '秒';
const ROLES = ['一般作業員', '現場管理者'];
function msg(t) { $('view').innerHTML = '<div class="msg">' + esc(t) + '</div>'; }
function head(title, back) { $('title').textContent = title; $('back').hidden = !back; backTo = back || null; }
let backTo = null;
$('back').onclick = () => { if (backTo) backTo(); };
async function admin(action, data) {
  const idToken = await auth.currentUser.getIdToken();
  const d = await fetch(PORTAL_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'admin', idToken, action, data }) }).then(r => r.json());
  if (!d || !d.ok) throw new Error((d && d.m) || 'サーバーでエラーが発生しました。');
  return d.v;
}

/* ---------- ログイン ---------- */
let me = null, stop = null;
const AUTH_MSG = { 'auth/invalid-credential': 'メールアドレスかパスワードが違います。', 'auth/wrong-password': 'メールアドレスかパスワードが違います。', 'auth/user-not-found': 'メールアドレスかパスワードが違います。', 'auth/too-many-requests': '回数が多すぎます。少し待ってからもう一度お試しください。', 'auth/invalid-email': 'メールアドレスの形が正しくありません。' };

onAuthStateChanged(auth, async user => {
  if (stop) { stop(); stop = null; }
  if (!user) { me = null; $('admin').hidden = $('out').hidden = true; showLogin(); return; }
  $('out').hidden = false;
  // 表示を待たせないよう、一覧を先に出す。マスターかどうかは端末の控えで先に判断する
  const key = 'portalMe:' + user.uid;
  let c = {};
  try { c = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
  me = { uid: user.uid, isMaster: c.isMaster === true, canAddSite: c.canAddSite === true };
  $('admin').hidden = !me.isMaster;
  showList();
  try {
    const d = await getDoc(doc(db, 'users', user.uid));
    const x = d.exists() ? d.data() : {};
    const isMaster = x.isMaster === true, canAddSite = isMaster || x.canAddSite === true;
    if (isMaster !== me.isMaster || canAddSite !== me.canAddSite) {
      me.isMaster = isMaster; me.canAddSite = canAddSite;
      localStorage.setItem(key, JSON.stringify({ isMaster, canAddSite }));
      $('admin').hidden = !isMaster;
      showList();
    }
  } catch (e) {}
});

function showLogin(note) {
  head('現場管理ポータル');
  $('speed').textContent = '';
  $('view').innerHTML = (note ? '<div class="msg">' + esc(note) + '</div>' : '') +
    '<label>メールアドレス</label><input id="id" type="email" autocomplete="username">' +
    '<label>パスワード</label><input id="pw" type="password" autocomplete="current-password">' +
    '<button class="btn" id="go">ログイン</button>' +
    '<button class="link" id="forgot">初めての方・パスワードを忘れた方</button><div id="err" class="sub"></div>';
  $('go').onclick = async () => {
    $('err').textContent = '確認しています…';
    try { await signInWithEmailAndPassword(auth, $('id').value.trim().toLowerCase(), $('pw').value); }
    catch (e) { $('err').textContent = AUTH_MSG[e.code] || 'ログインできませんでした。'; }
  };
  $('forgot').onclick = async () => {
    const em = $('id').value.trim().toLowerCase();
    if (!em) { $('err').textContent = '先にメールアドレスを入れてください。'; return; }
    try { await sendPasswordResetEmail(auth, em); $('err').textContent = em + ' あてに、パスワードを決めるメールを送りました。届かないときは迷惑メールも見てください。'; }
    catch (e) { $('err').textContent = AUTH_MSG[e.code] || 'メールを送れませんでした。'; }
  };
}
$('out').onclick = () => { signOut(auth); };

/* ---------- 現場一覧 ---------- */
function sitesQuery() { const c = collection(db, 'sites'); return me.isMaster ? c : query(c, where('members', 'array-contains', me.uid)); }
function showList() {
  if (stop) stop();
  const t = performance.now();
  let first = true, docs = [];
  head('現場一覧');
  stop = onSnapshot(sitesQuery(), { includeMetadataChanges: true }, snap => {
    docs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.order - b.order);
    const server = !snap.metadata.fromCache;
    if (first || server) $('speed').textContent = (server ? '最新を表示：' : '端末の控えを表示：') + sec(t) + '（開いてから ' + sec(T0) + '）';
    first = false;
    if (!docs.length && !server) return;
    $('view').innerHTML = (me.canAddSite ? '<button class="btn" id="addSite" style="margin:0 0 12px">＋ 現場を追加</button>' : '') +
      (docs.length ? '' : '<div class="msg">見られる現場はありません。</div>') +
      docs.map(s =>
      '<button class="card" data-id="' + esc(s.id) + '"><b>' + esc(s.siteName) + '</b>' +
      '<span class="sub">' + esc(s.flow) + '　' + esc(s.startDate) + ' 〜 ' + esc(s.endDate) + '</span></button>').join('');
    $('view').querySelectorAll('.card').forEach(b => { b.onclick = () => showDetail(b.dataset.id); });
    if ($('addSite')) $('addSite').onclick = () => showSiteForm(null, docs);
  }, e => msg('読み込めませんでした：' + e.message));
}

/* ---------- 現場の編集・追加・削除（権限は今の現場管理と同じ。最終の判断は Firestore のルール） ---------- */
const FLOWS = ['作業前', '進行中', '完了調整中', '完了', 'EXD管理'];
const RULES = [
  ['ruleParking', '駐車スペース', ['未確認', '現場内', 'コインパーキング']],
  ['ruleHolidayWork', '土日祝工事', ['未確認', '土日共に可', '土曜のみ可', '日曜のみ可', '不可', 'その他']],
  ['ruleSmoking', '喫煙ルール', ['未確認', '喫煙スペースのみ可', '不可', 'その他']],
  ['ruleToilet', 'トイレ', ['未確認', '敷地内or仮設', '無し']],
  ['ruleGuard', '守衛手続', ['未確認', '無し', '有り']]
];
const TEXTS = [
  ['address', '住所'], ['tel', '連絡先'], ['fax', 'FAX'], ['exdChargeName', 'EXD担当'], ['exdChargeTel', 'EXD連絡先'],
  ['agentCompany', '代理人会社'], ['agentName', '代理人'], ['agentTel', '代理人連絡先'],
  ['siteStaff1Company', '担当1 会社'], ['siteStaff1Name', '担当1'], ['siteStaff1Tel', '担当1 連絡先'],
  ['siteStaff2Company', '担当2 会社'], ['siteStaff2Name', '担当2'], ['siteStaff2Tel', '担当2 連絡先']
];
const isManagerOf = s => me.isMaster || (s.roles || {})[me.uid] === '現場管理者';
const toIso = t => { const m = String(t || '').match(/(\d+)年(\d+)月(\d+)日/); return m ? m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0') : ''; };
const toJp = v => { const m = String(v || '').match(/^(\d+)-(\d+)-(\d+)$/); return m ? m[1] + '年' + Number(m[2]) + '月' + Number(m[3]) + '日' : '未設定'; };
const opts = (list, cur) => list.map(o => '<option' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>').join('');

function showSiteForm(s, others) {
  if (stop) { stop(); stop = null; }
  const isNew = !s, full = isNew || isManagerOf(s), v = s || {};
  head(isNew ? '現場を追加' : '現場の編集', isNew ? showList : () => showDetail(s.id));
  $('speed').textContent = '';
  const rules = RULES.map(r => '<label>' + r[1] + '</label><select id="f_' + r[0] + '">' + opts(r[2], v[r[0]] || '未確認') + '</select>').join('') +
    '<label>その他ルール</label><textarea id="f_ruleOther" rows="3" style="width:100%;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:6px">' + esc(v.ruleOther) + '</textarea>';
  $('view').innerHTML = (full ?
    '<label>現場名</label><input id="f_siteName" value="' + esc(v.siteName) + '">' +
    '<label>案件フロー</label><select id="f_flow">' + opts(FLOWS, v.flow || '作業前') + '</select>' +
    '<label>着手</label><input id="f_start" type="date" value="' + toIso(v.startDate) + '">' +
    '<label>完成</label><input id="f_end" type="date" value="' + toIso(v.endDate) + '">' +
    TEXTS.map(t => '<label>' + t[1] + '</label><input id="f_' + t[0] + '" value="' + esc(v[t[0]]) + '">').join('') +
    '<label>工事内容</label><textarea id="f_workContent" rows="3" style="width:100%;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:6px">' + esc(v.workContent) + '</textarea>' +
    '<label>備考</label><textarea id="f_notes" rows="3" style="width:100%;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:6px">' + esc(v.notes) + '</textarea>'
    : '<p class="sub">担当者が変えられるのは、注意事項だけです。</p>') + rules +
    '<button class="btn" id="save">保存する</button>' +
    (!isNew && (me.isMaster || (me.canAddSite && isManagerOf(s))) ? '<button class="btn sub2" id="delSite">この現場を削除</button>' : '') +
    '<div id="err" class="sub"></div>';
  $('save').onclick = async () => {
    const data = {};
    RULES.forEach(r => { data[r[0]] = $('f_' + r[0]).value; });
    data.ruleOther = $('f_ruleOther').value;
    if (full) {
      data.siteName = $('f_siteName').value.trim();
      if (!data.siteName) { $('err').textContent = '現場名を入れてください。'; return; }
      if ((others || []).some(o => o.siteName === data.siteName && (!s || o.id !== s.id))) { $('err').textContent = '同じ名前の現場があります。'; return; }
      data.flow = $('f_flow').value;
      data.startDate = toJp($('f_start').value); data.endDate = toJp($('f_end').value);
      TEXTS.forEach(t => { data[t[0]] = $('f_' + t[0]).value.trim(); });
      data.workContent = $('f_workContent').value; data.notes = $('f_notes').value;
    }
    $('save').disabled = true; $('err').textContent = '保存しています…';
    const t = performance.now();
    try {
      if (isNew) {
        const ref = doc(collection(db, 'sites'));
        await setDoc(ref, { ...data, imageUrl1: '', imageUrl2: '', order: Date.now(), members: [me.uid], roles: { [me.uid]: '現場管理者' } });
        showDetail(ref.id, '保存 ' + sec(t));
      } else {
        await updateDoc(doc(db, 'sites', s.id), data);
        showDetail(s.id, '保存 ' + sec(t));
      }
    } catch (e) { $('save').disabled = false; $('err').textContent = '保存できませんでした（権限がないか、通信できません）。'; }
  };
  if ($('delSite')) $('delSite').onclick = async () => {
    if (!confirm('「' + s.siteName + '」を削除します。よろしいですか？')) return;
    $('err').textContent = '削除しています…';
    try {
      const b = writeBatch(db), { id, ...rest } = s;
      b.set(doc(db, 'endedSites', s.id), { ...rest, endedAt: Date.now(), endedBy: me.uid });
      b.delete(doc(db, 'sites', s.id));
      await b.commit();
      showList();
    } catch (e) { $('err').textContent = '削除できませんでした（権限がないか、通信できません）。'; }
  };
}

/* ---------- 現場詳細 ---------- */
function thumb(link) {
  const m = String(link || '').match(/\/d\/([a-zA-Z0-9_-]+)/) || String(link || '').match(/id=([a-zA-Z0-9_-]+)/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w800' : '';
}
function row(k, v, tel) {
  if (!v) return '';
  return '<div class="row"><span>' + esc(k) + '</span><span>' + (tel ? '<a href="tel:' + esc(String(v).replace(/[^0-9+]/g, '')) + '">' + esc(v) + '</a>' : esc(v)) + '</span></div>';
}
function showDetail(id, saved) {
  if (stop) stop();
  const t = performance.now();
  let first = true;
  head('', showList);
  stop = onSnapshot(doc(db, 'sites', id), { includeMetadataChanges: true }, d => {
    if (!d.exists()) { if (!d.metadata.fromCache) msg('この現場は見られません。'); return; }
    const s = { id, ...d.data() }, server = !d.metadata.fromCache;
    if (first || server) $('speed').textContent = (saved ? saved + '　' : '') + (server ? '最新を表示：' : '端末の控えを表示：') + sec(t);
    first = false;
    $('title').textContent = s.siteName;
    const imgs = [s.imageUrl1, s.imageUrl2].map(thumb).filter(Boolean).map(u => '<img class="site" loading="lazy" alt="外観" src="' + esc(u) + '">').join('');
    $('view').innerHTML = imgs + '<button class="btn" id="edit" style="margin:0 0 12px">' + (isManagerOf(s) ? '編集する' : '注意事項を編集する') + '</button><div class="card">' +
      row('案件フロー', s.flow) + row('工期', s.startDate + ' 〜 ' + s.endDate) + row('住所', s.address) + row('連絡先', s.tel, true) + row('FAX', s.fax) +
      row('EXD担当', s.exdChargeName) + row('EXD連絡先', s.exdChargeTel, true) +
      row('代理人会社', s.agentCompany) + row('代理人', s.agentName) + row('代理人連絡先', s.agentTel, true) +
      row('担当1 会社', s.siteStaff1Company) + row('担当1', s.siteStaff1Name) + row('担当1 連絡先', s.siteStaff1Tel, true) +
      row('担当2 会社', s.siteStaff2Company) + row('担当2', s.siteStaff2Name) + row('担当2 連絡先', s.siteStaff2Tel, true) +
      row('工事内容', s.workContent) + row('備考', s.notes) +
      row('駐車', s.ruleParking) + row('土日祝', s.ruleHolidayWork) + row('喫煙', s.ruleSmoking) + row('トイレ', s.ruleToilet) + row('守衛', s.ruleGuard) + row('その他', s.ruleOther) +
      '</div>';
    $('edit').onclick = async () => {
      const list = isManagerOf(s) ? (await getDocs(sitesQuery())).docs.map(x => ({ id: x.id, ...x.data() })) : [];
      showSiteForm(s, list);
    };
  }, e => msg('読み込めませんでした：' + e.message));
}

/* ---------- マスター用の管理 ---------- */
$('admin').onclick = () => showUsers();
async function showUsers(note) {
  if (stop) { stop(); stop = null; }
  head('人の管理', showList);
  $('speed').textContent = '';
  msg('読み込んでいます…');
  try {
    const snap = await getDocs(collection(db, 'users'));
    const us = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.isMaster === true) - (a.isMaster === true) || a.id.localeCompare(b.id));
    $('view').innerHTML = (note ? '<div class="msg">' + esc(note) + '</div>' : '') +
      '<button class="btn" id="add" style="margin:0 0 12px">＋ 人を追加</button>' +
      us.map(u => '<button class="card" data-id="' + esc(u.id) + '"><b>' + esc(u.name || u.id) + (u.isMaster ? '（マスター）' : '') + '</b><span class="sub">' + esc(u.id) + '</span></button>').join('');
    $('add').onclick = showAddUser;
    $('view').querySelectorAll('.card').forEach(b => { b.onclick = () => showUser(b.dataset.id); });
  } catch (e) { msg('読み込めませんでした：' + e.message); }
}
function showAddUser() {
  head('人を追加', () => showUsers());
  $('view').innerHTML =
    '<label>名前</label><input id="n">' +
    '<label>メールアドレス（ログインIDになります）</label><input id="e" type="email">' +
    '<label>最初のパスワード（6文字以上）</label><input id="p" type="text" autocomplete="off">' +
    '<label class="check"><input id="m" type="checkbox">マスターにする</label>' +
    '<button class="btn" id="save">追加する</button><div id="err" class="sub"></div>';
  $('save').onclick = async () => {
    const email = $('e').value.trim().toLowerCase(), name = $('n').value.trim();
    if (!name || !email) { $('err').textContent = '名前とメールアドレスを入れてください。'; return; }
    $('save').disabled = true; $('err').textContent = '追加しています…';
    try {
      await admin('create', { email, password: $('p').value });
      await setDoc(doc(db, 'users', email), { name, isMaster: $('m').checked });
      showUser(email, '追加しました。担当現場を選んで保存してください。');
    } catch (e) { $('save').disabled = false; $('err').textContent = e.message; }
  };
}
async function showUser(uid, note) {
  head('人の設定', () => showUsers());
  msg('読み込んでいます…');
  try {
    const [u, sites] = await Promise.all([getDoc(doc(db, 'users', uid)), getDocs(collection(db, 'sites'))]);
    const d = u.data() || {};
    const list = sites.docs.map(s => ({ id: s.id, ...s.data() })).sort((a, b) => a.order - b.order);
    $('view').innerHTML = (note ? '<div class="msg">' + esc(note) + '</div>' : '') +
      '<div class="sub">' + esc(uid) + '</div>' +
      '<label>名前</label><input id="n" value="' + esc(d.name) + '">' +
      '<label class="check"><input id="m" type="checkbox"' + (d.isMaster ? ' checked' : '') + (uid === me.uid ? ' disabled' : '') + '>マスター</label>' +
      '<label class="check"><input id="ca" type="checkbox"' + (d.canAddSite ? ' checked' : '') + '>新規現場追加者</label>' +
      '<label>担当現場</label>' + list.map(s => {
        const role = (s.roles || {})[uid], on = (s.members || []).indexOf(uid) !== -1;
        return '<div class="siterow"><label class="check" style="margin:0"><input type="checkbox" data-s="' + esc(s.id) + '"' + (on ? ' checked' : '') + '>' + esc(s.siteName) + '</label>' +
          '<select data-r="' + esc(s.id) + '">' + ROLES.map(r => '<option' + (r === role ? ' selected' : '') + '>' + r + '</option>').join('') + '</select></div>';
      }).join('') +
      '<button class="btn" id="save">保存する</button>' +
      '<label>新しいパスワード（6文字以上）</label><input id="p" type="text" autocomplete="off">' +
      '<button class="btn sub2" id="pass">パスワードを変える</button>' +
      (uid === me.uid ? '' : '<button class="btn sub2" id="del">この人を削除</button>') + '<div id="err" class="sub"></div>';
    $('save').onclick = async () => {
      $('err').textContent = '保存しています…';
      try {
        const b = writeBatch(db);
        b.update(doc(db, 'users', uid), { name: $('n').value.trim(), isMaster: $('m').checked, canAddSite: $('ca').checked });
        list.forEach(s => {
          const on = $('view').querySelector('[data-s="' + s.id + '"]').checked, role = $('view').querySelector('[data-r="' + s.id + '"]').value;
          const members = (s.members || []).filter(x => x !== uid), roles = { ...(s.roles || {}) };
          delete roles[uid];
          if (on) { members.push(uid); roles[uid] = role; }
          if (on !== ((s.members || []).indexOf(uid) !== -1) || (on && (s.roles || {})[uid] !== role)) b.update(doc(db, 'sites', s.id), { members, roles });
        });
        await b.commit();
        showUsers('保存しました。');
      } catch (e) { $('err').textContent = '保存できませんでした：' + e.message; }
    };
    $('pass').onclick = async () => {
      $('err').textContent = '変更しています…';
      try { await admin('setPassword', { email: uid, password: $('p').value }); $('p').value = ''; $('err').textContent = 'パスワードを変えました。'; }
      catch (e) { $('err').textContent = e.message; }
    };
    if ($('del')) $('del').onclick = async () => {
      if (!confirm((d.name || uid) + ' を削除します。よろしいですか？')) return;
      $('err').textContent = '削除しています…';
      try {
        await admin('delete', { email: uid });
        const b = writeBatch(db);
        list.forEach(s => {
          if ((s.members || []).indexOf(uid) === -1) return;
          const roles = { ...(s.roles || {}) }; delete roles[uid];
          b.update(doc(db, 'sites', s.id), { members: s.members.filter(x => x !== uid), roles });
        });
        b.delete(doc(db, 'users', uid));
        await b.commit();
        showUsers('削除しました。');
      } catch (e) { $('err').textContent = e.message; }
    };
  } catch (e) { msg('読み込めませんでした：' + e.message); }
}
</script>
</body>
</html>
