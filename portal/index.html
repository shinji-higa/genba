<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, query, where, doc, getDoc, getDocs, setDoc, updateDoc, writeBatch, onSnapshot, disableNetwork, enableNetwork } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

import { getStorage, ref as stRef, uploadBytesResumable, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

/* 現場管理ポータル（試作）：ログインと保存はポータルの中。写真・資料のファイルは Cloud Storage（東京）。
   2026-10-31 より前に入れたテスト用の600個だけ Google ドライブにある（url が無く driveId がある） */
const T0 = performance.now();
const app = initializeApp({
  apiKey: 'AIzaSyDVR4p4DO4s9h70uPlXUVlhNcMP9-YkQ5Q',
  authDomain: 'genba-portal-9077b.firebaseapp.com',
  projectId: 'genba-portal-9077b',
  appId: '1:1005411376335:web:0129ce73c9988973e56bba',
  storageBucket: 'genba-portal-9077b.firebasestorage.app'
});
const storage = getStorage(app);
storage.maxUploadRetryTime = 60000;   // 電波が切れたら1分で一度あきらめ、端末に貯めたまま後で送り直す
const auth = getAuth(app);
auth.languageCode = 'ja';   // パスワード再設定のメールと画面を日本語にする
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
const APP_VER = 'Ver.20261031-07';

/* ---------- 電波なしでも使う（今の現場管理と同じ考え方） ----------
   ・保存は押した瞬間に完了の形。電波が戻ったら自動で送る（データは Firestore が端末に貯める）
   ・写真・資料は端末（IndexedDB）に貯めて、電波が戻ったら Cloud Storage へ送る。画面を閉じても消えない
   ・iPhone は裏で送り続けられないので、ポータルを開いているときに送る */
let fireN = 0, netDown = navigator.onLine === false, badgeUp = 0, badgeEl = null;
let failures = [];
try { failures = JSON.parse(localStorage.getItem('portalFailures') || '[]') || []; } catch (e) {}
function fail(label, msg) {
  failures.push({ label, msg, t: Date.now() });
  try { localStorage.setItem('portalFailures', JSON.stringify(failures)); } catch (e) {}
  badge();
}
/** 保存を始めて、結果を待たずに進む。断られたときだけ一覧に残す */
function fire(p, label) {
  fireN++; badge();
  return p.catch(e => { fail(label, (e && e.code) === 'permission-denied' ? '権限がありません' : '送れませんでした'); })
    .finally(() => { fireN--; badge(); });
}
function badge() {
  if (!document.body) return;
  if (!badgeEl) {
    badgeEl = document.createElement('button');
    badgeEl.type = 'button'; badgeEl.id = 'offlineBadge';
    badgeEl.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:3500;border:0;border-radius:18px;padding:8px 14px;font:700 13px -apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
    badgeEl.onclick = showPending;
    document.body.appendChild(badgeEl);
  }
  const n = fireN + badgeUp, txt = [];
  if (netDown) txt.push('電波なし');
  if (n) txt.push('未送信 ' + n + '件');
  if (failures.length) txt.push('送れなかったもの ' + failures.length + '件');
  badgeEl.style.display = txt.length ? 'block' : 'none';
  badgeEl.style.background = failures.length ? '#c62828' : (n ? '#b35c00' : '#444');
  badgeEl.textContent = txt.join('・') + (txt.length ? '（押すと詳しく）' : '');
}
function showPending() {
  const bg = document.createElement('div');
  bg.style.cssText = 'position:fixed;inset:0;z-index:3600;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;';
  bg.innerHTML = '<div class="info-card" style="max-width:420px;width:100%;max-height:80vh;overflow:auto;margin:0;">' +
    (netDown ? '<p style="margin:0 0 10px;"><b>電波がありません。</b><br>前に見た内容を表示しています。最新ではないことがあります。</p>' : '') +
    '<p style="margin:0 0 10px;font-weight:700;">未送信（電波が戻ったら自動で送ります）：' + (fireN + badgeUp) + '件</p>' +
    (failures.length ? '<p style="margin:0 0 6px;font-weight:700;color:#c62828;">送れなかったもの：' + failures.length + '件</p><ul style="margin:0 0 10px 18px;padding:0;color:#c62828;">' +
      failures.map(f => '<li>' + esc(f.label) + '：' + esc(f.msg) + '</li>').join('') + '</ul>' : '') +
    '<div style="display:flex;gap:8px;">' + (failures.length ? '<button type="button" data-a="clear" class="btn btn-sub" style="flex:1;">確認した</button>' : '') +
    '<button type="button" data-a="close" class="btn btn-sub" style="flex:1;">閉じる</button></div>' +
    '<p style="margin:10px 0 0;font-size:11px;color:#666;text-align:right;">' + APP_VER + '</p></div>';
  bg.onclick = e => {
    const a = e.target.getAttribute && e.target.getAttribute('data-a');
    if (e.target === bg || a === 'close') bg.remove();
    else if (a === 'clear') { failures = []; localStorage.removeItem('portalFailures'); badge(); bg.remove(); }
  };
  document.body.appendChild(bg);
}
window.addEventListener('online', () => { netDown = false; badge(); upPump(); });
window.addEventListener('offline', () => { netDown = true; badge(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) upPump(); });
setInterval(() => upPump(), 30000);

/* 新しい版の知らせ。iPhone のホーム画面アプリは裏に残って続きから出るので、開き直しを待たず、
   表に出たときと10分ごとに公開中の版番号を確かめる。押すと端末の控えを入れ替えて開き直す */
function showUpdate() {
  if (document.getElementById('updBar')) return;
  const b = document.createElement('button');
  b.type = 'button'; b.id = 'updBar'; b.textContent = '新しいVerがあります（押すと入れ替え）';
  b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));z-index:3700;border:0;border-radius:18px;padding:9px 16px;background:#111;color:#fff;font:700 13px -apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.3);max-width:92vw;white-space:nowrap;';
  b.onclick = async () => {
    b.textContent = '入れ替えています…';
    try {
      const r = await fetch('./?check=' + Date.now(), { cache: 'no-store' });
      if (r.ok && window.caches) await (await caches.open('portal-shell-v1')).put('./', r);
    } catch (e) {}
    location.reload();
  };
  document.body.appendChild(b);
}
async function checkVer() {
  if (navigator.onLine === false || document.hidden) return;
  try {
    const t = await fetch('./?check=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '');
    const m = t.match(/APP_VER = '([^']+)'/);
    if (m && m[1] !== APP_VER) showUpdate();
  } catch (e) {}
}
document.addEventListener('visibilitychange', checkVer);
setInterval(checkVer, 600000);
setTimeout(checkVer, 3000);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'portal-update') showUpdate(); });
}

/* 写真・資料の貯め場所 */
function idb() {
  return new Promise((ok, ng) => {
    const r = indexedDB.open('portal-offline', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('up', { keyPath: 'id' });
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ng(r.error);
  });
}
async function upTx(mode, fn) {
  const d = await idb();
  return new Promise((ok, ng) => {
    const q = fn(d.transaction('up', mode).objectStore('up'));
    q.onsuccess = () => ok(q.result);
    q.onerror = () => ng(q.error);
  });
}
const upRun = new Set();
async function upPump() {
  if (!auth.currentUser) return;
  let list = [];
  try { list = await upTx('readonly', s => s.getAll()); } catch (e) { return; }
  badgeUp = list.length; badge();
  if (navigator.onLine === false || window.portalTestOffline) return;
  list.sort((a, b) => a.t - b.t);
  for (const j of list) {
    if (upRun.size >= 3) break;
    if (upRun.has(j.id)) continue;
    upRun.add(j.id);
    upOne(j).finally(() => { upRun.delete(j.id); upPump(); });
  }
}
async function upOne(j) {
  const t = performance.now(), file = doc(db, 'sites', j.siteId, 'files', j.id), path = 'sites/' + j.siteId + '/' + j.id + '/' + j.name, r = stRef(storage, path);
  try {
    await uploadBytesResumable(r, j.blob, { contentType: j.mime });
  } catch (e) {
    if (e && e.code === 'storage/unauthorized') {
      // 前の回で本体は届いていて、記録だけ残らなかった場合は成功として続ける
      try { await getDownloadURL(r); } catch (e2) {
        fire(updateDoc(file, { uploading: false, failed: true }), j.name);
        await upTx('readwrite', s => s.delete(j.id));
        fail(j.name, '権限がありません');
        return;
      }
    } else { window.portalLastError = e && e.code; return; }   // 電波の問題：貯めたまま、あとで送り直す
  }
  try {
    const url = await getDownloadURL(r);
    fire(updateDoc(file, { url, path, uploading: false, sendMs: Math.round(performance.now() - t) }), j.name);
    await upTx('readwrite', s => s.delete(j.id));
    window.portalLastSend = sec(t);
  } catch (e) { window.portalLastError = e && e.code; }
}
const PORTAL_API = 'https://script.google.com/macros/s/AKfycbyW2hFHqIQuu-TsflPk_0zv7gquhoepspuvRG9-bMStPDSWSc2blcDFBtWs7MisP3f_/exec';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sec = t => ((performance.now() - t) / 1000).toFixed(2) + '秒';
const ROLES = ['一般作業員', '現場管理者'];
const FLOWS = ['作業前', '進行中', '完了調整中', '完了', 'EXD管理'];
const RULES = [
  ['ruleParking', '駐車スペース', ['未確認', '現場内', 'コインパーキング']],
  ['ruleHolidayWork', '土日祝工事', ['未確認', '土日共に可', '土曜のみ可', '日曜のみ可', '不可', 'その他']],
  ['ruleSmoking', '喫煙ルール', ['未確認', '喫煙スペースのみ可', '不可', 'その他']],
  ['ruleToilet', 'トイレ', ['未確認', '敷地内or仮設', '無し']],
  ['ruleGuard', '守衛手続', ['未確認', '無し', '有り']]
];
const PANELS = ['panelLogin', 'panelPortal', 'panelNewSite', 'panelDetail', 'panelSettings'];
let me = null, stop = null, backTo = null;

function show(panel, title, back, backLabel) {
  PANELS.forEach(p => {
    $(p).classList.toggle('active', p === panel);
    if (p !== panel && p !== 'panelPortal') $(p).innerHTML = '';   // 同じ名前の入力欄が残らないように消す
  });
  $('title').textContent = title;
  backTo = back || null;
  $('back').style.display = back ? 'inline-flex' : 'none';
  $('back').textContent = backLabel || '← 現場選択へ';
  window.scrollTo(0, 0);
}
$('back').onclick = () => { if (backTo) backTo(); };
const stopWatch = () => { if (stop) { stop(); stop = null; } xStop(); };
const banner = (t, ng) => '<div class="info-card" style="' + (ng ? 'background:var(--error-bg);color:var(--error-text);' : 'background:var(--success-bg);color:var(--success-text);') + 'font-weight:600;">' + esc(t) + '</div>';
const autoGrow = root => root.querySelectorAll('textarea.auto-expand').forEach(a => {
  const f = () => { a.style.height = 'auto'; a.style.height = a.scrollHeight + 4 + 'px'; };
  a.oninput = f; f();
});
async function admin(action, data) {
  const idToken = await auth.currentUser.getIdToken();
  const d = await fetch(PORTAL_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'admin', idToken, action, data }) }).then(r => r.json());
  if (!d || !d.ok) throw new Error((d && d.m) || 'サーバーでエラーが発生しました。');
  return d.v;
}

/* ---------- ログイン ---------- */
const AUTH_MSG = { 'auth/invalid-credential': 'メールアドレスかパスワードが違います。', 'auth/wrong-password': 'メールアドレスかパスワードが違います。', 'auth/user-not-found': 'メールアドレスかパスワードが違います。', 'auth/too-many-requests': '回数が多すぎます。少し待ってからもう一度お試しください。', 'auth/invalid-email': 'メールアドレスの形が正しくありません。' };

onAuthStateChanged(auth, async user => {
  stopWatch();
  if (!user) { me = null; $('userBox').style.display = 'none'; showLogin(); return; }
  $('userBox').style.display = 'flex';
  $('userEmail').textContent = user.uid;
  // 表示を待たせないよう、権限は端末の控えで先に判断して一覧を出す
  const key = 'portalMe:' + user.uid;
  let c = {};
  try { c = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
  me = { uid: user.uid, name: c.name || '', group: c.group || '', isMaster: c.isMaster === true, canAddSite: c.canAddSite === true };
  $('admin').style.display = me.isMaster ? '' : 'none';
  showList();
  setTimeout(upPump, 1500);
  try {
    const d = await getDoc(doc(db, 'users', user.uid));
    const x = d.exists() ? d.data() : {};
    const isMaster = x.isMaster === true, canAddSite = isMaster || x.canAddSite === true;
    me.name = x.name || ''; me.group = x.group || '';
    localStorage.setItem(key, JSON.stringify({ isMaster, canAddSite, name: me.name, group: me.group }));
    if (isMaster !== me.isMaster || canAddSite !== me.canAddSite) {
      me.isMaster = isMaster; me.canAddSite = canAddSite;
      $('admin').style.display = isMaster ? '' : 'none';
      showList();
    }
  } catch (e) {}
});

function showLogin() {
  show('panelLogin', '現場管理ポータル');
  $('speed').textContent = '';
  $('panelLogin').innerHTML =
    '<div class="info-card" style="margin-top: 40px; text-align: center;">' +
    '<h2 style="font-size: 1.15rem; margin-bottom: 6px;">ログイン</h2>' +
    '<p style="font-size: 0.8rem; color: var(--muted); margin-bottom: 20px;">メールアドレスとパスワードを入力してください。</p>' +
    '<div style="text-align: left;">' +
    '<div class="form-group"><label for="id">メールアドレス</label><input type="text" id="id" autocomplete="username" inputmode="email"></div>' +
    '<div class="form-group"><label for="pw">パスワード</label><input type="password" id="pw" autocomplete="current-password"></div>' +
    '<button type="button" id="go" class="btn btn-dark" style="margin-top: 10px;">ログイン</button>' +
    '<button type="button" id="forgot" class="btn btn-sub" style="margin-top: 14px; width: 100%;">初めての方・パスワードを忘れた方</button>' +
    '<div id="err" style="margin-top: 10px; font-size: 0.85rem;"></div></div></div>';
  $('go').onclick = async () => {
    $('err').textContent = '確認しています…';
    try { await signInWithEmailAndPassword(auth, $('id').value.trim().toLowerCase(), $('pw').value); }
    catch (e) { $('err').textContent = AUTH_MSG[e.code] || 'ログインできませんでした。'; }
  };
  $('pw').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
  $('forgot').onclick = async () => {
    const em = $('id').value.trim().toLowerCase();
    if (!em) { $('err').textContent = '先にメールアドレスを入れてください。'; return; }
    try { await sendPasswordResetEmail(auth, em); $('err').textContent = em + ' あてに、パスワードを決めるメールを送りました。届かないときは迷惑メールも見てください。'; }
    catch (e) { $('err').textContent = AUTH_MSG[e.code] || 'メールを送れませんでした。'; }
  };
}
$('out').onclick = () => { signOut(auth); };

/* ---------- 現場一覧 ---------- */
let allSites = [], flowFilter = '全て表示';
$('flowFilters').innerHTML = ['全て表示'].concat(FLOWS).map(f =>
  '<button type="button" class="flow-filter-btn flow-color-' + (f === '全て表示' ? 'ALL' : f) + (f === flowFilter ? ' active' : '') + '" data-f="' + f + '">' + f + '</button>').join('');
$('flowFilters').querySelectorAll('button').forEach(b => {
  b.onclick = () => {
    flowFilter = b.dataset.f;
    $('flowFilters').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
    renderSites();
  };
});
$('inputSearchSite').oninput = renderSites;
$('reloadList').onclick = () => showList();
$('addSite').onclick = () => showSiteForm(null);

function sitesQuery() { const c = collection(db, 'sites'); return me.isMaster ? c : query(c, where('members', 'array-contains', me.uid)); }
function showList() {
  stopWatch();
  const t = performance.now();
  let first = true, firstServer = false;
  show('panelPortal', '現場選択');
  $('addSite').style.display = me.canAddSite ? '' : 'none';
  $('noAdd').style.display = me.canAddSite ? 'none' : '';
  stop = onSnapshot(sitesQuery(), { includeMetadataChanges: true }, snap => {
    allSites = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.order - b.order);
    const server = !snap.metadata.fromCache;
    if (first || (server && !firstServer)) $('speed').textContent = (server ? '最新を表示：' : '端末の控えを表示：') + sec(t) + '（開いてから ' + sec(T0) + '）';
    first = false; firstServer = firstServer || server;
    if (allSites.length || server) renderSites();
  }, e => { $('siteCardsContainer').innerHTML = banner('読み込めませんでした：' + e.message, true); });
}
function renderSites() {
  const q = $('inputSearchSite').value.trim().toLowerCase();
  const list = allSites.filter(s => (!q || String(s.siteName).toLowerCase().includes(q)) && (flowFilter === '全て表示' || s.flow === flowFilter));
  const box = $('siteCardsContainer');
  if (!list.length) { box.innerHTML = '<div class="info-card" style="text-align:center; color:var(--muted);">該当する現場がありません。</div>'; return; }
  box.innerHTML = list.map(s =>
    '<button type="button" class="site-card-btn" data-id="' + esc(s.id) + '">' +
      '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">' +
        '<div style="font-size:1.02rem; font-weight:700; flex:1; padding-right:8px;">' + esc(s.siteName) + '</div>' +
        '<span class="flow-badge flow-color-' + esc(s.flow) + '">' + esc(s.flow) + '</span>' +
      '</div>' +
      '<div style="font-size:0.8rem; color:var(--muted); display:flex; flex-direction:column; gap:3px;">' +
        '<div><span style="font-size:0.7rem; font-weight:600; background:#eee; padding:1px 4px; border-radius:2px;">着手</span> ' + esc(s.startDate) + '</div>' +
        '<div><span style="font-size:0.7rem; font-weight:600; background:#eee; padding:1px 4px; border-radius:2px;">完成</span> ' + esc(s.endDate) + '</div>' +
      '</div></button>').join('');
  box.querySelectorAll('.site-card-btn').forEach(b => { b.onclick = () => showDetail(b.dataset.id); });
}

/* ---------- 現場詳細 ---------- */
const tabsOf = s => ['現場詳細', '報告', '写真', '資料', '注文'].concat(isManagerOf(s) ? ['担当'] : []);   // 担当はマスターと現場管理者だけ
const isManagerOf = s => me.isMaster || (s.roles || {})[me.uid] === '現場管理者';
const canDelete = s => me.isMaster || (me.canAddSite && isManagerOf(s));
const person = (co, n, t) => {
  if (!co && !n && !t) return '<div class="dt-person-main">未設定</div>';
  return (co ? '<div class="dt-person-co">' + esc(co) + '</div>' : '') +
    '<div class="dt-person-main"><span>' + esc(n || '未設定') + '</span>' + (t ? '<a href="tel:' + esc(t) + '">' + esc(t) + '</a>' : '') + '</div>';
};
const imgBox = (url, label) => {
  const m = String(url || '').match(/\/d\/([a-zA-Z0-9_-]+)/) || String(url || '').match(/id=([a-zA-Z0-9_-]+)/);
  return '<div class="img-box">' + (m ? '<img loading="lazy" alt="' + label + '" src="https://lh3.googleusercontent.com/d/' + m[1] + '=w800">' : '<span style="font-size:0.78rem; color:var(--muted); font-weight:600;">' + label + ' なし</span>') + '</div>';
};
const opts = (list, cur) => list.map(o => '<option' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>').join('');
let detailTab = '現場詳細', rulesEditing = false;

function showDetail(id, saved) {
  stopWatch();
  const t = performance.now();
  let first = true, firstServer = false;
  rulesEditing = false;
  detailTab = '現場詳細';
  show('panelDetail', '', showList);
  stop = onSnapshot(doc(db, 'sites', id), { includeMetadataChanges: true }, d => {
    if (!d.exists()) { if (!d.metadata.fromCache) $('panelDetail').innerHTML = banner('この現場は見られません。', true); return; }
    const s = { id, ...d.data() }, server = !d.metadata.fromCache;
    if (first || (server && !firstServer)) $('speed').textContent = (saved ? saved + '　' : '') + (server ? '最新を表示：' : '端末の控えを表示：') + sec(t);
    first = false; firstServer = firstServer || server;
    $('title').textContent = s.siteName;
    // 写真・資料タブを開いているときは作り直さない（ファイルを選んでいる最中に入力欄が消えるため）
    if (($('xRoot') || $('rRoot')) && X) X.s = s;
    else if ($('sRoot')) sSite = s;
    else if (!rulesEditing) renderDetail(s);
  }, e => { $('panelDetail').innerHTML = banner('読み込めませんでした：' + e.message, true); });
}
function renderDetail(s) {
  const addr = s.address ? '<a class="address-map-link" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.address) + '" target="_blank" rel="noopener noreferrer">📍 ' + esc(s.address) + '</a>' : '未設定';
  const nearby = s.address ? '<div class="nearby-row" style="display:grid;">' + ['コンビニ', 'トイレ', '駐車場', 'ホームセンター'].map(k => '<button type="button" class="nearby-btn" data-k="' + k + '"><span>' + k + '</span></button>').join('') + '</div>' : '';
  $('panelDetail').innerHTML =
    '<nav class="nav-tabs" style="margin: -16px -16px 14px -16px;">' + tabsOf(s).map(n => '<button type="button" class="nav-tab-item' + (n === detailTab ? ' active' : '') + '" data-t="' + n + '">' + n + '</button>').join('') + '</nav>' +
    (detailTab === '担当' ? '<div id="sRoot"></div>' : detailTab === '報告' ? '<div id="rRoot"></div>' : detailTab === '写真' || detailTab === '資料' ? '<div id="xRoot"></div>' :
     detailTab !== '現場詳細' ? '<div class="info-card" style="text-align:center; color:var(--muted);">「' + detailTab + '」はこれから作ります。</div>' :
    '<div style="margin-bottom: 14px; display: flex; gap: 8px; align-items: center;">' +
      (isManagerOf(s) ? '<button type="button" id="edit" class="btn btn-dark" style="flex: 1;">✏️ 現場情報編集</button>'
        : '<div style="flex: 1; padding: 10px 12px; background: #f7f7f9; color: #555; font-size: 0.82rem; font-weight: 600; border: 1px dashed var(--border); border-radius: 4px; text-align: center;">※ 編集する場合は現場管理者に連絡</div>') +
    '</div>' +
    '<div class="info-card">' +
      '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border);">' +
        '<div style="font-size:1.15rem; font-weight:800; flex:1; padding-right:8px;">' + esc(s.siteName) + '</div>' +
        '<span class="flow-badge flow-color-' + esc(s.flow) + '">' + esc(s.flow) + '</span></div>' +
      '<div class="form-group"><label>現場住所 (押すとGoogle地図アプリが開きます)</label><div style="font-size:0.92rem; line-height:1.5;">' + addr + '</div>' + nearby + '</div>' +
      '<div class="grid-two-col form-group"><div><label>工期 着手</label><div style="font-size:0.92rem;">' + esc(s.startDate || '未設定') + '</div></div><div><label>工期 完成</label><div style="font-size:0.92rem;">' + esc(s.endDate || '未設定') + '</div></div></div>' +
      '<div class="form-group"><label>工事内容</label><div class="dt-multiline">' + (esc(s.workContent) || '未設定') + '</div></div>' +
    '</div>' +
    '<div class="info-card">' +
      '<div class="form-group"><label>EXD案件担当者 / 連絡先</label><div>' + person('', s.exdChargeName, s.exdChargeTel) + '</div></div>' +
      '<div class="form-group"><label>現場代理人 / 連絡先</label><div>' + person(s.agentCompany, s.agentName, s.agentTel) + '</div></div>' +
      '<div class="form-group"><label>現場担当者1 / 連絡先</label><div>' + person(s.siteStaff1Company, s.siteStaff1Name, s.siteStaff1Tel) + '</div></div>' +
      '<div class="form-group" style="margin-bottom: 0;"><label>現場担当者2 / 連絡先</label><div>' + person(s.siteStaff2Company, s.siteStaff2Name, s.siteStaff2Tel) + '</div></div>' +
    '</div>' +
    '<div class="images-row">' + imgBox(s.imageUrl1, '外観画像1') + imgBox(s.imageUrl2, '外観画像2') + '</div>' +
    '<div class="info-card"><label>備考</label><div class="dt-multiline" style="margin-top:4px;">' + (esc(s.notes) || '特になし') + '</div></div>' +
    '<div class="info-card">' +
      '<div class="card-header-row"><span style="font-weight: 700; font-size: 0.92rem;">⚠️ 施工に関する注意事項</span><div>' +
        '<button type="button" id="rEdit" class="btn btn-sub">✏️ 編集</button>' +
        '<button type="button" id="rSave" class="btn btn-dark" style="display:none; padding:4px 10px; font-size:0.75rem; width:auto;">保存</button> ' +
        '<button type="button" id="rCancel" class="btn btn-sub" style="display:none; padding:4px 10px; font-size:0.75rem;">取消</button></div></div>' +
      ruleFields(s, true) +
    '</div>');
  $('panelDetail').querySelectorAll('.nav-tab-item').forEach(b => { b.onclick = () => { detailTab = b.dataset.t; renderDetail(s); }; });
  if (detailTab === '担当') { sOpen(s); return; }
  if (detailTab === '報告') { rOpen(s); return; }
  if (detailTab === '写真' || detailTab === '資料') { xOpen(s, detailTab === '写真' ? 'photo' : 'doc'); return; }
  if (detailTab !== '現場詳細') return;
  autoGrow($('panelDetail'));
  $('panelDetail').querySelectorAll('.nearby-btn').forEach(b => {
    b.onclick = () => {
      const word = b.dataset.k === 'トイレ' ? '公衆トイレ' : b.dataset.k;
      window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(String(s.address).split(/\r?\n/)[0].trim() + ' 周辺 ' + word), '_blank');
    };
  });
  if ($('edit')) $('edit').onclick = () => showSiteForm(s);
  const fields = () => $('panelDetail').querySelectorAll('.rule-field');
  $('rEdit').onclick = () => {
    rulesEditing = true;
    fields().forEach(f => { f.disabled = false; f.readOnly = false; });
    $('rEdit').style.display = 'none'; $('rSave').style.display = 'inline-block'; $('rCancel').style.display = 'inline-block';
  };
  $('rCancel').onclick = () => { rulesEditing = false; renderDetail(s); };
  $('rSave').onclick = () => {
    const data = readRules();
    fire(updateDoc(doc(db, 'sites', s.id), data), '注意事項');
    rulesEditing = false;
    renderDetail({ ...s, ...data });
  };
}
function ruleFields(v, locked) {
  const d = locked ? ' class="rule-field" disabled' : '';
  const sel = r => '<div><label>' + r[1] + '</label><select id="f_' + r[0] + '"' + d + '>' + opts(r[2], v[r[0]] || '未確認') + '</select></div>';
  return '<div class="grid-two-col form-group">' + sel(RULES[0]) + sel(RULES[1]) + '</div>' +
    '<div class="grid-two-col form-group">' + sel(RULES[2]) + sel(RULES[3]) + '</div>' +
    '<div class="form-group">' + sel(RULES[4]) + '</div>' +
    '<div class="form-group" style="margin-top: 12px;"><label>その他ルール（全権限で編集可能・全文自動展開）</label>' +
    '<textarea id="f_ruleOther" class="' + (locked ? 'rule-field ' : '') + 'auto-expand"' + (locked ? ' readonly' : '') + ' placeholder="特になし">' + esc(v.ruleOther) + '</textarea></div>';
}
function readRules() {
  const data = {};
  RULES.forEach(r => { data[r[0]] = $('f_' + r[0]).value; });
  data.ruleOther = $('f_ruleOther').value;
  return data;
}

/* ---------- 写真・資料（見た目と操作は今の現場管理と同じ） ----------
   ファイルの情報と小さな見本画像は Firestore、本体は Google ドライブ。
   一覧は Firestore から出すので、ドライブを待たない。追加は先に一覧へ出して、本体は裏で送る */
const RELOAD_ICON = '';
let X = null, xUnsub = [];
function xStop() { xUnsub.forEach(f => f()); xUnsub = []; X = null; cmPanels = {}; const o = $('cmOverlay'); if (o) o.remove(); }
const xLabel = k => k === 'doc' ? '資料' : '写真';
const xSub = name => collection(db, 'sites', X.s.id, name);
const xFolders = () => X.folders.filter(f => f.kind === X.kind && !f.deleted);
const xFiles = () => X.files.filter(f => f.kind === X.kind && !f.deleted);
const xMayRemove = it => me.isMaster || isManagerOf(X.s) || (me.canAddSite && it.by === me.uid);
const xDate = t => { const d = new Date(t || 0); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate(); };

function xEnsure(s, kind) {
  if (!X || X.s.id !== s.id) {
    xStop();
    const t = performance.now();
    X = { s, kind, folders: [], files: [], reports: [], active: { photo: '', doc: '' }, mode: { photo: 'grid', doc: 'textonly' }, sort: 'newest', selMode: false, sel: new Set(), selF: new Set(), rCat: '全て表示', rMode: 'textonly', rEdit: '' };
    let shown = isOffline();   // 電波なしで開いたときは、電波が戻るまでの時間を数えない
    const draw = snap => {
      if (!shown && !snap.metadata.fromCache) { shown = true; $('speed').textContent = '表示：' + sec(t); }
      if ($('xRoot')) xRender();
      if ($('rRoot')) rList();
    };
    xUnsub.push(onSnapshot(xSub('folders'), { includeMetadataChanges: true }, q => { if (!X) return; X.folders = q.docs.map(d => ({ id: d.id, ...d.data() })); draw(q); }));
    xUnsub.push(onSnapshot(xSub('files'), { includeMetadataChanges: true }, q => { if (!X) return; X.files = q.docs.map(d => ({ id: d.id, ...d.data() })); draw(q); }));
    xUnsub.push(onSnapshot(xSub('reports'), { includeMetadataChanges: true }, q => { if (!X) return; X.reports = q.docs.map(d => ({ id: d.id, ...d.data() })); draw(q); }));
    xUnsub.push(onSnapshot(xSub('comments'), q => { if (!X) return; X.comments = q.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => !c.deleted).sort((a, b) => (a.at || 0) - (b.at || 0)); cmRefresh(); }));
    getDoc(doc(xSub('reads'), me.uid)).then(d => { if (X && d.exists()) { X.reads = { ...(d.data().marks || {}), ...X.reads }; cmRefresh(); } }).catch(() => {});
    cmPeopleLoad();
  }
  X.s = s;
}

/* ---------- コメント（報告・写真・資料ごと。今の現場管理と同じ作り）----------
   報告はカードの下に埋め込み、写真・資料は画面の下からチャットが開く。自分は右、他の人は左。
   @ で現場の担当者を選べる。ほかの人のコメントは、画面に見えた時点で既読になる */
const cmList = (k, id) => (X.comments || []).filter(c => c.kind === k && c.target === id);
const cmUnread = (k, id) => { const t = (X.reads || {})[k + ':' + id] || 0; return cmList(k, id).filter(c => c.by !== me.uid && (c.at || 0) > t).length; };
const cmText = (k, id, label, toggle) => { const n = cmList(k, id).length, u = cmUnread(k, id); return '💬' + (label ? ' ' + label : '') + (toggle ? ' ' + ((X.cmOpen || {})[k + ':' + id] ? '▲' : '▼') : '') + (n ? ' ' + u + '/' + n : ''); };
const cmCls = (k, id) => ' cm-open-btn' + (cmList(k, id).length ? ' has-cm' : '') + (cmUnread(k, id) ? ' has-unread' : '');
const cmBtn = (k, id, cls) => '<button type="button" class="' + cls + cmCls(k, id) + '" data-cm="' + k + '|' + esc(id) + '" title="コメント">' + cmText(k, id) + '</button>';
const cmInline = (k, id) => '<div class="cm-inline" data-cmw="' + k + '|' + esc(id) + '"><button type="button" class="cm-toggle' + cmCls(k, id) + '" data-cm="' + k + '|' + esc(id) + '" data-label="コメント" data-toggle="1">' + cmText(k, id, 'コメント', true) + '</button><div class="cm-inline-body" style="display:none;"></div></div>';
const CM_BODY = '<div class="cm-list"></div><div class="cm-input"><div class="cm-suggest"></div><button type="button" class="cm-at" title="相手を指定（メンション）">@</button><textarea rows="1" placeholder="コメントを入力"></textarea><button type="button" class="cm-send">送信</button></div>';
let cmPanels = {}, cmReadTimer = null, cmIO = null;
async function cmPeopleLoad() {
  try {
    const c = collection(db, 'users'), seeAll = me.isMaster || me.group === 'エクスケア社員';
    const q = seeAll ? c : query(c, where('home', '==', (me.group === 'マルトク' || me.group === 'NAFA') ? me.group : 'エクスケア'));
    const snap = await getDocs(q);
    if (X) X.people = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => u.id !== me.uid);
  } catch (e) {}
}
function cmSeen(key, ts) {
  if (!X) return;
  X.reads = X.reads || {};
  if ((X.reads[key] || 0) >= ts) return;
  X.reads[key] = ts;
  clearTimeout(cmReadTimer);
  const site = X.s.id, marks = { ...X.reads };
  cmReadTimer = setTimeout(() => { setDoc(doc(db, 'sites', site, 'reads', me.uid), { marks }, { merge: true }).catch(() => {}); }, 1500);
  cmButtons();
}
function cmButtons() {
  document.querySelectorAll('[data-cm]').forEach(b => {
    const [k, id] = b.dataset.cm.split('|');
    b.textContent = cmText(k, id, b.dataset.label || '', !!b.dataset.toggle);
    b.classList.toggle('has-cm', cmList(k, id).length > 0);
    b.classList.toggle('has-unread', cmUnread(k, id) > 0);
  });
}
function cmRefresh() { cmButtons(); Object.values(cmPanels).forEach(cmDraw); }
function cmDraw(p) {
  const list = p.root.querySelector('.cm-list');
  if (!list) return;
  const items = cmList(p.k, p.id), read = p.readTs, near = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
  if (!items.length) { list.innerHTML = '<div class="cm-empty">まだコメントはありません。<br>最初のコメントを送ってみましょう。</div>'; return; }
  const first = items.find(c => c.by !== me.uid && (c.at || 0) > read);
  if (cmIO) list.querySelectorAll('.cm-row').forEach(r => cmIO.unobserve(r));
  const names = (X.people || []).map(u => u.name).concat(me.name).filter(Boolean).sort((a, b) => b.length - a.length).map(n => esc(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const re = names.length ? new RegExp('@(' + names.join('|') + ')', 'g') : null;
  list.innerHTML = items.map(c => {
    const mine = c.by === me.uid, un = !mine && (c.at || 0) > read;
    return (first && c === first && items[0] !== c ? '<div class="cm-divider">ここから未読</div>' : '') +
      '<div class="cm-row' + (mine ? ' mine' : '') + (un ? ' cm-unread' : '') + '" data-at="' + (c.at || 0) + '"><div class="cm-meta">' + (mine ? '' : esc(c.byName) + '　') + esc(rWhen(c.at)) +
      (mine || me.isMaster ? '<button type="button" class="cm-del" data-del="' + esc(c.id) + '">削除</button>' : '') + '</div><div class="cm-bubble">' + (re ? esc(c.text).replace(re, '<span class="cm-mention">@$1</span>') : esc(c.text)) + '</div></div>';
  }).join('');
  list.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => { if (confirm('このコメントを削除しますか？')) fire(updateDoc(doc(xSub('comments'), b.dataset.del), { deleted: true, deletedAt: Date.now() }), 'コメントの削除'); };
  });
  if (!list.dataset.shown) {
    const dv = list.querySelector('.cm-divider');
    list.scrollTop = dv ? list.scrollTop + dv.getBoundingClientRect().top - list.getBoundingClientRect().top - 8 : list.scrollHeight;
    list.dataset.shown = '1';
  } else if (near) list.scrollTop = list.scrollHeight;
  if ('IntersectionObserver' in window) {
    cmIO = cmIO || new IntersectionObserver(es => {
      es.forEach(e => {
        const row = e.target;
        if (e.isIntersecting) row._t = setTimeout(() => { const pk = row.closest('[data-cmk]'); if (pk) cmSeen(pk.dataset.cmk, Number(row.dataset.at)); }, 700);
        else clearTimeout(row._t);
      });
    });
    list.querySelectorAll('.cm-row.cm-unread').forEach(r => cmIO.observe(r));
  }
}
function cmPanel(k, id, root, label, draft) {
  const key = k + ':' + id;
  root.setAttribute('data-cmk', key);
  const p = { k, id, root, label, readTs: (X.reads || {})[key] || 0 };
  cmPanels[key] = p;
  const ta = root.querySelector('textarea'), box = root.querySelector('.cm-suggest');
  if (draft) ta.value = draft;
  const query_ = () => { const m = ta.value.slice(0, ta.selectionStart).match(/@([^\s@]*)$/); return m ? { q: m[1], start: ta.selectionStart - m[0].length, end: ta.selectionStart } : null; };
  const suggest = () => {
    const q = query_(), members = X.s.members || [];
    if (!q) { box.style.display = 'none'; return; }
    const hits = (X.people || []).filter(u => (members.includes(u.id) || u.isMaster) && String(u.name).replace(/\s/g, '').includes(q.q.replace(/\s/g, ''))).slice(0, 20);
    if (!hits.length) { box.style.display = 'none'; return; }

/* ---------- 担当（見た目と操作は今の現場管理と同じ）----------
   マスターは現場管理者も付けられる。現場管理者は一般作業員まで。マスター本人と自分は一覧に出さない。

let sSite = null, sPeople = [], sPending = {};
async function sOpen(s) {
  sSite = s; sPending = {};

    const q = seeAll ? c : query(c, where('home', '==', (me.group === 'マルトク' || me.group === 'NAFA') ? me.group : 'エクスケア'));
    const snap = await getDocs(q);
    sPeople = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => !u.isMaster && u.id !== me.uid).sort((a, b) => String(a.name).localeCompare(String(b.name), 'ja'));

}
function sList() {
  const box = $('sBox');

  if (!sPeople.length) { box.innerHTML = '<div class="info-card" style="text-align:center; color:var(--muted);">登録者が存在しません。</div>'; return; }
  const roles = sSite.roles || {};
  box.innerHTML = sPeople.map(u => {
    const base = roles[u.id] || '担当なし', cur = sPending[u.id] !== undefined ? sPending[u.id] : base;
    const color = cur === '現場管理者' ? 'background:#111111; color:#ffffff;' : cur === '一般作業員' ? 'background:#e8f0fe; color:#1967d2;' : 'background:#f0f0f2; color:#333;';
    const sel = '<select class="action-control-select" data-u="' + esc(u.id) + '" style="height:32px; font-size:0.8rem;">' + opts(me.isMaster ? ['担当なし', '一般作業員', '現場管理者'] : ['担当なし', '一般作業員'], cur) + '</select>';

      (!me.isMaster && base === '現場管理者' ? '<span style="font-size:0.8rem; font-weight:700; padding:4px 8px; background:#eee; border-radius:4px;">現場管理者</span>' : sel) + '</div></div>';

function sSubmit() {
  const ids = Object.keys(sPending).filter(k => sPending[k] !== ((sSite.roles || {})[k] || '担当なし'));
  if (!ids.length) { alert('変更された権限はありません。'); return; }
  const roles = { ...(sSite.roles || {}) };
  let members = (sSite.members || []).slice(), managers = (sSite.managers || []).slice();
  ids.forEach(u => {
    const r = sPending[u];
    members = members.filter(x => x !== u); managers = managers.filter(x => x !== u); delete roles[u];
    if (r !== '担当なし') { members.push(u); roles[u] = r; if (r === '現場管理者') managers.push(u); }

  const data = { members, roles };
  if (me.isMaster) data.managers = managers;
  fire(updateDoc(doc(db, 'sites', sSite.id), data), '担当の変更');

}

  body.addEventListener('touchstart', e => {
    if (!VW) return;
    if (e.touches.length === 2) {
      const a = e.touches[0], b = e.touches[1], r = body.getBoundingClientRect();
      pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), s: VW.scale, cx: (a.clientX + b.clientX) / 2 - r.left, cy: (a.clientY + b.clientY) / 2 - r.top };
      t0 = null;
    } else if (e.touches.length === 1) t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  body.addEventListener('touchmove', e => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const a = e.touches[0], b = e.touches[1];
    viewerSetScale(pinch.s * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pinch.d, pinch.cx, pinch.cy);
  }, { passive: false });
  body.addEventListener('touchend', e => {
    if (pinch) { if (e.touches.length < 2) pinch = null; return; }
    if (!t0 || !VW) return;
    const p = e.changedTouches[0], dx = p.clientX - t0.x, dy = p.clientY - t0.y, photo = !VW.pdf;
    if (photo && VW.scale === 1 && Math.abs(dx) > 60 && Math.abs(dy) < 60) { viewerStep(dx < 0 ? 1 : -1); t0 = null; return; }
    if (photo && Math.abs(dx) < 10 && Math.abs(dy) < 10) {
      const now = Date.now();
      if (now - lastTap < 300) { const r = body.getBoundingClientRect(); viewerSetScale(VW.scale > 1 ? 1 : 2.5, p.clientX - r.left, p.clientY - r.top); lastTap = 0; }
      else lastTap = now;
    }
    t0 = null;
  });
}
function xBatch(rows, data) {
  for (let i = 0; i < rows.length; i += 400) {
    const b = writeBatch(db);
    rows.slice(i, i + 400).forEach(r => b.update(doc(xSub(r[0]), r[1]), data));
    fire(b.commit(), xLabel(X.kind));
  }
}

/* フォルダを選ぶ画面。allowTop=false のときは TOP を出さない。選ばなければ null */
function xPick(title, allowTop, allowNew) {
  return new Promise(done => {
    const rows = [];
    const walk = (p, depth) => xKids(p).forEach(f => { rows.push([f.id, '　'.repeat(depth) + f.name]); walk(f.id, depth + 1); });
    walk('', 0);
    const o = document.createElement('div');
    o.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px;';
    o.innerHTML = '<div class="info-card" style="width:100%; max-width:420px; max-height:80vh; overflow:auto; margin:0;"><div style="font-weight:700; margin-bottom:10px;">' + esc(title) + '</div>' +
      (allowTop ? '<button type="button" class="btn btn-sub" data-p="" style="width:100%; margin-bottom:6px; justify-content:flex-start;">' + xLabel(X.kind) + 'TOP</button>' : '') +
      rows.map(r => '<button type="button" class="btn btn-sub" data-p="' + esc(r[0]) + '" style="width:100%; margin-bottom:6px; justify-content:flex-start;">' + esc(r[1]) + '</button>').join('') +
      (allowNew ? '<button type="button" class="btn btn-outline" data-n="1" style="margin-bottom:6px;">＋ 新しいフォルダを作って追加</button>' : '') +
      '<button type="button" class="btn btn-sub" data-x="1" style="width:100%;">やめる</button></div>';
    const end = v => { o.remove(); done(v); };
    o.querySelectorAll('[data-p]').forEach(b => { b.onclick = () => end(b.dataset.p); });
    if (o.querySelector('[data-n]')) o.querySelector('[data-n]').onclick = async () => {
      const name = (prompt('新しいフォルダ名を入力してください（' + xLabel(X.kind) + 'TOPの中に作ります）:') || '').trim();
      if (name) end(xNewFolder(name, '')); else end(null);
    };
    o.querySelector('[data-x]').onclick = () => end(null);
    document.body.appendChild(o);
  });
}

/* 追加：写真は今の現場管理と同じく 1600px・画質 0.8 に縮める。一覧用の見本画像（長い辺 240px）は Firestore に入れる */
function xPrepare(file, kind) {
  return new Promise(ok => {
    const raw = () => { const r = new FileReader(); r.onload = () => ok({ name: file.name, mime: file.type || 'application/octet-stream', data: String(r.result).split(',')[1], thumb: '' }); r.readAsDataURL(file); };
    // 資料は元のまま送る（今の現場管理と同じ）。縮めるのは写真だけ
    if (kind !== 'photo' || !/^image\/(jpeg|png|webp|heic)/i.test(file.type || '')) return raw();
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const draw = (max, q) => {
        const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        return c.toDataURL('image/jpeg', q);
      };
      const big = draw(1600, 0.8), thumb = draw(240, 0.5);
      URL.revokeObjectURL(url);
      ok({ name: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', data: big.split(',')[1], thumb });
    };
    img.onerror = () => { URL.revokeObjectURL(url); raw(); };
    img.src = url;
  });
}
async function xUpload(kind, folder, files) {
  let lastId = '';
  for (const file of files) {
    const p = await xPrepare(file, kind);
    const ref = doc(xSub('files')), siteId = X.s.id;
    const blob = new Blob([Uint8Array.from(atob(p.data), c => c.charCodeAt(0))], { type: p.mime });
    // 先に端末へ貯める（画面を閉じても電波がなくても消えない）。一覧には押した瞬間に出る
    await upTx('readwrite', s => s.put({ id: ref.id, siteId, name: p.name.replace(/[\/#?\[\]*]/g, '_'), mime: p.mime, blob, t: Date.now() }));
    fire(setDoc(ref, { kind, folder, name: p.name, mime: p.mime, size: blob.size, thumb: p.thumb, by: me.uid, byName: me.name || me.uid, at: Date.now(), driveId: '', uploading: true, deleted: false, comment: '' }), p.name);
    upPump();
    lastId = ref.id;
  }
  return lastId;
}
window.portalTest = {
  queue: () => ({ waiting: badgeUp, busy: upRun.size, writes: fireN, last: window.portalLastSend || '', error: window.portalLastError || '' }),
  /* 電波なしのふりをする（確認用） */
  async net(on) {
    window.portalTestOffline = !on; netDown = !on;
    await (on ? enableNetwork(db) : disableNetwork(db));
    badge(); upPump();
  },
  /* テスト用データ：開いている現場に、フォルダと 写真30・資料30 を入れる（テスト現場だけ） */
  async seed() {
    if (!X || !X.s.isTest) throw new Error('テスト現場を開いてください。');
    const sets = { photo: [['全景'], ['施工中', '1階', '2階'], ['完了']], doc: [['図面', 'ダクト図'], ['書類'], ['メーカー資料']] };
    for (const kind of ['photo', 'doc']) {
      X.kind = kind;
      const leaves = [];
      for (const s of sets[kind]) {
        const top = await xNewFolder(s[0], '');
        if (s.length === 1) leaves.push(top);
        for (const c of s.slice(1)) leaves.push(await xNewFolder(c, top));
      }
      for (let i = 1; i <= 30; i++) {
        let file;
        if (kind === 'photo') {
          const c = document.createElement('canvas'); c.width = 1600; c.height = 1200;
          const x = c.getContext('2d'), h = (i * 37 + X.s.order * 11) % 360;
          for (let n = 0; n < 900; n++) { x.fillStyle = 'hsl(' + ((h + Math.random() * 60) % 360) + ',' + (20 + Math.random() * 40) + '%,' + (25 + Math.random() * 55) + '%)'; x.fillRect(Math.random() * 1600, Math.random() * 1200, 40 + Math.random() * 300, 30 + Math.random() * 200); }
          x.fillStyle = '#fff'; x.font = 'bold 120px sans-serif'; x.fillText('写真 ' + i, 80, 180);
          const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
          file = new File([blob], 'テスト写真' + ('0' + i).slice(-2) + '.jpg', { type: 'image/jpeg' });
        } else {
          file = new File(['%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj 2 0 obj<</Type/Pages/Count 1/Kids[3 0 R]>>endobj 3 0 obj<</Type/Page/MediaBox[0 0 595 842]/Parent 2 0 R>>endobj\ntrailer<</Root 1 0 R>>\n' + '%'.repeat(200000)], 'テスト資料' + ('0' + i).slice(-2) + '.pdf', { type: 'application/pdf' });
        }
        await xUpload(kind, leaves[i % leaves.length], [file]);
        while (badgeUp > 6) await new Promise(r => setTimeout(r, 300));
      }
    }
    return 'done';
  }
};

      try {
        const b = writeBatch(db);
        const g = $('g').value;
        b.update(doc(db, 'users', uid), { name: $('n').value.trim(), isMaster: $('m').checked, canAddSite: $('ca').checked, group: g, home: (g === 'マルトク' || g === 'NAFA') ? g : 'エクスケア' });
        list.forEach(s => {
          const on = P.querySelector('[data-s="' + s.id + '"]').checked, role = P.querySelector('[data-r="' + s.id + '"]').value;
          const members = (s.members || []).filter(x => x !== uid), roles = { ...(s.roles || {}) };
          delete roles[uid];
          if (on) { members.push(uid); roles[uid] = role; }
          const managers = (s.managers || []).filter(x => x !== uid);
          if (on && role === '現場管理者') managers.push(uid);
          if (on !== ((s.members || []).indexOf(uid) !== -1) || (on && (s.roles || {})[uid] !== role)) b.update(doc(db, 'sites', s.id), { members, roles, managers });
        });
        await b.commit();
        showUsers('保存しました。');
      } catch (e) { $('err').textContent = '保存できませんでした：' + e.message; }
    };
    $('pass').onclick = async () => {
      $('err').textContent = '変更しています…';
      try { await admin('setPassword', { email: uid, password: $('p').value }); $('p').value = ''; $('err').textContent = 'パスワードを変えました。'; }
      catch (e) { $('err').textContent = e.message; }
    };
    if ($('del')) $('del').onclick = async () => {
      if (!confirm((d.name || uid) + ' を削除します。よろしいですか？')) return;
      $('err').textContent = '削除しています…';
      try {
        await admin('delete', { email: uid });
        const b = writeBatch(db);
        list.forEach(s => {
          if ((s.members || []).indexOf(uid) === -1) return;
          const roles = { ...(s.roles || {}) }; delete roles[uid];
          b.update(doc(db, 'sites', s.id), { members: s.members.filter(x => x !== uid), roles, managers: (s.managers || []).filter(x => x !== uid) });
        });
        b.delete(doc(db, 'users', uid));
        await b.commit();
        showUsers('削除しました。');
      } catch (e) { $('err').textContent = e.message; }
    };
  } catch (e) { $('panelSettings').innerHTML = banner('読み込めませんでした：' + e.message, true); }
}
</script>
</body>
</html>
