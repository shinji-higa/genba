  const d = await fetch(PORTAL_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'admin', idToken, action, data }) }).then(r => r.json());
  if (!d || !d.ok) throw new Error((d && d.m) || 'サーバーでエラーが発生しました。');
  return d.v;
}

const AUTH_MSG = { 'auth/invalid-credential': 'メールアドレスかパスワードが違います。', 'auth/wrong-password': 'メールアドレスかパスワードが違います。', 'auth/user-not-found': 'メールアドレスかパスワードが違います。', 'auth/too-many-requests': '回数が多すぎます。少し待ってからもう一度お試しください。', 'auth/invalid-email': 'メールアドレスの形が正しくありません。' };

onAuthStateChanged(auth, async user => {
  stopWatch();
  if (!user) { me = null; nStop(); document.querySelector('.app-container').classList.remove('has-footer'); $('userBox').style.display = 'none'; showLogin(); return; }
  $('userBox').style.display = 'flex';
  $('userEmail').textContent = user.uid;
  // 表示を待たせないよう、権限は端末の控えで先に判断して一覧を出す
  const key = 'portalMe:' + user.uid;
  let c = {};
  try { c = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
  me = { uid: user.uid, name: c.name || '', group: c.group || '', isMaster: c.isMaster === true, canAddSite: c.canAddSite === true, canDaily: c.canDaily === true, isSenior: c.isSenior === true };
  $('admin').style.display = '';
  showList();
  nStart();
  setTimeout(upPump, 1500);
  setTimeout(pushRefresh, 2500);
  try {
    const d = await getDoc(doc(db, 'users', user.uid));
    const x = d.exists() ? d.data() : {};
    const isMaster = x.isMaster === true, canAddSite = isMaster || x.canAddSite === true;
    const canDaily = isMaster || x.canDaily === true, isSenior = x.isSenior === true, moved = canDaily !== me.canDaily || isSenior !== me.isSenior;
    me.name = x.name || ''; me.group = x.group || ''; me.canDaily = canDaily; me.isSenior = isSenior;
    localStorage.setItem(key, JSON.stringify({ isMaster, canAddSite, canDaily, isSenior, name: me.name, group: me.group }));
    if (isMaster !== me.isMaster || canAddSite !== me.canAddSite || moved) {
      me.isMaster = isMaster; me.canAddSite = canAddSite;
      showList(); nStart();
    }
  } catch (e) {}
});

/* ---------- 写真・資料（見た目と操作は今の現場管理と同じ） ----------
   ファイルの情報と小さな見本画像は Firestore、本体は Google ドライブ。
   一覧は Firestore から出すので、ドライブを待たない。追加は先に一覧へ出して、本体は裏で送る */
const RELOAD_ICON = '';
let X = null, xUnsub = [];
function xStop() { xUnsub.forEach(f => f()); xUnsub = []; X = null; cmPanels = {}; const o = $('cmOverlay'); if (o) o.remove(); }
const xLabel = k => k === 'doc' ? '資料' : '写真';
const xSub = name => collection(db, 'sites', X.s.id, name);
const xFolders = () => X.folders.filter(f => f.kind === X.kind && !f.deleted);
const xFiles = () => X.files.filter(f => f.kind === X.kind && !f.deleted);
const xMayRemove = it => me.isMaster || isManagerOf(X.s) || (me.canAddSite && it.by === me.uid);
const xDate = t => { const d = new Date(t || 0); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate(); };

function xEnsure(s, kind) {
  if (!X || X.s.id !== s.id) {
    xStop();
    const t = performance.now();
    X = { s, kind, folders: [], files: [], reports: [], active: { photo: '', doc: '' }, mode: { photo: 'grid', doc: 'textonly' }, sort: 'newest', selMode: false, sel: new Set(), selF: new Set(), rCat: '全て表示', rMode: 'textonly', rEdit: '' };
    let shown = isOffline();   // 電波なしで開いたときは、電波が戻るまでの時間を数えない
    const draw = snap => {
      if (!shown && !snap.metadata.fromCache) { shown = true; $('speed').textContent = '表示：' + sec(t); }
      if ($('xRoot')) xRender();
      if ($('rRoot')) rList();
    };
    xUnsub.push(onSnapshot(xSub('folders'), { includeMetadataChanges: true }, q => { if (!X) return; X.folders = q.docs.map(d => ({ id: d.id, ...d.data() })); draw(q); }));
    xUnsub.push(onSnapshot(xSub('files'), { includeMetadataChanges: true }, q => { if (!X) return; X.files = q.docs.map(d => ({ id: d.id, ...d.data() })); draw(q); }));
    xUnsub.push(onSnapshot(xSub('reports'), { includeMetadataChanges: true }, q => { if (!X) return; X.reports = q.docs.map(d => ({ id: d.id, ...d.data() })); draw(q); }));
    xUnsub.push(onSnapshot(xSub('comments'), q => { if (!X) return; X.comments = q.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => !c.deleted).sort((a, b) => (a.at || 0) - (b.at || 0)); cmRefresh(); }));
    getDoc(doc(xSub('reads'), me.uid)).then(d => { if (X && d.exists()) { X.reads = { ...(d.data().marks || {}), ...X.reads }; cmRefresh(); } }).catch(() => {});
    cmPeopleLoad();
  }
  X.s = s;
}

/* ---------- コメント（報告・写真・資料ごと。今の現場管理と同じ作り）----------
   報告はカードの下に埋め込み、写真・資料は画面の下からチャットが開く。自分は右、他の人は左。

      staff('現場代理人', 'agent') + staff('現場担当者1', 'siteStaff1') + staff('現場担当者2', 'siteStaff2') + '</div>' +
    '<div class="info-card"><div class="card-header-row"><span style="font-weight: 700;">⚠️ 施工ルール・注意事項</span></div>' + ruleFields(v, false) + '</div>' +
    '<div class="info-card"><div class="card-header-row"><span style="font-weight: 700;">📷 外観画像</span></div>' + pic(1) + pic(2) +
      '<div class="form-group"><label>備考</label><textarea id="f_notes" class="auto-expand" placeholder="補足事項等">' + esc(v.notes) + '</textarea></div></div>' +
    '<div style="margin-top: 16px; margin-bottom: 30px; display: flex; flex-direction: column; gap: 8px;">' +
      '<button type="button" id="save" class="btn btn-dark">' + (isNew ? 'この内容で現場を登録' : 'この内容で現場情報を編集する') + '</button>' +
      '<button type="button" id="cancelForm" class="btn btn-sub">キャンセルして戻る</button><div id="err" style="font-size:0.85rem;"></div></div>';
  autoGrow($('panelNewSite'));
  $('panelNewSite').querySelectorAll('[data-clear]').forEach(b => { b.onclick = () => { $(b.dataset.clear).value = ''; }; });
  $('cancelForm').onclick = () => backTo();
  const pics = {};
  let shrinking = 0;
  [1, 2].forEach(n => {
    const clear = () => { $('fImg' + n).value = ''; $('fImgP' + n).src = ''; $('fImgW' + n).style.display = 'none'; $('fImgI' + n).innerHTML = exist(n); delete pics[n]; };
    $('fImgB' + n).onclick = () => $('fImg' + n).click();
    $('fImgC' + n).onclick = clear;
    $('fImg' + n).onchange = async () => {
      const f = $('fImg' + n).files[0];
      if (!f) return;
      $('fImgI' + n).textContent = '写真を圧縮しています...';
      shrinking++;
      const p = await xPrepare(f, 'photo');
      shrinking--;
      const blob = new Blob([Uint8Array.from(atob(p.data), c => c.charCodeAt(0))], { type: p.mime });
      pics[n] = { ...p, blob };
      $('fImgP' + n).src = 'data:' + p.mime + ';base64,' + p.data;
      $('fImgW' + n).style.display = 'block';
      $('fImgI' + n).textContent = '送信サイズ ' + Math.round(blob.size / 1024) + 'KB';
    };
  });
  // 写真は端末に貯めてから送る（電波がなくても消えない）。現場の情報には先に見本画像を入れ、送り終えたら本物に替わる
  const picData = () => {
    const d = {};
    Object.keys(pics).forEach(n => { d['imageUrl' + n] = ''; d['imagePath' + n] = ''; d['imageThumb' + n] = pics[n].thumb; d['imageAt' + n] = Date.now(); d['imageByName' + n] = me.name || me.uid; });
    return d;
  };
  const picSend = async siteId => {
    for (const n of Object.keys(pics)) {
      const id = doc(collection(db, 'sites')).id, p = pics[n];
      await upTx('readwrite', q => q.put({ id, siteId, slot: Number(n), name: p.name.replace(/[\/#?\[\]*]/g, '_'), mime: p.mime, blob: p.blob, t: Date.now() }));
    }
    upPump();
  };
  $('save').onclick = async () => {
    if (shrinking) { $('err').textContent = '写真を圧縮しています。少し待ってからもう一度押してください。'; return; }
    const data = { ...readRules() };
    data.siteName = $('f_siteName').value.trim();
    if (!data.siteName) { $('err').textContent = '現場名を入れてください。'; return; }
    if (allSites.some(o => o.siteName === data.siteName && (!s || o.id !== s.id))) { $('err').textContent = '同じ名前の現場があります。'; return; }
    data.flow = $('f_flow').value;
    data.startDate = toJp($('f_start').value); data.endDate = toJp($('f_end').value);
    TEXTS.forEach(k => { data[k] = $('f_' + k).value.trim(); });
    data.workContent = $('f_workContent').value; data.notes = $('f_notes').value;
    if (isNew) {
      const ref = doc(collection(db, 'sites'));
      fire(setDoc(ref, { ...data, imageUrl1: '', imageUrl2: '', ...picData(), order: Date.now(), members: [me.uid], roles: { [me.uid]: '現場管理者' }, managers: [me.uid] }), data.siteName);
      picSend(ref.id);
      showDetail(ref.id);
    } else {
      fire(updateDoc(doc(db, 'sites', s.id), { ...data, ...picData() }), data.siteName);
      picSend(s.id);
      notify({ ...s, ...data }, 'site', Object.keys(pics).length ? '現場情報を編集（外観画像を変更）' : '現場情報を編集');
      showDetail(s.id);
    }
  };
  if ($('delSite')) $('delSite').onclick = () => {
    if (!confirm('「' + s.siteName + '」を削除します。よろしいですか？')) return;
    const b = writeBatch(db), { id, ...rest } = s;
    b.set(doc(db, 'endedSites', s.id), { ...rest, endedAt: Date.now(), endedBy: me.uid });
    b.delete(doc(db, 'sites', s.id));
    notify(s, 'site', '現場を削除しました（現場終了）');
    fire(b.commit(), s.siteName + 'の削除');
    showList();
  };
}

/* ---------- 注文（角ダクト注文・丸ダクト注文）----------
   画面は今の現場管理と同じ denpyo.html・maru.html を、押したときだけ枠（iframe）で開く。
   画面からは window.parent.denpyoHost / maruHost を呼ぶ。今の現場管理のサーバーの代わりに、ここで Firestore と Cloud Storage へ保存する。
   電波がなくても入力できる（ユーザー指示 2026-10-31。工場へ提出だけは電波が要る）。伝票は端末（portal-offline）に貯め、電波が戻ったら送る。
   送るときに、ほかの人が先に直していたら上書きせず、別の伝票として残す
   1枚の中身は sites/{id}/orderBody、一覧に出す情報は sites/{id}/orders、記録は sites/{id}/orderLog */
const O_KIND = {
  kaku: { host: 'denpyoHost', src: 'denpyo.html?v=1', title: '角ダクト注文', word: '伝票', log: '角ダクト', fn: 'Denpyo' },
  maru: { host: 'maruHost', src: 'maru.html?v=1', title: '丸ダクト注文', word: '注文書', log: '丸ダクト', fn: 'Maru' }
};
function oOpen(s) {
  const btn = (k, ic, t, sub) => '<button type="button" class="order-btn' + (k ? ' on' : '') + '"' + (k ? ' data-o="' + k + '"' : ' disabled') + '><span class="order-ic">' + ic + '</span><span class="order-t">' + t + '</span><span class="order-s">' + sub + '</span></button>';
  $('oRoot').innerHTML = '<div class="order-grid">' + btn('maru', '◯', '丸ダクト注文', '注文書の入力') + btn('kaku', '▢', '角ダクト注文', '製作伝票の入力') + btn('', '🧰', '消耗品注文', '準備中') + btn('', '🔩', '金物注文', '準備中') + '</div>';
  $('oRoot').querySelectorAll('[data-o]').forEach(b => { b.onclick = () => oShow(s, b.dataset.o); });
  // 電波が切れても一覧・会社の情報・ダクト仕様が出るように、電波のあるうちに読んで端末に控える
  if (!isOffline()) {
    getDocs(collection(db, 'sites', s.id, 'orders')).catch(() => {});
    getDocs(collection(db, 'companies')).catch(() => {});
    getDocs(collection(db, 'ductSpecs')).catch(() => {});
  }
}
function oShow(s, k) {
  const K = O_KIND[k];
  let ov = $('denpyoOverlay');
  if (!ov) { ov = document.createElement('div'); ov.id = 'denpyoOverlay'; document.body.appendChild(ov); }
  window[K.host] = oHost(s, k);
  ov.innerHTML = '<iframe class="denpyo-frame" title="' + K.title + '" src="' + K.src + '"></iframe>';
  ov.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function oClose() {
  const ov = $('denpyoOverlay');
  if (ov) { ov.classList.remove('open'); ov.innerHTML = ''; }
  document.body.style.overflow = '';
}
const oDataUrl = b => new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ng(r.error); r.readAsDataURL(b); });
/* 読む：電波があれば新しいものを、無いか3秒待っても来なければ端末の控えを出す */
const oRead = (net, cache) => isOffline() ? cache() : Promise.race([net(), new Promise((_, ng) => setTimeout(() => ng({ code: 'timeout' }), 3000))]).catch(e => { if (e && e.code === 'permission-denied') throw e; return cache(); });
function oLog(siteId, k, action, no, rev, url) {
  fire(setDoc(doc(collection(db, 'sites', siteId, 'orderLog')), { at: Date.now(), by: me.uid, byName: me.name || me.uid, kind: O_KIND[k].log, no: String(no || ''), rev: Number(rev) || 0, action, url: url || '' }), '注文ログ');
}
const oMeta = (k, slip, now) => ({ kind: k, sid: slip.id || '', no: String(slip.no || ''), room: String(slip.room || ''), n: (slip.items || []).length, status: String(slip.status || ''), rev: Number(slip.rev) || 0, updated: now, by: me.uid, byName: me.name || me.uid });
/** サーバーへ保存。ほかの人が base より後に保存していたら断る */
async function oSave(siteId, k, id, json, base) {
  const K = O_KIND[k], slip = JSON.parse(json), now = Date.now(), meta = oMeta(k, slip, now), ref = doc(db, 'sites', siteId, 'orders', id), body = doc(db, 'sites', siteId, 'orderBody', id);
  let made = false;
  await runTransaction(db, async t => {
    const c = await t.get(ref);
    if (!c.exists()) { made = true; t.set(ref, { ...meta, createdBy: me.uid, createdAt: now, deleted: false }); }
    else {
      const m = c.data();
      if (base && m.updated && m.updated !== base && m.by !== me.uid) throw { conflict: true, message: (m.byName || 'ほかの人') + 'さんが先にこの' + K.word + 'を保存しました。' + K.word + '一覧から開き直してください。' };
      t.update(ref, meta);
    }
    t.set(body, { json });
  });
  if (made) oLog(siteId, k, '作成', slip.no, 0);
  return { fileId: id, updated: now };
}
/** 貯めておいた伝票を送る（upPump から呼ばれる） */
async function oSendJob(j) {
  const done = async () => { const cur = await upTx('readonly', s => s.get(j.id)); if (cur && cur.n === j.n) await upTx('readwrite', s => s.delete(j.id)); };
  try { await oSave(j.siteId, j.k, j.oid, j.json, j.base); await done(); }
  catch (e) {
    if (e && e.conflict) {
      const slip = JSON.parse(j.json), id = doc(collection(db, 'sites', j.siteId, 'orders')).id;
      slip.id = id; slip.no = (slip.no ? slip.no + '-' : '') + '電波なし分';
      try { await oSave(j.siteId, j.k, id, JSON.stringify(slip), 0); await done(); fail(j.name, 'ほかの人が先に直していたため、「' + slip.no + '」という別の' + O_KIND[j.k].word + 'として残しました'); } catch (e2) { window.portalLastError = e2 && e2.code; }
    } else if (e && e.code === 'permission-denied') { await done(); fail(j.name, '権限がありません'); }
    else window.portalLastError = e && e.code;
  }
}
function oHost(s, k) {
  const K = O_KIND[k], col = n => collection(db, 'sites', s.id, n), log = (a, no, rev, url) => oLog(s.id, k, a, no, rev, url);
  const jobKey = id => 'o' + id, job = id => upTx('readonly', q => q.get(jobKey(id)));
  const NO_NET = '電波がないため開けません。電波のある所で一度開くと、次からは電波がなくても見られます。';
  const fns = {
    async getOrdererInfo() {
      const u = await oRead(() => getDoc(doc(db, 'users', me.uid)), () => getDocFromCache(doc(db, 'users', me.uid))).catch(() => null);
      const x = (u && u.data()) || {}, home = me.group === 'マルトク' || me.group === 'NAFA' ? me.group : 'エクスケア', c = doc(db, 'companies', home);
      const co = await oRead(() => getDoc(c), () => getDocFromCache(c)).catch(() => null);
      return { orderer: { name: me.name, mobile: x.mobile || '', google: x.google || '', group: home, company: co && co.exists() ? co.data() : { name: '', addr: '', tel: '', fax: '', logo: '', addrs: [] } } };
    },
    async getDuctSpecs() {
      const c = collection(db, 'ductSpecs');
      return { list: (await oRead(() => getDocs(c), () => getDocsFromCache(c))).docs.map(d => d.data()) };
    },
    async saveDuctSpec(json) {
      const x = JSON.parse(json || '{}'), name = String(x.name || '').trim();
      if (!name) throw new Error('題名を入れてください。');
      fire(setDoc(doc(db, 'ductSpecs', encodeURIComponent(name)), { name, spec: x.spec || {}, up: !!x.up, updated: Date.now(), by: me.uid }), 'ダクト仕様');
      return fns.getDuctSpecs();
    },
    // 写真は端末に貯めて、番号（置き場）だけ先に返す。電波が戻ったら送る
    async uploadDenpyoPhoto(site, dataUrl) {
      const path = 'sites/' + s.id + '/orderPhotos/' + doc(col('orders')).id + '.jpg', blob = await (await fetch(dataUrl)).blob();
      await upTx('readwrite', q => q.put({ id: path, rawPath: path, siteId: s.id, name: K.word + 'の写真', mime: blob.type || 'image/jpeg', blob, t: Date.now() }));
      upPump();
      return { id: path };
    },
    async getDenpyoPhotos(site, ids) {
      const photos = {};
      await Promise.all((ids || []).slice(0, 60).map(async id => {
        try {
          const j = await upTx('readonly', q => q.get(id));
          if (j && j.blob) { photos[id] = await oDataUrl(j.blob); return; }
          const key = 'portalUrl:' + id;
          let url = localStorage.getItem(key);
          if (!url) { url = await getDownloadURL(stRef(storage, id)); localStorage.setItem(key, url); }
          photos[id] = await oDataUrl(await (await fetch(url)).blob());
        } catch (e) {}
      }));
      return { photos };
    },
    async getDenpyoFolders() {
      if (isOffline()) throw new Error('工場へ提出は、電波のある所で行ってください。入力した内容は保存されています。');
      const fs = (await getDocs(col('folders'))).docs.map(d => ({ id: d.id, ...d.data() })).filter(f => f.kind === 'doc' && !f.deleted);
      const pathOf = f => { const p = [f.name]; let c = f; while (c.parent && (c = fs.find(x => x.id === c.parent))) p.unshift(c.name); return p.join(' / '); };
      return { folders: fs.map(f => ({ id: f.id, path: pathOf(f) })).sort((a, b) => a.path.localeCompare(b.path, 'ja')), rootName: '資料' };
    },
    async ['list' + K.fn]() {
      const q = query(col('orders'), where('kind', '==', k));
      const list = (await oRead(() => getDocs(q), () => getDocsFromCache(q))).docs.map(d => ({ id: d.id, ...d.data() })).filter(m => !m.deleted);
      (await upTx('readonly', o => o.getAll())).filter(j => j.order && j.siteId === s.id && j.k === k).forEach(j => {
        const i = list.findIndex(m => m.id === j.oid), m = { id: j.oid, createdBy: me.uid, ...(i >= 0 ? list[i] : {}), ...j.meta };
        if (i >= 0) list[i] = m; else list.push(m);
      });
      list.forEach(m => { m.canDelete = me.isMaster || isManagerOf(s) || me.canAddSite || m.createdBy === me.uid; });
      return { list: list.sort((a, b) => (b.updated || 0) - (a.updated || 0)) };
    },
    async ['get' + K.fn](site, id) {
      const j = await job(id);
      if (j) return { fileId: id, updated: j.base, slip: JSON.parse(j.json) };
      const m0 = doc(col('orders'), id), b0 = doc(col('orderBody'), id);
      const [m, b] = await oRead(() => Promise.all([getDoc(m0), getDoc(b0)]), () => Promise.all([getDocFromCache(m0), getDocFromCache(b0)])).catch(e => { if (e && e.code === 'permission-denied') throw e; throw new Error(NO_NET); });
      if (!m.exists() || !b.exists() || m.data().deleted) throw new Error('この現場の' + K.word + 'ではありません。');
      return { fileId: id, updated: m.data().updated || 0, slip: JSON.parse(b.data().json) };
    },
    async ['save' + K.fn](site, id, json, base) {
      if (new Blob([json]).size > 1000000) throw new Error(K.word + 'が大きすぎて保存できません。');
      const fid = id || doc(col('orders')).id, now = Date.now(), old = await job(fid), b = old ? old.base : (base || 0);
      const keep = async () => {
        const slip = JSON.parse(json);
        await upTx('readwrite', q => q.put({ id: jobKey(fid), order: true, siteId: s.id, oid: fid, k, name: K.word + (slip.no ? '（NO.' + slip.no + '）' : ''), json, base: b, meta: oMeta(k, slip, now), n: now, t: old ? old.t : now }));
        upPump();
        return { fileId: fid, updated: b };
      };
      if (isOffline()) return keep();
      try {
        const r = await Promise.race([oSave(s.id, k, fid, json, b), new Promise((_, ng) => setTimeout(() => ng({ code: 'timeout' }), 5000))]);
        if (old) await upTx('readwrite', q => q.delete(jobKey(fid)));
        return r;
      } catch (e) {
        if ((e && e.conflict) || (e && e.code === 'permission-denied')) throw e;
        return keep();   // 電波が弱くて送れないときも、端末に貯めて入力を続けられるように
      }
    },
    async ['delete' + K.fn](site, id) {
      const ref = doc(col('orders'), id), c = await oRead(() => getDoc(ref), () => getDocFromCache(ref)).catch(() => null), j = await job(id);
      const m = (c && c.data()) || (j && j.meta) || {};
      if (j) await upTx('readwrite', q => q.delete(jobKey(id)));
      if (c && c.exists()) fire(updateDoc(ref, { deleted: true, deletedAt: Date.now(), updated: Date.now(), by: me.uid, byName: me.name || me.uid }), K.word + 'の削除');
      log('削除（' + K.word + '）', m.no, 0);
      return { message: K.word + (m.no ? '（NO.' + m.no + '）' : '') + 'を削除しました。' };
    },
    async ['log' + K.fn](site, action, no, rev) { log(action, no, rev); return {}; },
    /* 工場へ提出：PDF を資料の選んだフォルダへ。前の版は削除の印を付ける（今の現場管理の削除フォルダと同じ扱い） */
    async ['save' + K.fn + 'Pdf'](site, dir, newName, b64, fileName, replaceId, rev, no) {
      if (isOffline()) throw new Error('工場へ提出は、電波のある所で行ってください。');
      let fid = dir, folder = '';
      const fs = (await getDocs(col('folders'))).docs.map(d => ({ id: d.id, ...d.data() })).filter(f => f.kind === 'doc' && !f.deleted);
      if (newName) {
        const hit = fs.find(f => !f.parent && f.name === newName);
        if (hit) fid = hit.id;
        else { const ref = doc(col('folders')); await setDoc(ref, { kind: 'doc', name: newName, parent: '', at: Date.now(), by: me.uid, deleted: false }); fid = ref.id; }
        folder = newName;
      } else folder = (fs.find(f => f.id === fid) || {}).name || '';
      if (!fid) throw new Error('保存先フォルダを選んでください。');
      const used = (await getDocs(query(col('files'), where('folder', '==', fid)))).docs.map(d => d.data()).filter(f => !f.deleted).map(f => f.name);
      const base = String(fileName || K.title).replace(/[\\/:*?"<>|#\[\]]/g, '').replace(/\.pdf$/i, '');
      let name = base + '.pdf';
      for (let n = 2; used.includes(name); n++) name = base + n + '.pdf';
      const blob = new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], { type: 'application/pdf' }), ref = doc(col('files')), path = 'sites/' + s.id + '/' + ref.id + '/' + name, r = stRef(storage, path);
      await uploadBytesResumable(r, blob, { contentType: 'application/pdf' });
      const url = await getDownloadURL(r);
      await setDoc(ref, { kind: 'doc', folder: fid, name, mime: 'application/pdf', size: blob.size, thumb: '', by: me.uid, byName: me.name || me.uid, at: Date.now(), driveId: '', url, path, uploading: false, deleted: false, comment: '', orderPdf: true });
      let old = '';
      if (replaceId) {
        try {
          const o = doc(col('files'), replaceId), d = await getDoc(o);
          if (d.exists() && !d.data().deleted) { await updateDoc(o, { deleted: true }); old = d.data().name; }
        } catch (e) {}
      }
      log('提出' + (old ? '（前の版のPDFを置き換え）' : ''), no, rev, url);
      notify(s, 'doc', '「' + folder + '」に資料を追加：' + name);
      return { message: '「' + name + '」を保存しました。' + (old ? '\n前の版（' + old + '）は削除しました。' : ''), url, pdfId: ref.id, folderId: fid };
    }
  };
  return {
    site: s.siteName, userName: me.name || '',
    call: (fn, args) => (async () => {
      if (!fns[fn]) throw new Error('この操作はまだ使えません（' + fn + '）。');
      return fns[fn](...(args || []));
    })().catch(e => { throw e && e.conflict ? e : { message: e && e.code === 'permission-denied' ? '権限がありません。' : (e && e.message) || String(e) }; }),
    confirm: msg => Promise.resolve(window.confirm(msg)),
    close: oClose
  };
}

/* ---------- 日報（今の現場管理と同じ。本人が1日ずつ入力。電波なしでも保存できる）----------
   daily/{本人}/days/{yyyyMMdd}。計算：8:00〜12:00・13:00〜17:00 の8時間。超えた分が時間外、足りない分が早退（平日のみ）。夜勤は休憩なし
   給与への受け渡しはまだ。受け渡すときは出勤・退勤の時刻から計算し直す */
const pad2 = n => ('0' + n).slice(-2);

const STD_HOURS = 8;
const holCache = {};
let companyDays = {};   // 会社休日（meta/companyDays の days。{ 'yyyy/MM/dd': { type, name } }）
function jpHolidays(year) {
  if (holCache[year]) return holCache[year];
  const key = dt => dsOf(dt), base = {};
  const add = (m, d, name) => { base[year + '/' + pad2(m) + '/' + pad2(d)] = name; };
  const nthMonday = (m, n) => { const dow = new Date(year, m - 1, 1).getDay(); return 1 + ((8 - dow) % 7) + (n - 1) * 7; };
  const eq = c => Math.floor(c + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
  add(1, 1, '元日'); add(1, nthMonday(1, 2), '成人の日'); add(2, 11, '建国記念の日'); add(2, 23, '天皇誕生日');
  add(3, eq(20.8431), '春分の日'); add(4, 29, '昭和の日'); add(5, 3, '憲法記念日'); add(5, 4, 'みどりの日'); add(5, 5, 'こどもの日');
  add(7, nthMonday(7, 3), '海の日'); add(8, 11, '山の日'); add(9, nthMonday(9, 3), '敬老の日'); add(9, eq(23.2488), '秋分の日');
  add(10, nthMonday(10, 2), 'スポーツの日'); add(11, 3, '文化の日'); add(11, 23, '勤労感謝の日');
  const out = { ...base };
  for (let dt = new Date(year, 0, 2); dt.getFullYear() === year; dt.setDate(dt.getDate() + 1)) {   // 国民の休日：祝日にはさまれた平日
    const k = key(dt);
    if (base[k] || dt.getDay() === 0) continue;
    const p = new Date(dt), n = new Date(dt); p.setDate(dt.getDate() - 1); n.setDate(dt.getDate() + 1);
    if (base[key(p)] && base[key(n)]) out[k] = '国民の休日';
  }
  Object.keys(base).sort().forEach(k => {   // 振替休日：日曜の祝日の後の、最初の祝日でない日
    const a = k.split('/').map(Number), dt = new Date(a[0], a[1] - 1, a[2]);
    if (dt.getDay() !== 0) return;
    const n = new Date(dt);
    do { n.setDate(n.getDate() + 1); } while (out[key(n)]);

}
function dayType(ds) {
  const p = ds.split('/').map(Number), dow = new Date(p[0], p[1] - 1, p[2]).getDay(), c = companyDays[ds];

  if (c && (c.type === '所定休日' || c.type === '法定休日')) return { date: ds, day: p[2], type: c.type, name: c.name || '', dow };
  const hn = jpHolidays(p[0])[ds];
  if (dow === 0 || hn) return { date: ds, day: p[2], type: '法定休日', name: hn || '', dow };

function payCalc(kubun, start, end, night, type) {
  const r = { brk: 0, hours: 0, ot: 0, early: 0, night: 0 };
  if (kubun !== '出勤') return r;
  const s = Number(start);
  let e = Number(end);
  if (e <= s) e += 24;
  r.brk = night ? 0 : (s <= 12 && e >= 13 ? 1 : 0);
  r.hours = Math.max(0, e - s - r.brk);
  r.ot = Math.max(0, r.hours - STD_HOURS);

}

/* ---------- 体調チェック（今の現場管理と同じ）----------
   health/{yyyyMMdd:本人}。対象は 60歳以上（users の isSenior）とマスター。入力は今日の分だけ（同じ日は書き換え、確認済みは外れる）。

const H_RULE = { stopSys: 180, stopDia: 110, lowSys: 90, warnSys: 160, warnDia: 100, pulseLow: 50, pulseHigh: 100 };

  { k: 'breakfast', label: '朝食', opts: ['食べた', '食べていない'] }, { k: 'alcohol', label: '前日の飲酒', opts: ['なし', '適量', '多め'] },
  { k: 'medicine', label: 'いつもの薬', opts: ['飲んだ', '飲み忘れ', '服薬なし'] },
  { k: 'fatigue', label: '前日の疲れ', opts: ['残っていない', '少し残っている', 'かなり残っている'], summer: true }, { k: 'urine', label: '尿の色', opts: ['薄い', '普通', '濃い'], summer: true }
];
const H_SYM = ['頭痛', 'めまい', '動悸', '胸の痛み', '息苦しさ', '発熱', 'だるさ', '吐き気', '腰や関節の痛み'], H_SYM_STOP = ['胸の痛み', '息苦しさ'];

const hBp = r => r.sys + '/' + r.dia + (r.pulse !== '' && r.pulse != null ? ' · 脈拍 ' + r.pulse : '');
const hDate = ds => { const p = ds.split('/').map(Number); return p[1] + '月' + p[2] + '日(' + DOW[new Date(p[0], p[1] - 1, p[2]).getDay()] + ')'; };

function hJudge(h, summer) {
  const R = H_RULE, stop = [], warn = [], bp = h.sys + '/' + h.dia;

  if (h.pulse !== '') { if (h.pulse < R.pulseLow) warn.push('脈拍が少ない（' + h.pulse + '）'); else if (h.pulse > R.pulseHigh) warn.push('脈拍が多い（' + h.pulse + '）'); }

const VAPID = 'BB9VwflcuXR7PK0wAwMc4_b8_jFHLsPCgNNv2sxtsgBRMd2JKTtj5mkA--u3s-2w4TAkRzWt_O-rTZDatVg4MdM';

  $('nBox').innerHTML = html;
  $('nBox').querySelectorAll('[data-n]').forEach(c => { c.onclick = () => nRead(c.dataset.n); });
  $('nBox').querySelectorAll('[data-open]').forEach(b => {
    b.onclick = e => { e.stopPropagation(); nRead(b.closest('[data-n]').dataset.n); if (b.dataset.open) showDetail(b.dataset.open); else hOpen(); };
  });
  if ($('nMore')) $('nMore').onclick = () => { nLimit += 30; nRender(); };
}

/* ヘッダーの高さを測って、タブが止まる位置にする（タブが上下に動かないように） */
(() => {
  const h = document.querySelector('header'), set = () => { if (h.offsetHeight) document.documentElement.style.setProperty('--hdrH', h.offsetHeight + 'px'); };
  set();
  if (window.ResizeObserver) new ResizeObserver(set).observe(h); else window.addEventListener('resize', set);
})();

/* ---------- マスター用の管理 ---------- */
$('admin').onclick = setOpen;
async function showUsers(note) {
  stopWatch();
  show('panelSettings', '人の管理', showList);
  $('speed').textContent = '';
  $('panelSettings').innerHTML = '<div class="info-card" style="text-align:center; color:var(--muted);">読み込んでいます…</div>';
  try {
    const snap = await getDocs(collection(db, 'users'));
    const us = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.isMaster === true) - (a.isMaster === true) || a.id.localeCompare(b.id));
    $('panelSettings').innerHTML = (note ? banner(note) : '') +
      '<button type="button" id="add" class="btn btn-dark" style="margin-bottom: 12px;">＋ 人を追加</button>' +
      us.map(u => '<button type="button" class="site-card-btn" data-id="' + esc(u.id) + '"><div style="font-size:1.02rem; font-weight:700;">' + esc(u.name || u.id) + (u.isMaster ? '（マスター）' : '') + '</div><div style="font-size:0.8rem; color:var(--muted);">' + esc(u.id) + '</div></button>').join('');
    $('add').onclick = showAddUser;
    $('panelSettings').querySelectorAll('.site-card-btn').forEach(b => { b.onclick = () => showUser(b.dataset.id); });
  } catch (e) { $('panelSettings').innerHTML = banner('読み込めませんでした：' + e.message, true); }
}
function showAddUser() {
  show('panelSettings', '人を追加', () => showUsers(), '← 戻る');
  $('panelSettings').innerHTML = '<div class="info-card">' +
    '<div class="form-group"><label>名前</label><input type="text" id="n"></div>' +
    '<div class="form-group"><label>メールアドレス（ログインIDになります）</label><input type="text" id="e" inputmode="email"></div>' +
    '<div class="form-group"><label>最初のパスワード（6文字以上）</label><input type="text" id="p" autocomplete="off"></div>' +
    '<label class="check-row"><input id="m" type="checkbox">マスターにする</label>' +
    '<button type="button" id="save" class="btn btn-dark" style="margin-top: 14px;">追加する</button><div id="err" style="margin-top: 8px; font-size:0.85rem;"></div></div>';
  $('save').onclick = async () => {
    const email = $('e').value.trim().toLowerCase(), name = $('n').value.trim();
    if (!name || !email) { $('err').textContent = '名前とメールアドレスを入れてください。'; return; }
    $('save').disabled = true; $('err').textContent = '追加しています…';
    try {
      await admin('create', { email, password: $('p').value });
      await setDoc(doc(db, 'users', email), { name, isMaster: $('m').checked, group: '', home: 'エクスケア' });
      showUser(email, '追加しました。担当現場を選んで保存してください。');
    } catch (e) { $('save').disabled = false; $('err').textContent = e.message; }
  };
}
async function showUser(uid, note) {
  show('panelSettings', '人の設定', () => showUsers(), '← 戻る');
  $('panelSettings').innerHTML = '<div class="info-card" style="text-align:center; color:var(--muted);">読み込んでいます…</div>';
  try {
    const [u, sites] = await Promise.all([getDoc(doc(db, 'users', uid)), getDocs(collection(db, 'sites'))]);
    const d = u.data() || {};
    const list = sites.docs.map(s => ({ id: s.id, ...s.data() })).sort((a, b) => a.order - b.order);
    const P = $('panelSettings');
    P.innerHTML = (note ? banner(note) : '') + '<div class="info-card">' +
      '<div style="font-size:0.8rem; color:var(--muted); margin-bottom: 8px;">' + esc(uid) + '</div>' +
      '<div class="form-group"><label>名前</label><input type="text" id="n" value="' + esc(d.name) + '"></div>' +
      '<label class="check-row"><input id="m" type="checkbox"' + (d.isMaster ? ' checked' : '') + (uid === me.uid ? ' disabled' : '') + '>マスター</label>' +
      '<label class="check-row" style="margin-top: 8px;"><input id="ca" type="checkbox"' + (d.canAddSite ? ' checked' : '') + '>新規現場追加者</label>' +
      '<label class="check-row" style="margin-top: 8px;"><input id="cd" type="checkbox"' + (d.canDaily ? ' checked' : '') + '>日報</label>' +
      '<label class="check-row" style="margin-top: 8px;"><input id="sn" type="checkbox"' + (d.isSenior ? ' checked' : '') + '>60歳以上</label>' +
      '<div class="form-group" style="margin-top: 10px;"><label>携帯番号（伝票・注文書の注文者の欄に出ます）</label><input type="tel" id="mb" value="' + esc(d.mobile) + '" placeholder="例: 090-1234-5678"></div>' +
      '<div class="form-group" style="margin-top: 10px;"><label>グループ</label><select id="g">' + ['', 'エクスケア社員', 'エクスケア', 'マルトク', 'NAFA'].map(g => '<option value="' + g + '"' + ((d.group || '') === g ? ' selected' : '') + '>' + (g || '（空欄：エクスケアとして扱う）') + '</option>').join('') + '</select></div></div>' +
      '<div class="info-card"><div class="card-header-row"><span style="font-weight: 700;">担当現場</span></div>' + list.map(s => {
        const role = (s.roles || {})[uid], on = (s.members || []).indexOf(uid) !== -1;
        return '<div class="site-row"><label class="check-row"><input type="checkbox" data-s="' + esc(s.id) + '"' + (on ? ' checked' : '') + '>' + esc(s.siteName) + '</label>' +
          '<select data-r="' + esc(s.id) + '">' + opts(ROLES, role) + '</select></div>';
      }).join('') + '<button type="button" id="save" class="btn btn-dark" style="margin-top: 14px;">保存する</button></div>' +
      '<div class="info-card"><div class="form-group"><label>新しいパスワード（6文字以上）</label><input type="text" id="p" autocomplete="off"></div>' +
      '<button type="button" id="pass" class="btn btn-outline">パスワードを変える</button>' +
      (uid === me.uid ? '' : '<button type="button" id="del" class="btn btn-sub" style="margin-top: 10px; width: 100%;">この人を削除</button>') + '</div><div id="err" style="font-size:0.85rem;"></div>';
    $('save').onclick = async () => {
      $('err').textContent = '保存しています…';
      try {
        const b = writeBatch(db);
        const g = $('g').value;
        b.update(doc(db, 'users', uid), { name: $('n').value.trim(), isMaster: $('m').checked, canAddSite: $('ca').checked, canDaily: $('cd').checked, isSenior: $('sn').checked, mobile: $('mb').value.trim(), group: g, home: (g === 'マルトク' || g === 'NAFA') ? g : 'エクスケア' });
        list.forEach(s => {
          const on = P.querySelector('[data-s="' + s.id + '"]').checked, role = P.querySelector('[data-r="' + s.id + '"]').value;
          const members = (s.members || []).filter(x => x !== uid), roles = { ...(s.roles || {}) };
          delete roles[uid];
          if (on) { members.push(uid); roles[uid] = role; }
          const managers = (s.managers || []).filter(x => x !== uid);
          if (on && role === '現場管理者') managers.push(uid);
          if (on !== ((s.members || []).indexOf(uid) !== -1) || (on && (s.roles || {})[uid] !== role)) b.update(doc(db, 'sites', s.id), { members, roles, managers });
        });
        await b.commit();
        showUsers('保存しました。');
      } catch (e) { $('err').textContent = '保存できませんでした：' + e.message; }
    };
    $('pass').onclick = async () => {
      $('err').textContent = '変更しています…';
      try { await admin('setPassword', { email: uid, password: $('p').value }); $('p').value = ''; $('err').textContent = 'パスワードを変えました。'; }
      catch (e) { $('err').textContent = e.message; }
    };
    if ($('del')) $('del').onclick = async () => {
      if (!confirm((d.name || uid) + ' を削除します。よろしいですか？')) return;
      $('err').textContent = '削除しています…';
      try {
        await admin('delete', { email: uid });
        const b = writeBatch(db);
        list.forEach(s => {
          if ((s.members || []).indexOf(uid) === -1) return;
          const roles = { ...(s.roles || {}) }; delete roles[uid];
          b.update(doc(db, 'sites', s.id), { members: s.members.filter(x => x !== uid), roles, managers: (s.managers || []).filter(x => x !== uid) });
        });
        b.delete(doc(db, 'users', uid));
        await b.commit();
        showUsers('削除しました。');
      } catch (e) { $('err').textContent = e.message; }
    };
  } catch (e) { $('panelSettings').innerHTML = banner('読み込めませんでした：' + e.message, true); }
}
</script>
