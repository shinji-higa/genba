    /* iPhone の日付欄は幅の指定を受け付けず枠からはみ出す（2026-11-02 比嘉さんの報告）。iPhone だけに効かせる */

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, collection, query, where, doc, getDoc, getDocs, getDocFromCache, getDocsFromCache, setDoc, updateDoc, writeBatch, onSnapshot, disableNetwork, enableNetwork, deleteDoc, deleteField, orderBy, limit, waitForPendingWrites, runTransaction } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

import { getStorage, ref as stRef, uploadBytesResumable, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

/* 現場管理ポータル（試作）：ログインと保存はポータルの中。写真・資料のファイルは Cloud Storage（東京）。
   2026-10-31 より前に入れたテスト用の600個だけ Google ドライブにある（url が無く driveId がある） */
const T0 = performance.now();
const app = initializeApp({
  apiKey: 'AIzaSyDVR4p4DO4s9h70uPlXUVlhNcMP9-YkQ5Q',
  authDomain: 'genba-portal-9077b.firebaseapp.com',
  projectId: 'genba-portal-9077b',
  appId: '1:1005411376335:web:0129ce73c9988973e56bba',
  storageBucket: 'genba-portal-9077b.firebasestorage.app',
  messagingSenderId: '1005411376335'
});
const storage = getStorage(app);
storage.maxUploadRetryTime = 60000;   // 電波が切れたら1分で一度あきらめ、端末に貯めたまま後で送り直す
const auth = getAuth(app);
auth.languageCode = 'ja';   // パスワード再設定のメールと画面を日本語にする
// 端末の控え（電波なしでも見られる）は1つのタブだけが持つ。2つ目からのタブは、開いている間だけの控えでサーバーと直接やりとりする。
// 前は全部のタブで控えを分け合っていて、サーバーとやりとりするタブが裏にあると、ほかのタブに最新が届くまで約28秒待っていた（2026-11-05 確認）
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }) });
const APP_VER = 'Ver.20261109-03';

/* ---------- 電波なしでも使う（今の現場管理と同じ考え方） ----------
   ・保存は押した瞬間に完了の形。電波が戻ったら自動で送る（データは Firestore が端末に貯める）
   ・写真・資料は端末（IndexedDB）に貯めて、電波が戻ったら Cloud Storage へ送る。画面を閉じても消えない
   ・iPhone は裏で送り続けられないので、ポータルを開いているときに送る */
let fireN = 0, netDown = navigator.onLine === false, badgeUp = 0, badgeEl = null;
let failures = [];
try { failures = JSON.parse(localStorage.getItem('portalFailures') || '[]') || []; } catch (e) {}
function fail(label, msg) {
  failures.push({ label, msg, t: Date.now() });
  try { localStorage.setItem('portalFailures', JSON.stringify(failures)); } catch (e) {}
  badge();
}
/* 確認・入力・知らせは、ブラウザの小窓（alert/confirm/prompt）ではなく画面の中に出す（2026-11-05 運用テスト No.7）
   uiAsk(文, { input: 初めの文字 | undefined, ok, cancel(null で1つだけ) }) → OK で true（入力ありは文字）、やめると false（入力ありは null） */
function uiAsk(msg, o) {
  o = o || {};
  return new Promise(done => {
    const back = document.createElement('div'), hasIn = o.input !== undefined, prev = document.activeElement;
    back.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;';
    back.innerHTML = '<div role="dialog" aria-modal="true" style="background:#fff;color:#111;border:1px solid #333;border-radius:8px;max-width:440px;width:100%;padding:18px 16px 14px;box-shadow:0 6px 24px rgba(0,0,0,.35);font:15px/1.6 -apple-system,BlinkMacSystemFont,\'Hiragino Sans\',Meiryo,sans-serif;">' +
      '<div class="ua-msg" style="white-space:pre-wrap;font-weight:700;margin-bottom:12px;word-break:break-word;"></div>' +
      (hasIn ? '<input type="text" class="ua-in" style="width:100%;box-sizing:border-box;font-size:16px;padding:10px;border:1px solid #555;border-radius:4px;margin-bottom:12px;">' : '') +
      '<div style="display:flex;gap:8px;justify-content:flex-end;">' +
      (o.cancel === null ? '' : '<button type="button" class="btn btn-sub ua-no" style="width:auto;padding:8px 18px;">' + esc(o.cancel || 'やめる') + '</button>') +
      '<button type="button" class="btn btn-dark ua-ok" style="width:auto;padding:8px 22px;">' + esc(o.ok || 'OK') + '</button></div></div>';
    back.querySelector('.ua-msg').textContent = msg;
    const inp = back.querySelector('.ua-in');
    if (inp) inp.value = o.input || '';
    const end = v => { back.remove(); document.removeEventListener('keydown', key, true); try { prev && prev.focus && prev.focus(); } catch (e) {} done(v); };
    const yes = () => end(hasIn ? inp.value : true), no = () => end(hasIn ? null : false);
    const key = e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); no(); } else if (e.key === 'Enter' && (inp ? document.activeElement === inp : true)) { e.preventDefault(); e.stopPropagation(); yes(); } };
    back.querySelector('.ua-ok').onclick = yes;
    if (back.querySelector('.ua-no')) back.querySelector('.ua-no').onclick = no;
    back.onclick = e => { if (e.target === back && o.cancel !== null) no(); };
    document.addEventListener('keydown', key, true);
    document.body.appendChild(back);
    (inp || back.querySelector('.ua-ok')).focus();
    if (inp) inp.select();
  });
}
const uiConfirm = (msg, ok) => uiAsk(msg, { ok: ok || 'OK' });
const uiPrompt = (msg, def) => uiAsk(msg, { input: def || '' });
const uiAlert = msg => uiAsk(msg, { cancel: null });
/** 保存を始めて、結果を待たずに進む。断られたときだけ一覧に残す */
function fire(p, label) {
  fireN++; badge();
  return p.catch(e => { fail(label, (e && e.code) === 'permission-denied' ? '権限がありません' : '送れませんでした'); })
    .finally(() => { fireN--; badge(); });
}
function badge() {
  if (!document.body) return;
  if (!badgeEl) {
    badgeEl = document.createElement('button');
    badgeEl.type = 'button'; badgeEl.id = 'offlineBadge';
    badgeEl.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:3500;border:0;border-radius:18px;padding:8px 14px;font:700 13px -apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
    badgeEl.onclick = showPending;
    document.body.appendChild(badgeEl);
  }
  const n = fireN + badgeUp, txt = [];
  if (netDown) txt.push('電波なし');
  if (n) txt.push('未送信 ' + n + '件');
  if (failures.length) txt.push('送れなかったもの ' + failures.length + '件');
  badgeEl.style.display = txt.length ? 'block' : 'none';
  badgeEl.style.background = failures.length ? '#c62828' : (n ? '#b35c00' : '#444');
  badgeEl.textContent = txt.join('・') + (txt.length ? '（押すと詳しく）' : '');
}
function showPending() {
  const bg = document.createElement('div');
  bg.style.cssText = 'position:fixed;inset:0;z-index:3600;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;';
  bg.innerHTML = '<div class="info-card" style="max-width:420px;width:100%;max-height:80vh;overflow:auto;margin:0;">' +
    (netDown ? '<p style="margin:0 0 10px;"><b>電波がありません。</b><br>前に見た内容を表示しています。最新ではないことがあります。</p>' : '') +
    '<p style="margin:0 0 10px;font-weight:700;">未送信（電波が戻ったら自動で送ります）：' + (fireN + badgeUp) + '件</p>' +
    (failures.length ? '<p style="margin:0 0 6px;font-weight:700;color:#c62828;">送れなかったもの：' + failures.length + '件</p><ul style="margin:0 0 10px 18px;padding:0;color:#c62828;">' +
      failures.map(f => '<li>' + esc(f.label) + '：' + esc(f.msg) + '</li>').join('') + '</ul>' : '') +
    '<div style="display:flex;gap:8px;">' + (failures.length ? '<button type="button" data-a="clear" class="btn btn-sub" style="flex:1;">確認した</button>' : '') +
    '<button type="button" data-a="close" class="btn btn-sub" style="flex:1;">閉じる</button></div>' +
    '<p style="margin:10px 0 0;font-size:11px;color:#666;text-align:right;">' + APP_VER + '</p></div>';
  bg.onclick = e => {
    const a = e.target.getAttribute && e.target.getAttribute('data-a');
    if (e.target === bg || a === 'close') bg.remove();
    else if (a === 'clear') { failures = []; localStorage.removeItem('portalFailures'); badge(); bg.remove(); }
  };
  document.body.appendChild(bg);
}
window.addEventListener('online', () => { netDown = false; badge(); upPump(); });
window.addEventListener('offline', () => { netDown = true; badge(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) upPump(); });
setInterval(() => upPump(), 30000);

/* 新しい版の知らせ。iPhone のホーム画面アプリは裏に残って続きから出るので、開き直しを待たず、
   表に出たときと10分ごとに公開中の版番号を確かめる。押すと端末の控えを入れ替えて開き直す */
async function refreshShell() {
  if (!window.caches) return;
  const c = await caches.open('portal-shell-v1');
  await Promise.all(['./', 'app.css', 'i18n.js', 'denpyo.html', 'maru.html', 'cons.html', 'kana.html', 'hood.html', 'kanagu.html'].map(async u => {
    try { const r = await fetch(u + '?check=' + Date.now(), { cache: 'no-store' }); if (r.ok) await c.put(u, r); } catch (e) {}
  }));
}
function showUpdate() {

function idb() {
  return new Promise((ok, ng) => {
    const r = indexedDB.open('portal-offline', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('up', { keyPath: 'id' });
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ng(r.error);
  });
}

  const d = await idb();
  return new Promise((ok, ng) => {
    const q = fn(d.transaction('up', mode).objectStore('up'));
    q.onsuccess = () => ok(q.result);
    q.onerror = () => ng(q.error);
  });
}
const upRun = new Set();

  if (navigator.onLine === false || window.portalTestOffline) return;
  list.sort((a, b) => a.t - b.t);

    if (upRun.size >= 3) break;
    if (upRun.has(j.id)) continue;
    upRun.add(j.id);
    upOne(j).finally(() => { upRun.delete(j.id); upPump(); });
  }
}

    }

  const t = performance.now(), ext = !!j.slot, file = ext ? doc(db, 'sites', j.siteId) : doc(db, 'sites', j.siteId, 'files', j.id), path = 'sites/' + j.siteId + '/' + (ext ? 'exterior/' : '') + j.id + '/' + j.name, r = stRef(storage, path);

  }

   マスターは現場管理者も付けられる。現場管理者は一般作業員まで。マスター本人と自分は一覧に出さない。
   エクスケア社員とマスターは全員、ほかの人は同じグループの人だけ見える（ルールでも断る） */
let sSite = null, sPeople = [], sPending = {};
async function sOpen(s) {
  sSite = s; sPending = {};
  $('sRoot').innerHTML = '<div style="margin-bottom: 12px;"><button type="button" id="sSave" class="btn btn-dark">編集を完了</button></div><div id="sBox" style="display: flex; flex-direction: column; gap: 8px;"><div class="info-card" style="text-align: center; color: var(--muted);">担当者一覧を読み込んでいます...</div></div>';
  $('sSave').onclick = sSubmit;
  try {
    const c = collection(db, 'users'), seeAll = me.isMaster || me.group === 'エクスケア社員';
    const q = seeAll ? c : query(c, where('home', '==', (me.group === 'マルトク' || me.group === 'NAFA') ? me.group : 'エクスケア'));
    const snap = await getDocs(q);
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // 今この現場にいる、ほかの会社の人も出す（現場管理者は会社に関係なく、自分の現場の担当者を外せる。ルールは users の mgrs）
    const have = new Set(list.map(u => u.id)), more = (s.members || []).filter(id => !have.has(id) && id !== me.uid);
    const got = await Promise.allSettled(more.map(id => getDoc(doc(db, 'users', id))));
    got.forEach((g, i) => { if (g.status === 'fulfilled' && g.value.exists()) list.push({ id: more[i], ...g.value.data() }); else list.push({ id: more[i], name: more[i] }); });
    sPeople = list.filter(u => !u.isMaster && u.id !== me.uid).sort((a, b) => String(a.name).localeCompare(String(b.name), 'ja'));
    sList();
  } catch (e) { if ($('sBox')) $('sBox').innerHTML = banner('読み込めませんでした（電波がないか、権限がありません）。', true); }
}
const sHome = u => (u.group === 'マルトク' || u.group === 'NAFA') ? u.group : 'エクスケア';   // 会社（エクスケア社員とエクスケアは同じ）
function sList() {
  const box = $('sBox');
  if (!box) return;
  if (!sPeople.length) { box.innerHTML = '<div class="info-card" style="text-align:center; color:var(--muted);">登録者が存在しません。</div>'; return; }
  const roles = sSite.roles || {};
  box.innerHTML = sPeople.map(u => {
    const base = roles[u.id] || '担当なし', cur = sPending[u.id] !== undefined ? sPending[u.id] : base;
    const color = cur === '現場管理者' ? 'background:#111111; color:#ffffff;' : cur === '一般作業員' ? 'background:#e8f0fe; color:#1967d2;' : 'background:#f0f0f2; color:#333;';
    const sel = '<select class="action-control-select" data-u="' + esc(u.id) + '" style="height:32px; font-size:0.8rem;">' + opts(me.isMaster ? ['担当なし', '一般作業員', '現場管理者'] : ['担当なし', '一般作業員'], cur) + '</select>';
    return '<div class="info-card" style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; margin-bottom:0;"><div style="overflow:hidden; padding-right:8px;"><div style="font-weight:700; font-size:0.92rem; display:flex; align-items:center;"><span>' + esc(u.name || u.id) + '</span>' + (sHome(u) !== sHome(me) ? '<span style="font-size:0.72rem; font-weight:400; color:#555; margin-left:6px;">（' + esc(sHome(u)) + '）</span>' : '') + '<span style="font-size:0.7rem; font-weight:700; padding:2px 6px; border-radius:3px; margin-left:6px; ' + color + '">' + esc(cur) + '</span>' + (cur !== base ? '<span style="font-size:0.74rem; color:#b06000; font-weight:700; margin-left:4px;">[変更中]</span>' : '') + '</div><div style="font-size:0.75rem; color:var(--muted); margin-top:2px;">' + esc(u.id) + '</div></div><div style="flex-shrink:0;">' +
      (!me.isMaster && base === '現場管理者' ? '<span style="font-size:0.8rem; font-weight:700; padding:4px 8px; background:#eee; border-radius:4px;">現場管理者</span>' : sel) + '</div></div>';
  }).join('');
  box.querySelectorAll('select').forEach(e => { e.onchange = () => { sPending[e.dataset.u] = e.value; sList(); }; });
}
function sSubmit() {
  const ids = Object.keys(sPending).filter(k => sPending[k] !== ((sSite.roles || {})[k] || '担当なし'));
  if (!ids.length) { uiAlert('変更された権限はありません。'); return; }
  const roles = { ...(sSite.roles || {}) };
  let members = (sSite.members || []).slice(), managers = (sSite.managers || []).slice();
  ids.forEach(u => {
    const r = sPending[u];
    members = members.filter(x => x !== u); managers = managers.filter(x => x !== u); delete roles[u];
    if (r !== '担当なし') { members.push(u); roles[u] = r; if (r === '現場管理者') managers.push(u); }
  });
  const data = { members, roles };
  if (me.isMaster) data.managers = managers;
  // 決まりで、1回の保存で足せるのは8人まで（マスターとエクスケア社員は別）。9人以上は8人ずつ順に保存する（書き込みは出した順に届く）
  const before = sSite.members || [], added = members.filter(x => !before.includes(x));
  if (!me.isMaster && me.group !== 'エクスケア社員' && added.length > 8) {
    for (let k = 8; k < added.length; k += 8) {
      const later = added.slice(k), part = { members: members.filter(x => !later.includes(x)), roles: { ...roles } };
      later.forEach(x => { delete part.roles[x]; });
      fire(updateDoc(doc(db, 'sites', sSite.id), part), '担当の変更');
    }
  }
  fire(updateDoc(doc(db, 'sites', sSite.id), data), '担当の変更');
  sSite = { ...sSite, ...data }; sPending = {};
  sList();
}

/* ---------- 日付のカレンダー（ユーザー指示 2026-11-02）----------
   ブラウザ標準のカレンダーは文字の色を変えられず、画面の写しにも写らず、他を押すと閉じる。自前のものに替える。土曜は青、日曜・祝日は赤。
   注文の画面（枠の中）にも同じものを出す。開いたまま不具合修正ボタンを押せば、カレンダーごと写る */
const DP_CSS = `
.dp-overlay { position: fixed; inset: 0; z-index: 9600; background: rgba(17,17,17,0.45); display: flex; align-items: center; justify-content: center; }
.dp-sheet { background: #fff; width: 100%; max-width: 420px; border-radius: 14px; padding: 12px; box-sizing: border-box; font-family: inherit; }
.dp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.dp-nav { flex-shrink: 0; width: 44px; height: 44px; border: 1px solid #8d9298; border-radius: 50%; background: #fff; font-size: 1.4rem; line-height: 1; cursor: pointer; color: #111; }
.dp-sel { flex: 1; min-width: 0; text-align: center; font-weight: 700; font-size: 1.05rem; color: #111; }
.dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dp-w { text-align: center; font-size: 0.75rem; font-weight: 700; color: #47566a; padding: 4px 0; }
.dp-d { height: 44px; border: none; border-radius: 50%; background: #f4f5f7; font-size: 1rem; font-weight: 600; color: #111; cursor: pointer; }
.dp-w.sun, .dp-d.sun { color: #c62828; }
.dp-w.sat, .dp-d.sat { color: #1a56c4; }
.dp-d.today { box-shadow: inset 0 0 0 2px #111; }
.dp-d.sel { background: #111; color: #fff; }
.dp-foot { display: flex; gap: 8px; margin-top: 10px; }
.dp-foot button { flex: 1; height: 44px; border: 1px solid #111; border-radius: 6px; background: #fff; color: #111; font: inherit; font-weight: 700; cursor: pointer; }
`;
function dpOpen(input) {
  const d = input.ownerDocument, W = d.defaultView;
  if (d.querySelector('.dp-overlay')) return;
  if (!d.getElementById('dpCss')) { const s = d.createElement('style'); s.id = 'dpCss'; s.textContent = DP_CSS; d.head.appendChild(s); }
  const now = new Date(), m0 = String(input.value).match(/^(\d+)-(\d+)-(\d+)$/);
  let y = m0 ? +m0[1] : now.getFullYear(), m = m0 ? +m0[2] : now.getMonth() + 1;

  const setVal = v => { input.value = v; input.dispatchEvent(new W.Event('input', { bubbles: true })); input.dispatchEvent(new W.Event('change', { bubbles: true })); ov.remove(); };
  const paint = () => {
    const first = new Date(y, m - 1, 1).getDay(), last = new Date(y, m, 0).getDate(), today = dsOf(now);
    let g = ['日', '月', '火', '水', '木', '金', '土'].map((w, i) => '<div class="dp-w' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</div>').join('') + '<div></div>'.repeat(first);
    for (let n = 1; n <= last; n++) {
      const ds = y + '/' + pad2(m) + '/' + pad2(n), iso = ds.replace(/\//g, '-'), t = dayType(ds);
      g += '<button type="button" class="dp-d' + (t.type === '法定休日' ? ' sun' : t.type === '所定休日' ? ' sat' : '') + (ds === today ? ' today' : '') + (iso === input.value ? ' sel' : '') + '" data-iso="' + iso + '"' + (t.name ? ' title="' + esc(t.name) + '"' : '') + '>' + n + '</button>';
    }
    ov.innerHTML = '<div class="dp-sheet"><div class="dp-head"><button type="button" class="dp-nav" data-mv="-1" aria-label="前の月">‹</button><div class="dp-sel">' + y + '年' + m + '月</div><button type="button" class="dp-nav" data-mv="1" aria-label="次の月">›</button></div><div class="dp-grid">' + g + '</div><div class="dp-foot"><button type="button" data-a="today">今日</button><button type="button" data-a="clear">クリア</button><button type="button" data-a="close">閉じる</button></div></div>';
  };
  ov.onclick = e => {
    const t = e.target.closest ? e.target.closest('button') : null;
    if (e.target === ov) { ov.remove(); return; }
    if (!t) return;
    if (t.dataset.mv) { const n = y * 12 + m - 1 + Number(t.dataset.mv); y = Math.floor(n / 12); m = n % 12 + 1; paint(); }
    else if (t.dataset.iso) setVal(t.dataset.iso);
    else if (t.dataset.a === 'today') setVal(dsOf(now).replace(/\//g, '-'));

/* 日付の欄を押したら標準のカレンダーの代わりに開く。欄は増えたり作り直されたりするので、見張って読み取り専用にする */
function dpBind(d) {
  if (!d || d.__dpBound) return;
  d.__dpBound = true;
  // iPhone は readonly の日付欄でも標準の日付選択が開き、自分のカレンダーと二重に出る（2026-11-02 ユーザー報告）。触ると開かないよう、押した瞬間に焦点を外して自分のカレンダーだけ出す
  const lock = () => d.querySelectorAll('input[type="date"]:not([data-dp])').forEach(i => { i.readOnly = true; i.dataset.dp = '1'; i.setAttribute('inputmode', 'none'); });
  lock();
  new d.defaultView.MutationObserver(lock).observe(d.documentElement, { childList: true, subtree: true });
  const isDate = i => i && i.matches && i.matches('input[type="date"]') && !i.disabled;
  d.addEventListener('touchstart', e => { const i = e.target; if (isDate(i)) { e.preventDefault(); i.blur(); dpOpen(i); } }, { capture: true, passive: false });
  d.addEventListener('mousedown', e => { const i = e.target; if (isDate(i)) e.preventDefault(); }, true);
  d.addEventListener('focus', e => { const i = e.target; if (isDate(i)) { i.blur(); if (!d.querySelector('.dp-overlay')) dpOpen(i); } }, true);
  d.addEventListener('click', e => { const i = e.target; if (isDate(i)) { e.preventDefault(); dpOpen(i); } }, true);
  d.addEventListener('keydown', e => { const o = d.querySelector('.dp-overlay'); if (e.key === 'Escape' && o) o.remove(); });
}
dpBind(document);

    '<div class="form-group"><label>会社（グループ） <span class="req">*</span></label><select id="g">' + ['', 'エクスケア社員', 'エクスケア', 'マルトク', 'NAFA'].map(g => '<option value="' + g + '">' + (g || '選んでください') + '</option>').join('') + '</select></div>' +

    '<button type="button" id="save" class="btn btn-dark" style="margin-top: 14px;">追加する</button><div id="err" style="margin-top: 8px; font-size:0.85rem;"></div></div>';
  $('save').onclick = async () => {
    const email = $('e').value.trim().toLowerCase(), name = $('n').value.trim();
    const g = $('g').value;
    if (!name || !email) { $('err').textContent = '名前とアカウントIDを入れてください。'; return; }
    if (!g) { $('err').textContent = '会社（グループ）を選んでください。'; return; }
    $('save').disabled = true; $('err').textContent = '追加しています…';
    try {
      await admin('create', { email, password: $('p').value });
      // ログインはできたあとで人の情報の保存に失敗したときは、もう一度押せば続きから入る（サーバー側で同じメールを受け付ける。2026-11-04 不具合）
      try { await setDoc(doc(db, 'users', email), { name, isMaster: $('m').checked, group: g, home: (g === 'マルトク' || g === 'NAFA') ? g : 'エクスケア' }); }
      catch (e2) { throw new Error('ログインは作れましたが、人の情報を保存できませんでした（' + (e2.message || e2) + '）。もう一度「追加する」を押してください。'); }
      showUser(email, '追加しました。担当現場を選んで保存してください。');
    } catch (e) { $('save').disabled = false; $('err').textContent = e.message; }
  };
}
async function showUser(uid, note) {
  show('panelSettings', '人の設定', () => showUsers(), '← 戻る');
  $('panelSettings').innerHTML = '<div class="info-card" style="text-align:center; color:var(--muted);">読み込んでいます…</div>';
  try {
    const [u, sites] = await Promise.all([getDoc(doc(db, 'users', uid)), getDocs(collection(db, 'sites'))]);
    const d = u.data() || {};
    const list = sites.docs.map(s => ({ id: s.id, ...s.data() })).sort((a, b) => a.order - b.order);
    const P = $('panelSettings');
    P.innerHTML = (note ? banner(note) : '') + '<div class="info-card">' +
      '<div style="font-size:0.8rem; color:var(--muted); margin-bottom: 8px;">' + esc(uid) + '</div>' +
      '<div class="form-group"><label>名前</label><input type="text" id="n" value="' + esc(d.name) + '"></div>' +
      '<label class="check-row"><input id="m" type="checkbox"' + (d.isMaster ? ' checked' : '') + (uid === me.uid ? ' disabled' : '') + '>マスター</label>' +
      '<label class="check-row" style="margin-top: 8px;"><input id="ca" type="checkbox"' + (d.canAddSite ? ' checked' : '') + '>新規現場追加者</label>' +
      '<label class="check-row" style="margin-top: 8px;"><input id="cd" type="checkbox"' + (d.canDaily ? ' checked' : '') + '>日報</label>' +
      '<label class="check-row" style="margin-top: 8px;"><input id="sn" type="checkbox"' + (d.isSenior ? ' checked' : '') + '>60歳以上</label>' +
      '<label class="check-row" style="margin-top: 8px;"><input id="cp" type="checkbox"' + (d.canPayroll ? ' checked' : '') + '>給与管理</label>' +
      '<label class="check-row" style="margin-top: 8px;"><input id="ci" type="checkbox"' + (d.canInvoice ? ' checked' : '') + '>請求管理</label>' +
      '<div class="form-group" style="margin-top: 10px;"><label>携帯番号（伝票・注文書の注文者の欄に出ます）</label><input type="tel" id="mb" value="' + esc(d.mobile) + '" placeholder="例: 090-1234-5678"></div>' +
      '<div class="form-group" style="margin-top: 10px;"><label>グループ</label><select id="g">' + ['', 'エクスケア社員', 'エクスケア', 'マルトク', 'NAFA'].map(g => '<option value="' + g + '"' + ((d.group || '') === g ? ' selected' : '') + '>' + (g || '（空欄：エクスケアとして扱う）') + '</option>').join('') + '</select></div></div>' +
      '<div class="info-card"><div class="card-header-row"><span style="font-weight: 700;">担当現場</span></div>' + list.map(s => {
        const role = (s.roles || {})[uid], on = (s.members || []).indexOf(uid) !== -1;
        return '<div class="site-row"><label class="check-row"><input type="checkbox" data-s="' + esc(s.id) + '"' + (on ? ' checked' : '') + '>' + esc(s.siteName) + '</label>' +
          '<select data-r="' + esc(s.id) + '">' + opts(ROLES, role) + '</select></div>';
      }).join('') + '<button type="button" id="save" class="btn btn-dark" style="margin-top: 14px;">保存する</button></div>' +
      '<div class="info-card"><div class="form-group"><label>新しいパスワード（6文字以上）</label><input type="text" id="p" autocomplete="off"></div>' +
      '<button type="button" id="pass" class="btn btn-outline">パスワードを変える</button>' +
      (uid === me.uid ? '' : '<button type="button" id="del" class="btn btn-sub" style="margin-top: 10px; width: 100%;">この人を削除</button>') + '</div><div id="err" style="font-size:0.85rem;"></div>';
    $('save').onclick = async () => {
      $('err').textContent = '保存しています…';
      try {
        const b = writeBatch(db);
        const g = $('g').value;
        b.update(doc(db, 'users', uid), { name: $('n').value.trim(), isMaster: $('m').checked, canAddSite: $('ca').checked, canDaily: $('cd').checked, isSenior: $('sn').checked, canPayroll: $('cp').checked, canInvoice: $('ci').checked, mobile: $('mb').value.trim(), group: g, home: (g === 'マルトク' || g === 'NAFA') ? g : 'エクスケア' });
        list.forEach(s => {
          const on = P.querySelector('[data-s="' + s.id + '"]').checked, role = P.querySelector('[data-r="' + s.id + '"]').value;
          const members = (s.members || []).filter(x => x !== uid), roles = { ...(s.roles || {}) };
          delete roles[uid];
          if (on) { members.push(uid); roles[uid] = role; }
          const managers = (s.managers || []).filter(x => x !== uid);
          if (on && role === '現場管理者') managers.push(uid);
          if (on !== ((s.members || []).indexOf(uid) !== -1) || (on && (s.roles || {})[uid] !== role)) b.update(doc(db, 'sites', s.id), { members, roles, managers });
        });
        await b.commit();
        showUsers('保存しました。');
      } catch (e) { $('err').textContent = '保存できませんでした：' + e.message; }
    };
    $('pass').onclick = async () => {
      $('err').textContent = '変更しています…';
      try { await admin('setPassword', { email: uid, password: $('p').value }); $('p').value = ''; $('err').textContent = 'パスワードを変えました。'; }
      catch (e) { $('err').textContent = e.message; }
    };
    if ($('del')) $('del').onclick = async () => {
      if (!await uiConfirm((d.name || uid) + ' を削除します。よろしいですか？', '削除')) return;
      $('err').textContent = '削除しています…';
      try {
        await admin('delete', { email: uid });
        const b = writeBatch(db);
        list.forEach(s => {
          if ((s.members || []).indexOf(uid) === -1) return;
          const roles = { ...(s.roles || {}) }; delete roles[uid];
          b.update(doc(db, 'sites', s.id), { members: s.members.filter(x => x !== uid), roles, managers: (s.managers || []).filter(x => x !== uid) });
        });
        b.delete(doc(db, 'users', uid));
        await b.commit();
        showUsers('削除しました。');
      } catch (e) { $('err').textContent = e.message; }
    };
  } catch (e) { $('panelSettings').innerHTML = banner('読み込めませんでした：' + e.message, true); }
}
</script>
<script>
  /* 全角の数字を半角に（数字の欄だけ。ユーザー指示 2026-11-03）。日本語入力の確定のあとにも直す */
  (function () {
    var Z = /[０-９．，－]/;
    function isNum(el) { return el && el.tagName === 'INPUT' && (el.type === 'number' || /^(numeric|decimal)$/.test(el.getAttribute('inputmode') || '')); }
    function fix(el) {
      if (!isNum(el) || !Z.test(el.value)) return false;
      var p = el.selectionStart;
      el.value = el.value.replace(/[０-９．，－]/g, function (c) { return c === '．' ? '.' : c === '，' ? ',' : c === '－' ? '-' : String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
      try { if (p != null) el.setSelectionRange(p, p); } catch (e) {}
      return true;
    }
    document.addEventListener('input', function (e) { if (!e.isComposing) fix(e.target); }, true);
    document.addEventListener('compositionend', function (e) { if (fix(e.target)) e.target.dispatchEvent(new Event('input', { bubbles: true })); }, true);
  })();
</script>
