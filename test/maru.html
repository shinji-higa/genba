<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>丸ダクト注文</title>
  <style>
    /* 丸ダクト注文（スパイラルダクト・継手・フレキの注文書）。2026-10-28 作成
       見た目は角ダクトの製作伝票にそろえる（白黒を基調に、薄い灰色は使わない） */
    :root { --bg: #e8eaed; --text: #111; --muted: #3d3d3d; --border: #9e9e9e; --primary: #111; --err: #b3261e; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif; }
    html, body { height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--text); }
    #app { height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    button { font: inherit; color: inherit; }
    input, select, textarea { min-width: 0; max-width: 100%; }
    .top { position: sticky; top: 0; z-index: 30; background: #fff; border-bottom: 2px solid #111; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
    .top-title { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; border-radius: 4px; border: 1.5px solid var(--primary); cursor: pointer; padding: 9px 14px; background: #fff; white-space: nowrap; }
    .btn-dark { background: var(--primary); color: #fff; }
    .btn-sub { border-color: #6e6e6e; color: #222; font-size: 0.82rem; padding: 7px 10px; }
    .btn-danger { color: var(--err); border-color: #d9a29d; }
    .btn:disabled { background: #8a8a8a; border-color: #8a8a8a; color: #f2f2f2; }
    .layout { display: flex; gap: 16px; padding: 12px; max-width: 1600px; margin: 0 auto; }
    .col-left { width: 100%; max-width: 640px; margin: 0 auto; }
    .col-right { display: none; }
    @media (min-width: 1100px) {
      .col-left { width: 460px; flex-shrink: 0; margin: 0; }
      .col-right { display: block; flex: 1; min-width: 0; position: sticky; top: 58px; align-self: flex-start; max-height: calc(100vh - 72px); overflow: auto; }
      .only-mobile { display: none !important; }
    }
    @media (max-width: 1099px) { .only-desk { display: none !important; } }
    .card { border: 1.5px solid #a3a7ad; border-radius: 8px; background: #eceef1; padding: 12px; margin-bottom: 12px; }
    .card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1.5px solid #a3a7ad; font-weight: 700; font-size: 0.95rem; }
    .fg { margin-bottom: 10px; }
    label, .lbl { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; color: #222; }
    input[type="text"], input[type="date"], input[type="number"], select, textarea { width: 100%; padding: 9px 10px; border: 1.5px solid #8d9298; border-radius: 4px; font-size: 1rem; background: #fff; color: #111; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #111; }
    input::placeholder, textarea::placeholder { color: #6b6b6b; }
    textarea { resize: vertical; min-height: 56px; }
    .g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 7px 12px; border-radius: 16px; border: 1.5px solid #6e6e6e; background: #fff; font-size: 0.85rem; font-weight: 700; color: #222; cursor: pointer; user-select: none; }
    .chip.on { background: #111; border-color: #111; color: #fff; }
    .note { font-size: 0.8rem; color: var(--muted); line-height: 1.6; }
    .errbox { background: #fceded; color: var(--err); border-radius: 4px; padding: 8px 10px; font-size: 0.85rem; font-weight: 700; margin-top: 8px; }
    /* 部材の一覧 */
    .items { display: flex; flex-direction: column; gap: 8px; }
    .item { display: flex; gap: 10px; align-items: center; border: 1.5px solid #9e9e9e; border-radius: 6px; padding: 8px; background: #fff; cursor: pointer; }
    .item-ic { width: 54px; height: 34px; flex-shrink: 0; }
    .item-b { flex: 1; min-width: 0; }
    .item-t { font-weight: 700; font-size: 0.95rem; }
    .item-s { font-size: 0.82rem; color: #333; }
    .item-q { font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
    .empty { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 16px 0; }
    .bottom-bar { position: sticky; bottom: 0; z-index: 25; background: #fff; border-top: 1.5px solid #9e9e9e; padding: 10px 12px; display: flex; gap: 8px; }
    .bottom-bar .btn { flex: 1; min-width: 0; padding: 12px 6px; }
    /* 全画面のシート */
    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 50; display: none; }
    .sheet-bg.open { display: block; }
    .sheet { position: absolute; inset: 0; background: #fff; display: flex; flex-direction: column; }
    @media (min-width: 900px) { .sheet { inset: 4vh auto auto 50%; transform: translateX(-50%); width: min(760px, 94vw); max-height: 92vh; border-radius: 8px; } }
    .sheet-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1.5px solid #9e9e9e; font-weight: 700; }
    .sheet-h .ttl { flex: 1; min-width: 0; }
    .sheet-b { flex: 1; overflow: auto; padding: 12px; background: #eceef1; }
    .sheet-f { display: flex; gap: 8px; padding: 10px 12px; border-top: 1.5px solid #9e9e9e; }
    .sheet-f .btn { flex: 1; padding: 12px; }
    .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .pick { border: 1.5px solid #8d9298; border-radius: 6px; padding: 8px; cursor: pointer; text-align: center; background: #fff; }
    .pick:hover { border-color: #111; }
    .pick svg { width: 100%; height: 56px; }
    .pick-n { font-weight: 700; font-size: 0.9rem; margin-top: 4px; }
    .edfig { background: #fff; border: 1.5px solid #9e9e9e; border-radius: 6px; padding: 6px; margin-bottom: 10px; }
    .edfig svg { width: 100%; height: 110px; display: block; }
    .edbox { border: 1.5px solid #a3a7ad; border-radius: 8px; background: #eceef1; padding: 10px 12px; margin-bottom: 10px; }
    .qty { display: flex; align-items: center; gap: 8px; }
    .qty button { width: 46px; height: 42px; border: 1.5px solid #6e6e6e; border-radius: 6px; background: #fff; font-size: 1.3rem; font-weight: 700; cursor: pointer; }
    .qty input { text-align: center; font-size: 1.15rem; font-weight: 700; }
    .slip-row { display: flex; gap: 10px; align-items: center; border: 1.5px solid #9e9e9e; border-radius: 6px; padding: 10px; margin-bottom: 8px; background: #fff; }
    .slip-row .b { flex: 1; min-width: 0; cursor: pointer; }
    .slip-row .t { font-weight: 700; }
    .slip-row .m { font-size: 0.8rem; color: var(--muted); }
    /* 消耗品を選ぶ画面 */
    .cons-g { margin-bottom: 14px; }
    .cons-gh { font-weight: 700; font-size: 0.9rem; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1.5px solid #a3a7ad; }
    .cons-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
    .cons-p { border: 1.5px solid #8d9298; border-radius: 6px; padding: 8px 10px; background: #fff; font-size: 0.88rem; font-weight: 700; cursor: pointer; text-align: left; }
    .cons-p:hover { border-color: #111; }
    .cons-p small { display: block; font-weight: 400; color: #333; font-size: 0.76rem; margin-top: 2px; }
    .top-close { display: none; }
    .hosted .top-close { display: inline-flex; }
    .toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 0.9rem; z-index: 99; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }

    /* ===== 注文書（A4）===== 製作伝票と同じ書式 */
    .pv-wrap { background: #e9e9ec; padding: 12px; border-radius: 6px; }
    .pv-page { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.2); margin: 0 auto 12px; overflow: hidden; }
    .pv-page > .dp { transform-origin: 0 0; }
    .dp { width: 210mm; height: 297mm; padding: 8mm 9mm 7mm; color: #000; font-family: "MS Mincho", "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 9pt; display: flex; flex-direction: column; background: #fff; }
    .dp .gt { font-family: "Yu Gothic", "Hiragino Sans", Meiryo, sans-serif; }
    .dp-title { display: flex; align-items: flex-end; justify-content: center; position: relative; height: 13mm; }
    .dp-title h1 { font-size: 22pt; font-weight: 400; letter-spacing: 0.3em; }
    .dp-no { position: absolute; right: 0; bottom: 0; font-size: 9pt; text-align: right; line-height: 1.4; }
    .dp-no b { font-size: 12pt; font-weight: 400; }
    .dp-head { display: flex; justify-content: space-between; gap: 6mm; margin-top: 2mm; }
    .dp-lines { width: 50%; }
    .dp-line { display: flex; border-bottom: 1px solid #000; height: 6.4mm; align-items: flex-end; padding-bottom: 0.6mm; gap: 3mm; white-space: nowrap; overflow: hidden; }
    .dp-line .k { width: 15mm; text-decoration: underline; flex-shrink: 0; }
    .dp-line .v { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .dp-co { width: 50%; text-align: right; padding-top: 5mm; font-size: 7.5pt; line-height: 1.5; }
    .dp-co img { height: 6mm; vertical-align: middle; }
    .dp-co .nm { font-size: 9.5pt; font-weight: 700; vertical-align: middle; margin-left: 2mm; }
    .dp table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .dp td, .dp th { border: 1px solid #000; text-align: center; font-weight: 400; height: 6.6mm; padding: 0 1mm; white-space: nowrap; overflow: hidden; }
    .dp-spec { margin-top: 2.5mm; font-size: 8.5pt; }
    .dp-spec td.k { width: 14mm; }
    .dp-spec td.memo { text-align: left; white-space: normal; line-height: 1.25; }
    .dp-sec { margin-top: 3mm; margin-bottom: 1mm; font-size: 9pt; font-weight: 700; }
    .dp-mx th { font-size: 9.5pt; }
    .dp-mx td.sz { font-weight: 700; }
    .dp-mx tr:nth-child(even) td { background: #e6f0f5; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .dp-mx td.q, .dp-br td.q, .dp-fx td.q { font-size: 10.5pt; }
    .dp-br td, .dp-fx td { height: 6.4mm; }
    .dp-cs td { height: 6.4mm; }
    .dp-cs td.l { text-align: left; }
    .dp-foot { font-size: 7.5pt; margin-top: 1.5mm; }
    .dp-cont-head { display: flex; align-items: flex-end; gap: 4mm; border-bottom: 1.5px solid #000; padding-bottom: 1.5mm; }
    .dp-cont-head h1 { font-size: 15pt; font-weight: 400; letter-spacing: 0.15em; white-space: nowrap; }
    .dp-cont-head .site { flex: 1; min-width: 0; font-size: 9pt; white-space: nowrap; overflow: hidden; }
    .dp-cont-head .no { font-size: 9pt; text-align: right; white-space: nowrap; }
    #print-root { display: none; }
    @media print {
      @page { size: A4 portrait; margin: 0; }
      html, body { height: auto; overflow: visible; }
      body { background: #fff; }
      body > *:not(#print-root) { display: none !important; }
      #print-root { display: block; }
      #print-root .dp { page-break-after: always; break-after: page; }
      #print-root .dp:last-child { page-break-after: auto; break-after: auto; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="top">
      <div class="top-title" id="topTitle">丸ダクト注文</div>
      <div class="top-btns">
        <button type="button" class="btn btn-sub top-close" onclick="closeApp()">閉じる</button>
        <button type="button" class="btn btn-sub" onclick="openSlips()">注文書一覧</button>
        <button type="button" class="btn btn-sub" onclick="saveSlip(true)">保存</button>
        <button type="button" class="btn btn-sub only-desk" onclick="printSlip()">印刷</button>
      </div>
    </div>

    <div class="layout">
      <section class="col-left">
        <div class="card">
          <div class="card-h">注文書の情報</div>
          <div class="g2">
            <div class="fg"><label for="fNo">注文書NO</label><input type="text" id="fNo" data-k="no"></div>
            <div class="fg"><label for="fOrderer">注文者</label><input type="text" id="fOrderer" data-k="orderer"></div>
          </div>
          <div class="fg"><label for="fSite">現場名</label><input type="text" id="fSite" data-k="site"></div>
          <div class="fg"><label for="fRoom">室名</label><input type="text" id="fRoom" data-k="room"></div>
          <div class="g2">
            <div class="fg"><label for="fOrderDate">発注日</label><input type="date" id="fOrderDate" data-k="orderDate"></div>
            <div class="fg"><label for="fDelivDate">搬入日</label><input type="date" id="fDelivDate" data-k="delivDate"></div>
          </div>
          <div class="fg"><span class="lbl">搬入先</span><div class="chips" id="cDest"></div></div>
          <div class="fg"><span class="lbl">材質</span><div class="chips" id="cMat"></div></div>
          <div class="fg"><label for="fMemo">Memo（注文書の材質の横に出ます）</label><textarea id="fMemo" data-k="memo" placeholder="例：キャップ＝NIサイズ　金網＝SPサイズ"></textarea></div>
        </div>

        <div class="card">
          <div class="card-h"><span>部材（<span id="itemCount">0</span>件）</span>
            <button type="button" class="btn btn-dark" onclick="openPicker()">＋ 部材を追加</button></div>
          <div class="items" id="items"></div>
        </div>

        <div class="card">
          <div class="card-h"><span>消耗品（<span id="consCount">0</span>件）</span>
            <button type="button" class="btn btn-dark" onclick="openConsPicker()">＋ 消耗品を追加</button></div>
          <div class="items" id="consItems"></div>
        </div>
      </section>
      <section class="col-right"><div class="pv-wrap" id="pvDesk"></div></section>
    </div>

    <div class="bottom-bar only-mobile">
      <button type="button" class="btn" onclick="openPreview()">注文書を見る</button>
      <button type="button" class="btn btn-dark" onclick="openPicker()">＋ 部材を追加</button>
    </div>
  </div>

  <!-- 部材の種類を選ぶ -->
  <div class="sheet-bg" id="pickerBg" onclick="if(event.target===this)closeSheet('pickerBg')">
    <div class="sheet">
      <div class="sheet-h"><span class="ttl">部材の種類を選ぶ</span><button type="button" class="btn btn-sub" onclick="closeSheet('pickerBg')">閉じる</button></div>
      <div class="sheet-b"><div class="pick-grid" id="pickGrid"></div></div>
    </div>
  </div>

  <!-- 部材の入力 -->
  <div class="sheet-bg" id="editorBg">
    <div class="sheet">
      <div class="sheet-h"><span class="ttl" id="edTitle">部材</span><button type="button" class="btn btn-sub" onclick="closeSheet('editorBg')">キャンセル</button></div>
      <div class="sheet-b"><div class="edfig" id="edFig"></div><div id="edForm"></div></div>
      <div class="sheet-f">
        <button type="button" class="btn btn-danger" id="edDel" onclick="deleteItem()" style="flex:0 0 auto;">削除</button>
        <button type="button" class="btn btn-dark" id="edOk" onclick="commitItem()">決定</button>
      </div>
    </div>
  </div>

  <!-- 消耗品を選ぶ -->
  <div class="sheet-bg" id="consPickBg" onclick="if(event.target===this)closeSheet('consPickBg')">
    <div class="sheet">
      <div class="sheet-h"><span class="ttl">消耗品を選ぶ</span><button type="button" class="btn btn-sub" onclick="closeSheet('consPickBg')">閉じる</button>
        <input type="text" id="consFind" placeholder="品名でさがす（例：バンド、アルミ、全ネジ）" oninput="renderConsPick()" style="flex-basis:100%;"></div>
      <div class="sheet-b"><div id="consPick"></div></div>
    </div>
  </div>

  <!-- 消耗品の入力 -->
  <div class="sheet-bg" id="consEdBg">
    <div class="sheet">
      <div class="sheet-h"><span class="ttl" id="ceTitle">消耗品</span><button type="button" class="btn btn-sub" onclick="closeSheet('consEdBg')">キャンセル</button></div>
      <div class="sheet-b"><div id="ceForm"></div></div>
      <div class="sheet-f">
        <button type="button" class="btn btn-danger" id="ceDel" onclick="deleteCons()" style="flex:0 0 auto;">削除</button>
        <button type="button" class="btn btn-dark" id="ceOk" onclick="commitCons()">決定</button>
      </div>
    </div>
  </div>

  <!-- 注文書一覧 -->
  <div class="sheet-bg" id="slipsBg" onclick="if(event.target===this)closeSheet('slipsBg')">
    <div class="sheet">
      <div class="sheet-h"><span class="ttl">注文書一覧</span><button type="button" class="btn btn-sub" onclick="closeSheet('slipsBg')">閉じる</button></div>
      <div class="sheet-b"><button type="button" class="btn btn-dark" onclick="newSlip()" style="width:100%; margin-bottom:12px;">＋ 新しい注文書</button><div id="slipList"></div></div>
    </div>
  </div>

  <!-- 注文書プレビュー（スマホ） -->
  <div class="sheet-bg" id="pvBg">
    <div class="sheet">
      <div class="sheet-h"><span class="ttl">注文書プレビュー</span><button type="button" class="btn btn-sub" onclick="closeSheet('pvBg')">閉じる</button></div>
      <div class="sheet-b" style="background:#e9e9ec;"><div id="pvMobile"></div></div>
      <div class="sheet-f"><button type="button" class="btn btn-sub" onclick="printSlip()">印刷</button></div>
    </div>
  </div>

  <div id="print-root"></div>

    function saveSlip(show) {
      S.updated = Date.now();
      var a = loadStore().filter(function (x) { return x.id !== S.id; });

      writeStore(a.slice(0, 200));

    /* 部材1件の文字（一覧と注文書で使う） */
    function spLen(it) { return it.len === 'L' ? ('L=' + (num(it.lenMm) || '') ) : (it.len || '4') + 'm'; }
    function sizeText(it) {
      var t = TYPES[it.type];
      if (it.type === 't') return 'T-' + it.d1 + '×' + it.d3;
      if (it.type === 'rt') return 'RT-' + it.d1 + '×' + it.d2 + '×' + it.d3;
      if (it.type === 'r') return 'R-' + it.d1 + '×' + it.d2;
      if (t.flex) return 'φ' + it.d1 + '　L' + it.flen + 'm　' + (it.endc ? '端末加工あり' : '端末加工なし');
      if (it.type === 'sp') return 'φ' + it.d1 + '　' + (it.len === 'L' ? '長さ指定 ' + (num(it.lenMm) || '') + 'mm' : '定尺 ' + (it.len || '4') + 'm');

    function itemErrors(it) {
      var e = [];
      if (!(num(it.qty) > 0)) e.push('数を入れてください。');
      if (it.type === 't' && num(it.d3) > num(it.d1)) e.push('③（枝）は①より大きくできません。');
      if (it.type === 'r' && !(num(it.d2) < num(it.d1))) e.push('②は①より小さいサイズにしてください。');
      if (it.type === 'rt') {
        if (!(num(it.d2) < num(it.d1))) e.push('②は①より小さいサイズにしてください。');
        if (num(it.d3) > num(it.d1)) e.push('③（枝）は①より大きくできません。');
      }
      if (it.type === 'sp' && it.len === 'L' && !(num(it.lenMm) > 0)) e.push('長さ（mm）を入れてください。');

    }

    /* ===== 注文書（A4）=====
       案A（ユーザー指示 2026-10-28）：
       ・直管・継手の数：使ったサイズの行だけ。列は SP・90°・45°・NI・NEC・キャップ・金網。SP の長さが 4m 以外なら「SP 2m」などの列を足す
       ・分岐・片落ち：T管・RT管・R管を ①②③・数・書き方（T-200×150 など）で1行ずつ
       ・フレキ：DEC・AC をサイズ・長さ・端末加工・数で1行ずつ
       同じ部材・同じサイズ・同じ長さは数を足して1つにまとめる */
    function spKey(it) { return it.len === 'L' ? 'L' + num(it.lenMm) : (it.len || '4'); }
    function spColName(k) { return k.charAt(0) === 'L' ? 'SP L=' + k.slice(1) : 'SP ' + k + 'm'; }
    function collect() {
      var mx = {}, cols = {}, br = {}, fx = {};
      S.items.forEach(function (it) {
        if (itemErrors(it).length) return;
        var t = TYPES[it.type], q = num(it.qty);
        if (t.br) {
          var k = it.type + '|' + it.d1 + '|' + (it.d2 || '') + '|' + (it.d3 || '');
          if (!br[k]) br[k] = { it: it, q: 0 };
          br[k].q += q;
        } else if (t.flex) {
          var kf = it.type + '|' + it.d1 + '|' + it.flen + '|' + (it.endc ? 1 : 0);
          if (!fx[kf]) fx[kf] = { it: it, q: 0 };
          fx[kf].q += q;
        } else {
          var col = it.type === 'sp' ? 'sp:' + spKey(it) : it.type;
          cols[col] = true;
          mx[it.d1] = mx[it.d1] || {};
          mx[it.d1][col] = (mx[it.d1][col] || 0) + q;
        }
      });
      // SP の列：4m を最初に、そのあと 2m、長さ指定
      var spCols = Object.keys(cols).filter(function (c) { return c.indexOf('sp:') === 0; }).sort(function (a, b) {
        var o = function (c) { return c === 'sp:4' ? 0 : c === 'sp:2' ? 1 : 2 + num(c.slice(4)); };
        return o(a) - o(b);
      });
      var onlyStd4 = !spCols.length || (spCols.length === 1 && spCols[0] === 'sp:4');
      var colList = (onlyStd4 ? [{ k: 'sp:4', h: 'SP' }] : spCols.map(function (c) { return { k: c, h: spColName(c.slice(3)) }; }))
        .concat(MX.slice(1).map(function (t) { return { k: t, h: TYPES[t].col }; }));
      var sizes = Object.keys(mx).map(Number).sort(function (a, b) { return a - b; });
      var brList = Object.keys(br).map(function (k) { return br[k]; }).sort(function (a, b) { return itemSort({ it: a.it }, { it: b.it }); });
      var fxList = Object.keys(fx).map(function (k) { return fx[k]; }).sort(function (a, b) { return itemSort({ it: a.it }, { it: b.it }) || num(a.it.flen) - num(b.it.flen); });
      // 消耗品：入れた順。品名・仕様・単位・メモが同じものは数を足して1行にする
      var cs = {}, csList = [];
      (S.cons || []).forEach(function (x) {
        if (consErrors(x).length) return;
        var k = [consName(x), x.spec, x.unit, x.memo].join('|');
        if (!cs[k]) { cs[k] = { c: x, q: 0 }; csList.push(cs[k]); }
        cs[k].q += num(x.qty);
      });
      return { mx: mx, colList: colList, sizes: sizes, brList: brList, fxList: fxList, csList: csList, onlyStd4: onlyStd4 };
    }
    function headHtml(page, pages) {
      return '<div class="dp-title"><h1>注 文 書</h1><div class="dp-no">（NO, <b>' + esc(S.no || '') + '</b>）<br>ページNo, ⇒ ' + page + '／' + pages + '</div></div>' +
        '<div class="dp-head"><div class="dp-lines">' +
        '<div class="dp-line"><span class="k">現場名</span><span class="v">' + esc(S.site) + '</span></div>' +
        '<div class="dp-line"><span class="k">室名</span><span class="v">' + esc(S.room) + '</span></div>' +
        '<div class="dp-line"><span class="k">発注日</span><span class="v">' + esc(jpDate(S.orderDate)) + '</span></div>' +
        '<div class="dp-line"><span class="k">搬入日</span><span class="v">' + esc(jpDate(S.delivDate)) + '　' + esc(S.dest || '') + '</span></div>' +
        '</div><div class="dp-co"><img src="' + LOGO + '" alt="ExcureDUCT"><br><span class="nm">' + esc(COMPANY.name) + '</span>　注文者 ' + esc(S.orderer || '') +
        '<br>' + esc(COMPANY.addr) + '<br>' + esc(COMPANY.tel) + '</div></div>' +
        '<table class="dp-spec"><tr><td class="k">材質</td><td style="width:32mm">' + esc(S.mat) + '</td><td class="k">板厚</td><td style="width:16mm">標準</td><td class="k">Memo</td><td class="memo">' + esc(S.memo || '') + '</td></tr></table>';
    }
    function contHead(page, pages) {
      return '<div class="dp-cont-head"><h1>注文書（続き）</h1><span class="site">' + esc(S.site) + (S.room ? '　' + esc(S.room) : '') + '</span><span class="no">（NO, ' + esc(S.no || '') + '）　ページNo, ' + page + '／' + pages + '</span></div>';
    }
    function mxTable(c, sizes) {
      return '<table class="dp-mx"><colgroup><col style="width:15mm">' + c.colList.map(function () { return '<col>'; }).join('') + '</colgroup>' +
        '<tr><th></th>' + c.colList.map(function (x) { return '<th>' + esc(x.h) + '</th>'; }).join('') + '</tr>' +
        sizes.map(function (d) {
          return '<tr><td class="sz">' + d + '</td>' + c.colList.map(function (x) { var q = (c.mx[d] || {})[x.k]; return '<td class="q">' + (q ? q : '') + '</td>'; }).join('') + '</tr>';
        }).join('') + '</table>';
    }
    function brTable(list) {
      return '<table class="dp-br"><colgroup><col style="width:20mm"><col><col><col><col style="width:14mm"><col style="width:52mm"></colgroup>' +
        '<tr><th>部材</th><th>①</th><th>②</th><th>③</th><th>数</th><th>書き方</th></tr>' +
        list.map(function (x) {
          var it = x.it;
          var d2 = it.type === 't' ? it.d1 : (it.d2 || '－'), d3 = it.type === 'r' ? '－' : it.d3;
          return '<tr><td>' + esc(TYPES[it.type].name) + '</td><td>' + it.d1 + '</td><td>' + d2 + '</td><td>' + d3 + '</td><td class="q">' + x.q + '</td><td>' + esc(sizeText(it)) + '</td></tr>';
        }).join('') + '</table>';
    }
    function fxTable(list) {
      return '<table class="dp-fx"><colgroup><col><col style="width:22mm"><col style="width:22mm"><col style="width:26mm"><col style="width:14mm"></colgroup>' +
        '<tr><th>部材</th><th>サイズ</th><th>長さ</th><th>端末加工</th><th>数</th></tr>' +
        list.map(function (x) {
          var it = x.it;
          return '<tr><td>' + esc(TYPES[it.type].full) + '</td><td>φ' + it.d1 + '</td><td>' + esc(it.flen) + 'm</td><td>' + (it.endc ? 'あり' : 'なし') + '</td><td class="q">' + x.q + '</td></tr>';
        }).join('') + '</table>';
    }
    function csTable(list) {
      return '<table class="dp-cs"><colgroup><col style="width:62mm"><col><col style="width:14mm"><col style="width:13mm"><col style="width:36mm"></colgroup>' +
        '<tr><th>品名</th><th>仕様・サイズ</th><th>数</th><th>単位</th><th>メモ</th></tr>' +
        list.map(function (x) {
          var c = x.c;
          return '<tr><td class="l">' + esc(consName(c)) + '</td><td class="l">' + esc(c.spec || '') + '</td><td class="q">' + x.q + '</td><td>' + esc(c.unit || '') + '</td><td class="l">' + esc(c.memo || '') + '</td></tr>';
        }).join('') + '</table>';
    }
    // 用紙に入る行数で、表をページに分ける（1行 6.6mm。1枚目は見出しのぶん少ない）
    function buildPages() {
      var c = collect(), blocks = [];
      if (c.sizes.length) blocks.push({ kind: 'mx', rows: c.sizes, title: '■ 直管・継手（数）' + (c.onlyStd4 ? '　SP は定尺 4m' : '') });
      if (c.brList.length) blocks.push({ kind: 'br', rows: c.brList, title: '■ 分岐・片落ち（T管・RT管・R管）' });
      if (c.fxList.length) blocks.push({ kind: 'fx', rows: c.fxList, title: '■ フレキ（DEC・保温付きフレキ AC）' });
      if (c.csList.length) blocks.push({ kind: 'cs', rows: c.csList, title: '■ 消耗品' });
      var FIRST = 34, NEXT = 40;   // 1枚に入る行数のめやす（見出し・表の頭を含む）
      var pages = [[]], left = FIRST;
      blocks.forEach(function (b) {
        var i = 0;
        while (i < b.rows.length) {
          if (left < 4) { pages.push([]); left = NEXT; }
          var n = Math.min(b.rows.length - i, left - 2);
          pages[pages.length - 1].push({ kind: b.kind, rows: b.rows.slice(i, i + n), title: b.title + (i > 0 ? '（続き）' : '') });
          left -= n + 2; i += n;
        }
      });
      var total = pages.length;
      return pages.map(function (blk, pi) {
        var h = pi === 0 ? headHtml(1, total) : contHead(pi + 1, total);
        if (!blk.length && pi === 0) h += '<div class="dp-sec">（部材がまだありません）</div>';
        blk.forEach(function (b) {
          h += '<div class="dp-sec gt">' + esc(b.title) + '</div>';
          if (b.kind === 'mx') h += mxTable(c, b.rows);
          if (b.kind === 'br') h += brTable(b.rows);
          if (b.kind === 'fx') h += fxTable(b.rows);
          if (b.kind === 'cs') h += csTable(b.rows);
        });
        if (pi === total - 1) h += '<div class="dp-foot">※板厚はサイズに応じた標準板厚（φ450以下 0.5・φ710以下 0.6・φ1000以下 0.8）</div>';
        return '<div class="dp">' + h + '</div>';
      });
    }
    function renderPreview() {
      var pages = buildPages();
      ['pvDesk', 'pvMobile'].forEach(function (id) {
        var host = document.getElementById(id);
        if (!host || !host.offsetParent && id === 'pvDesk') { if (host) host.innerHTML = ''; if (id === 'pvDesk') return; }
        var w = Math.max(200, (host.clientWidth || 360) - (id === 'pvDesk' ? 24 : 0));
        var sc = Math.min(1, w / 793.7);
        host.innerHTML = pages.map(function (p) {
          return '<div class="pv-page" style="width:' + (793.7 * sc) + 'px;height:' + (1122.5 * sc) + 'px;"><div style="transform:scale(' + sc + ');transform-origin:0 0;">' + p + '</div></div>';
        }).join('');
      });
    }
    function openPreview() { openSheet('pvBg'); renderPreview(); }
    function printSlip() {
      document.getElementById('print-root').innerHTML = buildPages().join('');
      setTimeout(function () { window.print(); }, 50);
    }

    /* ===== 注文書一覧 ===== */
    function openSlips() {
      saveSlip(false);
      var list = loadStore();
      document.getElementById('slipList').innerHTML = list.length ? list.map(function (x) {
        var d = new Date(x.updated || 0);
        return '<div class="slip-row"><div class="b" onclick="loadSlip(\'' + x.id + '\')"><div class="t">' + esc(x.site || '（現場名なし）') + (x.no ? '　NO.' + esc(x.no) : '') + (x.id === S.id ? '　（開いている注文書）' : '') + '</div>' +
          '<div class="m">' + esc(x.room || '') + '　部材' + (x.items || []).length + '件　更新 ' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2) + '</div></div>' +
          '<button type="button" class="btn btn-sub" onclick="copySlip(\'' + x.id + '\')">複製</button></div>';
      }).join('') : '<div class="empty">保存した注文書はまだありません。</div>';
      openSheet('slipsBg');
    }
    function loadSlip(id) { var x = loadStore().filter(function (s) { return s.id === id; })[0]; if (!x) return; S = x; closeSheet('slipsBg'); renderAll(); }
    function copySlip(id) {
      var x = loadStore().filter(function (s) { return s.id === id; })[0]; if (!x) return;
      S = JSON.parse(JSON.stringify(x)); S.id = uid(); S.no = ''; S.orderDate = today(); S.delivDate = '';
      saveSlip(false); closeSheet('slipsBg'); renderAll(); toast('複製しました');
    }
    function newSlip() { saveSlip(false); S = blankForHost(); closeSheet('slipsBg'); renderAll(); }

    function openSheet(id) { document.getElementById(id).classList.add('open'); }
    function closeSheet(id) { document.getElementById(id).classList.remove('open'); }
    function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 1600); }
    window.addEventListener('resize', function () { renderPreview(); });

    /* 現場管理の中で開いたとき（注文 → 丸ダクト注文）：閉じるボタン、現場名・注文者を入れておく。
       今はまだ試し（テスト画面だけ）で、注文書はこの端末に保存する */
    var HOST = null;
    try { HOST = window.parent !== window && window.parent.maruHost ? window.parent.maruHost : null; } catch (e) { HOST = null; }
    function closeApp() { saveSlip(false); if (HOST) HOST.close(); }
    function blankForHost() { var b = blank(); if (HOST) { b.site = HOST.site || ''; b.orderer = HOST.userName || ''; } return b; }

    (function start() {
      var list = loadStore();
      if (HOST) {
        document.body.classList.add('hosted');
        S = list.filter(function (x) { return x.site === HOST.site; })[0] || blankForHost();
      } else {
        S = list[0] || blank();
      }
      renderAll();
    })();
  </script>
</body>
</html>
