<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, writeBatch, runTransaction } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const APP_VER = 'Ver.20261106-02';
const API = 'https://script.google.com/macros/s/AKfycbzpJgqJOqQz5180PQF2S3kVN7TWg0c1dnyUUUNuCZtzy5_pmKEhAkw5w3gqSj31EEA1/exec';   // Apps Script「請求管理」（ポータル・給与とは別）
/* ログインは給与アプリと同じ（ユーザー指示 2026-11-05）：ポータルの Firebase、メールとパスワード。入れるのはマスターと「請求管理」の権限（users.canInvoice）がある人 */
const app = initializeApp({ apiKey: 'AIzaSyDVR4p4DO4s9h70uPlXUVlhNcMP9-YkQ5Q', authDomain: 'genba-portal-9077b.firebaseapp.com', projectId: 'genba-portal-9077b' });
const auth = getAuth(app), db = getFirestore(app);
/* 試し：パソコンの中（localhost）で ?local を付けたときだけ、ログインせず端末の中のデータで動く（画面と紙の確かめ用。本番の URL では動かない） */
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).has('local');
const SK = window.SK, $ = id => document.getElementById(id), M = $('m');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = n => SK.yen(n);
const plain = o => JSON.parse(JSON.stringify(o, (k, v) => v === undefined ? null : v));
const pad = n => ('0' + n).slice(-2);
const today = () => SK.ymd(new Date());
const nowStr = () => { const d = new Date(); return SK.ymd(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const dJp = s => { const d = SK.parse(s); return d ? d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日' : ''; };
const dShort = s => { const d = SK.parse(s); return d ? d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) : ''; };
const wareki = s => { const d = SK.parse(s); return d ? '令和' + (d.getFullYear() - 2018) + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日' : ''; };
const num = v => { const x = String(v == null ? '' : v).replace(/[０-９．－]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[,，\s円¥￥]/g, ''); return x === '' ? null : Number(x); };
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function busy(t) { const b = $('busy'); if (t) { b.innerHTML = '<span>' + esc(t) + '</span>'; b.style.display = 'flex'; } else b.style.display = 'none'; }

/* 確かめる欄・知らせる欄（ブラウザの小窓は使わない。給与と同じ） */
function okBox(msg, okLabel, noCancel) {
  return new Promise(done => {
    const w = document.createElement('div'); w.id = 'ask';
    const bad = /できません|できなかった|失敗|エラー|権限|切れ|ありません|ください|使っています|まだです|大きすぎ|けたの数字/.test(String(msg)) && !/^保存しました/.test(String(msg));   // うまくいかなかった知らせは赤い枠
    w.innerHTML = '<div class="card' + (bad ? ' err' : '') + '"><div class="q" style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;">' + esc(msg) + '</div><div class="row" style="margin-top:14px;"><span class="sp"></span>' + (noCancel ? '' : '<button class="b" data-k="n">やめる</button>') + '<button class="b dark" data-k="y">' + esc(okLabel || 'はい') + '</button></div></div>';
    document.body.appendChild(w);
    const end = v => { w.remove(); done(v); };
    w.querySelector('[data-k="y"]').onclick = () => end(true);
    if (!noCancel) w.querySelector('[data-k="n"]').onclick = () => end(false);
    w.querySelector('[data-k="y"]').focus();
  });
}
const alert = m => { okBox(String(m), 'OK', true); };
/* 入力欄つきの小さな画面。fields は [{ k, label, type, value, opts }]。OK で値のまとまり、やめたら null */
function formBox(title, fields, okLabel) {
  return new Promise(done => {
    const w = document.createElement('div'); w.id = 'ask';
    w.innerHTML = '<div class="card"><h2>' + esc(title) + '</h2>' + fields.map(f => '<div style="margin-bottom:8px;"><label class="f">' + esc(f.label) + '</label>' +
      (f.type === 'select' ? '<select data-k="' + f.k + '" style="width:100%;">' + f.opts.map(o => '<option' + (o === f.value ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>'
        : f.type === 'area' ? '<textarea data-k="' + f.k + '">' + esc(f.value || '') + '</textarea>'
          : '<input data-k="' + f.k + '" type="' + (f.type || 'text') + '" value="' + esc(f.value == null ? '' : f.value) + '" style="width:100%;' + (f.num ? 'text-align:right;' : '') + '">') + (f.note ? '<div class="note">' + esc(f.note) + '</div>' : '') + '</div>').join('') +
      '<div class="row" style="margin-top:12px;"><span class="sp"></span><button class="b" data-x="n">やめる</button><button class="b dark" data-x="y">' + esc(okLabel || 'OK') + '</button></div></div>';
    document.body.appendChild(w);
    const end = v => { w.remove(); done(v); };
    w.querySelector('[data-x="n"]').onclick = () => end(null);
    w.querySelector('[data-x="y"]').onclick = () => { const o = {}; w.querySelectorAll('[data-k]').forEach(e => { o[e.dataset.k] = e.value; }); end(o); };
    const first = w.querySelector('[data-k]'); if (first) first.focus();
  });
}

/* 新しい版の知らせ（給与と同じ） */
async function refreshApp() {
  try { const r = await fetch('./?check=' + Date.now(), { cache: 'no-store' }); if (r.ok && window.caches) await (await caches.open('seikyu-shell-v3')).put('./', r); } catch (e) {}
  location.reload();
}
function showUpdate() {
  if ($('upd')) return;
  const b = document.createElement('button'); b.id = 'upd'; b.textContent = '新しいVerがあります（押すと入れ替え）';
  b.onclick = () => { b.textContent = '入れ替えています…'; refreshApp(); };
  document.body.appendChild(b);
}
async function checkVer() {
  if (LOCAL || navigator.onLine === false || document.hidden) return;
  try { const t = await fetch('./?check=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : ''); const m = t.match(/APP_VER = '([^']+)'/); if (m && m[1] !== APP_VER) showUpdate(); } catch (e) {}
}
document.addEventListener('visibilitychange', checkVer); setInterval(checkVer, 600000); setTimeout(checkVer, 3000);
if ('serviceWorker' in navigator && !LOCAL) navigator.serviceWorker.register('sw.js').catch(() => {});

/* サーバー（スプレッドシートの請求管理DBを書く） */
async function gas(action, data) {
  if (LOCAL) {
    if (action === 'importRead') return fetch('../移行/seikyu_import.json', { cache: 'no-store' }).then(r => r.json());
    if (action === 'year') return (await fetch('../移行/seikyu_import.json', { cache: 'no-store' }).then(r => r.json())).invoices.filter(i => String(i.date).slice(0, 4) === String(data.year)).map(i => Object.assign(i, { fromSheet: true }));
    if (action === 'importWrite') return { customers: 0, invoices: 0, note: '試し（スプレッドシートには書いていません）' };
    return { at: nowStr() };
  }
  const idToken = await auth.currentUser.getIdToken();
  const d = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'sk', idToken, action, data: data || {} }) }).then(r => r.json());
  if (!d || !d.ok) throw new Error((d && d.m) || 'サーバーでエラーが発生しました。');
  return d.v;
}

/* 画面のデータの置き場（Firestore の写し）。記録の正本はスプレッドシート（請求管理DB）。
   保存は「スプレッドシートに書く → 書けたら Firestore の写しを書く」の順（給与と同じく、写しと正本をそろえる）。
   写しは、入金が済んだ請求書・領収書だけ「その年の翌年3月末」に消える（ルール6：溜まり続けるデータを作らない。期限付きは可）。
   入金がまだの請求書は、済むまで消えない */
const C = { cfg: 'seikyuCfg', cust: 'seikyuCustomers', inv: 'seikyuInvoices', rcp: 'seikyuReceipts' };
const MEM = {};
const store = {
  async all(c) { if (LOCAL) return Object.values(MEM[c] || {}).map(x => plain(x)); return (await getDocs(collection(db, c))).docs.map(d => ({ ...d.data(), id: d.id })); },
  async get(c, id) { if (LOCAL) return (MEM[c] || {})[id] ? plain(MEM[c][id]) : null; const s = await getDoc(doc(db, c, id)); return s.exists() ? s.data() : null; },
  async put(c, id, v) { if (LOCAL) { (MEM[c] = MEM[c] || {})[id] = plain(v); return; } await setDoc(doc(db, c, id), plain(v)); },
  async del(c, id) { if (LOCAL) { delete (MEM[c] || {})[id]; return; } await deleteDoc(doc(db, c, id)); },
  async many(c, list) {
    if (LOCAL) { list.forEach(v => { (MEM[c] = MEM[c] || {})[v.id] = plain(v); }); return; }
    for (let i = 0; i < list.length; i += 400) { const b = writeBatch(db); list.slice(i, i + 400).forEach(v => b.set(doc(db, c, v.id), plain(v))); await b.commit(); }
  }
};
const endOfMarch = y => new Date((Number(y) + 1) + '-03-31T23:59:59+09:00').getTime();
const liveYear = y => Date.now() <= endOfMarch(y);


/* ===== 付箋メモ（ユーザー指示 2026-11-06：全画面で付箋メモ。色も選べる。メモは見えるように）。
   o.sticky = { c: 'y'|'g'|'b'|'r', t: 文字 }。販売らくだから写した請求書は、販売らくだの付箋（色・メモ）を初めの付箋にする ===== */
const STK = [['y', '黄'], ['g', '緑'], ['b', '青'], ['r', '赤']];
const RAKU_STK = { 1: 'g', 2: 'b', 3: 'r' };
function stickyOf(o) {
  if (!o) return null;
  if (o.sticky) return (o.sticky.t || o.sticky.c) ? o.sticky : null;
  const L = o.legacy || {};
  if (L.orderId != null && (L.tagMemo || L.tagId)) return { c: RAKU_STK[L.tagId] || 'y', t: L.tagMemo || '' };
  return null;
}
const stkChip = o => { const s = stickyOf(o); return s ? '<span class="stk ' + (s.c || 'y') + '" title="' + esc(s.t) + '">' + (esc(s.t) || '　') + '</span>' : ''; };
function stkPanel(o, id) {
  const s = stickyOf(o);
  return '<div class="card"><div class="row" style="align-items:flex-start;"><b style="white-space:nowrap;padding-top:6px;">付箋メモ</b>' +
    (s ? '<div class="stkbox ' + (s.c || 'y') + '" style="flex:1;">' + (esc(s.t) || '（文字なし）') + '</div>' : '<div class="note" style="flex:1;padding-top:6px;">付箋はありません。</div>') +
    '<button class="b" id="' + id + '">' + (s ? '付箋を直す' : '付箋を貼る') + '</button></div></div>';
}
async function stkEdit(o) {   // 付箋の画面。OK なら新しい sticky、やめたら undefined
  const s = stickyOf(o) || { c: 'y', t: '' };
  const r = await formBox('付箋メモ', [{ k: 'c', label: '色', type: 'select', opts: STK.map(x => x[1]).concat(['（付箋をはがす）']), value: (STK.find(x => x[0] === s.c) || STK[0])[1] }, { k: 't', label: 'メモ', type: 'area', value: s.t }], '貼る');
  if (!r) return undefined;
  if (r.c === '（付箋をはがす）') return { c: '', t: '' };
  return { c: (STK.find(x => x[1] === r.c) || STK[0])[0], t: r.t.trim() };
}

/* ===== 承認（ユーザー指示 2026-11-06：担当者が作り、比嘉 伸治・比嘉 美紀の2人が承認してから印刷・PDF。承認の欄は3つ）。
   cfg.approvers[k] = { label, name, uid, stamp }。uid が入っている欄の承認が全部済むと印刷できる。
   inv.approvals[k] = { uid, name, stamp, at }。中身を直して保存すると承認はやり直し ===== */
const DEF_APV = [{ label: '承認', name: '比嘉 伸治', uid: 'sh@excureduct.co.jp', stamp: 'maru' }, { label: '承認', name: '比嘉 美紀', uid: 'mh@excureduct.com', stamp: 'higa' }, { label: '承認', name: '', uid: '', stamp: '' }];
const STAMP_NAMES = [['maru', '代表者印（丸印）'], ['higa', '比嘉の印'], ['kaku', '角印'], ['', 'なし（名前の文字）']];
const needApv = inv => !inv.fixed && inv.state !== '取消';   // 販売らくだから写した請求書（もう出した物）は承認なしで印刷できる
const apvNeed = () => (ST.cfg.approvers || []).map((a, k) => a.uid ? k : -1).filter(k => k >= 0);
const approved = inv => !needApv(inv) || apvNeed().every(k => inv.approvals && inv.approvals[k]);
const apvLeft = inv => apvNeed().filter(k => !(inv.approvals && inv.approvals[k])).map(k => ST.cfg.approvers[k].name || ('欄' + (k + 1)));

/* ===== 一覧の並べ方・しぼり込み（ユーザー指示 2026-11-06：請求書・領収書・入金は 会社名・時期・月 で並べ替え） ===== */
const SORTS = { dateD: '日付の新しい順', dateA: '日付の古い順', name: '会社名の順', amt: '金額の大きい順', due: '入金予定日の早い順' };
function lt(key, def) { ST.lt = ST.lt || {}; return (ST.lt[key] = ST.lt[key] || { sort: def, mon: '', name: '' }); }
/* rows：[{ date, name, amt, due, ... }]。dateLabel：月で分けるときの日付の名前 */
function ltBar(key, rows, sorts, dateLabel) {
  const s = lt(key), mons = [...new Set(rows.map(r => String(r.mon || r.date || '').slice(0, 7)).filter(Boolean))].sort().reverse(), names = [...new Set(rows.map(r => r.name).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ja'));
  return '<div class="row lt" style="margin-top:8px;">' +
    '<label class="ltl">並べ方 <select data-lt="sort">' + sorts.map(k => '<option value="' + k + '"' + (s.sort === k ? ' selected' : '') + '>' + SORTS[k] + '</option>').join('') + '</select></label>' +
    '<label class="ltl">' + esc(dateLabel) + 'の月 <select data-lt="mon"><option value="">すべての月</option>' + mons.map(m => '<option value="' + m + '"' + (s.mon === m ? ' selected' : '') + '>' + m.slice(0, 4) + '年' + Number(m.slice(5)) + '月</option>').join('') + '</select></label>' +
    '<label class="ltl">会社名 <select data-lt="name" style="max-width:260px;"><option value="">すべての会社</option>' + names.map(n => '<option' + (s.name === n ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select></label></div>';
}
function ltApply(key, rows) {
  const s = lt(key);
  const out = rows.filter(r => (!s.mon || String(r.mon || r.date || '').slice(0, 7) === s.mon) && (!s.name || r.name === s.name));
  const by = { dateD: (a, b) => String(b.date).localeCompare(String(a.date)) || String(b.no).localeCompare(String(a.no)), dateA: (a, b) => String(a.date).localeCompare(String(b.date)) || String(a.no).localeCompare(String(b.no)),
    name: (a, b) => nameKey(a).localeCompare(nameKey(b), 'ja') || String(b.date).localeCompare(String(a.date)), amt: (a, b) => (b.amt || 0) - (a.amt || 0), due: (a, b) => String(a.due || '9').localeCompare(String(b.due || '9')) };
  return out.sort(by[s.sort] || by.dateD);
}
/* 会社名の順は「株式会社」「（株）」などを除いて並べる */
const coKey = n => String(n || '').replace(/[\s　]/g, '').replace(/^(株式会社|有限会社|合同会社|合資会社|（株）|\(株\)|（有）|\(有\))/, '').replace(/(株式会社|有限会社|（株）|\(株\))$/, '');
/* 並べるときはフリガナ（得意先の台帳）があればそれで、無ければ会社名で */
const nameKey = r => { const c = r.custId ? custOf(r.custId) : null; return (c && c.kana ? c.kana.replace(/[\s　]/g, '').replace(/^(カブシキガイシャ|カブシキカイシャ|ユウゲンガイシャ|ゴウドウガイシャ|\(カ\)|（カ）)/, '') : '') || coKey(r.name); };
function ltWire(key, redraw) { M.querySelectorAll('[data-lt]').forEach(e => e.onchange = () => { lt(key)[e.dataset.lt] = e.value; redraw(); }); }
/* 販売らくだの決まった文「備考：すべて消費税率10%」は出さない（ユーザー指示 2026-11-06：必要ない） */

const calcOf = inv => SK.calc(inv, ST.cfg);

/* 発行元（自社の名前・住所・振込先・登録番号）は書類ごとに保存したときの物を残す。設定を変えても前の書類は変わらない（ユーザー指示 2026-11-05：古い請求書が自動で今の会社名にならないように）。

const curFrom = () => { const co = ST.cfg.company; return { name: co.name, person: '', zip: co.zip, addr: co.addr, tel: co.tel, fax: co.fax, regNo: co.regNo || '', bank: ST.cfg.bank || '' }; };
const fromOf = d => (d && d.from) || curFrom();

}
const stTag = st => '<span class="tag ' + ({ '入金済み': 'ok', '期日超え': 'ng', '一部入金': 'mid', '未入金': 'blue', '取消': '', '入金なし': '' }[st] || '') + '">' + esc(st) + '</span>';

const TABS = [['inv', '請求書'], ['pay', '入金'], ['rcp', '領収書'], ['cust', '得意先'], ['sub', '提出データ'], ['cfg', '設定']];

/* ===== 請求書の一覧 ===== */

/* ===== 請求書の作成・編集 ===== */
function newInv(cust) {

function setCust(inv, c) {

async function nextNo(kind) {   // 番号は保存したときに付ける（2人が同時に作っても重ならないよう、Firestore の取引で数える）
  let n;
  if (LOCAL) { n = ST.cfg[kind]; ST.cfg[kind] = { ...n, next: n.next + 1 }; await store.put(C.cfg, 'main', ST.cfg); }
  else {
    const ref = doc(db, C.cfg, 'main');
    n = await runTransaction(db, async t => { const s = await t.get(ref); const cur = (s.exists() && s.data()[kind]) || ST.cfg[kind]; t.set(ref, { [kind]: { ...cur, next: cur.next + 1 } }, { merge: true }); return cur; });
    ST.cfg[kind] = { ...n, next: n.next + 1 };
  }
  gas('saveCfg', { cfg: { [kind]: ST.cfg[kind] } }).catch(() => {});
  return n.prefix + String(n.next).padStart(n.digits, '0');
}
async function saveInv(inv, why) {
  const c = calcOf(inv);
  if (c.missing.length) throw new Error('発行日（' + dShort(inv.date) + '）に使う税率が、設定の税率の表にありません：' + c.missing.map(SK.kindName).join('・'));
  if (!inv.no) inv.no = await nextNo('invNo');
  if (!inv.from) inv.from = curFrom();
  if (!inv.createdAt) { inv.createdAt = nowStr(); inv.createdBy = ST.me.name; }
  inv.updatedAt = nowStr(); inv.updatedBy = ST.me.name;
  const d = plain(inv); delete d.isNew; delete d.fromSheet;
  busy('保存しています…');
  try {
    await gas('saveInv', { inv: d, calc: { sub: c.sub, tax: c.tax, total: c.total, groups: c.groups, payState: stateOf(d) }, why: why || '' });
    d.expireAt = expireOf(d);
    try { await store.put(C.inv, d.id, d); } catch (e) { throw new Error('スプレッドシートには書けましたが、画面の写しを書けませんでした（' + e.message + '）。開き直してください。'); }

  ST.invs = ST.invs.filter(x => x.id !== d.id).concat([d]);
  Object.values(ST.yearData).forEach(a => { const k = a.findIndex(x => x.id === d.id); if (k >= 0) a[k] = d; });

  return d;
}

  const mark = () => { ST.dirty = true; };

    $('tm').onchange = re;

  $('pr').onclick = async () => {

  };

    if ($('unc')) $('unc').onclick = async () => { readForm(); inv.state = '発行済み'; try { await saveInv(inv, '取消をやめた'); ST.dirty = false; drawInvEdit(); } catch (e) { alert(e.message); } };

async function addPayment(inv, after) {
  const c = calcOf(inv), rest = Math.max(0, c.total - SK.paid(inv));
  const r = await formBox('入金を入れる（' + inv.no + '　' + (inv.to || {}).name + '）', [
    { k: 'date', label: '入金日', type: 'date', value: today() },
    { k: 'amount', label: '入金額（円）', value: yen(rest), num: 1, note: '請求額 ' + yen(c.total) + ' 円、残り ' + yen(rest) + ' 円' },
    { k: 'fee', label: '振込手数料（先方が差し引いた分。円）', value: '0', num: 1, note: '入金額＋振込手数料で請求額に届けば「入金済み」になります' },
    { k: 'how', label: '方法', type: 'select', opts: ['振込', '現金', '相殺', '手形', '小切手', '電子記録債権', 'その他'], value: '振込' },
    { k: 'memo', label: 'メモ', value: '' }], '入金を入れる');
  if (!r) return;
  const p = { date: r.date, amount: num(r.amount) || 0, fee: num(r.fee) || 0, how: r.how, memo: r.memo, at: nowStr(), by: ST.me.name };
  if (!p.date || !(p.amount || p.fee)) return alert('入金日と金額を入れてください。');
  inv.payments = (inv.payments || []).concat([p]);
  try { await saveInv(inv, '入金 ' + yen(p.amount) + '円'); if (after) after(); else if (ST.edit === inv) drawInvEdit(); } catch (e) { inv.payments.pop(); alert('保存できませんでした：' + e.message); }
}

/* ===== 紙（請求書・送り状・領収書）。1ページ＝A4縦 210×297mm。位置は mm で書く ===== */
const SERIF = "font-family:'BIZ UDMincho Medium','BIZ UD明朝 Medium','BIZ UDMincho','Yu Mincho','YuMincho','Hiragino Mincho ProN','Noto Serif JP',serif;";
const PG = 'position:relative;width:210mm;height:297mm;background:#fff;overflow:hidden;color:#1d1d1d;' + SERIF;
const pgWrap = (inner, duct) => '<div class="pg" style="' + PG + '">' + (duct ? '<div style="position:absolute;right:0;bottom:0;width:124mm;height:108mm;background:url(paper_duct.png) right bottom/contain no-repeat;"></div>' : '') + inner + '</div>';
/* 明細の行の高さ（mm）。品名・備考が長い行は折り返して高くなる（ユーザー指示 2026-11-06：品目・備考がすごく長いときの対応）。

/* 印刷：見えない枠に紙を並べてブラウザの印刷の画面を出す。窓付き封筒に合わせるため、倍率100%・余白なしで印刷する */
function printPages(pages) {
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(f);
  const base = location.href.replace(/[^/]*([?#].*)?$/, '');
  f.contentDocument.open();
  f.contentDocument.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><base href="' + base + '"><style>@page{size:A4 portrait;margin:0;}html,body{margin:0;padding:0;}.pg{page-break-after:always;break-after:page;}.pg:last-child{page-break-after:auto;break-after:auto;}*{-webkit-print-color-adjust:exact;print-color-adjust:exact;}</style></head><body>' + pages.join('') + '</body></html>');
  f.contentDocument.close();
  const imgs = [...f.contentDocument.images];
  Promise.all(imgs.map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; }))).then(() => setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 60000); }, 200));
}
/* PDF・Excel（給与と同じ：先に保存先を聞く。部品は lib に置いた物） */
async function loadLib() {
  const add = s => new Promise((ok, ng) => { const x = document.createElement('script'); x.src = s; x.onload = ok; x.onerror = () => ng(new Error('PDFを作る部品を読み込めませんでした')); document.head.appendChild(x); });
  if (!window.html2canvas) await add('./lib/html2canvas.min.js');
  if (!window.jspdf) await add('./lib/jspdf.umd.min.js');
}
async function pickSave(name) {
  if (!window.showSaveFilePicker) return null;
  const xl = /\.xlsx$/.test(name), type = xl ? { description: 'Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } } : { description: 'PDF', accept: { 'application/pdf': ['.pdf'] } };
  try { return await window.showSaveFilePicker({ id: 'seikyu-save', suggestedName: name.replace(/[\\/:*?"<>|]/g, ''), types: [type] }); }
  catch (e) { if (e && e.name === 'AbortError') throw new Error('保存をやめました。'); return null; }
}
async function pdfOf(pages, name) {
  const fh = await pickSave(name);
  await loadLib();
  if (typeof pages === 'function') pages = await pages();
  if (!pages.length) throw new Error('入れる物がありません。');
  busy('PDFを作っています…（' + pages.length + 'ページ）');
  const box = document.createElement('div'); box.style.cssText = 'position:fixed;left:-6000px;top:0;background:#fff;'; document.body.appendChild(box);
  try {
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
    for (let i = 0; i < pages.length; i++) {
      box.innerHTML = pages[i];
      await Promise.all([...box.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
      const cv = await window.html2canvas(box.firstElementChild, { scale: 2, backgroundColor: '#fff', logging: false });
      if (i) pdf.addPage('a4', 'portrait');
      pdf.addImage(cv.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, 210, 297);
      busy('PDFを作っています…（' + (i + 1) + ' / ' + pages.length + 'ページ）');
    }
    if (fh) { const w = await fh.createWritable(); await w.write(pdf.output('blob')); await w.close(); } else pdf.save(name);
  } finally { box.remove(); busy(''); }
}
async function xlsxOf(sheets, name) {
  const fh = await pickSave(name);
  if (!window.XLSX) await new Promise((ok, ng) => { const x = document.createElement('script'); x.src = './lib/xlsx.full.min.js'; x.onload = ok; x.onerror = () => ng(new Error('Excelを作る部品を読み込めませんでした')); document.head.appendChild(x); });
  if (typeof sheets === 'function') sheets = await sheets();
  const wb = window.XLSX.utils.book_new();
  sheets.forEach(sh => {
    const ws = window.XLSX.utils.aoa_to_sheet(sh.rows);
    Object.keys(ws).forEach(a => { const c = ws[a]; if (a[0] !== '!' && c && c.t === 'n') c.z = '#,##0;-#,##0;0'; });
    ws['!cols'] = sh.cols || sh.rows[0].map(() => ({ wch: 14 }));
    window.XLSX.utils.book_append_sheet(wb, ws, sh.name.slice(0, 30));
  });
  const blob = new Blob([window.XLSX.write(wb, { type: 'array', bookType: 'xlsx' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  if (fh) { const w = await fh.createWritable(); await w.write(blob); await w.close(); }
  else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
}

/* ===== 提出データ（税理士さん。ユーザー決定 2026-11-05：月ごとに 請求書のPDF・入金分のPDF・Excel。アプリで作って保存し、送るのはユーザー） ===== */
async function monthData(ym) {
  const y = ym.slice(0, 4), py = String(Number(y) - 1);
  const all = {}; [...await invsOfYear(py), ...await invsOfYear(y)].forEach(i => { all[i.id] = i; }); ST.invs.forEach(i => { all[i.id] = i; });
  const list = Object.values(all);
  const issued = list.filter(i => String(i.date).slice(0, 7) === ym && i.state !== '取消').sort((a, b) => String(a.no).localeCompare(String(b.no)));
  const paidIn = list.filter(i => (i.payments || []).some(p => String(p.date || '').slice(0, 7) === ym)).sort((a, b) => String(a.no).localeCompare(String(b.no)));
  const endM = SK.ymd(new Date(+y, +ym.slice(5, 7), 0));
  const unpaid = list.filter(i => i.state !== '取消' && i.date <= endM).filter(i => { const paidBy = (i.payments || []).filter(p => !p.date || p.date <= endM).reduce((s, p) => s + (Number(p.amount) || 0) + (Number(p.fee) || 0), 0); return paidBy < calcOf(i).total; });
  return { issued, paidIn, unpaid, endM };
}
async function drawSub() {
  const d = new Date(), def = d.getFullYear() + '-' + pad(d.getMonth() === 0 ? 12 : d.getMonth());
  const ym = ST.subYm || (d.getMonth() === 0 ? (d.getFullYear() - 1) + '-12' : def);
  M.innerHTML = '<div class="card"><div class="row"><b>提出データ（税理士さん）</b><input type="month" id="ym" value="' + ym + '"><span class="sp"></span>' + (ST.cfg.memoTax ? '<button class="b" id="memo">税理士さんへのメモ</button>' : '') + '</div><div class="note" style="margin-top:6px;">月を選んで、PDF と Excel を作って保存します（保存先を選べます）。メールに付けて送るか、印刷して渡してください。</div></div><div class="card" id="sb">読み込んでいます…</div>';
  $('ym').onchange = () => { ST.subYm = $('ym').value; drawSub(); };
  if ($('memo')) $('memo').onclick = () => alert(ST.cfg.memoTax);
  let md; try { md = await monthData(ym); } catch (e) { $('sb').innerHTML = '<div class="msg">' + esc(e.message) + '</div>'; return; }
  const tot = a => a.reduce((s, i) => s + calcOf(i).total, 0), lab = ym.replace('-', '年') + '月';
  $('sb').innerHTML = '<table class="t"><tbody>' +
    '<tr><td><b>請求書（PDF）</b><div class="note">' + lab + 'に出した請求書（取消を除く）。印鑑つき、1枚ずつ。</div></td><td class="n">' + md.issued.length + ' 枚　' + yen(tot(md.issued)) + ' 円</td><td><button class="b dark" id="p1"' + (md.issued.length ? '' : ' disabled') + '>PDFを作る</button></td></tr>' +
    '<tr><td><b>入金分（PDF）</b><div class="note">' + lab + 'に入金があった請求書。</div></td><td class="n">' + md.paidIn.length + ' 枚</td><td><button class="b dark" id="p2"' + (md.paidIn.length ? '' : ' disabled') + '>PDFを作る</button></td></tr>' +
    '<tr><td><b>一覧（Excel）</b><div class="note">シート「請求書」「入金」「' + lab + '末の未入金」の3つ。</div></td><td class="n">未入金 ' + md.unpaid.length + ' 枚</td><td><button class="b dark" id="x1">Excelを作る</button></td></tr></tbody></table>';
  const pagesOf = list => list.flatMap(i => invPages(i, null));
  $('p1').onclick = async () => { try { await pdfOf(() => pagesOf(md.issued), lab + '_請求書.pdf'); } catch (e) { alert(e.message); } };
  $('p2').onclick = async () => { try { await pdfOf(() => pagesOf(md.paidIn), lab + '_入金分.pdf'); } catch (e) { alert(e.message); } };
  $('x1').onclick = async () => {
    try {
      const gtxt = c => c.groups.map(g => SK.groupLabel(g) + ' ' + yen(g.base) + (g.rate ? '（税' + yen(g.tax) + '）' : '')).join(' / ');
      const s1 = [['番号', '発行日', '得意先', '件名', '税抜合計', '消費税', '合計', '税率ごとの内訳', '入金予定日', '入金の状態', '入金合計', '最後の入金日']].concat(md.issued.map(i => { const c = calcOf(i); return [i.no, i.date, (i.to || {}).name, i.title || ((i.lines || []).find(l => l.name) || {}).name || '', c.sub, c.tax, c.total, gtxt(c), i.due || '', stateOf(i), SK.paid(i), SK.lastPayDate(i)]; }));
      const pr = []; md.paidIn.forEach(i => (i.payments || []).filter(p => String(p.date || '').slice(0, 7) === ym).forEach(p => pr.push([p.date, i.no, i.date, (i.to || {}).name, calcOf(i).total, Number(p.amount) || 0, Number(p.fee) || 0, p.how || '', p.memo || ''])));
      const s2 = [['入金日', '請求書番号', '発行日', '得意先', '請求額', '入金額', '振込手数料', '方法', 'メモ']].concat(pr.sort((a, b) => String(a[0]).localeCompare(String(b[0]))));
      const s3 = [['番号', '発行日', '得意先', '請求額', md.endM + 'までの入金', '残り', '入金予定日']].concat(md.unpaid.map(i => { const p = (i.payments || []).filter(x => !x.date || x.date <= md.endM).reduce((s, x) => s + (Number(x.amount) || 0) + (Number(x.fee) || 0), 0), t = calcOf(i).total; return [i.no, i.date, (i.to || {}).name, t, p, t - p, i.due || '']; }));
      await xlsxOf([{ name: '請求書', rows: s1, cols: [{ wch: 9 }, { wch: 11 }, { wch: 28 }, { wch: 28 }, { wch: 12 }, { wch: 11 }, { wch: 12 }, { wch: 34 }, { wch: 11 }, { wch: 9 }, { wch: 12 }, { wch: 11 }] }, { name: '入金', rows: s2, cols: [{ wch: 11 }, { wch: 10 }, { wch: 11 }, { wch: 28 }, { wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 8 }, { wch: 24 }] }, { name: lab + '末の未入金', rows: s3, cols: [{ wch: 9 }, { wch: 11 }, { wch: 28 }, { wch: 12 }, { wch: 14 }, { wch: 12 }, { wch: 11 }] }], lab + '_請求と入金の一覧.xlsx');
    } catch (e) { alert(e.message); }
  };
}

      invNo: { prefix: $('in_p').value.trim(), digits: num($('in_d').value) || 5, next: num($('in_n').value) || 1 }, rcpNo: { prefix: $('rn_p').value.trim(), digits: num($('rn_d').value) || 5, next: num($('rn_n').value) || 1 },
      defTerms: { close: Number($('dc').value), months: Number($('dm').value), day: Number($('dd').value) }, rcpPurpose: $('rp').value, coverPerson: $('cp').value, coverText: $('ct').value, memoTax: $('mt').value,
      approvers: [...M.querySelectorAll('[data-apk]')].map(tr => { const u = tr.querySelector('[data-ap="uid"]'), uid = u.value, p = (ST.people || []).find(x => x.uid === uid); return { label: tr.querySelector('[data-ap="label"]').value.trim() || '承認', uid, name: uid ? (p ? p.name : (u.selectedOptions[0] || {}).textContent || uid) : '', stamp: tr.querySelector('[data-ap="stamp"]').value }; })
    };
  }
  $('sv').onclick = async () => {
    const v = readAll();
    if (v.rates.some(r => r.rate == null || !r.from)) return alert('税率の表に、税率か「いつから」が空の行があります。');
    if (v.company.regNo && !/^T\d{13}$/.test(v.company.regNo)) return alert('登録番号は T と13けたの数字です。');
    const used = [...ST.invs, ...Object.values(ST.yearData).flat()].map(i => i.no);
    const nextNoTxt = v.invNo.prefix + String(v.invNo.next).padStart(v.invNo.digits, '0');
    if (used.includes(nextNoTxt) && !(await okBox('次の請求書の番号 ' + nextNoTxt + ' は、もう使われています。このまま保存しますか？', '保存する'))) return;
    busy('保存しています…');
    try { await gas('saveCfg', { cfg: v }); await store.put(C.cfg, 'main', Object.assign({}, ST.cfg, v)); Object.assign(ST.cfg, v); ST.hasCfg = true; ST.dirty = false; alert('保存しました。'); drawCfg(); }
    catch (e) { alert('保存できませんでした：' + e.message); } finally { busy(''); }
  };
  if ($('imp')) $('imp').onclick = importRaku;
  const upStamp = (id, key) => $(id).onchange = async () => { const fl = $(id).files[0]; if (!fl) return; if (fl.size > 300000) return alert('画像が大きすぎます（300KBまで）。'); const url = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(fl); }); const v = Object.assign({}, ST.stamps, { [key]: url }); try { await store.put(C.cfg, 'stamps', v); ST.stamps = v; gas('log', { what: '印鑑の画像を入れた', detail: key }).catch(() => {}); drawCfg(); } catch (e) { alert('入れられませんでした：' + e.message); } };
  upStamp('stK', 'kaku'); upStamp('stH', 'higa'); upStamp('stM', 'maru');
  loadPeople().then(() => { const P = ST.people || []; M.querySelectorAll('[data-ap="uid"]').forEach(e => { const v = e.value; e.innerHTML = '<option value="">（決めていない）</option>' + P.map(p => '<option value="' + esc(p.uid) + '"' + (p.uid === v ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + (v && !P.some(p => p.uid === v) ? '<option value="' + esc(v) + '" selected>' + esc(v) + '</option>' : ''); }); });
}
/* 承認する人を選ぶための、請求管理アプリに入れる人（マスター・請求管理）。読めないときは今の設定の人だけ */
async function loadPeople() {
  if (ST.people) return;
  if (LOCAL) { ST.people = DEF_APV.filter(a => a.uid).map(a => ({ uid: a.uid, name: a.name })); return; }
  try { ST.people = (await getDocs(collection(db, 'users'))).docs.filter(d => d.data().isMaster || d.data().canInvoice).map(d => ({ uid: d.id, name: d.data().name || d.id })); }
  catch (e) { ST.people = (ST.cfg.approvers || []).filter(a => a.uid).map(a => ({ uid: a.uid, name: a.name })); }
}
/* 販売らくだの写しの読み込み（ユーザー決定 2026-11-05：コピーして移す・販売らくだは一切触らない） */
async function importRaku() {
  if (!(await okBox('販売らくだの写し（seikyu_import.json）を読み込みます。\nスプレッドシート（請求管理DB）に全部を書き、画面の写しには「入金がまだの物」と今年・去年の分だけを入れます。\n数分かかることがあります。', '読み込む'))) return;
  try {
    busy('スプレッドシートに書いています…（数分かかることがあります）');
    let w; try { w = await gas('importWrite'); } catch (e) { if (!/もうデータがあります/.test(e.message)) throw e; if (!(await okBox(e.message + '\n\nスプレッドシートはそのままにして、画面の写しだけ作りますか？', '写しだけ作る'))) return; w = null; }
    busy('画面の写しを作っています…');
    const d = await gas('importRead');
    const cfg = cfgMerge(d.cfg);
    await store.put(C.cfg, 'main', cfg);
    await store.many(C.cust, d.customers);
    const t0 = today(), inv = d.invoices.filter(i => { const st = SK.payState(i, t0, i.fixed.total); return !['入金済み', '入金なし', '取消'].includes(st) || liveYear(String(i.date).slice(0, 4)); }).map(i => { const x = plain(i); x.expireAt = expireOf(x); return x; });
    await store.many(C.inv, inv);
    busy('');
    await okBox('読み込みました。\n' + (w ? 'スプレッドシート：得意先 ' + w.customers + ' 社、請求書 ' + w.invoices + ' 枚' + (w.lines != null ? '、明細 ' + w.lines + ' 行、入金 ' + w.payments + ' 件' : '') + '\n' : '') + '画面の写し：得意先 ' + d.customers.length + ' 社、請求書 ' + inv.length + ' 枚\n元：' + d.source + '（' + d.sourceAt + ' 保存）', 'OK', true);
    ST.tab = 'inv'; boot();
  } catch (e) { busy(''); alert('読み込めませんでした：' + e.message); }
}

/* ログイン（給与アプリと同じ） */
function drawLogin() {
  $('hd').style.display = 'none';
  M.innerHTML = '<div class="card" id="login"><h2>請求管理 ログイン</h2><label class="f">アカウントID（メールアドレス）</label><input id="em" type="email" autocomplete="username"><label class="f">パスワード</label><input id="pw" type="password" autocomplete="current-password"><button class="b dark" id="go" style="width:100%;">ログイン</button><div class="msg" id="lm"></div><div class="note">ポータル・給与管理と同じアカウントです。</div></div>';
  $('go').onclick = async () => { try { await signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value); } catch (e) { $('lm').textContent = 'ログインできませんでした。'; } };
  $('pw').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
}
$('out').onclick = async e => { e.preventDefault(); if (LOCAL) return; await signOut(auth); location.reload(); };
window.addEventListener('beforeunload', e => { if (ST.dirty) { e.preventDefault(); e.returnValue = ''; } });
if (LOCAL) boot(); else onAuthStateChanged(auth, u => { if (u) boot(); else drawLogin(); });
window.skTest = { ST, invPages, coverPage, rcpPages, showPaper, calcOf, stateOf, store, MEM, pdfOf, xlsxOf, monthData, approved, stickyOf, paginate, rowH, openInv, newInv, custOf };   // 試しで中を見る用
</script>
