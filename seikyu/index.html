<script type="module">

/* 確かめる欄・知らせる欄（ブラウザの小窓は使わない。給与と同じ） */
function okBox(msg, okLabel, noCancel) {
  return new Promise(done => {
    const w = document.createElement('div'); w.id = 'ask';

    w.innerHTML = '<div class="card' + (bad ? ' err' : '') + '"><div class="q" style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;">' + esc(msg) + '</div><div class="row" style="margin-top:14px;"><span class="sp"></span>' + (noCancel ? '' : '<button class="b" data-k="n">やめる</button>') + '<button class="b dark" data-k="y">' + esc(okLabel || 'はい') + '</button></div></div>';

const alert = m => { okBox(String(m), 'OK', true); };

      '<div class="row" style="margin-top:12px;"><span class="sp"></span><button class="b" data-x="n">やめる</button><button class="b dark" data-x="y">' + esc(okLabel || 'OK') + '</button></div></div>';

    if (/保存/.test(okLabel || '')) saveBar(w.querySelector('.card'), [[w.querySelector('[data-x="n"]'), 'やめる'], [w.querySelector('[data-x="y"]'), okLabel, 1]]);   // やめるも同じ大きさで左横に（ユーザー指示 2026-11-07）   // 新しい領収書など
    const first = w.querySelector('[data-k]'); if (first) first.focus();
  });
}

/* 新しい版（ユーザー指示 2026-11-06：給与と同じように 知らせ・自動・ボタン で入れ替えられる）。
   知らせ：画面の上に「新しいVerがあります」。自動：入力の途中（保存していない変更・開いている小窓）でなければ、見つけたときにそのまま入れ替える。ボタン：設定のいちばん上 */
async function refreshApp() {
  try { if (window.caches) { const c = await caches.open('seikyu-shell-v3'); await Promise.all(['./', 'calc.js', 'manifest.json'].map(async u => { const r = await fetch(u + '?check=' + Date.now(), { cache: 'no-store' }); if (r.ok) await c.put(u, r); })); } } catch (e) {}

}

async function checkVer() {
  if (LOCAL || navigator.onLine === false || document.hidden) return;

/* ===== スプレッドシートへ後から書く順番待ちの列（提案7・ユーザー決定 2026-11-06：保存をさらに速く）。

   列はこのパソコンの中（localStorage）に置く。書けなかったら自動でやり直す。閉じても、次に開いたときに続きを書く。
   スプレッドシート側は1つずつ「受け取り番号」を覚えていて、同じ物を2回書かない ===== */

  const n = qGet().length;
  e.innerHTML = n ? (Q.err ? '<span class="tag ng" title="' + esc(Q.err) + '">スプレッドシートに書けていません ' + n + ' 件（自動でやり直します）</span>　' : '<span class="tag mid">スプレッドシートへ書いています ' + n + ' 件</span>　') : '';
}
async function qRun() {
  if (Q.run || !ST.me) return;

    for (;;) {
      const a = qGet(); if (!a.length) break;

      catch (e) { Q.err = e.message || String(e); Q.fail++; qShow(); await new Promise(ok => setTimeout(ok, Math.min(60000, 3000 * Math.pow(2, Q.fail)))); continue; }   // 通信・ログイン切れ・混み合い：消さずにやり直す

      const done = new Set(batch.map(x => x.k));

async function apvMany(list) {
  const tot = list.reduce((s, i) => s + calcOf(i).total, 0);
  if (!(await okBox(list.length + ' 枚（合計 ¥' + yen(tot) + '）を、まとめて承認します。\n番号：' + list.slice(0, 12).map(i => i.no).join('、') + (list.length > 12 ? ' ほか' : '') + '\n' + ST.me.name + ' の印を押します。', 'まとめて承認する'))) return;
  const bad = []; let n = 0; ST.hold = true;
  try { for (const i0 of list) {
    const inv = plain(i0), k = myApvBox(inv); if (k < 0) continue;
    busy('承認しています… ' + (++n) + ' / ' + list.length);
    try {
      await staleCheck(C.inv, inv, '請求書');
      const a = ST.cfg.approvers[k]; inv.approvals = Object.assign({}, inv.approvals || {}); inv.approvals[k] = { uid: ST.me.uid, name: ST.me.name, stamp: a.stamp || '', at: nowStr() };
      await saveInv(inv, '承認（まとめて）');
    } catch (e) { bad.push(inv.no + '：' + e.message); }
  } } finally { ST.hold = false; busy(''); }
  await okBox(bad.length ? '承認できなかった物があります（' + bad.length + ' 枚）：\n' + bad.join('\n') : n + ' 枚を承認しました。', 'OK', true);

}

function newInv(cust) {

  const inv = { id: newId('i'), no: '', date: today(), custId: c ? c.id : '', to: {}, title: '', taxMode: 'out', lines: [{ type: 'item', name: '', qty: 1, unit: '式', price: null, tax: 'std' }], note: '', due: '', sentBy: c ? c.sendBy || '紙' : '紙', sentAt: '', payments: [], state: '発行済み', isNew: true };
  if (c) setCust(inv, c);
  return inv;
}
function setCust(inv, c) {
  inv.custId = c.id;
  inv.to = { name: c.name || '', dept: c.dept || '', person: c.person || '', honor: c.honor || '様', zip: c.zip || '', addr1: c.addr1 || '', addr2: c.addr2 || '', tel: c.tel || '', fax: c.fax || '', code: c.code || '' };
  inv.due = SK.dueOf(inv.date, c.terms || ST.cfg.defTerms);
  inv.sentBy = c.sendBy || '紙';
}
async function nextNo(kind) {   // 番号は保存したときに付ける（2人が同時に作っても重ならないよう、Firestore の取引で数える）
  let n;
  if (LOCAL) { n = ST.cfg[kind]; ST.cfg[kind] = { ...n, next: n.next + 1 }; await store.put(C.cfg, 'main', ST.cfg); }
  else {
    const ref = doc(db, C.cfg, 'main');
    n = await runTransaction(db, async t => { const s = await t.get(ref); const cur = (s.exists() && s.data()[kind]) || ST.cfg[kind]; t.set(ref, { [kind]: { ...cur, next: cur.next + 1 } }, { merge: true }); return cur; });
    ST.cfg[kind] = { ...n, next: n.next + 1 };
  }
  gas('saveCfg', { cfg: { [kind]: ST.cfg[kind] } }).catch(() => {});
  return n.prefix + String(n.next).padStart(n.digits, '0');
}
/* 保存の直前に、画面の写しの最新の中身と「最後に保存した時刻」を比べる。違えば、ほかの人が先に保存している */
class StaleError extends Error {}
async function latestOf(col, id) { try { return await store.get(col, id); } catch (e) { return null; } }
const staleMsg = (cur, what) => 'ほかの人（' + (cur.updatedBy || '') + '）が ' + (cur.updatedAt || '') + ' に、この' + what + 'を先に保存しました。\nいま画面にある中身は古いので、保存をやめました。\n上の「読み込み直す」を押してから、もう一度してください。';
async function staleCheck(col, local, what) {
  if (!local || local.isNew || !local.id) return;
  const cur = await latestOf(col, local.id);
  if (cur && String(cur.updatedAt || '') !== String(local.updatedAt || '')) throw new StaleError(staleMsg(cur, what));
}
/* 1か所だけ足す操作（付箋・入金・送った日）は、最新の中身を取ってきて、その上に足す。直している途中（保存していない）なら止める */
async function freshen(col, local, list, what) {
  if (!local || local.isNew || !local.id) return local;
  const cur = await latestOf(col, local.id);
  if (!cur || String(cur.updatedAt || '') === String(local.updatedAt || '')) return local;
  if (ST.dirty) throw new StaleError(staleMsg(cur, what));
  Object.keys(local).forEach(k => { if (!(k in cur)) delete local[k]; }); Object.assign(local, plain(cur));
  return local;
}
async function saveInv(inv, why) {
  await staleCheck(C.inv, inv, '請求書');
  const c = calcOf(inv);
  if (c.missing.length) throw new Error('発行日（' + dShort(inv.date) + '）に使う税率が、設定の税率の表にありません：' + c.missing.map(SK.kindName).join('・'));
  if (!inv.no) inv.no = await nextNo('invNo');
  if (!inv.from) inv.from = curFrom();
  if (!inv.createdAt) { inv.createdAt = nowStr(); inv.createdBy = ST.me.name; }
  inv.updatedAt = nowStr(); inv.updatedBy = ST.me.name;
  const d = plain(inv); delete d.isNew; delete d.fromSheet;
  const prevI = [...ST.invs, ...Object.values(ST.yearData).flat()].find(x => x.id === d.id);
  const sheetData = { prevDate: prevI ? prevI.date : '', inv: plain(d), calc: { sub: c.sub, tax: c.tax, total: c.total, groups: c.groups, payState: stateOf(d) }, why: why || '', at: nowStr() };
  if (!ST.hold) busy('保存しています…');
  try {
    d.expireAt = expireOf(d);
    await store.put(C.inv, d.id, d);   // 画面の写しに先に書く（提案7）
  } finally { if (!ST.hold) busy(''); }
  qAdd('saveInv', sheetData, '請求書 ' + d.no + ' ' + (why || ''));   // スプレッドシートには後から（順番待ち）
  setTimeout(apvBadge, 0);   // 承認待ちの数を出し直す
  ST.invs = ST.invs.filter(x => x.id !== d.id).concat([d]);
  Object.values(ST.yearData).forEach(a => { const k = a.findIndex(x => x.id === d.id); if (k >= 0) a[k] = d; });
  delete inv.isNew; delete inv.fromSheet;
  return d;
}

/* 税率ごとの内訳：請求書の全額と同じなら請求書の内訳。違う金額や請求書なしなら、発行日の標準税率の税込として分ける */
const RCP_MODES = [['in', '税込で入れる'], ['ex', '税抜で入れる']];

function rcpAmounts(v, mode, date, invId) {
  if (mode === 'ex') { const rate = SK.rateOf('std', date, ST.cfg.rates) || 0, tax = SK.round(v * rate / 100, ST.cfg.taxRound); return { amount: v + tax, groups: [{ kind: 'std', rate, base: v, tax, incl: v + tax }] }; }
  return { amount: v, groups: rcpGroups(v, date, invId) };
}
/* 印紙の金額を決める金額：紙に「うち消費税額等」を分けて書くので、消費税額等を除いた金額（No.7124）。登録番号がない（免税事業者の）ときは税込のまま */

const rcpBase = r => (r.groups || []).reduce((s, g) => s + (Number(g.base) || 0), 0);

  const inv = invId ? ST.invs.find(i => i.id === invId) : null, c = inv ? calcOf(inv) : null;
  if (c && amount === c.total) return c.groups;
  const rate = SK.rateOf('std', date, ST.cfg.rates) || 0, tax = SK.round(amount * rate / (100 + rate), ST.cfg.taxRound);
  return [{ kind: 'std', rate, base: amount - tax, tax, incl: amount }];
}

  const upStamp = (id, key) => $(id).onchange = async () => { const fl = $(id).files[0]; if (!fl) return; if (fl.size > 300000) return alert('画像が大きすぎます（300KBまで）。'); const url = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(fl); }); const v = Object.assign({}, ST.stamps, { [key]: url }); try { await store.put(C.cfg, 'stamps', v); ST.stamps = v; gas('log', { what: '印鑑の画像を入れた', detail: key }).catch(() => {}); drawCfg(); } catch (e) { alert('入れられませんでした：' + e.message); } };
  upStamp('stK', 'kaku'); upStamp('stH', 'higa'); upStamp('stM', 'maru');
  loadPeople().then(() => { const P = ST.people || []; M.querySelectorAll('[data-ap="uid"]').forEach(e => { const v = e.value; e.innerHTML = '<option value="">（決めていない）</option>' + P.map(p => '<option value="' + esc(p.uid) + '"' + (p.uid === v ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + (v && !P.some(p => p.uid === v) ? '<option value="' + esc(v) + '" selected>' + esc(v) + '</option>' : ''); }); });
}
/* 承認する人を選ぶための、請求管理アプリに入れる人（マスター・請求管理）。読めないときは今の設定の人だけ */
async function loadPeople() {
  if (ST.people) return;
  if (LOCAL) { ST.people = DEF_APV.filter(a => a.uid).map(a => ({ uid: a.uid, name: a.name })); return; }
  try { ST.people = (await getDocs(collection(db, 'users'))).docs.filter(d => d.data().isMaster || d.data().canInvoice).map(d => ({ uid: d.id, name: d.data().name || d.id })); }
  catch (e) { ST.people = (ST.cfg.approvers || []).filter(a => a.uid).map(a => ({ uid: a.uid, name: a.name })); }
}
/* 販売らくだの写しの読み込み（ユーザー決定 2026-11-05：コピーして移す・販売らくだは一切触らない） */
async function importRaku() {
  if (!(await okBox('販売らくだの写し（seikyu_import.json）を読み込みます。\nスプレッドシート（請求管理DB）に全部を書き、画面の写しには「入金がまだの物」と今年・去年の分だけを入れます。\n数分かかることがあります。', '読み込む'))) return;
  try {
    busy('スプレッドシートに書いています…（数分かかることがあります）');
    let w; try { w = await gas('importWrite'); } catch (e) { if (!/もうデータがあります/.test(e.message)) throw e; if (!(await okBox(e.message + '\n\nスプレッドシートはそのままにして、画面の写しだけ作りますか？', '写しだけ作る'))) return; w = null; }
    busy('画面の写しを作っています…');
    const d = await gas('importRead');
    const cfg = cfgMerge(d.cfg);
    await store.put(C.cfg, 'main', cfg);
    await store.many(C.cust, d.customers);
    const t0 = today(), inv = d.invoices.filter(i => { const st = SK.payState(i, t0, i.fixed.total); return !['入金済み', '入金なし', '取消'].includes(st) || liveYear(String(i.date).slice(0, 4)); }).map(i => { const x = plain(i); x.expireAt = expireOf(x); return x; });
    await store.many(C.inv, inv);
    busy('');
    await okBox('読み込みました。\n' + (w ? 'スプレッドシート：得意先 ' + w.customers + ' 社、請求書 ' + w.invoices + ' 枚' + (w.lines != null ? '、明細 ' + w.lines + ' 行、入金 ' + w.payments + ' 件' : '') + '\n' : '') + '画面の写し：得意先 ' + d.customers.length + ' 社、請求書 ' + inv.length + ' 枚\n元：' + d.source + '（' + d.sourceAt + ' 保存）', 'OK', true);
    ST.tab = 'inv'; boot();
  } catch (e) { busy(''); alert('読み込めませんでした：' + e.message); }
}

/* ログイン（給与アプリと同じ） */
function drawLogin() {
  $('hd').style.display = 'none';
  M.innerHTML = '<div class="card" id="login"><h2>請求管理 ログイン</h2><label class="f">アカウントID（メールアドレス）</label><input id="em" type="email" autocomplete="username"><label class="f">パスワード</label><input id="pw" type="password" autocomplete="current-password"><button class="b dark" id="go" style="width:100%;">ログイン</button><div class="msg" id="lm"></div><div class="note">ポータル・給与管理と同じアカウントです。</div></div>';
  $('go').onclick = async () => { try { await signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value); } catch (e) { $('lm').textContent = 'ログインできませんでした。'; } };
  $('pw').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
}
$('out').onclick = async e => { e.preventDefault(); if (LOCAL) return; if (qGet().length && !(await okBox('スプレッドシートにまだ書いていない保存が ' + qGet().length + ' 件あります。\nログアウトすると、次にこのパソコンでログインしたときに続きを書きます。ログアウトしますか？', 'ログアウトする'))) return; try { indexedDB.deleteDatabase('seikyu'); } catch (x) {} await signOut(auth); location.reload(); };   // 手元に覚えた昔の請求書も消す
window.addEventListener('beforeunload', e => { if (ST.dirty || (ST.me && qGet().length)) { e.preventDefault(); e.returnValue = ''; } });   // スプレッドシートへ書く前に閉じるときも止める
if (LOCAL) boot(); else onAuthStateChanged(auth, u => { if (u) boot(); else drawLogin(); });
window.skTest = { ST, invPages, coverPage, rcpPages, showPaper, calcOf, stateOf, store, MEM, pdfOf, xlsxOf, monthData, approved, stickyOf, paginate, rowH, openInv, newInv, custOf };   // 試しで中を見る用
</script>
